# uv run pre-commit install   (once per clone)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files  # stop tensors/checkpoints sneaking into git
        args: [--maxkb=2000]
      - id: check-yaml
      - id: check-toml
      # Never on pinned inputs, raw results or rendered pages: a fixed newline changes a pinned sha256 or a run's file.
      - id: end-of-file-fixer
        exclude: ^(data|results|examples)/
      - id: trailing-whitespace
        exclude: ^(data|results|examples)/
      - id: detect-private-key
  # Local hooks use the locked tool versions from uv.lock (no version drift vs `make lint`).
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
