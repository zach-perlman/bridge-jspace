# Worked examples for exp11_bridge_vs_answer_by_layer: lens tables for items sampled by outcome group from one of its runs.
#   make run CONFIG=scripts/exp11_bridge_vs_answer_by_layer/examples.yaml        # GPU (needs the model); writes results/exp11_bridge_vs_answer_by_layer/<stamp>/examples.md
name: exp11_bridge_vs_answer_by_layer
target: bridge_jspace.examples:LensExamples
seed: 0
model: configs/models/qwen3.6-27b.yaml
params:
  title: "exp11_bridge_vs_answer_by_layer (last token, prompts as published), Qwen3.6-27B"
  selector: scripts.exp11_bridge_vs_answer_by_layer.examples:select
  source_run: results/exp11_bridge_vs_answer_by_layer/20261014-092835
  per_group: 3
  seed_examples: 0
  band: [32, 48]
  top_k: 5
  layer_step: 4  # last-token table: layers 0, 4, ..., 60 and the last source layer
  position_layers: [8, 16, 24, 32, 40, 48, 56, 62]
  n_positions: 8  # position table: the last 8 tokens
  position_readers: [jlens]
  fact_prompt: "Fact: The capital of France is"
  fact_expected: " Paris"
  parity_prompts:
    - "Fact: The currency used in the country shaped like a boot is"
    - "Fact: The language spoken in the country where the Amazon River ends is "
  parity_atol: 0.01
