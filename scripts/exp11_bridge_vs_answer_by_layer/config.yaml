# exp11_bridge_vs_answer_by_layer: at which layers is the bridge readable, and at which the answer?
# Readers = logit lens (baseline) + every lens in the model YAML. Items and labels from part B's exp02 v4.
#   make run CONFIG=scripts/exp11_bridge_vs_answer_by_layer/config.yaml                                   # 27B
#   make run CONFIG=scripts/exp11_bridge_vs_answer_by_layer/config.yaml ARGS="params.labels_file=results/exp02_swaps/main_v4_jpp/labels.csv params.labels_sha256=bba45a33c49611d741b47e657050737a5689fe4bd1227acc9d747e39c29f4793"   # split by the J++ swaps
#   uv run bj-run scripts/exp11_bridge_vs_answer_by_layer/config.yaml \
#       model=configs/models/qwen3.5-0.8b.yaml params.limit=6 results_dir=cache/smoke                   # CPU smoke
#   uv run python -m scripts.exp11_bridge_vs_answer_by_layer.experiment analyze <run_dir>   # re-aggregate a run
name: exp11_bridge_vs_answer_by_layer
target: scripts.exp11_bridge_vs_answer_by_layer.experiment:BridgeVsAnswer
seed: 0
model: configs/models/qwen3.6-27b.yaml
params:
  # Part B's v4 labels (status: eligible = the greedy continuation contains the answer; label: which part of the
  # bridge's probe flips the answer when swapped). The J-lens swaps; main_v4_jpp splits by the J++ swaps.
  labels_file: results/exp02_swaps/main_v4_jlens/labels.csv
  labels_sha256: 11da778146f1fb51c9a614929ce38be62ae11806a6c5df8ea02d81d7337a7a4c
  # Prompts with the trailing space stripped, as in part B v4 (the published prompts end in a lone " " token).
  strip_trailing_space: true
  bands:
    # Named by their range; the first is primary. Both are part B's swap bands: 32-48 fixed before exp11, 24-40 the
    # band part B's gate picked for its main swaps (exp02 v4).
    "32-48": [32, 48]
    "24-40": [24, 40]
  emerge_run: 3  # a word "emerges" at the first layer it is top-1 in its pool for this many layers in a row
  n_boot: 10000
  limit: null  # first N items; smoke runs only
  fact_prompt: "Fact: The capital of France is"
  fact_expected: " Paris"
  parity_prompts:
    - "Fact: The currency used in the country shaped like a boot is"
    - "Fact: The language spoken in the country where the Amazon River ends is "
  parity_atol: 0.01
