# exp12_position_map: at which prompt positions (and layers) is the bridge readable, and the answer?
# Readers = logit lens (baseline) + every lens in the model YAML. Items, labels, words and pools as exp11.
#   make run CONFIG=scripts/exp12_position_map/config.yaml                                                 # 27B
#   uv run bj-run scripts/exp12_position_map/config.yaml \
#       model=configs/models/qwen3.5-0.8b.yaml params.limit=6 params.min_item_share=0.3 results_dir=cache/smoke
#   uv run python -m scripts.exp12_position_map.experiment analyze <run_dir>      # re-analyze saved grids
name: exp12_position_map
target: scripts.exp12_position_map.experiment:PositionMap
seed: 0
model: configs/models/qwen3.6-27b.yaml
params:
  # Part B's v4 labels (status: eligible = the greedy continuation contains the answer; label: which part of the
  # bridge's probe flips the answer when swapped). The J-lens swaps; main_v4_jpp splits by the J++ swaps.
  labels_file: results/exp02_swaps/main_v4_jlens/labels.csv
  labels_sha256: 11da778146f1fb51c9a614929ce38be62ae11806a6c5df8ea02d81d7337a7a4c
  # Prompts with the trailing space stripped, as in part B v4 (the published prompts end in a lone " " token).
  strip_trailing_space: true
  bands:
    # Named by their range; the first is primary (offsets are scored on it). The others are reported by the exp11
    # analysis at the optimal offset. 24-40: the band part B's gate picked for its main swaps (exp02 v4).
    "32-48": [32, 48]
    "24-40": [24, 40]
  emerge_run: 3
  # An offset is analysed only if at least this share of eligible prompts reach it (long offsets exist in few).
  min_item_share: 0.5
  panel_min_share: 0.95  # balanced-panel check: offsets reached by >= 95% of eligible prompts
  n_boot: 10000
  limit: null
  fact_prompt: "Fact: The capital of France is"
  fact_expected: " Paris"
  parity_prompts:
    - "Fact: The currency used in the country shaped like a boot is"
    - "Fact: The language spoken in the country where the Amazon River ends is "
  parity_atol: 0.01
