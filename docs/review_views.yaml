# The review views: one per claim the README makes. The single source of truth for the review dashboard
# (scripts/review.py: make review-serve / review-export / review-summary) and, from Phase 2, for docs/verify_pack.md.
# Per view: the claim in the README's words, the docs/x0_numbers.json keys it backs ("sources"; <m> = 9b / 27b / 122b /
# muse, the same keys as the `source` column of figures/story/data.csv), per model the run dirs and their per-item
# files, the filters that make the claim's item set (as the verdict used them), and what each answer class means.
# Read-only on results/. status: phase1 = in the dashboard now; later = listed, not yet in the dashboard. headline: the
# numbers the dashboard recounts over the whole item set (Phase 2) and compares with figures/story/data.csv.
# join_runs (per model): runs whose rows give the arms the view's run does not have, joined by scene (x0_parts). A run
# that has not landed gives no items; its view lists it as "not run yet" (no run dir) or "no outcomes.jsonl yet".
version: 1

models:
  qwen3.5-9b: {key: 9b, label: Qwen3.5-9B, layer: 12}
  qwen3.6-27b: {key: 27b, label: Qwen3.6-27B, layer: 32}
  qwen3.5-122b-a10b: {key: 122b, label: Qwen3.5-122B, layer: 33}
  muse-glimmer-30b: {key: muse, label: Muse Glimmer 30B, layer: 26}

# Token ids are decoded with tokenizer.json only, at the revision pinned in src/bridge_jspace/pins.py (hf_hub_download
# of that one file). The three Qwens share one tokenizer.json (sha256 5f9e4d4901a92b99...); Muse has its own.

# How each kind's per-item files are read (src/bridge_jspace/review/).
kinds:
  x0:
    files: [cases.jsonl, outcomes.jsonl, shares.jsonl, competence.jsonl, gate.json]
    prompts: >-
      cases.jsonl per (scene, rendering): context / cf_context, bridge / cf_bridge, pos (the bridge's token index, where
      the change is added), readers.{PP,PM}: question, answer / cf_answer, ids.org / ids.alt, tok_A / tok_b.
    outcomes: >-
      per (scene, rendering, layer, reader, dict, k, omp, arm): switched, role, p_org, p_alt, ld. No top token is
      stored: the stored class is role.
    classes:
      b: changed answer - the top token is the changed prompt's answer (it switched)
      A: original answer - the top token is the original prompt's answer
      other: another token (not stored)
    eligible: >-
      x0_necessity.gate_and_eligible: org and alt said right and read right by both readers (competence.jsonl), the
      first 200 in scene order; the item set is the scenes in outcomes.jsonl at the layer.
  routes:
    files: [cases.jsonl, outcomes.jsonl, norms.jsonl, competence.jsonl, gate.json, c0_check.json]
    prompts: >-
      cases.jsonl per scene (700 generated per condition, seed 2510): context (O) / cf_context (S), bridge (the O
      pick) / cf_bridge (the S pick), pos, expect (the digit each route predicts), route_tokens, readers as x0.
    outcomes: per (scene, condition, reader, arm) - top (token id), route (lookup only), switched, role, p_org, p_alt, ld.
    classes:
      identity: the bridge item's own locker digit in S (C1 - the same as original; reported as identity)
      position: the digit in S of the locker sentence at the bridge's sentence slot in O
      value: the new digit S gives the moved item
      original: O's answer
      other: none of these. C0 stores "other" for a correct switch (route_tokens has no "switch"); for C0 the class is
        re-derived from expect - switch / original / other.
      recall: switched = the recall follows S (the top token is S's answer, the S pick's legs)
    eligible: >-
      x6_routes: both readers say and read O's and S's answers right (competence.jsonl), the first 300 per condition;
      the item set is the scenes in outcomes.jsonl for the condition.
  x5:
    files: [cases.jsonl, outcomes.jsonl, competence.jsonl, gate.json]
    prompts: >-
      cases.jsonl per passage: context / cf_context (the bridge changed in its binding sentence only), bridge /
      cf_bridge, pos, relation, genre, readers.{PP,PM}: question, answer / cf_answer (words), lure / cf_lure (the
      passage's own value for the bridge), ids.org / ids.alt.
    outcomes: >-
      per (scene, layer, reader, dict, k, omp, arm): switched, top (the answer word read: the top first token among the
      relation's answer words), org_read, lure_org / lure_alt, share. No p / ld stored.
    classes:
      b: changed answer - the top word is the changed passage's answer (it switched)
      A: original answer - the top word is the original passage's answer
      other: another answer word
    eligible: >-
      x5_natural: both readers read the original and changed passages right (competence.jsonl); the item set is the
      passages in outcomes.jsonl at the layer.
  massmean:
    files: [outcomes.jsonl, manifest.json]
    prompts: >-
      none of its own: the cases.jsonl of the run named in manifest.json "single" (the one-change main test), joined by
      scene.
    outcomes: per (scene, reader, arm) - switched, role, p_org, p_alt, ld, share_<part>.
    classes: {b: changed answer (it switched), A: original answer, other: another token (not stored)}
    eligible: >-
      manifest items_rule - the one-change items whose org and alt locker sentences both come before the asked pick;
      the item set is the scenes in outcomes.jsonl.
  x8:
    files: [outcomes.jsonl, gate.json, manifest.json]
    prompts: >-
      none of its own: x8_write.stage_run builds O from x6_routes' generator (same seed 2510, C2, same eligibility), so
      its scenes are the C2 cases of the model's routes run, joined by scene. Checked per item (badge): the stored entity
      is that case's bridge and j its locker slot.
    outcomes: per (scene, reader, kind none / write / random, j, k, s) - top, norm, class (lookup), changed (recall).
    classes:
      target: the digit of locker slot k (the slot written to)
      original: the digit of locker slot j (the bridge's own)
      third: the digit of the remaining slot
      other: none of the three
      recall: changed = the recall's top token is not O's answer (tok_A; x8_write.stage_run)
  x0_parts:  # a kind of its own: x0's loader reads a run's own cases.jsonl, and shares with rand_share and a layer
    files: [outcomes.jsonl, shares.jsonl, manifest.json]
    prompts: >-
      none of its own: the cases.jsonl of the run named in manifest.json "single" (under "source_exp", x0_necessity),
      joined by scene, as massmean. The view's join_runs (x0 runs) give the arms this run does not have, by scene; their
      prompts are checked per item (badge "second run has the same prompts").
    outcomes: >-
      as x0, per (scene, layer, reader, dict, k, omp, arm); dict jpp_other has omp "other" and k its atom count; shares.jsonl
      per (scene, dict, k, omp) has no layer and no rand_share. Runs since batch 45 store the top token.
    classes:
      b: changed answer - the top token is the changed prompt's answer (it switched)
      A: original answer - the top token is the original prompt's answer
      other: another token
    eligible: >-
      x0_parts.stage_run: every scene of the source run's chat outcomes; the item set is the scenes in outcomes.jsonl at
      the layer.
  x45b_sweep:  # a kind of its own: per-layer arms, patches at several positions, cases keyed "entity"
    files: [cases.jsonl, outcomes.jsonl, manifest.json, plan.json]
    prompts: >-
      cases.jsonl per item (x45b_binding.select, then role_positions): context (O) / cf_context (S), entity (the bridge) /
      cf_bridge, pos (the bridge word), patched (O's locker-sentence token positions) / source (S's), lockers (sentences,
      positions per sentence, align), marks (character spans of the bridge word and the locker sentences in the lookup's
      O text), roles.{item,value,final}.{org,alt} (token positions), readers.{PP,PM}: question, answer / cf_answer,
      ids.org / ids.alt, tok_A / tok_b, text.org / text.alt. The readers' prompts are the same through the last locker
      token (select), so one set of positions serves both.
    outcomes: >-
      per (scene, reader, arm): none (O unedited), bw<l> / ls<l> / li<l> / lv<l> / lf<l> at each sweep layer l (manifest
      sweep_layers: L/2 to L every 2), S (S read on S); layer, switched, top, role, p_org, p_alt, ld.
    classes:  # an item's class is S read on S's role (b = S itself switches; the sweep's "share of S's switches" counts these)
      b: S's answer (switched)
      A: O's answer
      other: another token
    eligible: >-
      x45b_binding.select on the main run: its items at L whose original locker sentence comes after the asked pick, the
      locker sentences aligned; every one is read, so none is outside the set.
  x45a_prepend:  # a kind of its own: one item is a base scene in every variant (the routes loader keys one case per item)
    files: [cases.jsonl, outcomes.jsonl, norms.jsonl, beta.jsonl, competence.jsonl, gate.json, manifest.json]
    prompts: >-
      cases.jsonl per (base scene, variant) (x6_routes.prepend_cases): the routes C2 case with one sentence put before O's
      and S's first sentence ("prepended": V0 none, V1-V3 a new person's pick, V4 a filler), scene "<base>-<variant>",
      base_scene, variant, move (the pointer's: the O bridge's locker slot -> the S bridge's), pos, expect, readers as
      routes.
    outcomes: >-
      per (base scene, variant, reader, arm): top, route (lookup), switched, role, p_org, p_alt, ld. norms.jsonl: each
      variant's share_alf / share_jpp and norm; beta.jsonl: the code's shift vs V0 at O's bridge word (V1-V4).
    classes:  # the stored route under the view's class_arm (only the pointer part) in V0; the card shows every variant
      identity: the S bridge item's own locker digit in S
      position: the digit in S of the locker sentence at the bridge's sentence slot in O
      value: the new digit S gives the moved item
      original: O's answer
      other: none of these
      recall: follows S (the top token is S's answer) or stays
    eligible: >-
      x6_routes --prepend: the base scenes eligible (both readers say and read O's and S's answers) in every variant that
      passed its gate, the first 300 in scene order; every variant of a base scene is read (paired).
  x45d:  # a kind of its own: x0's rows on varied formats; the format, the fit run's split and the cell gate on top
    files: [cases.jsonl, outcomes.jsonl, shares.jsonl, competence.jsonl, gate.json, manifest.json]
    prompts: >-
      cases.jsonl per scene (x0b_generalize.scene_case, the held-out half only): context / cf_context in prose, JSON or
      table, format, level, domain, numbers, order (the bridge's locker statement vs the asked pick), facts, bridge /
      cf_bridge, pos, readers as x0. The fit run (manifest pcf_from, results/x7_pcf/*_x45d_fit) has split.json: per
      format, the bridge items of the fit and the test (held-out) halves.
    outcomes: >-
      as x0 at the run's layer (manifest predicted), with the top token: dict jpp (k 25, signed and nonneg), alf (U, the
      simple-scene pointer, k 4), pcf (the format's refit basis, k 4); shares.jsonl per (scene, dict, k, omp): share,
      rand_share.
    classes:
      b: changed answer - the top token is the changed prompt's answer (it switched)
      A: original answer - the top token is the original prompt's answer
      other: another token
    eligible: >-
      x0b_generalize.gate_cells: per cell (domain / format / level) the read gate (>= 0.80, both readers), then org and
      alt said and read right by both readers, at most 40 per cell in scene order.
  x45g:  # a kind of its own: massmean's rows on every item, two runs (scene sets) per model, the stored sentence order
    files: [outcomes.jsonl, manifest.json]
    prompts: >-
      none of its own: the cases.jsonl of the run named in manifest.json "single" (x0_necessity), the cases
      x0_massmean.examples_blob rebuilds (X.build_cases on the manifest's set with its alt: cf = two people swap, single =
      only the asked pick), joined by scene. Checked per item (badge): the stored entity is the case's bridge, and the
      stored org_order / alt_order are the case's sentence order.
    outcomes: >-
      per (scene, reader, arm): switched, role, p_org, p_alt, ld, share_jpp / share_Alf / share_jppAlf, org_order /
      alt_order (x0_strata.features: the original / changed bridge's locker sentence vs the asked pick). No top token.
    classes: {b: changed answer (it switched), A: original answer, other: another token (not stored)}
    eligible: >-
      x0_massmean --mode two_routes: every chat item of the single run, both sentence orders (manifest items_rule).

views:
  # ---------------------------------------------------------------- Phase 1 (Tuesday's hand check)
  - id: main_swap
    title: Main test, two people swap picks
    status: phase1
    kind: x0
    readme: "Section 1 'The split holds on all four models', Fig. 1; scorecard row 'The split (main test)'"
    claim: >-
      Recall needs the lens-readable (J++) part of the bridge; the lookup mostly doesn't. Gap = the recall's extra loss
      minus the lookup's; extra loss = the share of switches lost without the J++ part minus the share lost without a
      random part of the same size.
    sources: [lk_excess_<m>, rc_excess_<m>, contrast_<m>]
    filters:
      rendering: chat
      layer: fixed
      readers: [PP, PM]
      arms:  # label: [arm, dict, k, omp]
        unedited: [none, "-", 0, "-"]
        whole: [whole, "-", 0, "-"]
        without J++: [no_part, jpp, 25, signed]
        without its random part: [no_rand, jpp, 25, signed]
    headline: {stat: extra_loss, whole: whole, part: without J++, random: without its random part,
               keys: {PP: lk_excess_<m>, PM: rc_excess_<m>, gap: contrast_<m>}}
    runs:
      qwen3.5-9b: [results/x0_necessity/qwen35_9b_x0_necessity]
      qwen3.6-27b: [results/x0_necessity/x0_necessity_27b_chat]
      qwen3.5-122b-a10b: [results/x0_necessity/qwen35_122b_x0_necessity_r2]
      muse-glimmer-30b: [results/x0_necessity/muse30b_x0_necessity]
    superseded:
      qwen3.5-122b-a10b: [results/x0_necessity/qwen35_122b_x0_necessity]

  - id: single_change
    title: Only the asked person's pick changes
    status: phase1
    kind: x0
    readme: "Section 1 'It holds in every setting', Fig. 1b panel 'Only the asked person's pick changes'"
    claim: >-
      The same gap when only the asked person's pick changes (one change in the prompt, not two people swapping).
    sources: [single_lk_excess_<m>, single_rc_excess_<m>, single_contrast_<m>]
    filters:
      rendering: chat
      layer: fixed
      readers: [PP, PM]
      arms:
        unedited: [none, "-", 0, "-"]
        whole: [whole, "-", 0, "-"]
        without J++: [no_part, jpp, 25, signed]
        without its random part: [no_rand, jpp, 25, signed]
    headline: {stat: extra_loss, whole: whole, part: without J++, random: without its random part,
               keys: {PP: single_lk_excess_<m>, PM: single_rc_excess_<m>, gap: single_contrast_<m>}}
    runs:
      qwen3.5-9b: [results/x0_necessity/qwen35_9b_x0_single_r2]
      qwen3.6-27b: [results/x0_necessity/x0_single_27b_r2]
      qwen3.5-122b-a10b: [results/x0_necessity/qwen35_122b_x0_single]
      muse-glimmer-30b: [results/x0_necessity/muse30b_x0_single]

  - id: routes
    title: "Routes test: what the lookup follows (C0 sanity, C1 same item moved, C2 another item moved)"
    status: phase1
    kind: routes
    readme: "Section 3, Fig. 5 and its table; Section 4 'Removing the pointer stops position answers', 'Adding only the pointer'; scorecard rows 'Never the value', 'The pointer alone gives position'"
    claim: >-
      When another item moved, the lookup follows its identity or its locker sentence's position, never the new value.
      Removing the pointer directions cuts position; adding only them gives position answers on all but the 27B; the
      J++ part alone moves none.
    sources: [rt_C2_whole_identity_9b, rt_C2_whole_position_9b, rt_C2_no_alf_position_9b, rt_C2_no_alf_rand_position_9b,
              rt_C2_whole_identity_27b, rt_C2_whole_position_27b, rt_C2_no_alf_position_27b, rt_C2_no_alf_rand_position_27b,
              rt_C2_whole_identity_muse, rt_C2_whole_position_muse, rt_C2_no_alf_position_muse, rt_C2_no_alf_rand_position_muse,
              rtg_C2_whole_identity_122b, rtg_C2_whole_position_122b, rtg_C2_no_alf_position_122b, rtg_C2_no_alf_rand_position_122b,
              rtk_C2_keep_alf_position_<m>, rtk_C2_keep_alf_rand_position_<m>, rtk_C2_keep_jpp_identity_<m>]
    filters:
      layer: fixed
      conditions: [C0, C1, C2]
      readers: [PP, PM]
      arms:  # label: arm (the first run that has it; keep-only arms come from the keep-only run, C1 and C2 only)
        unedited: none
        whole: whole
        without J++: no_jpp
        without J++'s random part: no_jpp_rand
        without the pointer directions: no_alf
        without the pointer's random part: no_alf_rand
        only the pointer part: keep_alf
        only a random part of its size: keep_alf_rand
        only the J++ part: keep_jpp
        only a random part of J++'s size: keep_jpp_rand
    headline: {stat: route_share, condition: C2, reader: PP, arms: [whole, without the pointer directions, without the pointer's random part, only the pointer part, only a random part of its size, only the J++ part]}
    export: {condition: C2}  # the static export's sample (Dan: routes C2)
    runs:  # the main run first (it fixes the item set); the keep-only run joined by scene and condition
      qwen3.5-9b: [results/x6_routes/qwen35_9b_x6_routes, results/x6_routes/qwen35_9b_x6_routes_keeponly]
      qwen3.6-27b: [results/x6_routes/x6_routes_27b, results/x6_routes/x6_routes_keeponly_27b]
      qwen3.5-122b-a10b: [results/x6_routes/qwen35_122b_x6_routes_g75, results/x6_routes/qwen35_122b_x6_routes_keeponly_g75]
      muse-glimmer-30b: [results/x6_routes/muse30b_x6_routes]
    notes: "122B: gate lowered to 0.75 after the data (its run at 0.80, qwen35_122b_x6_routes_c0, stopped at the gate and backs Section 4's 'not tested' line: rt_c0gate_rc_122b)."
    superseded:
      qwen3.5-9b: [results/x6_routes/qwen35_9b_x6_routes_c0]
      qwen3.6-27b: [results/x6_routes/x6_routes_c0_27b]
      qwen3.5-122b-a10b: [results/x6_routes/qwen35_122b_x6_routes_g75_c0]

  - id: routes_early
    title: Routes test at the early layer
    status: phase1
    kind: routes
    readme: "Section 3 'Position appears with depth', Fig. 6; docs/x0_details.md 'Depth: the early layer'"
    claim: >-
      Early, the lookup follows identity only; without J++ the Qwens give the original answer.
    sources: [rte_C2_whole_identity_<m>, rte_C2_no_jpp_original_<m>, rte_C2_no_jpp_recall_follows_s_<m>, rte_C2_whole_position_<m>]
    filters:
      layer: run  # the run's own layer: 9B L6, 27B L16, 122B L27, Muse L13
      conditions: [C0, C1, C2]
      readers: [PP, PM]
      arms:
        unedited: none
        whole: whole
        without J++: no_jpp
        without J++'s random part: no_jpp_rand
    headline: {stat: route_share, condition: C2, reader: PP, arms: [whole, without J++, without J++'s random part]}
    runs:
      qwen3.5-9b: [results/x6_routes/qwen35_9b_x6_routes_l6]
      qwen3.6-27b: [results/x6_routes/x6_routes_l16_27b]
      qwen3.5-122b-a10b: [results/x6_routes/qwen35_122b_x6_routes_l27_g75]
      muse-glimmer-30b: [results/x6_routes/muse30b_x6_routes_l13]
    superseded:
      qwen3.5-9b: [results/x6_routes/qwen35_9b_x6_routes_c0_l6]
      qwen3.6-27b: [results/x6_routes/x6_routes_c0_l16_27b]
      qwen3.5-122b-a10b: [results/x6_routes/qwen35_122b_x6_routes_c0_l27_g75]

  - id: pointer_main
    title: Pointer directions on the main items
    status: phase1
    kind: massmean
    readme: "Section 4 'Removing the pointer stops position answers'; docs/x0_details.md pointer table; scorecard row 'The lookup needs the pointer'"
    claim: >-
      Removing the pointer directions (4 directions that say where the item was first mentioned) costs the lookup on
      every model, the recall less.
    sources: [mmlf_Alf_lk_excess_<m>]
    filters:
      layer: fixed
      readers: [PP, PM]
      arms:
        unedited: none
        whole: whole
        without the pointer directions: no_Alf
        without their random part: no_Alf_rand
        only the pointer part: keep_Alf
        only a random part of its size: keep_Alf_rand
    headline: {stat: extra_loss, whole: whole, part: without the pointer directions, random: without their random part,
               keys: {PP: mmlf_Alf_lk_excess_<m>}}
    runs:
      qwen3.5-9b: [results/x0_massmean/qwen35_9b_x0_massmean_lf]
      qwen3.6-27b: [results/x0_massmean/x0_massmean_lf_27b]
      qwen3.5-122b-a10b: [results/x0_massmean/qwen35_122b_x0_massmean_grid]
      muse-glimmer-30b: [results/x0_massmean/muse30b_x0_massmean_grid]
    notes: "9B and 27B: the layout-free pointer (mode layout_free); 122B and Muse: the grid mode. The 9B's main table cell (0.47, replicated) comes from x0_replicate; this view backs Appendix A's row."
    superseded:
      qwen3.5-9b: [results/x0_massmean/qwen35_9b_x0_massmean]
      qwen3.6-27b: [results/x0_massmean/x0_massmean_27b]

  - id: x8_writes
    title: "Writing the pointer (batch 44 A): h + s (mu_k - mu_j) at the bridge word"
    status: phase1
    kind: x8
    readme: "Section 4 'One fixed vector written into the bridge moves the lookup', 'The recall follows a strong write', Fig. 7; scorecard rows 'A write moves the lookup', 'The recall follows the write'"
    claim: >-
      Batch 44: writing one generic address mu_k - mu_j at the bridge word sends the lookup to locker k, against a
      random direction of the same norm (Q44.1-3).
    sources: []
    filters:
      layer: fixed
      readers: [PP, PM]
      kinds: [write, random]
      s: [1, 2, 4]
    headline: {stat: x8_target_minus_random, s: 1}
    export: {s: 1, kind: write}  # the static export's sample (Dan: x8 A at s = 1)
    cases_from:  # the C2 cases of the routes run with the same generator, seed and gate
      qwen3.5-9b: results/x6_routes/qwen35_9b_x6_routes
      qwen3.6-27b: results/x6_routes/x6_routes_27b
      qwen3.5-122b-a10b: results/x6_routes/qwen35_122b_x6_routes_g75
      muse-glimmer-30b: results/x6_routes/muse30b_x6_routes
    runs:
      qwen3.5-9b: [results/x8_write/qwen35_9b_x8_write]
      qwen3.6-27b: [results/x8_write/x8_write_27b]
      qwen3.5-122b-a10b: [results/x8_write/qwen35_122b_x8_write_g75]
      muse-glimmer-30b: [results/x8_write/muse30b_x8_write]

  # ---------------------------------------------------------------- batch 45, before scoring (Dan 26 Oct ~22:40)
  # Added before these runs land and before any of them is scored: no README claim, no sources. The claim field states
  # the test as fixed in advance, not a result. Until a run lands its view lists it as "not run yet".
  - id: x45k_routes
    title: "45k: J++ removed at k = 25 / 50 / 100 in the routes test (batch 45, not scored yet)"
    status: phase1
    kind: routes
    readme: "not yet in the README (batch 45, test 45k: jobs/c3/x45k_*_q2.yaml, Q45.9)"
    claim: >-
      Fixed in advance: as J++ grows from 25 to 100 atoms, does the lookup lose the identity or the position route in C2
      beyond a random part of the same share; the 27B's C0 lookup extra loss at k = 100 is the precondition; another
      scene's 100 atoms refit here (jpp_other) are descriptive in this run. Not scored yet.
    sources: []
    filters:
      layer: fixed
      conditions: [C0, C2]
      readers: [PP, PM]
