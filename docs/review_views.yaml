    readme: "not yet in the README"
    claim: "Order, sentence index or distance sets the slot code (which filler variant shifts beta)."
    sources: []
    runs:
      qwen3.5-9b: [results/x8_write/qwen35_9b_x8_order]
      qwen3.6-27b: [results/x8_write/x8_order_27b]
      qwen3.5-122b-a10b: [results/x8_write/qwen35_122b_x8_order_g75]
      muse-glimmer-30b: [results/x8_write/muse30b_x8_order]

  - id: pointer_geometry
    title: "Pointer geometry (batch 44, CPU, descriptive)"
    status: later
    kind: aggregate
    readme: "not yet in the README"
    claim: "The 5 class means behind the pointer directions lie on a monotone first component (PC1 share >= 0.7 -> ordinal)."
    sources: []
    per_item: "none: an aggregate over the class means of the x0_probe v4 states; no per-item file"
    analyses: [results/x8_write/geometry-*]

  - id: k_curve
    title: More J++ directions removed (k = 25 / 50 / 100)
    status: later
    kind: x0
    readme: "Section 1, bullet 3 ('On the 27B the lookup needs J++ once more directions are removed')"
    claim: "On the 27B the lookup needs J++ once more directions are removed; the 9B, 122B and Muse keep the gap at k = 100."
    sources: [lk_excess_k25_27b, lk_excess_k50_27b, lk_excess_k100_27b, contrast_k100_<m>]
    runs:
      qwen3.5-9b: [results/x0_necessity/qwen35_9b_x0_kmatch]
      qwen3.6-27b: [results/x0_necessity/x0_kmatch_27b]
      qwen3.5-122b-a10b: [results/x0_necessity/qwen35_122b_x0_necessity_r2]
      muse-glimmer-30b: [results/x0_necessity/muse30b_x0_necessity]

  - id: varied_scenes
    title: Varied scenes (formats and levels)
    status: later
    kind: x0b
    readme: "Section 1 table row 'Varied scenes'; Section 4 'the 122B's varied scenes'; scorecard row 2"
    claim: "The gap shrinks outside simple scenes; Muse's stays the largest."
    sources: [x0b_c_<m>]
    runs:
