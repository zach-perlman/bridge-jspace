# The review views: one per claim the README makes. The single source of truth for the review dashboard
# (scripts/review.py: make review-serve / review-export / review-summary) and, from Phase 2, for docs/verify_pack.md.
# Per view: the claim in the README's words, the docs/x0_numbers.json keys it backs ("sources"; <m> = 9b / 27b / 122b /
# muse, the same keys as the `source` column of figures/story/data.csv), per model the run dirs and their per-item
# files, the filters that make the claim's item set (as the verdict used them), and what each answer class means.
# Read-only on results/. status: phase1 = in the dashboard now; later = listed, not yet in the dashboard. headline: the
# numbers the dashboard recounts over the whole item set (Phase 2) and compares with figures/story/data.csv.
# join_runs (per model): runs whose rows give the arms the view's run does not have, joined by scene (x0_parts). A run
# that has not landed gives no items; its view lists it as "not run yet" (no run dir) or "no outcomes.jsonl yet".
#
# 29 Oct (Dan 11:45, jobs/c3/batch53.yaml verify_prep_1145): the views are today's headline claims. tier: 1 marks the
# seven views Dan reads tomorrow, in his order a-g (the first seven views below); tier 2 only once tier 1 is done.
# headline csv: a number in figures/story/data.csv found by (model column, quantity) where no x0_numbers key exists
# (Lightning, the newer tests). The fixed sample Dan reads (seed 29) is at the end of this file (fixed_sample).
version: 1

models:
  qwen3.5-9b: {key: 9b, label: Qwen3.5-9B, layer: 12}
  qwen3.6-27b: {key: 27b, label: Qwen3.6-27B, layer: 32}
  qwen3.5-122b-a10b:
    key: 122b
    label: Qwen3.5-122B
    layer: 33
    flags: ["L33 came from another rule: the 27B's relative depth carried over (not the 9B / 27B / Muse layer rule)",
            "FP8; MoE, ~10B active"]
  muse-glimmer-30b: {key: muse, label: Muse Glimmer 30B, layer: 26}
  nemotron-3.5-lightning:
    key: lightning
    label: Nemotron 3.5 Lightning
    layer: 14
    flags: ["○ its gate was chosen after the 60-scene pre-check was seen (README: hollow marks)",
            "L14 by the rule fixed before its layer sweep was read (Dan 29 Oct ~00:50)"]

# The inspector panel's residual states for the fixed sample's items (Dan 29 Oct 11:45, inspector_1145 item 1; the
# inspector agent's GPU job, queued ~12:30, landing ~15:00): per model, the run dir under results/review_states/.
jspace_states:
  qwen3.5-9b: results/review_states/qwen35_9b_review_states
  qwen3.6-27b: results/review_states/review_states_27b
  qwen3.5-122b-a10b: results/review_states/qwen35_122b_review_states
  muse-glimmer-30b: results/review_states/muse30_review_states
  nemotron-3.5-lightning: results/review_states/nem35l_review_states

# Token ids are decoded with tokenizer.json only, at the revision pinned in src/bridge_jspace/pins.py (hf_hub_download
# of that one file). The three Qwens share one tokenizer.json (sha256 5f9e4d4901a92b99...); Muse has its own; Lightning
# its own (pins.TARGETS["nemotron-3.5-lightning"], revision pinned there).

# How each kind's per-item files are read (src/bridge_jspace/review/).
kinds:
  x0:
    files: [cases.jsonl, outcomes.jsonl, shares.jsonl, competence.jsonl, gate.json]
    prompts: >-
      cases.jsonl per (scene, rendering): context / cf_context, bridge / cf_bridge, pos (the bridge's token index, where
      the change is added), readers.{PP,PM}: question, answer / cf_answer, ids.org / ids.alt, tok_A / tok_b.
    outcomes: >-
      per (scene, rendering, layer, reader, dict, k, omp, arm): switched, role, p_org, p_alt, ld. No top token is
      stored: the stored class is role.
    classes:
      b: changed answer - the top token is the changed prompt's answer (it switched)
      A: original answer - the top token is the original prompt's answer
      other: another token (not stored)
    eligible: >-
      x0_necessity.gate_and_eligible: org and alt said right and read right by both readers (competence.jsonl), the
      first 200 in scene order; the item set is the scenes in outcomes.jsonl at the layer.
  routes:
    files: [cases.jsonl, outcomes.jsonl, norms.jsonl, competence.jsonl, gate.json, c0_check.json]
    prompts: >-
      cases.jsonl per scene (700 generated per condition, seed 2510): context (O) / cf_context (S), bridge (the O
      pick) / cf_bridge (the S pick), pos, expect (the digit each route predicts), route_tokens, readers as x0.
    outcomes: per (scene, condition, reader, arm) - top (token id), route (lookup only), switched, role, p_org, p_alt, ld.
    classes:
      identity: the bridge item's own locker digit in S (C1 - the same as original; reported as identity)
      position: the digit in S of the locker sentence at the bridge's sentence slot in O
      value: the new digit S gives the moved item
      original: O's answer
      other: none of these. C0 stores "other" for a correct switch (route_tokens has no "switch"); for C0 the class is
        re-derived from expect - switch / original / other.
      recall: switched = the recall follows S (the top token is S's answer, the S pick's legs)
    eligible: >-
      x6_routes: both readers say and read O's and S's answers right (competence.jsonl), the first 300 per condition;
      the item set is the scenes in outcomes.jsonl for the condition.
  x5:
    files: [cases.jsonl, outcomes.jsonl, competence.jsonl, gate.json]
    prompts: >-
      cases.jsonl per passage: context / cf_context (the bridge changed in its binding sentence only), bridge /
      cf_bridge, pos, relation, genre, readers.{PP,PM}: question, answer / cf_answer (words), lure / cf_lure (the
      passage's own value for the bridge), ids.org / ids.alt.
    outcomes: >-
      per (scene, layer, reader, dict, k, omp, arm): switched, top (the answer word read: the top first token among the
      relation's answer words), org_read, lure_org / lure_alt, share. No p / ld stored.
    classes:
      b: changed answer - the top word is the changed passage's answer (it switched)
      A: original answer - the top word is the original passage's answer
      other: another answer word
    eligible: >-
      x5_natural: both readers read the original and changed passages right (competence.jsonl); the item set is the
      passages in outcomes.jsonl at the layer.
  massmean:
    files: [outcomes.jsonl, manifest.json]
    prompts: >-
      none of its own: the cases.jsonl of the run named in manifest.json "single" (the one-change main test), joined by
      scene.
    outcomes: per (scene, reader, arm) - switched, role, p_org, p_alt, ld, share_<part>.
    classes: {b: changed answer (it switched), A: original answer, other: another token (not stored)}
    eligible: >-
      manifest items_rule - the one-change items whose org and alt locker sentences both come before the asked pick;
      the item set is the scenes in outcomes.jsonl.
  x8:
    files: [outcomes.jsonl, gate.json, manifest.json]
    prompts: >-
      none of its own: x8_write.stage_run builds O from x6_routes' generator (same seed 2510, C2, same eligibility), so
      its scenes are the C2 cases of the model's routes run, joined by scene. Checked per item (badge): the stored entity
      is that case's bridge and j its locker slot.
    outcomes: per (scene, reader, kind none / write / random, j, k, s) - top, norm, class (lookup), changed (recall).
    classes:
      target: the digit of locker slot k (the slot written to)
      original: the digit of locker slot j (the bridge's own)
      third: the digit of the remaining slot
      other: none of the three
      recall: changed = the recall's top token is not O's answer (tok_A; x8_write.stage_run)
  x0_parts:  # a kind of its own: x0's loader reads a run's own cases.jsonl, and shares with rand_share and a layer
    files: [outcomes.jsonl, shares.jsonl, manifest.json]
    prompts: >-
      none of its own: the cases.jsonl of the run named in manifest.json "single" (under "source_exp", x0_necessity),
      joined by scene, as massmean. The view's join_runs (x0 runs) give the arms this run does not have, by scene; their
      prompts are checked per item (badge "second run has the same prompts").
    outcomes: >-
      as x0, per (scene, layer, reader, dict, k, omp, arm); dict jpp_other has omp "other" and k its atom count; shares.jsonl
      per (scene, dict, k, omp) has no layer and no rand_share. Runs since batch 45 store the top token.
    classes:
      b: changed answer - the top token is the changed prompt's answer (it switched)
      A: original answer - the top token is the original prompt's answer
      other: another token
    eligible: >-
      x0_parts.stage_run: every scene of the source run's chat outcomes; the item set is the scenes in outcomes.jsonl at
      the layer.
  x45b_sweep:  # a kind of its own: per-layer arms, patches at several positions, cases keyed "entity"
    files: [cases.jsonl, outcomes.jsonl, manifest.json, plan.json]
    prompts: >-
      cases.jsonl per item (x45b_binding.select, then role_positions): context (O) / cf_context (S), entity (the bridge) /
      cf_bridge, pos (the bridge word), patched (O's locker-sentence token positions) / source (S's), lockers (sentences,
      positions per sentence, align), marks (character spans of the bridge word and the locker sentences in the lookup's
      O text), roles.{item,value,final}.{org,alt} (token positions), readers.{PP,PM}: question, answer / cf_answer,
      ids.org / ids.alt, tok_A / tok_b, text.org / text.alt. The readers' prompts are the same through the last locker
      token (select), so one set of positions serves both.
    outcomes: >-
      per (scene, reader, arm): none (O unedited), bw<l> / ls<l> / li<l> / lv<l> / lf<l> at each sweep layer l (manifest
      sweep_layers: L/2 to L every 2), S (S read on S); layer, switched, top, role, p_org, p_alt, ld.
    classes:  # an item's class is S read on S's role (b = S itself switches; the sweep's "share of S's switches" counts these)
      b: S's answer (switched)
      A: O's answer
      other: another token
    eligible: >-
      x45b_binding.select on the main run: its items at L whose original locker sentence comes after the asked pick, the
      locker sentences aligned; every one is read, so none is outside the set.
  x45a_prepend:  # a kind of its own: one item is a base scene in every variant (the routes loader keys one case per item)
    files: [cases.jsonl, outcomes.jsonl, norms.jsonl, beta.jsonl, competence.jsonl, gate.json, manifest.json]
    prompts: >-
      cases.jsonl per (base scene, variant) (x6_routes.prepend_cases): the routes C2 case with one sentence put before O's
      and S's first sentence ("prepended": V0 none, V1-V3 a new person's pick, V4 a filler), scene "<base>-<variant>",
      base_scene, variant, move (the pointer's: the O bridge's locker slot -> the S bridge's), pos, expect, readers as
      routes.
    outcomes: >-
      per (base scene, variant, reader, arm): top, route (lookup), switched, role, p_org, p_alt, ld. norms.jsonl: each
      variant's share_alf / share_jpp and norm; beta.jsonl: the code's shift vs V0 at O's bridge word (V1-V4).
    classes:  # the stored route under the view's class_arm (only the pointer part) in V0; the card shows every variant
      identity: the S bridge item's own locker digit in S
      position: the digit in S of the locker sentence at the bridge's sentence slot in O
      value: the new digit S gives the moved item
      original: O's answer
      other: none of these
      recall: follows S (the top token is S's answer) or stays
    eligible: >-
      x6_routes --prepend: the base scenes eligible (both readers say and read O's and S's answers) in every variant that
      passed its gate, the first 300 in scene order; every variant of a base scene is read (paired).
  x45d:  # a kind of its own: x0's rows on varied formats; the format, the fit run's split and the cell gate on top
    files: [cases.jsonl, outcomes.jsonl, shares.jsonl, competence.jsonl, gate.json, manifest.json]
    prompts: >-
      cases.jsonl per scene (x0b_generalize.scene_case, the held-out half only): context / cf_context in prose, JSON or
      table, format, level, domain, numbers, order (the bridge's locker statement vs the asked pick), facts, bridge /
      cf_bridge, pos, readers as x0. The fit run (manifest pcf_from, results/x7_pcf/*_x45d_fit) has split.json: per
      format, the bridge items of the fit and the test (held-out) halves.
    outcomes: >-
      as x0 at the run's layer (manifest predicted), with the top token: dict jpp (k 25, signed and nonneg), alf (U, the
      simple-scene pointer, k 4), pcf (the format's refit basis, k 4); shares.jsonl per (scene, dict, k, omp): share,
      rand_share.
    classes:
      b: changed answer - the top token is the changed prompt's answer (it switched)
      A: original answer - the top token is the original prompt's answer
      other: another token
    eligible: >-
      x0b_generalize.gate_cells: per cell (domain / format / level) the read gate (>= 0.80, both readers), then org and
      alt said and read right by both readers, at most 40 per cell in scene order.
  x45g:  # a kind of its own: massmean's rows on every item, two runs (scene sets) per model, the stored sentence order
    files: [outcomes.jsonl, manifest.json]
    prompts: >-
      none of its own: the cases.jsonl of the run named in manifest.json "single" (x0_necessity), the cases
      x0_massmean.examples_blob rebuilds (X.build_cases on the manifest's set with its alt: cf = two people swap, single =
      only the asked pick), joined by scene. Checked per item (badge): the stored entity is the case's bridge, and the
      stored org_order / alt_order are the case's sentence order.
    outcomes: >-
      per (scene, reader, arm): switched, role, p_org, p_alt, ld, share_jpp / share_Alf / share_jppAlf, org_order /
      alt_order (x0_strata.features: the original / changed bridge's locker sentence vs the asked pick). No top token.
    classes: {b: changed answer (it switched), A: original answer, other: another token (not stored)}
    eligible: >-
      x0_massmean --mode two_routes: every chat item of the single run, both sentence orders (manifest items_rule).
  x51_answer:  # 51.12 E1, the answer control (scripts/x51_answer.py --set e1)
    files: [cases.jsonl, outcomes.jsonl, norms.jsonl, readout.jsonl, gate.json, manifest.json]
    prompts: >-
      the cases.jsonl of the X0 run its gate.json names ("source"), joined by scene; this run's own cases.jsonl (reader
      ids, answer token lists) is checked against it per item (badge "second run has the same prompts").
    outcomes: >-
      per (scene, reader, arm): top, switched, role, p_org, p_alt, ld. Arms: none, whole; no_jpp / no_jpp_rand (arm 1:
      without the lens part); no_jpp_A / no_jpp_A_rand (arm 2: without it, keeping its answer-word directions); no_A /
      no_A_rand (arm 3: without the answer-word directions only). readout.jsonl per (scene, variant O / S): the answer
      words' lens rank at the bridge word (answer_word_rank per reader).
    classes: {b: changed answer (it switched), A: original answer, other: another token}
    eligible: the source X0 run's item set (its first 200 eligible scenes at L).
  zach:  # Zach's passages, Z1-P: made-up final facts (scripts/x50_zach.py, part z1p)
    files: [cases.jsonl, outcomes.jsonl, norms.jsonl, competence.jsonl, gate.json, manifest.json]
    prompts: >-
      cases.jsonl per passage pair: readers K (the lookup: its passage states the made-up final fact) and M (the recall:
      its passage leaves the fact out; the true value is from memory), each with its own context / cf_context, ids, pos
      (the bridge token), tok_A / tok_b (answer words, read by their first token). K / M are shown as lookup / recall.
    outcomes: "per (scene, layer, reader, arm none / whole / no_jpp / no_jpp_rand): top, switched, role, p_org, p_alt, ld."
    classes: {b: changed answer (it switched), A: original answer, other: another token}
    eligible: >-
      x50_zach z1p: the gate (the lookup's read accuracy on the original passages >= 0.80), then the passages both
      readers say and read right, the first 200 (gate.json chosen).
  jread:  # 51.10, the bridge entity at the last token (scripts/x51_jread.py)
    files: [cases.jsonl, outcomes.jsonl, logit_lens.jsonl, peak.json, gate.json, manifest.json]
    prompts: >-
      cases.jsonl per scene (the X0 run's main-test items): context / cf_context, entity (the bridge) / cf_bridge, pos
      (the bridge word), jpos per reader (P1 the bridge word, P2 the question's pick, P3 the last token), group
      (locker-first / locker-after / mixed), readers as x0.
    outcomes: >-
      per (scene, reader, pos, layer, arm): top, switched, role, p_org, p_alt, ld, other_digit. The view reads P3 at each
      reader's read peak (peak.json): whole (the whole-state patch), swap (the lens swap), swap_rand / swap_rot (its
      controls), jpp1 / rand1, jpp2 / rand2 (the J++ part of the change at gain 1 / 2 and a random part of its size).
      logit_lens.jsonl: the plain logit lens's top token per layer at the last token (O and S). The J++ lens readout per
      item is not stored (read.json holds its rates per layer); the inspector panel computes it.
    classes: {b: changed answer (it switched), A: original answer, other: another token}
    eligible: the locker-first items of the X0 run (cases.jsonl group), the swap grid's items.

views:
  # ---------------------------------------------------------------- Tier 1 (Dan 29 Oct 11:45): read tomorrow, order a-g
  # a main_swap (conflict test) · b answer_control (51.12 E1) · c routes (+ address removal) · d x8_writes (swap s = 2)
  # · e z1p (Zach's made-up facts, 9B) · f last_token (51.10) · g sentence_order. targeted: the 4 targeted items' rule
  # per view (Dan: 2 nearest the decision, |p_alt - p_org| smallest; 2 "surprising"); see fixed_sample at the end.
  # ---------------------------------------------------------------- Phase 1 (Tuesday's hand check)
  - id: main_swap
    title: "a. Conflict test: which part of the bridge word each reader follows"
    status: phase1
    tier: 1
    order: a
    kind: x0
    readme: "docs/depth/README.md, Claims row 1; Part I 'In a conflict, which part of the bridge word does each reader follow?', Fig. 1 (fig01_split)"
    claim: >-
      The recall follows the lens part of the bridge word; the lookup follows the rest (README claim 1, grade A, 27B
      partial; 9B, 27B, Muse, Lightning, and the 122B). Rule fixed in advance: "Confirmed if the lookup loses at most 0.10
      beyond random and the recall loses at least 0.30 of its switches without the lens part; killed if the lookup loses
      at least 0.20 or the recall under 0.20." Switches lost beyond a random part = (switches kept without the random
      part - switches kept without the lens part) / switches with the whole change.
    sources: [lk_excess_<m>, rc_excess_<m>, contrast_<m>]
    filters:
      rendering: chat
      layer: fixed
      readers: [PP, PM]
      arms:  # label: [arm, dict, k, omp]
        unedited: [none, "-", 0, "-"]
        whole: [whole, "-", 0, "-"]
        without J++: [no_part, jpp, 25, signed]
        without its random part: [no_rand, jpp, 25, signed]
    headline: {stat: extra_loss, whole: whole, part: without J++, random: without its random part,
               keys: {PP: lk_excess_<m>, PM: rc_excess_<m>, gap: contrast_<m>},
               csv: {PP: "conflict: lookup, switches lost beyond a random part", PM: "conflict: recall, switches lost beyond a random part",
                     gap: "main test (two people swap picks): gap"}}
    decisive: ["unedited", "whole", "without J++", "without its random part"]  # the arms shown side by side on each card
    readme_rows: [1]  # docs/depth/README.md claims-table rows, quoted verbatim in the pack
    readme_quotes: ["The recall follows the part of the bridge word the lens reads; the lookup follows the rest"]  # README lines containing these, quoted whole
    targeted:
      nearest: [without J++, without its random part]  # |p_alt - p_org| smallest under either arm, items the whole change switched
      surprising: {reader: PP, part: without J++, random: without its random part}
    runs:
      qwen3.5-9b: [results/x0_necessity/qwen35_9b_x0_necessity]
      qwen3.6-27b: [results/x0_necessity/x0_necessity_27b_chat]
      qwen3.5-122b-a10b: [results/x0_necessity/qwen35_122b_x0_necessity_r2]
      muse-glimmer-30b: [results/x0_necessity/muse30b_x0_necessity]
      nemotron-3.5-lightning: [results/x0_necessity/nem35l_x52_conflict]
    superseded:
      qwen3.5-122b-a10b: [results/x0_necessity/qwen35_122b_x0_necessity]
    notes: >-
      Lightning's run reads every 4th layer (L2-L50); the view reads L14 only. Its numbers in the README come from
      data.csv (cards: conflict) and figures/story fig01 (gap), not x0_numbers.json.

  - id: answer_control
    title: "b. Answer control (51.12 E1): is the lens part the item or its answer?"
    status: phase1
    tier: 1
    order: b
    kind: x51_answer
    readme: "docs/depth/README.md, Part I 'In a conflict ...', the result table's last four rows (specificity; conflict_answer in data.csv)"
    claim: >-
      What the recall follows is the item, not its answer: keeping the answer's lens directions keeps almost all of the
      recall's loss (0.95 / 0.93 / 0.93 / 0.92 ○), and removing only the answer directions costs it about nothing beyond
      random. Rule fixed in advance: "the lens effect is the item if the recall keeps at least 0.7 of its loss with the
      answer directions kept and loses at most 0.10 beyond random without them only"; first, the answer word's lens rank
      at the bridge word (outside the top 50 on >= 90% of items: "the answer word is not read", Muse and Lightning).
    sources: []
    filters:
      layer: fixed
      readers: [PP, PM]
      arms:  # label: arm (x51_answer e1)
        unedited: none
        whole: whole
        "arm 1: without the lens part": no_jpp
        "arm 1's random part": no_jpp_rand
        "arm 2: without the lens part, its answer directions kept": no_jpp_A
        "arm 2's random part": no_jpp_A_rand
        "arm 3: without the answer directions only": no_A
        "arm 3's random part": no_A_rand
    headline:
      - {stat: share_kept, reader: PM, csv: "main test, recall: share of its loss kept when the lens part keeps the answer words' directions"}
      - {stat: extra_loss, reader: PM, part: "arm 3: without the answer directions only", random: "arm 3's random part",
         csv: "main test, recall: switches lost beyond random without the answer words' directions only"}
      - {stat: answer_rank_below, reader: PM, top: 50, csv: "main test, recall: items whose answer word ranks below the lens's top 50 at the bridge word"}
    decisive: ["unedited", "whole", "arm 1: without the lens part", "arm 1's random part", "arm 2: without the lens part, its answer directions kept", "arm 2's random part", "arm 3: without the answer directions only", "arm 3's random part"]  # the arms shown side by side on each card
    readme_rows: []  # docs/depth/README.md claims-table rows, quoted verbatim in the pack
    readme_quotes: ["What the recall follows is the item, not its answer"]  # README lines containing these, quoted whole
    targeted:
      nearest: ["arm 1: without the lens part", "arm 2: without the lens part, its answer directions kept"]
      surprising: {reader: PP, part: "arm 1: without the lens part", random: "arm 1's random part"}
    runs:
      qwen3.5-9b: [results/x51_answer/qwen35_9b_x51_12_e1_r2]
      qwen3.6-27b: [results/x51_answer/x51_12_e1_27b_r2]
      qwen3.5-122b-a10b: [results/x51_answer/qwen35_122b_x51_12_e1]
      muse-glimmer-30b: [results/x51_answer/muse30_x51_12_e1_r2]
      nemotron-3.5-lightning: [results/x51_answer/nem35l_x52_answer]
    superseded:
      qwen3.5-9b: [results/x51_answer/qwen35_9b_x51_12_e1]
    notes: >-
      Verdicts: results/x51_answer/x51_12-20261028T201842Z (9B, 27B, Muse) and x52_answer-20261029T002056Z (Lightning).
      The 122B's E1 (jobs/c3/x51_12_e1_122b.yaml, Dan 11:30): Dan 12:10 (batch53 decisions_1210b), "the 122B's
      answer control landed after the sample was fixed; not in the hand-check" (its run is listed here, outside the
      fixed sample). The answer word's lens rank comes from readout.jsonl (variants O and S); "below the top 50" = rank
      > 50 on both O and S (x51_answer's not_read).

  - id: routes
    title: "c. Routes test and address removal: what the lookup follows (C0 sanity, C1 same item moved, C2 another item moved)"
    status: phase1
    tier: 1
    order: c
    kind: routes
    readme: "docs/depth/README.md, Claims rows 4, 6, 7; E5 'Identity, position, never the value'; E6 'The address: probe, remove, add, swap'"
    claim: >-
      The lookup goes by which item it is or where its locker sits, never by the number (claim 4, A); the address can be
      removed: without it position answers drop to 0.08 / 0.06 / 0.27 / 0.10 ○ against 0.54 / 0.25 / 0.55 / 0.56 ○ without
      a random part (claim 6, A); adding the address alone brings position answers back on the 9B, Muse and Lightning, not
      the 27B (claim 7, B).
