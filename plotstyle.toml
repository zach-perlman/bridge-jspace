# The write-up's vocabulary for styles-plot (docs: https://github.com/danorel/styles-plot, docs/ADOPTING.md).
# Carried over from src/bridge_jspace/figkit/terms.py and palette.py; tests/test_plotstyle.py keeps them in sync.
# Mention and question have no colours (Dan, 7 Nov): they are not roles.

[project]
name = "bridge-jspace"

[roles.recall]
slot = "ink"
word = "recall"
meaning = "the recall reader"

[roles.lookup]
slot = "violet"
word = "lookup"
meaning = "the lookup reader"

[roles.lens]
slot = "teal"
word = "lens part"
meaning = "the lens part: J++ directions read at a word"

[roles.address]
slot = "amber"
word = "address"
meaning = "the address and the position route"

[roles.identity]
slot = "blue"
word = "identity"
meaning = "the identity route; a change of item"

[roles.answer]
slot = "brick"
word = "answer"
meaning = "the answer span; the answers' own directions"

[roles.neutral]
slot = "slate"
word = "neutral"
meaning = "a quantity of no role, such as a difference"

[controls]
names = ["rotated", "logit lens", "PCA", "a random part", "energy-matched random", "a random vector", "layout-only probe", "10 random heads", "no change", "random lens directions", "the whole state swapped in", "the full state", "most common locker", "shuffled pairs", "a random subspace", "the rest swapped in", "a control block", "2 × a random direction", "2 × the lens part", "the null's cut", "the null's median"]

[key]
tick = "the largest same-size control"
band = "within 0.10 of a random part"

[key.bands]
gate = "layers that pass the gate (the whole change switches at least 0.30 of the lookups)"
random_vectors = "the range of 200 random vectors"

[intervals]
ci95 = "95% interval"
range = "the range over the five start lockers"
wilson95 = "95% Wilson interval"

# a paired difference printed with its sign (neutral sentence − own passage)
[formats.points_signed]
decimals = 1
sign = true

[formats.share_signed]
decimals = 2
sign = true

[units.accuracy]
title = "accuracy (%)"
quantity = "answers right"
format = "accuracy"

[units.drop]
title = "answers turned wrong (points)"
quantity = "answers turned wrong"
format = "points"

[units.gap]
title = "gap: recall \u2212 lookup (points)"
quantity = "gap"
format = "points"

[units.switches]
title = "switches blocked beyond a random part (share)"
quantity = "switches blocked"
format = "share"

[units.lookups]
title = "share of lookups"
quantity = "lookups"
format = "share"

[units.rebuilt]
title = "share of the rebuilt energy"
quantity = "rebuilt energy"
format = "share"

[units.damage]
title = "\u00d7 the full damage"
quantity = "of the damage"
format = "ratio"

[units.z]
title = "z against 200 random vectors"
quantity = "distance from random"
format = "z"

[units.lookups_switched]
title = "share of lookups switched"
quantity = "lookups switched"
format = "share"

[units.moved]
title = "answers moved (points)"
quantity = "answers moved"
format = "points"

[units.attention]
title = "share of the last token's attention"
quantity = "attention"
format = "share"

[units.cut]
title = "share of the swap's switches cut"
quantity = "switches cut"
format = "share"

[units.gap_share]
title = "gap: recall \u2212 lookup (share of switches)"
quantity = "gap"
format = "share"

[units.probe_accuracy]
title = "probe accuracy (share)"
quantity = "probe accuracy"
format = "share"

[units.undone]
title = "share of the damage undone"
quantity = "of the damage undone"
format = "share"

[units.drop_beyond]
