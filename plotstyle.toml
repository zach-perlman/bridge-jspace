[[terms.banned]]
pattern = "\\bJ\\+\\+ part\\b"
regex = true
use = "lens part"

[[terms.banned]]
pattern = "\\bJ-part\\b"
regex = true
use = "lens part"

[[terms.banned]]
pattern = "\\btaken out\\b"
regex = true
use = "knock-out / removed from the patch"

[[terms.banned]]
