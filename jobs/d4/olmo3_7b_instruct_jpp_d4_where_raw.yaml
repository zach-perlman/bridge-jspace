question: >-
  On OLMo-3-7B-Instruct with our J++, in the raw prompt format its animal-suite runs use, does a lens push at a stated bridge's sentence or word switch recalls but not lookups (finding 7)?
why_it_matters: >-
  The chat-format copy (olmo3_7b_instruct_jpp_d4_where) has ~20 eligible scenes: OLMo-Instruct is right on every recall -> lookup prompt for 30 of 400 items in chat format, 171 scenes in raw format (olmo3_7b_instruct_competence_raw_v1). Raw gives the test its intended size.
hypotheses:
  H-around: 'v2.1 (from layer 10 on): recall >= 30%, lookup <= 10%. Prior 0.5 (copied from qwen35_9b_d4_where)'
  H-no-cell: 'no valid cell. Prior 0.3 (copied from qwen35_9b_d4_where)'
  H-where: 'the lookup follows (>= 30%). Prior 0.05 (copied from qwen35_9b_d4_where)'
  inconclusive: 'Prior 0.15 (copied from qwen35_9b_d4_where)'
decision_rule: >-
