id: d4_where_fresh_seed2_27b
title: "Where can the lens write a stated bridge? D4 v2 on a second fresh draw, rules v2 and v2.1 (Qwen3.6-27B)"
thread: D4
gpus: 1
mem_gb: 75
est_gpu_hours: 1.3
depends_on:
- d4_where_fresh_27b
command: >-
  uv run python scripts/early_push_where.py run --name d4_where_fresh_seed2_smoke_27b --n 1 --scenes fresh --rule v2 --fresh-seed 2 --exclude-runs d4_where_fresh_27b --why "smoke: the fresh-scene path end to end; not a result"
  && uv run python scripts/early_push_where.py run --name d4_where_fresh_seed2_27b --n 100 --scenes fresh --rule v2 --fresh-seed 2 --exclude-runs d4_where_fresh_27b --why "F7 replication (Dan, 23 Oct): a second fresh draw (seed 2, d4_where_fresh_27b's scenes left out), rule v2 as fixed before d4_where_fresh_27b"
figures_command: >-
  uv run python scripts/early_push_where.py analyze --name d4_where_fresh_seed2_27b --rule v2.1
  && uv run python scripts/early_push_where.py figures --name d4_where_fresh_seed2_27b
question: >-
  On a second draw of scenes not used before (seed 2; neither map_A8_v1's nor d4_where_fresh_27b's), at the cell chosen by the fixed rule, does a lens push at the bridge's own sentence or word switch lookups from a stated bridge (prompt -> prompt) as it switches recalls (prompt -> memory)?
why_it_matters: >-
  Finding 7 (the lens writes a stated bridge for recall, the lookup ignores it) rests on one fresh draw on this model; a second draw with the rules unchanged shows whether it is that draw's.
hypotheses:
  H-around: 'the primary valid cell switches prompt -> memory >= 30% and prompt -> prompt <= 10% (scene-paired gap lower bound >= 20 points). Prior 0.65 (copied from d4_where_fresh_27b)'
  H-where: 'prompt -> prompt also switches >= 30% there. Prior 0.05 (copied from d4_where_fresh_27b)'
  H-no-cell: 'no cell passes selection and the off-path check. Prior 0.2 (copied from d4_where_fresh_27b)'
  inconclusive: 'a cell exists, prompt -> prompt between 10% and 30% or the gap is not clear. Prior 0.1 (copied from d4_where_fresh_27b)'
decision_rule: >-
  scripts/early_push_where.py's docstring, rule v2 (committed before d4_where_fresh_27b): a cell (s or w, layer, scale) is selected iff the lens push switches prompt -> memory >= 30% (Wilson lower bound >= 0.20), the random push switches it <= 5%, the lens push changes <= 10% of memory -> prompt and of memory -> memory answers (off the path) and the random push switches <= 5% of prompt -> prompt. Primary = the selected cell with the highest prompt -> memory rate (ties: smaller scale, earlier layer, the word before the sentence). H-where iff prompt -> prompt >= 30% (lower bound >= 0.20) there; H-around iff prompt -> prompt <= 10% and the scene-paired BR - BL gap's 2.5th percentile >= 0.20; else inconclusive; no selected cell: H-no-cell. Reported, not decisive: every cell, the whole context, the question's subject phrase at layer 20, 8x (slide 6's anchor), the off-scene push, the text edits. Amendment 2026-10-22 20:35 +0200 (Dan), reported alongside v2 (revised 20:55: v2 stays the main rule because v2.1 was written knowing the old data; both verdicts are shown, and a disagreement is stated as such): rule v2.1. v2 applied to d4_where_27b (already opened) picks the word at layer 16, 8x (recall 90%, lookup 20%), where the push moves lookups as an input edit would, while every valid cell at layers 20-36 has lookup 0%. v2.1 = v2 with the primary cell chosen among valid cells at layers >= 20; valid cells below 20 reported separately, not decisive. Analysis: the figures stage runs `uv run python scripts/early_push_where.py analyze --name d4_where_fresh_seed2_27b --rule v2.1` (a new analysis-v2.1-<stamp>/ folder; the run's own summary keeps v2). Second draw (Dan, 23 Oct ~00:40): --fresh-seed 2 and --exclude-runs d4_where_fresh_27b (the first fresh draw's scenes left out, read from its selection.json), nothing else changed.
controls:
- 'a random direction at the same per-position norms; a push toward an animal not in the scene (other leg count); the text edits of slide 6; memory -> prompt and memory -> memory, for which the owner sentence is off the path'
n: '100 fresh scenes, the four families on each (animal suite, wording A): drawn with seed 2 from the scenes eligible in all four families (every competence prompt right), not in map_A8_v1 and not in d4_where_fresh_27b''s draw (pool 247 - 100 = 147 before alignment drops); items right unedited'
seeds: [0, 2]
notes: "mechanical copy of d4_where_fresh_27b (Dan, 23 Oct ~00:40: a 10-hour plan); not opened before Dan's predictions. Primary lens (Dan, 23 Oct ~00:30): ours on 64 prompts for Qwen3-32B and OLMo, Zach's for Gemma and Muse; no silent switch. On this model the lens is its frozen published J++ (pins), as in the first draw. Only the run names, --fresh-seed 2 and --exclude-runs d4_where_fresh_27b change; the v2.1 analysis (run by hand after the first draw) is in the figures stage, as in qwen35_9b_d4_where."
