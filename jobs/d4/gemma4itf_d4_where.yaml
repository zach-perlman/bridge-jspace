  Runs iff Zach's J++ passes gate v1 (scripts/d1_precheck.py, --min-topics 0: only the gate matters here). scripts/early_push_where.py: rule v2 main, v2.1 reported (boundary 19 = the 27B's 20 x 60/64, rounded half up as muse30b_d4_where rounds); grid the 27B's 12-44 x 60/64 (11 15 19 23 26 30 34 38 41), the context the 27B's 28-44 x 60/64 (26 30 34 38 41); both verdicts shown. Fresh scenes: suite_split's eligibility on this model (the competence run in this job, chat format as the source), none of map_A8_v1's scenes, seed 1. Primary lens (Dan, 23 Oct ~00:30): ours on 64 prompts for Qwen3-32B and OLMo, Zach's for Gemma and Muse; no silent switch.
