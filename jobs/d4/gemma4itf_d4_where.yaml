  H-no-cell: 'no cell passes selection and the off-path check. Prior 0.4 (copied from muse30b_d4_where)'
  H-where: 'prompt -> prompt also switches >= 30% there. Prior 0.05 (copied from muse30b_d4_where)'
  inconclusive: 'Prior 0.15 (copied from muse30b_d4_where)'
