question: >-
  Does recall follow a stated bridge written by the lens at its sentence while the lookup does not (finding 7), on Gemma 4 31B-it with Zach's J++?
why_it_matters: >-
  Finding 7 rests on two Qwen models; Gemma 4 is another family (sliding + global attention). Its earlier lenses (base-model J++, the every-3rd-layer refit) failed their controls; Zach's J++ has maps at every layer 0-58.
hypotheses:
