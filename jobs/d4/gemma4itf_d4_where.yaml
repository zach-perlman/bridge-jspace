notes: "Mechanical copy of muse30b_d4_where (the 27B's d4_where_fresh_27b scaled by depth, here x 60/64) (Dan, 23 Oct ~01:30: the full J++ lens table); not opened before Dan's predictions. The competence step is lens-free and runs under gemma-4-31b-it-full so that suite_split finds it by prefix (gemma4itf_competence_chat_v1), as in qwen3_32b_jpp_d4_where; the earlier gemma4itb_competence_v1 (same weights) covers 150 items per family only. Depends on gemma4itf_d1_topics2_map_q only for the precheck's competence file (gemma4itf_d1_topics2_competence). Gemma breaks under most interventions (its random patch breaks 85%): the v2 off-path check may leave no valid cell (H-no-cell)."
