id: olmo3_7b_instruct_jpp_d4_where
title: "Where can the lens write a stated bridge? (OLMo-3-7B-Instruct, our J++, fresh scenes, rules v2 and v2.1)"
thread: D4
gpus: 1
mem_gb: 40
est_gpu_hours: 0.4
depends_on:
- olmo3_7b_instruct_jpp_lens_gate
command: >-
  BJ_TARGET=olmo-3-7b-instruct-jpp uv run python scripts/d1_precheck.py --gate olmo3_7b_instruct_jpp_lens_gate --competence olmo3_7b_instruct_d1_topics2_competence --min-topics 0
  && BJ_TARGET=olmo-3-7b-instruct-jpp BJ_FORMAT=chat uv run python scripts/suite_v1.py manifest --set main --name olmo3_7b_instruct_jpp_competence_chat_v1 --why "the animal suite on OLMo-3-7B-Instruct in chat format under the J++ prefix: which scenes are right on every prompt (D4's fresh-scene eligibility; lens-free)"
  && BJ_TARGET=olmo-3-7b-instruct-jpp BJ_FORMAT=chat uv run python scripts/suite_v1.py competence --name olmo3_7b_instruct_jpp_competence_chat_v1
  && BJ_TARGET=olmo-3-7b-instruct-jpp uv run python scripts/early_push_where.py run --name olmo3_7b_instruct_jpp_d4_where_smoke --n 1 --scenes fresh --rule v2 --layers 6 8 10 12 14 16 18 20 22 --context-layers 14 16 18 20 22 --v21-min-layer 10 --why "smoke: not a result"
  && BJ_TARGET=olmo-3-7b-instruct-jpp uv run python scripts/early_push_where.py run --name olmo3_7b_instruct_jpp_d4_where --n 100 --scenes fresh --rule v2 --layers 6 8 10 12 14 16 18 20 22 --context-layers 14 16 18 20 22 --v21-min-layer 10 --why "finding 7 on OLMo-3-7B-Instruct with our J++ (the 9B's grid: the same depth, 32 layers)"
figures_command: BJ_TARGET=olmo-3-7b-instruct-jpp uv run python scripts/early_push_where.py analyze --name olmo3_7b_instruct_jpp_d4_where --rule v2.1 && BJ_TARGET=olmo-3-7b-instruct-jpp uv run python scripts/early_push_where.py figures --name olmo3_7b_instruct_jpp_d4_where
question: >-
  On OLMo-3-7B-Instruct with our J++, does a lens push at a stated bridge's sentence or word switch recalls but not lookups (finding 7)?
why_it_matters: >-
  Finding 7 rests on two Qwen models (Qwen3.6-27B, Qwen3.5-9B). OLMo is another family and attention-only, with the 9B's depth (32 layers). Its plain J-lens had maps at every 3rd layer only and D4 never ran on it; with our J++ (every layer) the 9B's grid applies unchanged.
hypotheses:
  H-around: 'v2.1 (from layer 10 on): recall >= 30%, lookup <= 10%. Prior 0.5 (copied from qwen35_9b_d4_where)'
  H-no-cell: 'no valid cell. Prior 0.3 (copied from qwen35_9b_d4_where)'
  H-where: 'the lookup follows (>= 30%). Prior 0.05 (copied from qwen35_9b_d4_where)'
  inconclusive: 'Prior 0.15 (copied from qwen35_9b_d4_where)'
decision_rule: >-
  Runs iff our J++ passes gate v1 (scripts/d1_precheck.py, --min-topics 0: only the gate matters here). scripts/early_push_where.py, rule v2 as the main rule and v2.1 reported alongside (both fixed before this run), both verdicts shown, as on the 27B (d4_where_fresh_27b) and the 9B (qwen35_9b_d4_where). Layers: the 9B's (the 27B's scaled by depth x 32/64; OLMo has 32 layers too): grid 6-22 every 2nd, the context at 14-22, v2.1 from layer 10. Fresh scenes as the 9B's: suite_split's eligibility on this model (the competence run in this job, chat format as the source), none of map_A8_v1's scenes, seed 1. Primary lens (Dan, 23 Oct ~00:30): ours on 64 prompts for Qwen3-32B and OLMo, Zach's for Gemma and Muse; no silent switch.
controls:
- 'a random push of the same size; a push toward an animal not in the scene; the text edits; memory -> prompt and memory -> memory off the path (copied from qwen35_9b_d4_where)'
n: '100 fresh animal-suite scenes requested (seed 1, eligible on OLMo-3-7B-Instruct in chat format), four families; about 20 expected to exist (see notes)'
seeds: [0]
notes: "Mechanical copy of qwen35_9b_d4_where (Dan, 23 Oct ~01:30: the full J++ lens table); not opened before Dan's predictions. The competence step is lens-free and runs under the J++ target so that suite_split finds it by prefix (olmo3_7b_instruct_jpp_competence_chat_v1), as in qwen3_32b_jpp_d4_where. Sample size, recounted from the committed lens-free olmo3_7b_instruct_competence_chat_v1 (same weights, same format): in chat format RL is right on every prompt for 30 of 400 items (OLMo-Instruct fails G1 in chat; the D5 ladder ran raw for that reason), so only 20 scenes are eligible in all four families and outside map_A8_v1: n ~20, not 100. In raw format the pool is 171 scenes (olmo3_7b_instruct_competence_raw_v1). A raw variant is not a mechanical copy (early_push_where has never run with BJ_FORMAT=raw) and is left to Dan. Waits for the OLMo J++ pin (target olmo-3-7b-instruct-jpp)."
