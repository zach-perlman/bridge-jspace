id: d3v4_competence_27b
title: "D3 v4 gate: can the 27B answer the new scenes (three topics, three wordings) in every family?"
thread: D3
gpus: 1
mem_gb: 70
est_gpu_hours: 0.35
depends_on:
- d3v4_entity_probe_27b
command: >-
  uv run python scripts/pointer_v4.py manifest --set main --name d3v4_competence_27b
  --why "D3 v4 gate: pointer_v4's main scenes (the probe-passing entities of three topics, three wordings), every alt
  and control prompt and each step alone"
  && uv run python scripts/pointer_v4.py competence --name d3v4_competence_27b
question: >-
  Can Qwen3.6-27B answer pointer_v4's main scenes (5 statements; up to 300 scenes per topic over its probe-passing
  entities and 3 x 3 wordings) in every family (memory -> prompt, named -> prompt, memory -> memory), every alt prompt
  (dissoc, same, redigit) and each step alone?
why_it_matters: >-
  Gate for d3v4_swap_main and d3v4_fit_main: both read only items with every prompt right, and need >= 150 eligible
  scenes per topic (pointer_swap: eligible in all three families; pointer_fit: memory -> prompt items whose entity or
  wording is held out of the fit).
hypotheses:
  H-competent: 'clean >= 95% in every topic x family cell (Wilson lower bound >= 0.85); named -> prompt >= 98%; scenes
    eligible in all three families >= 75% per topic (>= 190 of ~250-300)'
  H-wording: 'a wording drags a cell down: per wording (statement x question template) memory -> prompt clean differs
    by > 10 points from the topic mean'
  H-dialling: 'countries memory -> memory (the dialling code) is the weakest cell, eligible scenes in all families
    < 75% there'
  prior: 'Agent prior: H-competent 0.6, H-wording 0.3, H-dialling 0.4.'
decision_rule: >-
  pointer_v1's gate, unchanged: a (topic, family) cell enters the patching run iff its clean Wilson 95% lower bound
  >= 0.85; an item is eligible iff every prompt of it is right (org, alt, same, redigit, hop1, hop2); pointer_swap
  keeps scenes eligible in every family of its run, pointer_fit eligible items. Report read vs greedy agreement on the
  digit prompts and the eligible scenes per topic, per wording and per held-out cut.
controls:
- 'each step alone (cue -> entity with the context; the lookup with the entity named / the recalled fact)'
- 'answer read vs 8-token greedy on the digit prompts'
n: 'up to 300 scenes per topic x 3 topics x 3 families (~2,550 items, ~13,600 prompts with every candidate; fewer after the probe)'
seeds: [841]
notes: >-
  Enqueue only after data/pointer_v4/ is made from d3v4_entity_probe_27b and committed (see that spec's notes). Timing:
  d3v2_competence_27b answered ~28,600 prompts in 1,545 s (18.5/s): ~13,600 prompts ~ 12 min + reads ~3 min + load ~4
  min ~ 0.35 h.
