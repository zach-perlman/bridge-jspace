  && BJ_TARGET=qwen3.5-122b-a10b BJ_BATCH=4 uv run python scripts/pointer_swap.py figures --name qwen35_122b_d3v5_len8_swap
question: >-
  On Qwen3.5-122B and fresh 8-sentence lists, does the copied label pick the original's statement at the same place when
  the donor asks its 1st or 2nd sentence, and the original's statement about the donor's entity when it asks the 3rd to the 8th?
why_it_matters: >-
  Finding 5 is confirmed as a rule fixed in advance on 5-sentence lists only; the 8-statement split (README fig. 16)
  was read after the data. A fixed rule on fresh 8-sentence scenes says whether the order label covers only the first
  two places whatever the list length, or a share of the list, on a larger model.
hypotheses:
  H-A: 'e8-digit: position - identity (1st and 2nd) has its entity-cluster 95% lower bound > 0. Prior 0.9 (agent''s) (copied from d3v5_len8_swap_27b)'
  H-B: 'e8-digit: identity - position (3rd-8th) >= 0 with lower bound >= -0.05. Prior 0.75 (agent''s) (copied from d3v5_len8_swap_27b)'
  H-word: 'e8-word gets the same verdict as e8-digit (reported, not decisive). Prior 0.6 (agent''s) (copied from d3v5_len8_swap_27b)'
decision_rule: >-
  scripts/finding5_confirm.py, its rule unchanged and generalised to N statements before this run (the committed
  5-statement verdicts are reproduced byte for byte, tests/test_finding5_confirm.py), with --sentences 8: memory ->
  prompt, the donor's last two tokens copied at one layer, items split by the place k of the donor's asked statement;
  A: k = 1-2 pooled, position - identity with its entity-cluster 95% lower bound > 0; B: k = 3-8 pooled, identity -
  position >= 0 (point) with its lower bound >= -0.05; confirms iff A and B, partly if one, fails if neither. Layer:
  the last of 33 35 36 38 39 41 42 (the 27B's 44-56, every 2, scaled by depth) where the donor's own answer ('value',
  memory -> prompt, the level's rows) has its Wilson upper bound < 0.10, decided before the split is read; none
  qualifies = not testable. Decisive: e8-digit (finding 5's answer kind). e8-word judged by the same rule, reported (the
  bridge to the 12-sentence lists, which have colour words only). Per topic, every k and named -> prompt reported, not
  decisive. (--primary-layers only feeds pointer_swap's own pointer_v5 report, not this rule.)
controls:
- 'same entity, statements reshuffled (every hypothesis predicts answer org): damage bar (pointer_swap''s own)'
- 'random push of the same size per token at every layer; another topic''s prompt of the same answer kind and list length'
- 'org prompt into itself (no-op) and the layer-0 all-position patch (hook checks)'
- 'the donor''s own answer (value) as the layer cut-off'
n: 'every eligible scene, up to 150 per topic (3 topics), right on every prompt in both answer kinds and both families; memory -> prompt decisive. Before the gate, 123 of 450 scenes ask the 1st or 2nd sentence.'
seeds: [872, 0]
notes: "mechanical copy of d3v5_len8_swap_27b for Qwen3.5-122B (Dan, 23 Oct ~00:55: the whole grid on the 2x H200); not opened before Dan's predictions. Primary lens: neuronpedia's published J++ for Qwen3.5-122B-A10B (this job uses no lens). Only BJ_TARGET (on every stage), run / gate names, the batch and the layers change. Layers: the 27B's 44 46 48 50 52 54 56 x 48/64 = 33, 34.5, 36, 37.5, 39, 40.5, 42, rounded half up (as muse30b_d4_where) to 33 35 36 38 39 41 42 (7 layers, as the source); the source's --primary-layers default (pointer_swap's 48 and 50, inside its sweep) scaled the same way to 36 38 and passed explicitly, since 48 and 50 do not exist on a 48-layer model; it only feeds pointer_swap's own report. Data: data/pointer_v5/len8/ (seed 872). If a finding5_confirm call stops with 'no layer ... before the donor''s digit arrives', that level is not testable by the rule and the figures stage after it has to be run by hand. Memory (Dan, 00:55): FP8 weights ~127 GB of a 143 GB H200, so mem_gb 135 and BJ_BATCH=4 (the queued 122B specs use 16)."
