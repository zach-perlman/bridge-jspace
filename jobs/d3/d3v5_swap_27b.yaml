id: d3v5_swap_27b
title: "D3 v5: does the statement address survive colour-word answers and 8-statement lists?"
thread: D3
gpus: 1
mem_gb: 70
est_gpu_hours: 1.5
depends_on:
- d3v5_competence_27b
- d3v5_smoke_27b
command: >-
  uv run python scripts/pointer_swap.py manifest --data pointer_v5 --set main --name d3v5_swap_27b
  --families RL DL --n 150 --layers 46 48 50 52 --control-stride 1 --groups last --competence d3v5_competence_27b
  --why "D3 v5: the slot-vs-word-vs-answer patch at the last two tokens with colour-word answers and 8 statements, on
  the same scenes as digits and 5 statements; layers 48 and 50 pre-registered"
  && uv run python scripts/pointer_swap.py run --name d3v5_swap_27b
examples_command: uv run python scripts/pointer_swap.py examples --name d3v5_swap_27b --group last
figures_command: uv run python scripts/pointer_swap.py figures --name d3v5_swap_27b
question: >-
  When the alt prompt's last two tokens are patched into the org prompt, does memory -> prompt answer the value of
  the same statement slot (rather than bridge alt's own statement or the alt prompt's answer) when the answers are
  colour words instead of digits, and when the list has 8 statements instead of 5?
why_it_matters: >-
  The two boring explanations of the README's pattern 5: a trick for copying a digit, and a property of 5-item
  lists. Colour-word answers and 8-statement lists on the same scenes test both.
hypotheses:
  H-word: 'e5-word keeps the slot (pointer_swap docstring, pointer_v5 additions: verdict "same statement slot" at
    layer 48 or 50, pooled and in >= 2 of 3 topics). Prior 0.55'
  H-long: 'e8-digit keeps the slot. Prior 0.5'
  H-replicate: 'e5-digit (pointer_v4''s layout on new scenes) keeps the slot. Prior 0.75'
decision_rule: >-
  Fixed before the run: scripts/pointer_swap.py docstring, "pointer_v4 additions" and "pointer_v5 additions"
  (analyze writes summary.json `v5` and report.md). Memory -> prompt, last two tokens, layers 48 and 50; named ->
  prompt, layers 46 and 52, and e8-word reported.
controls:
- 'same entity, statements reshuffled (every hypothesis predicts answer org): damage bar'
- 'random push of the same size per token at every layer: chance bar for each predicted value'
- 'another topic''s prompt of the same answer kind and list length: realistic-activation null'
- 'org prompt into itself (no-op) and the layer-0 all-position patch (hook checks)'
n: 'up to 150 scenes per topic and list length eligible in both answer kinds and families; 3 topics'
seeds: [871, 0]
notes: '~1.5 GPU-h. Digit and word levels share their scenes (pointer_swap samples the same scenes for both).'
