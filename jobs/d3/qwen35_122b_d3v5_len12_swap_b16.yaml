id: qwen35_122b_d3v5_len12_swap_b16
title: "Finding 5 by the fixed rule on fresh 12-sentence lists, colour-word answers (Qwen3.5-122B, layers 33-42)"
thread: D3
gpus: 1
mem_gb: 135
est_gpu_hours: 1.6
depends_on:
- qwen35_122b_d3v5_len12_competence_b16
command: >-
  BJ_TARGET=qwen3.5-122b-a10b BJ_BATCH=16 uv run python scripts/pointer_swap.py manifest --data pointer_v5 --set len12 --name qwen35_122b_d3v5_len12_swap
  --families RL DL --n 150 --layers 33 35 36 38 39 41 42 --control-stride 1 --groups last
  --competence qwen35_122b_d3v5_len12_competence --primary-layers 36 38
  --why "finding 5 on lists of 12 sentences (T8) on Qwen3.5-122B: the donor's last two tokens copied at layers 33-42
  (the 27B's 44-56 scaled by depth) on fresh 12-statement scenes with colour-word answers (pointer_v5 len12, seed 873);
  scripts/finding5_confirm.py --sentences 12 decides"
  && BJ_TARGET=qwen3.5-122b-a10b BJ_BATCH=16 uv run python scripts/pointer_swap.py run --name qwen35_122b_d3v5_len12_swap
examples_command: BJ_TARGET=qwen3.5-122b-a10b BJ_BATCH=16 uv run python scripts/pointer_swap.py examples --name qwen35_122b_d3v5_len12_swap --group last
figures_command: >-
  BJ_TARGET=qwen3.5-122b-a10b uv run python scripts/finding5_confirm.py --run qwen35_122b_d3v5_len12_swap --layers 33 35 36 38 39 41 42 --level e12-word --sentences 12
  && BJ_TARGET=qwen3.5-122b-a10b BJ_BATCH=16 uv run python scripts/pointer_swap.py figures --name qwen35_122b_d3v5_len12_swap
question: >-
  On Qwen3.5-122B and fresh 12-sentence lists, does the copied label pick the original's statement at the same place when
  the donor asks its 1st or 2nd sentence, and the original's statement about the donor's entity when it asks the 3rd to the 12th?
why_it_matters: >-
  Finding 5 is confirmed as a rule fixed in advance on 5-sentence lists only. Twelve sentences test whether the order
  label stays on the first two places when the list is long; with colour words, since 12 distinct values and an alt
  answer absent from the prompt need more than the 10 digits (qwen35_122b_d3v5_len8_swap's e8-word level separates the
  answer kind from the length).
hypotheses:
  H-A: 'e12-word: position - identity (1st and 2nd) has its entity-cluster 95% lower bound > 0. Prior 0.75 (agent''s) (copied from d3v5_len12_swap_27b)'
  H-B: 'e12-word: identity - position (3rd-12th) >= 0 with lower bound >= -0.05. Prior 0.7 (agent''s) (copied from d3v5_len12_swap_27b)'
decision_rule: >-
  scripts/finding5_confirm.py, its rule unchanged and generalised to N statements before this run (the committed
  5-statement verdicts are reproduced byte for byte, tests/test_finding5_confirm.py), with --sentences 12: memory ->
  prompt, the donor's last two tokens copied at one layer, items split by the place k of the donor's asked statement;
  A: k = 1-2 pooled, position - identity with its entity-cluster 95% lower bound > 0; B: k = 3-12 pooled, identity -
  position >= 0 (point) with its lower bound >= -0.05; confirms iff A and B, partly if one, fails if neither. Layer:
  the last of 33 35 36 38 39 41 42 (the 27B's 44-56, every 2, scaled by depth) where the donor's own answer ('value',
  the alt prompt's colour, memory -> prompt) has its Wilson upper bound < 0.10, decided before the split is read; none
  qualifies = not testable. Decisive: e12-word, the only level. Per topic, every k and named -> prompt reported, not
  decisive. (--primary-layers only feeds pointer_swap's own pointer_v5 report, not this rule.)
controls:
- 'same entity, statements reshuffled (every hypothesis predicts answer org): damage bar (pointer_swap''s own)'
- 'random push of the same size per token at every layer; another topic''s prompt of the same answer kind and list length'
- 'org prompt into itself (no-op) and the layer-0 all-position patch (hook checks)'
- 'the donor''s own answer (value) as the layer cut-off'
n: 'every eligible scene, up to 150 per topic (3 topics), right on every prompt in both families; memory -> prompt decisive. Before the gate, 68 of 450 scenes ask the 1st or 2nd sentence (A has the smaller n).'
seeds: [873, 0]
notes: "mechanical copy of d3v5_len12_swap_27b for Qwen3.5-122B (Dan, 23 Oct ~00:55: the whole grid on the 2x H200); not opened before Dan's predictions. Primary lens: neuronpedia's published J++ for Qwen3.5-122B-A10B (this job uses no lens). Only BJ_TARGET (on every stage), run / gate names, the batch and the layers change. Layers: the 27B's 44 46 48 50 52 54 56 x 48/64 = 33, 34.5, 36, 37.5, 39, 40.5, 42, rounded half up (as muse30b_d4_where) to 33 35 36 38 39 41 42 (7 layers, as the source); the source's --primary-layers default (pointer_swap's 48 and 50) scaled the same way to 36 38 and passed explicitly (48 and 50 do not exist on a 48-layer model); it only feeds pointer_swap's own report. Data: data/pointer_v5/len12/ (seed 873; 16 colours). If finding5_confirm stops with 'no layer ... before the donor''s digit arrives', the run is not testable by the rule and the figures stage has to be run by hand. Memory (Dan, 00:55): FP8 weights ~127 GB of a 143 GB H200, so mem_gb 135 and BJ_BATCH=16 (the queued 122B specs use 16). Batch 16 for the read-heavy steps (Dan, 23 Oct ~01:20: known to fit on one H200, Oct 20); J-space removal at BJ_ABL_BATCH=8 (Zach's 122B run with the random-dictionary control). Requeued as qwen35_122b_d3v5_len12_swap_b16 in place of qwen35_122b_d3v5_len12_swap (cancelled before running)."
