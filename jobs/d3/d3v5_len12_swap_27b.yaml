id: d3v5_len12_swap_27b
title: "Finding 5 by the fixed rule on fresh 12-sentence lists, colour-word answers (Qwen3.6-27B, layers 44-56)"
thread: D3
gpus: 1
mem_gb: 70
est_gpu_hours: 0.9
depends_on:
- d3v5_len12_competence_27b
command: >-
  uv run python scripts/pointer_swap.py manifest --data pointer_v5 --set len12 --name d3v5_len12_swap_27b
  --families RL DL --n 150 --layers 44 46 48 50 52 54 56 --control-stride 1 --groups last
  --competence d3v5_len12_competence_27b
  --why "finding 5 on lists of 12 sentences (T8): the donor's last two tokens copied at layers 44-56 (every 2) on
  fresh 12-statement scenes with colour-word answers (pointer_v5 len12, seed 873); scripts/finding5_confirm.py
  --sentences 12 decides"
  && uv run python scripts/pointer_swap.py run --name d3v5_len12_swap_27b
examples_command: uv run python scripts/pointer_swap.py examples --name d3v5_len12_swap_27b --group last
figures_command: >-
  uv run python scripts/finding5_confirm.py --run d3v5_len12_swap_27b --layers 44 46 48 50 52 54 56 --level e12-word --sentences 12
  && uv run python scripts/pointer_swap.py figures --name d3v5_len12_swap_27b
question: >-
  On fresh 12-sentence lists, does the copied label pick the original's statement at the same place when the donor
  asks its 1st or 2nd sentence, and the original's statement about the donor's entity when it asks the 3rd to the 12th?
why_it_matters: >-
  Finding 5 is confirmed as a rule fixed in advance on 5-sentence lists only. Twelve sentences test whether the order
  label stays on the first two places when the list is long; with colour words, since 12 distinct values and an alt
  answer absent from the prompt need more than the 10 digits (d3v5_len8_swap_27b's e8-word level separates the answer
  kind from the length).
hypotheses:
  H-A: 'e12-word: position - identity (1st and 2nd) has its entity-cluster 95% lower bound > 0. Prior 0.75 (agent''s)'
  H-B: 'e12-word: identity - position (3rd-12th) >= 0 with lower bound >= -0.05. Prior 0.7 (agent''s)'
decision_rule: >-
  scripts/finding5_confirm.py, its rule unchanged and generalised to N statements before this run (the committed
  5-statement verdicts are reproduced byte for byte, tests/test_finding5_confirm.py), with --sentences 12: memory ->
  prompt, the donor's last two tokens copied at one layer, items split by the place k of the donor's asked statement;
  A: k = 1-2 pooled, position - identity with its entity-cluster 95% lower bound > 0; B: k = 3-12 pooled, identity -
  position >= 0 (point) with its lower bound >= -0.05; confirms iff A and B, partly if one, fails if neither. Layer:
  the last of 44-56 (every 2) where the donor's own answer ('value', the alt prompt's colour, memory -> prompt) has its
  Wilson upper bound < 0.10, decided before the split is read; none qualifies = not testable. Decisive: e12-word, the
  only level. Per topic, every k and named -> prompt reported, not decisive.
controls:
- 'same entity, statements reshuffled (every hypothesis predicts answer org): damage bar (pointer_swap''s own)'
- 'random push of the same size per token at every layer; another topic''s prompt of the same answer kind and list length'
- 'org prompt into itself (no-op) and the layer-0 all-position patch (hook checks)'
- 'the donor''s own answer (value) as the layer cut-off'
n: 'every eligible scene, up to 150 per topic (3 topics), right on every prompt in both families; memory -> prompt decisive. Before the gate, 68 of 450 scenes ask the 1st or 2nd sentence (A has the smaller n).'
seeds: [873, 0]
notes: 'T8 (night brief, 22 Oct). Data: data/pointer_v5/len12/ (seed 873; never used before; 16 colours: main''s 11 and gold, silver, cyan, violet, beige). If finding5_confirm stops with "no layer ... before the donor''s digit arrives", the run is not testable by the rule and the figures stage has to be run by hand. Not opened before Dan predicts.'
