id: qwen3_32b_d3v5_len8_swap
title: "Finding 5 by the fixed rule on fresh 8-sentence lists (Qwen3-32B, layers 44-56)"
thread: D3
gpus: 1
mem_gb: 75
est_gpu_hours: 1.2
