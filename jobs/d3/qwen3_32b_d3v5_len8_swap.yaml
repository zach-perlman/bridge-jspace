- qwen3_32b_d3v5_len8_competence
command: >-
  BJ_TARGET=qwen3-32b uv run python scripts/pointer_swap.py manifest --data pointer_v5 --set len8 --name qwen3_32b_d3v5_len8_swap
  --families RL DL --n 150 --layers 44 46 48 50 52 54 56 --control-stride 1 --groups last
  --competence qwen3_32b_d3v5_len8_competence
