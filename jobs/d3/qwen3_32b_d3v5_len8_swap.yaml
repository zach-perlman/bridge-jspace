  --sentences 8 decides, per level"
  && BJ_TARGET=qwen3-32b uv run python scripts/pointer_swap.py run --name qwen3_32b_d3v5_len8_swap
examples_command: BJ_TARGET=qwen3-32b uv run python scripts/pointer_swap.py examples --name qwen3_32b_d3v5_len8_swap --group last
figures_command: >-
  BJ_TARGET=qwen3-32b uv run python scripts/finding5_confirm.py --run qwen3_32b_d3v5_len8_swap --layers 44 46 48 50 52 54 56 --level e8-digit --sentences 8
  && BJ_TARGET=qwen3-32b uv run python scripts/finding5_confirm.py --run qwen3_32b_d3v5_len8_swap --layers 44 46 48 50 52 54 56 --level e8-word --sentences 8
  && BJ_TARGET=qwen3-32b uv run python scripts/pointer_swap.py figures --name qwen3_32b_d3v5_len8_swap
question: >-
  On Qwen3-32B and fresh 8-sentence lists, does the copied label pick the original's statement at the same place when
  the donor asks its 1st or 2nd sentence, and the original's statement about the donor's entity when it asks the 3rd
  to the 8th?
why_it_matters: >-
  Finding 5 is confirmed as a rule fixed in advance on 5-sentence lists only; the 8-statement split (README fig. 16)
  was read after the data. A fixed rule on fresh 8-sentence scenes says whether the order label covers only the first
  two places whatever the list length, or a share of the list.
hypotheses:
  H-A: 'e8-digit: position - identity (1st and 2nd) has its entity-cluster 95% lower bound > 0. Prior 0.9 (agent''s) (copied from d3v5_len8_swap_27b)'
  H-B: 'e8-digit: identity - position (3rd-8th) >= 0 with lower bound >= -0.05. Prior 0.75 (agent''s) (copied from d3v5_len8_swap_27b)'
  H-word: 'e8-word gets the same verdict as e8-digit (reported, not decisive). Prior 0.6 (agent''s) (copied from d3v5_len8_swap_27b)'
decision_rule: >-
  scripts/finding5_confirm.py, its rule unchanged and generalised to N statements before this run (the committed
  5-statement verdicts are reproduced byte for byte, tests/test_finding5_confirm.py), with --sentences 8: memory ->
  prompt, the donor's last two tokens copied at one layer, items split by the place k of the donor's asked statement;
  A: k = 1-2 pooled, position - identity with its entity-cluster 95% lower bound > 0; B: k = 3-8 pooled, identity -
  position >= 0 (point) with its lower bound >= -0.05; confirms iff A and B, partly if one, fails if neither. Layer:
  the last of 44-56 (every 2) where the donor's own answer ('value', memory -> prompt, the level's rows) has its Wilson
  upper bound < 0.10, decided before the split is read; none qualifies = not testable. Decisive: e8-digit (finding 5's
  answer kind). e8-word judged by the same rule, reported (the bridge to the 12-sentence lists, which have colour words
  only). Per topic, every k and named -> prompt reported, not decisive.
controls:
- 'same entity, statements reshuffled (every hypothesis predicts answer org): damage bar (pointer_swap''s own)'
- 'random push of the same size per token at every layer; another topic''s prompt of the same answer kind and list length'
- 'org prompt into itself (no-op) and the layer-0 all-position patch (hook checks)'
- 'the donor''s own answer (value) as the layer cut-off'
n: 'every eligible scene, up to 150 per topic (3 topics), right on every prompt in both answer kinds and both families; memory -> prompt decisive. Before the gate, 123 of 450 scenes ask the 1st or 2nd sentence.'
seeds: [872, 0]
notes: 'Mechanical copy of d3v5_len8_swap_27b (Dan, 23 Oct ~01:30: fill the grid); not opened before Dan''s predictions. Only the target (BJ_TARGET=qwen3-32b on every stage) and run / gate names change; the 27B''s sweep 44-56 (every 2) kept unchanged since both have 64 layers (the coordinator''s choice; Qwen3-32B''s own d3v5 sweep is 32-56 every 4). No --primary-layers, as the source (pointer_swap''s default 48 and 50, inside the sweep; it only feeds pointer_swap''s own report). Data: data/pointer_v5/len8/ (seed 872). If a finding5_confirm call stops with "no layer ... before the donor''s digit arrives", that level is not testable by the rule and the figures stage after it has to be run by hand.'
