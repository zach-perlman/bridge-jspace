id: muse30b_d3v5_len12_swap
title: "Finding 5 by the fixed rule on fresh 12-sentence lists, colour-word answers (Muse Glimmer 30B, layers 26-48)"
thread: D3
gpus: 1
mem_gb: 75
est_gpu_hours: 1.0
depends_on:
- muse30b_d3v5_len12_competence
command: >-
  BJ_TARGET=muse-glimmer-30b uv run python scripts/pointer_swap.py manifest --data pointer_v5 --set len12 --name muse30b_d3v5_len12_swap
  --families RL DL --n 150 --layers 26 28 30 32 34 36 38 40 42 44 46 48 --control-stride 1 --groups last
  --competence muse30b_d3v5_len12_competence --primary-layers 26 28 30 32 34 36 38 40 42 44 46 48
  --why "finding 5 on lists of 12 sentences (T8) on Muse: the donor's last two tokens copied at layers 26-48 (every 2,
  Muse's own d3v5 sweep) on fresh 12-statement scenes with colour-word answers (pointer_v5 len12, seed 873);
  scripts/finding5_confirm.py --sentences 12 decides"
  && BJ_TARGET=muse-glimmer-30b uv run python scripts/pointer_swap.py run --name muse30b_d3v5_len12_swap
examples_command: BJ_TARGET=muse-glimmer-30b uv run python scripts/pointer_swap.py examples --name muse30b_d3v5_len12_swap --group last
figures_command: >-
  BJ_TARGET=muse-glimmer-30b uv run python scripts/finding5_confirm.py --run muse30b_d3v5_len12_swap --layers 26 28 30 32 34 36 38 40 42 44 46 48 --level e12-word --sentences 12
  && BJ_TARGET=muse-glimmer-30b uv run python scripts/pointer_swap.py figures --name muse30b_d3v5_len12_swap
question: >-
  On Muse Glimmer 30B and fresh 12-sentence lists, does the copied label pick the original's statement at the same
  place when the donor asks its 1st or 2nd sentence, and the original's statement about the donor's entity from the
  3rd to the 12th?
why_it_matters: >-
  Finding 5 is confirmed as a rule fixed in advance on 5-sentence lists only. Twelve sentences test whether the order
  label stays on the first two places when the list is long, on a model from another lab; with colour words, since
  12 distinct values and an alt answer absent from the prompt need more than the 10 digits (muse30b_d3v5_len8_swap's
  e8-word level separates the answer kind from the length).
hypotheses:
  H-A: 'e12-word: position - identity (1st and 2nd) has its entity-cluster 95% lower bound > 0. Prior 0.6 (agent''s) (copied from qwen35_9b_d3v5_len12_swap)'
  H-B: 'e12-word: identity - position (3rd-12th) >= 0 with lower bound >= -0.05. Prior 0.55 (agent''s) (copied from qwen35_9b_d3v5_len12_swap)'
decision_rule: >-
  scripts/finding5_confirm.py, its rule unchanged and generalised to N statements before this run (the committed
  5-statement verdicts are reproduced byte for byte, tests/test_finding5_confirm.py), with --sentences 12: memory ->
  prompt, the donor's last two tokens copied at one layer, items split by the place k of the donor's asked statement;
  A: k = 1-2 pooled, position - identity with its entity-cluster 95% lower bound > 0; B: k = 3-12 pooled, identity -
  position >= 0 (point) with its lower bound >= -0.05; confirms iff A and B, partly if one, fails if neither. Layer:
  the last of 26-48 (every 2) where the donor's own answer ('value', the alt prompt's colour, memory -> prompt) has its
  Wilson upper bound < 0.10, decided before the split is read; none qualifies = not testable. Decisive: e12-word, the
  only level. Per topic, every k and named -> prompt reported, not decisive. (--primary-layers only feeds
  pointer_swap's own pointer_v5 report, not this rule.) Muse's random-patch clause, as in every Muse swap spec
  (muse30b_d3v5_swap): if the same-size random patch at the last tokens breaks > 30% of answers, Muse's patching nulls
  are reported as not interpretable.
controls:
- 'same entity, statements reshuffled (every hypothesis predicts answer org): damage bar (pointer_swap''s own)'
- 'random push of the same size per token at every layer; another topic''s prompt of the same answer kind and list length'
- 'org prompt into itself (no-op) and the layer-0 all-position patch (hook checks)'
- 'the donor''s own answer (value) as the layer cut-off'
n: 'every eligible scene, up to 150 per topic (3 topics), right on every prompt in both families; memory -> prompt decisive. Before the gate, 68 of 450 scenes ask the 1st or 2nd sentence (A has the smaller n).'
seeds: [873, 0]
notes: 'Mechanical copy of qwen35_9b_d3v5_len12_swap (Dan, 23 Oct ~01:30: fill the grid); not opened before Dan''s predictions. Only the target, run / gate names and the layer lists change: Muse''s own committed d3v5 sweep (muse30b_d3v5_swap: 26-48 every 2) in place of the 9B''s 18-28, and the same for finding5_confirm. Data: data/pointer_v5/len12/ (seed 873; 16 colours). If finding5_confirm stops with "no layer ... before the donor''s digit arrives", the run is not testable by the rule and the figures stage has to be run by hand.'
