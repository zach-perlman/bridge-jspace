id: qwen35_122b_d3v4x_swap
title: "D3 v4x on Qwen3.5-122B: does the address count statements by order and from the start?"
thread: D3
gpus: 1
mem_gb: 135
est_gpu_hours: 2.5
depends_on:
- qwen35_122b_d3v4x_competence
command: >-
  BJ_TARGET=qwen3.5-122b-a10b BJ_BATCH=4 uv run python scripts/pointer_swap.py manifest --data pointer_v4x --set main --name qwen35_122b_d3v4x_swap
  --families RL DL --n 150 --layers 21 24 27 30 33 36 39 42 --control-stride 1 --groups last
  --competence qwen35_122b_d3v4x_competence --primary-layers 21 24 27 30 33 36 39 42
  --why "pointer_v4x on Qwen3.5-122B: the last-two-token patch over a layer sweep; the decisive layers are the swept
  layers before the alt digit arrives (pre-registered rule in the spec)"
  && BJ_TARGET=qwen3.5-122b-a10b BJ_BATCH=4 uv run python scripts/pointer_swap.py run --name qwen35_122b_d3v4x_swap
examples_command: BJ_TARGET=qwen3.5-122b-a10b BJ_BATCH=4 uv run python scripts/pointer_swap.py examples --name qwen35_122b_d3v4x_swap --group last
figures_command: BJ_TARGET=qwen3.5-122b-a10b BJ_BATCH=4 uv run python scripts/pointer_swap.py figures --name qwen35_122b_d3v4x_swap
question: >-
  On Qwen3.5-122B, at the layers where the alt prompt's digit has not yet arrived at the last tokens, does the address count statements by order and from the start (filler moved; one statement more / fewer), as on Qwen3.6-27B (pre-registered there: order 39% vs place 9%; start 31-39% vs end 10-12%)?
why_it_matters: >-
  The address tests (README pattern 5) on another model, to say whether how the address counts is a property of the
  lookup or of Qwen3.6-27B.
hypotheses:
  H-same-as-27b: 'the pointer_swap pointer_v4x tests (H-order-v4, H-start-v4) come out as on Qwen3.6-27B. Prior 0.4 (copied from qwen35_9b_d3v4x_swap_r2)'
decision_rule: >-
  Decisive layers by function, fixed before the run: of the swept layers, those whose pooled alt-digit share (memory ->
  prompt, last two tokens, the level's own cell) has upper bound < 0.10. the pointer_swap pointer_v4x tests (H-order-v4, H-start-v4) are applied at those layers
  only (the manifest lists every swept layer as primary; the analysis filters them by this rule). If no swept layer
  qualifies, the run is "not testable on this model". Several layers are looked at: a pass whose bound clears the bar
  by under 2 points is reported as borderline.
controls:
- 'same entity, statements reshuffled; random push of the same size; another topic''s prompt'
n: 'up to 150 scenes per topic and layout eligible in both families; scenes not token-aligned under the tokenizer dropped'
seeds: [0]
notes: "mechanical copy of qwen35_9b_d3v4x_swap_r2 for Qwen3.5-122B (Dan, 23 Oct ~00:55: the whole grid on the 2x H200); not opened before Dan's predictions. Primary lens: neuronpedia's published J++ for Qwen3.5-122B-A10B (this job uses no lens). Only BJ_TARGET, run / gate names, the batch and the layers change. Layers: the 9B's sweep 14-28 (every 2, 32 layers) scaled by depth x 48/32 = 21 24 27 30 33 36 39 42 (exact), 8 layers swept as the source; the 9B's (not the 27B's) because the 27B's d3v4x primaries 48 / 50 were placed on the 27B's own finding-5 cells, while every other model decides its layers by function as here. Memory (Dan, 00:55): FP8 weights ~127 GB of a 143 GB H200, so mem_gb 135 and BJ_BATCH=4 (the queued 122B specs use 16)."
