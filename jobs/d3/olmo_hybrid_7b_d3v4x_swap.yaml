id: olmo_hybrid_7b_d3v4x_swap
title: "D3 v4x on Olmo-Hybrid-7B Instruct: does its last-token pointer also count statements by order, from the start?"
thread: D3
gpus: 1
mem_gb: 30
est_gpu_hours: 0.7
depends_on:
- olmo_hybrid_7b_d3v4x_competence
- olmo_hybrid_7b_d3v4_swap_fn
command: >-
  BJ_TARGET=olmo-hybrid-7b-instruct-dpo uv run python scripts/pointer_swap.py manifest --data pointer_v4x --set main
  --name olmo_hybrid_7b_d3v4x_swap --families RL DL --n 150 --layers 16 17 18 19 20 21 --control-stride 1
  --groups final last --competence olmo_hybrid_7b_d3v4x_competence --primary-layers 17 18 19
  --why "olmo3_7b_instruct_d3v4x_swap on Olmo-Hybrid-7B Instruct: order vs the same place in the text, and from the
  start vs from the end vs the same place, at the last two tokens, OLMo-3's layers 17-19 carried over unchanged"
  && BJ_TARGET=olmo-hybrid-7b-instruct-dpo uv run python scripts/pointer_swap.py run --name olmo_hybrid_7b_d3v4x_swap
examples_command: BJ_TARGET=olmo-hybrid-7b-instruct-dpo uv run python scripts/pointer_swap.py examples --name olmo_hybrid_7b_d3v4x_swap --group last
figures_command: BJ_TARGET=olmo-hybrid-7b-instruct-dpo uv run python scripts/pointer_swap.py figures --name olmo_hybrid_7b_d3v4x_swap
question: >-
  On Olmo-Hybrid-7B Instruct (32 layers, Gated DeltaNet in 24, full attention without RoPE at 3, 7, ..., 31), when the
  alt prompt's last two tokens are patched into the org prompt at layers 17-19, does the org prompt answer the digit of
  the statement with the same ORDER index rather than the one at the same place in the text (filler moved), and the
  statement counted FROM THE START rather than from the end or at the same place (one statement more / fewer), as
  d3v4x_swap_main tests on Qwen3.6-27B?
why_it_matters: >-
  Finding 6 (order counting) on the non-Qwen DeltaNet hybrid of the OLMo family: with olmo3_7b_instruct_d3v4x_swap it
  separates architecture from family. Read together with olmo_hybrid_7b_d3v4_swap_fn: that run says whether the model
  has a slot phase at all; this one says how the slot counts.
hypotheses:
  H-order-olmo: 'filler moved: the order slot''s lower bound exceeds the same-token-position''s upper bound at layer 17,
    18 or 19, pooled and in >= 2 of 3 topics (same layer). Prior 0.45 (Dan: yes, like Qwen) (copied from olmo3_7b_instruct_d3v4x_swap)'
  H-start-olmo: 'one more and one fewer: the slot from the start''s lower bound exceeds the upper bounds of the slot
    from the end and of the same token position at layer 17, 18 or 19, pooled and in >= 2 of 3 topics, both alt types.
    Prior 0.4 (Dan: yes, like Qwen) (copied from olmo3_7b_instruct_d3v4x_swap)'
  H-text-position-olmo: 'the same token position beats order, or the end / token rival beats the start: the
    address is a place in the token sequence (copied from olmo3_7b_instruct_d3v4x_swap)'
decision_rule: >-
  pointer_swap's pointer_v4x rule (docstring "pointer_v4x additions") with OLMo-3's primary layers 17, 18 and 19 in place
  of the 27B's 48 and 50 (fixed by function on OLMo-3-7B-Instruct, the same depth, and carried over unchanged).
  Memory -> prompt, last two tokens, pooled and per topic (n >= 35). Three layers are looked at: a pass whose lower
  bound is within 2 points of the rival's upper bound is reported as "borderline". If olmo_hybrid_7b_d3v4_swap_fn
  finds no slot phase at 17-19 (the slot does not beat word and digit), this run is reported as "not testable on this
  model", whatever its numbers. Layers 16, 20, 21, the tokens after the question and named -> prompt are reported, not
  decisive.
controls:
- 'same entity, statements reshuffled, the org prompt''s filler places (every hypothesis predicts answer org): damage bar'
- 'random push of the same size per token at every layer: chance bar for each predicted digit'
- 'a prompt of another topic, same size: realistic-activation null'
- 'org prompt into itself (no-op) and the layer-0 all-position patch (hook checks)'
n: >-
  up to 150 scenes per topic x layout eligible in both families (seed 0) x 3 topics x 3 layouts x 2 families; scenes not
  token-aligned under the OLMo tokenizer are dropped (23 countries scenes in memory -> prompt, before eligibility)
seeds: [0]
notes: 'Mechanical copy of olmo3_7b_instruct_d3v4x_swap (Dan, 23 Oct ~01:30: fill the grid); not opened before Dan''s predictions. Only the target, run / gate names and the reference run change; layers unchanged (both 32 layers). ~0.7 GPU-h (OLMo-3: 0.29 h).'
