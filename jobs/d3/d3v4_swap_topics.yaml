id: d3v4_swap_topics
title: 'D3 v4 per topic: does the slot beat the word in each topic alone, with every eligible scene?'
thread: D3
gpus: 1
mem_gb: 70
est_gpu_hours: 1.9
depends_on:
- d3v4_competence_27b
command: >-
  uv run python scripts/pointer_swap.py manifest --data pointer_v4 --set main --name d3v4_swap_topics
  --n 300 --layers 16 24 32 40 44 46 48 50 52 56 --groups final last --competence d3v4_competence_27b
  --why "D3 v4 per topic (21 Oct, evening): d3v4_swap_main passed pooled ('same statement slot') but no topic alone
  with 150 scenes; the same patch on every eligible scene (countries 296, animals 297, body parts 169)"
  && uv run python scripts/pointer_swap.py run --name d3v4_swap_topics
examples_command: uv run python scripts/pointer_swap.py examples --name d3v4_swap_topics
figures_command: uv run python scripts/pointer_swap.py figures --name d3v4_swap_topics
question: In each topic of pointer_v4 alone (countries, animals, body parts), does copying the alt prompt's hidden
  states after the question at layers 44-52 move memory → prompt answers to the same statement slot more often than
  to bridge alt's statement (the word), with every eligible scene?
why_it_matters: 'The README calls "a pointer to the statement slot" strong. Pooled over 85 entities it passed the
  rule, but with 150 scenes per topic no topic passed alone, so the spec labels the result topic-dependent. A claim
  that holds in each topic with the full data is general within the 27B; one that does not must be stated as pooled.'
hypotheses:
  H-each-topic: 'primary cell (memory → prompt, after the question, layers 44-52 together): verdict "same statement
    slot" in at least 2 of 3 topics. Prior 0.45'
  H-pooled-only: 'pooled "same statement slot", but at most 1 topic alone (the effect, ~16%, is too small for the
    rule per topic even at ~300 scenes). Prior 0.45'
  H-word: 'the word wins in some topic. Prior 0.1'
decision_rule: 'As d3v4_swap_main (pointer_swap docstring, "Decision rule" and "pointer_v4 additions"): interpretable
  iff the changed share''s lower bound >= 0.20 and the same-entity control''s upper bound <= 0.10; verdict X iff X''s
  lower bound exceeds the other outcomes'' upper bounds, the random push''s upper bound and the per-digit context
  rate; bounds = entity-cluster bootstrap widened to Wilson where wider. Primary cell per topic; general iff the same
  verdict holds in >= 2 of 3 topics. Secondary: last two tokens at layer 50 and after the question at 48, per topic.'
controls:
- 'same entity, statements reshuffled (every hypothesis predicts answer org)'
- 'random push of the same size; another topic''s prompt of the same size'
- 'org prompt into itself (no-op) and the layer-0 all-position patch (hook checks)'
n: 'every eligible scene, up to 300 per topic: countries 296, animals 297, body parts 169 per family (memory → prompt,
  named → prompt, memory → memory); it includes d3v4_swap_main''s 150 per topic'
seeds:
- 0
notes: 'd3v4_swap_main took 1.1 h for 150 per topic; this is ~1.7x the cases: ~1.9 h. Results:
  results/pointer_swap/d3v4_swap_topics/.'
