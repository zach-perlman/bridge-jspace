id: gemma4it_d3v4x_swap
title: "D3 v4x on Gemma 4 31B-it: does the address count statements by order and from the start (filler ..."
thread: D3
gpus: 1
mem_gb: 75
est_gpu_hours: 1.6
depends_on:
- gemma4it_d3v4x_competence
command: >-
  BJ_TARGET=gemma-4-31b-it uv run python scripts/pointer_swap.py manifest --data pointer_v4x --set main --name gemma4it_d3v4x_swap
  --families RL DL --n 150 --layers 24 28 32 36 40 44 48 52 --control-stride 1 --groups last
  --competence gemma4it_d3v4x_competence --primary-layers 24 28 32 36 40 44 48 52
  --why "pointer_v4x on Gemma 4 31B-it: the last-two-token patch over a layer sweep; the decisive layers are the swept
  layers before the alt digit arrives (pre-registered rule in the spec)"
  && BJ_TARGET=gemma-4-31b-it uv run python scripts/pointer_swap.py run --name gemma4it_d3v4x_swap
examples_command: BJ_TARGET=gemma-4-31b-it uv run python scripts/pointer_swap.py examples --name gemma4it_d3v4x_swap --group last
figures_command: BJ_TARGET=gemma-4-31b-it uv run python scripts/pointer_swap.py figures --name gemma4it_d3v4x_swap
question: >-
  On Gemma 4 31B-it, at the layers where the alt prompt's digit has not yet arrived at the last tokens, does the address count statements by order and from the start (filler moved; one statement more / fewer), as on Qwen3.6-27B (pre-registered there: order 39% vs place 9%; start 31-39% vs end 10-12%)?
why_it_matters: >-
  The address tests (README pattern 5) on another model, to say whether how the address counts is a property of the
  lookup or of Qwen3.6-27B.
hypotheses:
  H-same-as-27b: 'the pointer_swap pointer_v4x tests (H-order-v4, H-start-v4) come out as on Qwen3.6-27B. Prior 0.4'
decision_rule: >-
  Decisive layers by function, fixed before the run: of the swept layers, those whose pooled alt-digit share (memory ->
  prompt, last two tokens, the level's own cell) has upper bound < 0.10. the pointer_swap pointer_v4x tests (H-order-v4, H-start-v4) are applied at those layers
  only (the manifest lists every swept layer as primary; the analysis filters them by this rule). If no swept layer
  qualifies, the run is "not testable on this model". Several layers are looked at: a pass whose bound clears the bar
  by under 2 points is reported as borderline.
controls:
- 'same entity, statements reshuffled; random push of the same size; another topic''s prompt'
n: 'up to 150 scenes per topic and layout eligible in both families; scenes not token-aligned under the tokenizer dropped'
seeds: [0]
notes: 'Gemma 4 31B-it, 8 layers swept.'
