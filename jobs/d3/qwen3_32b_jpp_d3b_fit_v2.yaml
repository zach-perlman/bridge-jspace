question: >-
  On Qwen3-32B, with our J++, does a lens push of the same size (bridge alt's J++ word direction minus bridge org's) move the lookup to the target statement, where the fitted slot direction does?
why_it_matters: >-
  Fig D4 (finding 8's lens arm) has the 27B and OLMo; Qwen3-32B is dense and attention-only, and its plain J-lens failed the gate, so the lens arm was never run there.
hypotheses:
  H-lens-null: 'the J++ lens push moves <= 5% of lookups at layer 50, scale 1, like the plain J-lens push. Prior 0.75 (agent''s) (copied from olmo3_7b_instruct_jpp_d3b_fit_v2; layer 18 there)'
  H-steer: 'pointer_fit''s rule at layer 50, scale 1 (slot-target rate lower bound >= 0.30 and >= 20 points above the lens push and the random direction). Prior 0.1 (agent''s; the plain J-lens run moved 2%) (copied from olmo3_7b_instruct_jpp_d3b_fit_v2; layer 18 there)'
decision_rule: >-
  Runs iff our J++ passes gate v1 (scripts/d1_precheck.py, --min-topics 0: only the gate matters here). pointer_fit's pre-registered rule unchanged (docstring "Decision rule"; pointer_v4: entity-cluster intervals) at the primary layer 50 (the 32B's finding-5 layer: finding5_confirm's decisive layer, qwen3_32b_d3v4_seed2_swap), scale 1. OLMo's cells around its primary (collect 12 15 18 21, steer 15 18 21 around 18 on 32 layers) scaled by depth x 64/32: collect 38 44 50 56, steer 44 50 (56 dropped from the steer layers because our J++ has maps at 16-51 only, as qwen3_32b_jpp_d4_where drops layer 12; the collect at 56 is lens-free). Layer 44, scale 2 and per topic reported. Primary lens (Dan, 23 Oct ~00:30): ours on 64 prompts for Qwen3-32B and OLMo, Zach's for Gemma and Muse; no silent switch.
