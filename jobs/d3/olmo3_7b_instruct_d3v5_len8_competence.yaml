question: 'Does OLMo-3-7B-Instruct answer the fresh 8-statement scenes, with digit and with colour-word answers (read judge)?'
why_it_matters: 'Gate for olmo3_7b_instruct_d3v5_len8_swap: only scenes with every prompt right, in both answer kinds and both families, are patched.'
