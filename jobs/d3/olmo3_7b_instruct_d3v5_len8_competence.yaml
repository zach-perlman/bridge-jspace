  H-gate: 'every topic, family and answer kind >= 80% right. Prior 0.6 (agent''s) (copied from qwen35_9b_d3v5_len8_competence)'
decision_rule: 'pointer_v1''s competence rule, unchanged (every prompt of an item right = eligible), with the read judge (BJ_JUDGE=read, as olmo3_7b_instruct_d3v5_competence): a prompt is right iff the top token of one forward is the expected answer''s first token (digit or colour word); the greedy judge is recorded as correct_greedy, not used.'
