notes: 'Mechanical copy of qwen35_9b_d3v5_len8_competence (Dan, 23 Oct ~01:30: fill the grid); not opened before Dan''s predictions. Only the target and run name change, and the judge is OLMo-3''s own committed competence pattern (BJ_JUDGE=read, as in olmo3_7b_instruct_d3v5_competence; the reason is in olmo3_7b_instruct_d3v4_competence''s notes). Data: data/pointer_v5/len8/ (per-file seeds 87208, 87228, 87238). OLMo''s tokenizer is not Qwen''s: check_len8.json does not hold for it; pointer_swap drops (and counts) the scenes not token-aligned under it, as on main (8-9 countries scenes per list length).'
