question: >-
  On Qwen3.5-122B, with its J++, does a lens push of the same size (bridge alt's J++ word direction minus bridge org's) move the lookup to the target statement, where the fitted slot direction does?
why_it_matters: >-
  Fig D4 (finding 8's lens arm: the fitted slot direction writes the lookup, a lens push of the same size does not) has the 27B (J++), OLMo and the 9B; the 122B is the larger model Neel asked for, with a published J++.
hypotheses:
  H-lens-null: 'the J++ lens push moves <= 5% of lookups at layer 38, scale 1, like the plain J-lens push. Prior 0.75 (agent''s) (copied from qwen35_9b_d3b_fit_v2; layer 21 there)'
  H-steer: 'pointer_fit''s rule at layer 38, scale 1 (slot-target rate lower bound >= 0.30 and >= 20 points above the lens push and the random direction). Prior 0.1 (agent''s; the plain J-lens run moved 2%) (copied from qwen35_9b_d3b_fit_v2; layer 21 there)'
decision_rule: >-
  Runs iff the 122B's published J++ passes gate v1 (scripts/d1_precheck.py, --min-topics 0: only the gate matters here; the first step). pointer_fit's pre-registered rule unchanged (docstring "Decision rule"; pointer_v4: entity-cluster intervals) at the primary layer 38, scale 1. Primary layer (fixed now, before any 122B finding-5 result): the 27B's finding-5 layer 50 scaled by depth, 50 x 48/64 = 37.5, rounded half up to 38 (as muse30b_d4_where); qwen35_122b_d3v4_swap names no single layer (its sweep 24-46 is decided by finding5_confirm after the run), so the scaled layer stands even if that run's decisive layer differs (then reported beside it, not substituted). The 9B's cells around its primary (collect 15 18 21 24, steer 18 21 24 around 21 on 32 layers) scaled by depth x 48/32 (3 x 48/32 = 4.5, rounded half up to 5): collect 28 33 38 43, steer 33 38 43. Layers 33 and 43, scale 2 and per topic reported. Primary lens (Dan, 23 Oct ~00:55): neuronpedia's published J++ for Qwen3.5-122B-A10B; no silent switch.
controls:
- 'lens push of the same norm (J++ word directions); random direction of the same norm; shuffled slot labels; memory -> memory items (copied from qwen35_9b_d3b_fit_v2)'
