notes: "mechanical copy of qwen35_9b_d3b_fit_v2 for Qwen3.5-122B (Dan, 23 Oct ~00:55: the whole grid on the 2x H200); not opened before Dan's predictions. Primary lens: neuronpedia's published J++ for Qwen3.5-122B-A10B (frozen, pinned in src/bridge_jspace/pins.py; fit on bf16 weights, run here on FP8). Only BJ_TARGET, names, the competence (the 122B's own pointer_v4 main competence, as its finding-5 run qwen35_122b_d3v4_swap; pointer_fit reads its main rows only), the batch and the layers change. Depends on qwen35_122b_d1_topics2_map_r2 only for the precheck's competence file. Memory (Dan, 00:55): FP8 weights ~127 GB of a 143 GB H200, so mem_gb 135 and BJ_BATCH=4 (pointer_fit's batch is pointer_swap's BJ_BATCH)."
