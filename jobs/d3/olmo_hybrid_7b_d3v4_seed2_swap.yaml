id: olmo_hybrid_7b_d3v4_seed2_swap
title: "Seed 2: does Olmo-Hybrid-7B Instruct's slot test (layers 17-19) give the same answer on a new draw of scenes?"
thread: D3
gpus: 1
mem_gb: 30
est_gpu_hours: 0.3
depends_on:
- olmo_hybrid_7b_port_smoke
- olmo_hybrid_7b_d3v4_seed2_competence
command: >-
  BJ_TARGET=olmo-hybrid-7b-instruct-dpo uv run python scripts/pointer_swap.py manifest --data pointer_v4 --set seed2 --name olmo_hybrid_7b_d3v4_seed2_swap
  --families RL DL --n 300 --layers 16 17 18 19 20 21 --control-stride 1 --groups last
  --competence olmo_hybrid_7b_d3v4_seed2_competence
