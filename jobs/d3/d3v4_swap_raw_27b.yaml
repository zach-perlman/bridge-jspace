id: d3v4_swap_raw_27b
title: "D3 v4 without the chat template: is the statement-slot answer still there in plain text?"
thread: D3
gpus: 1
mem_gb: 70
est_gpu_hours: 1.1
depends_on:
- d3v4_competence_raw_27b
command: >-
  BJ_FORMAT=raw uv run python scripts/pointer_swap.py manifest --data pointer_v4 --set main --name d3v4_swap_raw_27b
  --n 150 --layers 16 24 32 40 44 46 48 50 52 56 --groups final last --competence d3v4_competence_raw_27b
  --why "G1: d3v4_swap_main's patch (word / slot / answer) with the prompts as plain text ending in Answer: (no chat
  template), entity-cluster intervals, the same cells"
  && BJ_FORMAT=raw uv run python scripts/pointer_swap.py run --name d3v4_swap_raw_27b
examples_command: BJ_FORMAT=raw uv run python scripts/pointer_swap.py examples --name d3v4_swap_raw_27b
figures_command: BJ_FORMAT=raw uv run python scripts/pointer_swap.py figures --name d3v4_swap_raw_27b
question: >-
  With the prompts as plain text (no chat template: the statements, the question and the instruction, a newline and
  "Answer:"), when the alt prompt's hidden states at the last two tokens (":" and the read's space) are patched into
  the org prompt at layers 48-52, does the org prompt still answer the digit at the same statement slot more often
  than the digit of bridge alt's statement, as it does in chat format (layer 50: 50% vs 21%, d3v4_swap_main,
  UNVERIFIED)?
why_it_matters: >-
  G1 threat: every D2/D3 result reads the statement at the tokens after the question, which in chat format are mostly
  the chat template's tokens. If the slot answer needs those tokens, the pointer is a property of the template's
  positions (where an instruction-tuned model stages its answer), not of reading a statement list; if it survives in
  plain text, the claim is about the lookup itself. Either way the README's pointer line names the format it holds in.
hypotheses:
  H-format-free: 'raw, memory -> prompt, last two tokens, pooled: rule verdict "same statement slot" at layer 50 (or 48
    or 52); slot 30-55%, word <= 25%; per topic slot > word by point estimate in all three'
  H-template: 'raw, memory -> prompt, last two tokens, at every one of layers 48, 50 and 52: slot below 15% or within 10
    points of the word (point estimates)'
  prior: 'Agent prior: H-format-free 0.6, H-template 0.4 (coordinator''s priors; the last two tokens, ":" and the space,
    exist in both formats, but in chat they follow the template, in raw the question directly).'
decision_rule: >-
  Fixed before the run (scripts/pointer_swap.py docstring: "Decision rule" and "pointer_v4 additions"; the manifest
  records model.prompt_format = raw and ci = entity_cluster). Per cell, pooled over topics: interpretable iff the patch
  changes the answer (lower bound >= 0.20) and the same-entity control changes it rarely (upper bound <= 0.10); verdict
  = the outcome among {bridge alt's statement, same statement slot, the alt prompt's own answer} whose lower bound
  exceeds the others' upper bounds, the random push's upper bound and the per-digit context rate; else "mixed". Bounds:
  entity-cluster bootstrap 95% (asked entity within topic, 2000, seed 0) widened to Wilson where wider. Primary:
  memory -> prompt, last two tokens, layers 48, 50, 52 (each reported; H-format-free iff the verdict is "same statement
  slot" at at least one of them; H-template iff at all three the slot share is < 15% or within 10 points of the word;
  otherwise unclear). Secondary, reported not decisive: after the question (window 44-52 and layer 48), per topic, per
  slot class, named -> prompt and memory -> memory, and raw minus chat per cell against d3v4_swap_main (different
  eligible samples: unpaired entity-cluster bootstrap of the difference). If the raw gate leaves a topic with fewer
  than 35 eligible scenes, it is dropped and named; if the gate fails for memory -> prompt, G1 is not decidable from
  this run.
controls:
- 'same entity, statements reshuffled (every hypothesis predicts answer org): damage bar'
- 'random push of the same size per token (layers 16, 32, 44, 48, 52): chance bar'
- 'a prompt of another topic, same size: realistic-activation null'
- 'context digits no hypothesis predicts: per-digit chance'
- 'org prompt into itself (no-op) and the layer-0 all-position patch (hook checks; run invalid below 100%)'
- 'the chat-format run d3v4_swap_main: the same cells, layers and controls'
n: >-
  150 scenes per topic eligible in all three families in raw format (seed 0) x 3 topics x 3 families = 1,350 cases;
  per pooled cell 450 items over ~85 entities and 27 wordings; per topic 150 (fewer if the raw gate leaves fewer)
seeds: [0]
notes: >-
  Same cells, layers and controls as d3v4_swap_main (chat). In raw format the tokens after the question are the
  instruction, a newline and "Answer:" (checked token by token in tests/test_chat_format.py), in chat
  format the instruction, the template's tokens and "Answer:"; the last two tokens (":" and the read's space) are the
  same in both. Reads per case as d3v4_swap_main (75); 1,350 cases ~ 101k reads at 31-37/s ~ 50 min + forwards and
  load ~ 1.0-1.1 h. Smoke: Qwen3.5-0.8B, raw format, pointer_v4 competence (2 items per file) and pointer_swap run /
  examples / figures (1 scene per topic): layer-0 reproduction 9/9, self no-op 8/9 (one exact bf16 tie, p 0.1837 vs
  0.1837).
