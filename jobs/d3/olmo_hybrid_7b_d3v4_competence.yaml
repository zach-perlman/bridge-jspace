id: olmo_hybrid_7b_d3v4_competence
title: "G3 gate: can Olmo-Hybrid-7B Instruct answer the pointer_v4 scenes (countries, animals, body parts)?"
thread: D3
gpus: 1
mem_gb: 25
est_gpu_hours: 0.15
depends_on:
- olmo_hybrid_7b_port_smoke
command: >-
  BJ_TARGET=olmo-hybrid-7b-instruct-dpo BJ_JUDGE=read uv run python scripts/pointer_v4.py manifest --set main
  --name olmo_hybrid_7b_d3v4_competence
  --why "G3 on Olmo-Hybrid-7B Instruct: pointer_v4's main scenes, chat format, every prompt and step,
  judged by pointer_swap's one-forward read (as olmo3_7b_instruct_d3v4_competence)"
  && BJ_TARGET=olmo-hybrid-7b-instruct-dpo BJ_JUDGE=read uv run python scripts/pointer_v4.py competence
  --name olmo_hybrid_7b_d3v4_competence
question: >-
  Does Olmo-Hybrid-7B Instruct (chat format) put the right answer on top in the read the patching uses, for pointer_v4's
  main scenes (85 entities, 3 x 3 wordings), in every topic and family, every alt prompt, and the steps alone?
why_it_matters: >-
  Gate for olmo_hybrid_7b_d3v4_swap_fn, olmo_hybrid_7b_d2_parts_v2 and olmo_hybrid_7b_d2_v4_late_read_v3 (the main
  draw of findings 3-5 on Olmo-Hybrid). Read only on scenes the model answers.
hypotheses:
  H-competent: 'named -> prompt clean >= 95% per topic; memory -> prompt >= 85% where the 7B knows the cue (the entity
    check was the 27B''s); >= 100 scenes per topic eligible in all three families (copied from olmo3_7b_instruct_d3v4_competence)'
  H-cue-gap: 'memory -> prompt or memory -> memory below the gate for a topic: the 7B does not recall the cues or
    facts the 27B''s entity check kept (countries'' dialling codes most likely) (copied from olmo3_7b_instruct_d3v4_competence)'
  prior: 'Agent prior: H-competent 0.5 for memory -> prompt; memory -> memory below the gate in at least one topic 0.6. (copied from olmo3_7b_instruct_d3v4_competence)'
decision_rule: >-
  pointer_v1's gate with the read judge (scripts/pointer_v1.py JUDGE_READ_CHAT, BJ_JUDGE=read, recorded in the manifest
  and summary.json): a prompt is right iff the top token of one forward with a digit answer's space token appended is
  the expected answer's first token; the 8-token greedy judge is kept per prompt as correct_greedy and reported, not
  used. A (topic, family) cell enters the patching run iff its clean Wilson 95% lower bound >= 0.85; an item is
  eligible iff every prompt of it is right; pointer_swap keeps scenes eligible in every family of its run. Report
  every cell next to olmo3_7b_instruct_d3v4_competence and the greedy agreement per cell.
controls:
- 'each step alone (cue -> entity with the context; the lookup with the entity named / the recalled fact)'
- 'greedy agreement (correct_greedy): how often the plain 8-token reply gives the read''s answer'
- 'the same scenes on OLMo-3-7B-Instruct: olmo3_7b_instruct_d3v4_competence'
n: 'all main scenes: 300 + 300 + 180 per family x 3 families = 2,340 items (~12,500 prompts)'
seeds: [841]
notes: 'Mechanical copy of olmo3_7b_instruct_d3v4_competence (Dan, 23 Oct ~01:30: fill the grid); not opened before Dan''s predictions. Only the target and run name change (the comparison run is OLMo-3''s own gate). The read judge as on OLMo-3 and as in olmo_hybrid_7b_d3v4_seed2_competence. Olmo-Hybrid shares OLMo-3''s tokenizer (pins), so the same countries scenes should be unaligned and dropped by pointer_swap.'
