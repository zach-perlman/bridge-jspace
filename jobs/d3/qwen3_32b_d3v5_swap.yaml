id: qwen3_32b_d3v5_swap
title: "D3 v5 on Qwen3-32B: does the same-slot answer survive colour-word answers and 8-statement ..."
thread: D3
gpus: 1
mem_gb: 75
est_gpu_hours: 2.0
depends_on:
- qwen3_32b_d3v5_competence
command: >-
  BJ_TARGET=qwen3-32b uv run python scripts/pointer_swap.py manifest --data pointer_v5 --set main --name qwen3_32b_d3v5_swap
  --families RL DL --n 150 --layers 32 36 40 44 48 52 56 --control-stride 1 --groups last
  --competence qwen3_32b_d3v5_competence --primary-layers 32 36 40 44 48 52 56
  --why "pointer_v5 on Qwen3-32B: the last-two-token patch over a layer sweep; the decisive layers are the swept
  layers before the alt digit arrives (pre-registered rule in the spec)"
  && BJ_TARGET=qwen3-32b uv run python scripts/pointer_swap.py run --name qwen3_32b_d3v5_swap
examples_command: BJ_TARGET=qwen3-32b uv run python scripts/pointer_swap.py examples --name qwen3_32b_d3v5_swap --group last
figures_command: BJ_TARGET=qwen3-32b uv run python scripts/pointer_swap.py figures --name qwen3_32b_d3v5_swap
question: >-
  On Qwen3-32B, at the layers where the alt prompt's digit has not yet arrived at the last tokens, does the same-slot answer survive colour-word answers and 8-statement lists?
why_it_matters: >-
  The address tests (README pattern 5) on another model, to say whether how the address counts is a property of the
  lookup or of Qwen3.6-27B.
hypotheses:
  H-same-as-27b: 'the pointer_swap pointer_v5 tests (H-word, H-long) come out as on Qwen3.6-27B. Prior 0.4'
decision_rule: >-
  Decisive layers by function, fixed before the run: of the swept layers, those whose pooled alt-digit share (memory ->
  prompt, last two tokens, the level's own cell) has upper bound < 0.10. the pointer_swap pointer_v5 tests (H-word, H-long) are applied at those layers
  only (the manifest lists every swept layer as primary; the analysis filters them by this rule). If no swept layer
  qualifies, the run is "not testable on this model". Several layers are looked at: a pass whose bound clears the bar
  by under 2 points is reported as borderline.
controls:
- 'same entity, statements reshuffled; random push of the same size; another topic''s prompt'
n: 'up to 150 scenes per topic and layout eligible in both families; scenes not token-aligned under the tokenizer dropped'
seeds: [0]
notes: 'Qwen3-32B, 8 layers swept.'
