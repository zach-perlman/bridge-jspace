id: d3_start_or_end_smoke_27b
title: "D3 start-or-end test run: the scenes with one statement more or fewer work in the patching code on the 27B"
thread: D3
gpus: 1
mem_gb: 70
est_gpu_hours: 0.1
depends_on: []
command: >-
  uv run python scripts/pointer_swap.py manifest --data pointer_v3 --set main --name d3_start_or_end_smoke_27b
  --families RL DL --n 1 --layers 44 48 52 56 --groups final last --no-eligibility
  --why "D3 start-or-end smoke: every stage on the 27B with pointer_v3's alt prompts of another length; hook checks
  and timing"
  && uv run python scripts/pointer_swap.py run --name d3_start_or_end_smoke_27b
examples_command: uv run python scripts/pointer_swap.py examples --name d3_start_or_end_smoke_27b
figures_command: uv run python scripts/pointer_swap.py figures --name d3_start_or_end_smoke_27b
question: >-
  Do pointer_swap's run / examples / figures stages work end to end on the 27B with --data pointer_v3 (an alt prompt
  with one statement more or fewer, kept to the org prompt's length by filler sentences), with the self no-op and the
  layer-0 reproduction checks passing?
why_it_matters: Code-path check before d3_start_or_end_main (part B code needs CUDA, so the local smoke ran on the box's 0.8B); no claim.
hypotheses:
  H-ok: 'self no-op and layer-0 reproduction 8/8'
  H-broken: 'any check below 8/8: stop the main run'
decision_rule: 'The main run proceeds only if both checks are 8/8 (summary.json checks).'
controls:
- 'org prompt patched into itself at the middle layer (must change nothing)'
- 'alt prompt patched at every position at layer 0 (must give the alt prompt''s own answer)'
n: '1 scene per topic x alt type x 2 families = 8 cases'
seeds: [0]
notes: 'The 0.8B smoke on the box (CUDA_VISIBLE_DEVICES=3, BJ_TARGET=qwen3.5-0.8b) ran the same stages.'
