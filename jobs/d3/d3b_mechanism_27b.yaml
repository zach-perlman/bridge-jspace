id: d3b_mechanism_27b
title: "D3b mechanism: is the fitted slot direction the model's own statement address, or just a direction that moves the answer?"
thread: D3
gpus: 1
mem_gb: 75
est_gpu_hours: 0.8
depends_on: []
command: >-
  uv run python scripts/pointer_mechanism.py run --name d3b_mechanism_smoke_27b --n-test 2 --rr-n 1
  --why "smoke: the six tests on 2 scenes per topic; not a result"
  && uv run python scripts/pointer_mechanism.py run --name d3b_mechanism_27b --n-test 150 --rr-n 50
  --why "D3b mechanism (22 Oct): ordered axis, dose path through the slots in between, natural dose, necessity (remove
  the 4-dim slot subspace), the late head as the reader, ordinal words; held-out pointer_v4 items, layer 48"
question: >-
  The slot direction moves the lookup where random, shuffled and lens directions of the same norm do not. Is it the
  model's own address? (1) Are the five slot means ordered on an axis? (2) Pushing from slot a toward slot j, does the
  answer pass through the slots in between? (3) Does it steer at its natural size (mu_j - mu_a), not only at a patch's
  norm? (4) Does removing the 4-dim slot subspace break the lookup but not recall? (5) Does the late head 51/22 follow
  the push? (6) Is the slot code like the words "first", "2", "three"?
why_it_matters: >-
  pointer_fit shows sufficiency of a direction at a matched norm. A direction can move an answer without being what
  the model uses (an off-manifold push, a label-specific shortcut). Necessity, natural size, an ordered geometry and a
  reader that follows the push would make "the lookup runs on a statement address" a mechanism, not a steering trick.
hypotheses:
  H-axis: 'class-mean distances grow with |i - j|: Spearman rho >= 0.8 at layer 48, label-permutation p < 0.05. Prior 0.6'
  H-path: 'on the dose path from a toward j (|j - a| >= 2) the first statement reached is in between more often than
    chance, rarely on the other side. Prior 0.4'
  H-jump: 'the path jumps straight to j (>= 50%) with no excess of in-between slots. Prior 0.3'
  H-natural: 'at its natural size (alpha 1 or 2) the slot push moves >= 10% (lower bound) to j, above random. Prior 0.5'
  H-necessary: 'removing the 4-dim slot subspace at the tokens after the question (layers 44-52) leaves memory ->
    prompt <= 70% right, >= 20 points below random and top-variance removals, with memory -> memory >= 90%. Prior 0.3'
  H-reader: 'on alpha-2 pushes that moved the answer to j, head 51/22 looks most at statement j on >= 50%. Prior 0.55'
decision_rule: >-
  Fixed before the run in scripts/pointer_mechanism.py's docstring ("Decision rule"); analyze writes summary.json with
  each hypothesis holds / does not hold. Held-out pointer_v4 items only (asked entity or wording outside the fit),
  memory -> prompt primary, memory -> memory the control; layer 48 primary for the pushes; removals at every layer 44-52.
controls:
- 'label-permutation null for the axis (200 shuffles)'
- 'random direction of the same per-token norm as the natural push'
- 'removal of a random 4-dim subspace and of the top-4 directions of overall variance (same operation)'
- 'memory -> memory items: removal should not matter'
- 'random tokens for the word comparison'
n: '150 memory -> prompt and 50 memory -> memory held-out items per topic (3 topics); the fit set for the means'
seeds: [0]
notes: '~0.8 GPU-h; the smoke runs first in the same command.'
