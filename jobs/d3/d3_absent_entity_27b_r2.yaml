id: d3_absent_entity_27b_r2
title: "Finding 5's patch when the donor asks about an entity the original does not list: order label or fallback to the 1st statement? Every eligible seed-3 scene (Qwen3.6-27B, layer 50)"
thread: D3
gpus: 1
mem_gb: 70
est_gpu_hours: 0.4
depends_on:
- d3_absent_entity_27b_smoke
- d3v4_seed3_competence_27b
- d3v4_seed3_swap_27b
command: >-
  uv run python scripts/pointer_swap.py manifest --data pointer_v4 --set seed3 --name d3_absent_entity_27b_r2
  --families RL DL --n 300 --layers 50 --groups last --competence d3v4_seed3_competence_27b --donor absent
