id: olmo3_7b_instruct_d3v6_competence
title: "G3 gate: can OLMo-3-7B-Instruct answer pointer_v6's scenes (extra sentence moved, long statements)?"
thread: D3
gpus: 1
mem_gb: 25
est_gpu_hours: 0.25
depends_on: []
command: >-
  BJ_TARGET=olmo-3-7b-instruct BJ_JUDGE=read uv run python scripts/pointer_v6.py manifest
  --name olmo3_7b_instruct_d3v6_competence
  --why "pointer_v6 on a second model: OLMo-3-7B-Instruct (chat format, read judge), every layout, alt and control
  prompt and each step alone"
  && BJ_TARGET=olmo-3-7b-instruct BJ_JUDGE=read uv run python scripts/pointer_v6.py competence
  --name olmo3_7b_instruct_d3v6_competence
  && BJ_TARGET=olmo-3-7b-instruct uv run python scripts/pointer_v6.py errors --name olmo3_7b_instruct_d3v6_competence
question: >-
  Does OLMo-3-7B-Instruct answer pointer_v6's prompts (read judge), and are long statements answered right less often
  than the same scenes with short ones?
why_it_matters: >-
  Gate for olmo3_7b_instruct_d3v6_swap, and Dan's "longer sentences give more errors" on a second model. The cells are
  equal-length and the end alignment holds under OLMo's tokenizer for every scene but 8 countries memory -> prompt
  scenes (data/pointer_v6/check_main_olmo-3-7b-instruct.json), which pointer_swap drops.
hypotheses:
  H-gate: 'every topic, family and layout >= 80% right (read judge). Prior 0.65'
  H-long-errors (Dan): 'memory -> prompt, pooled: share right, long minus still, upper bound < 0. Prior 0.45'
decision_rule: >-
  As d3v6_competence_27b (pointer_v1's competence rule; pointer_v6.py errors for H-long-errors).
controls:
- 'each step alone (the recall and the named lookup) for memory -> prompt'
n: 'all of pointer_v6 main (3,600 items)'
seeds: [0]
notes: '~0.25 GPU-h on one A100 (7B).'
