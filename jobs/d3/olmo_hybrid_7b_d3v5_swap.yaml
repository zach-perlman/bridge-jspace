  The two boring explanations of the README's pattern 5: a trick for copying a digit, and a property of 5-item
  lists. Colour-word answers and 8-statement lists on the same scenes test both. On the non-Qwen DeltaNet hybrid.
hypotheses:
  H-word: 'e5-word keeps the slot at layer 17, 18 or 19. Prior 0.4 (copied from olmo3_7b_instruct_d3v5_swap)'
  H-long: 'e8-digit keeps the slot. Prior 0.35 (copied from olmo3_7b_instruct_d3v5_swap)'
  H-replicate: 'e5-digit keeps the slot. Prior 0.5 (copied from olmo3_7b_instruct_d3v5_swap)'
decision_rule: >-
  pointer_swap's pointer_v5 additions with the manifest's primary layers 17, 18 and 19 (placed by function on
  OLMo-3-7B-Instruct before olmo3_7b_instruct_d3v4_swap_fn, carried over unchanged to this model of the same depth).
  Three layers are looked at: passes within 2 points of the bar are reported as borderline.
