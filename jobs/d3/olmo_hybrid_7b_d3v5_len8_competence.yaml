id: olmo_hybrid_7b_d3v5_len8_competence
title: "Finding 5 on 8 sentences, gate: can Olmo-Hybrid-7B Instruct answer a fresh draw of 8-statement scenes (seed 872)?"
thread: D3
gpus: 1
mem_gb: 25
est_gpu_hours: 0.15
depends_on:
- olmo_hybrid_7b_port_smoke
command: >-
  BJ_TARGET=olmo-hybrid-7b-instruct-dpo BJ_JUDGE=read uv run python scripts/pointer_v5.py manifest --set len8 --name olmo_hybrid_7b_d3v5_len8_competence
  --why "finding 5 on lists of 8 sentences (T8) on Olmo-Hybrid-7B Instruct: pointer_v5 len8, main's 8-statement design
  on a fresh draw (seed 872), digit and colour-word answers on the same scenes; every alt and control prompt and each
  step alone (chat format, read judge)"
  && BJ_TARGET=olmo-hybrid-7b-instruct-dpo BJ_JUDGE=read uv run python scripts/pointer_v5.py competence --name olmo_hybrid_7b_d3v5_len8_competence
question: 'Does Olmo-Hybrid-7B Instruct answer the fresh 8-statement scenes, with digit and with colour-word answers (read judge)?'
why_it_matters: 'Gate for olmo_hybrid_7b_d3v5_len8_swap: only scenes with every prompt right, in both answer kinds and both families, are patched.'
hypotheses:
  H-gate: 'every topic, family and answer kind >= 80% right. Prior 0.6 (agent''s) (copied from qwen35_9b_d3v5_len8_competence)'
decision_rule: 'pointer_v1''s competence rule, unchanged (every prompt of an item right = eligible), with the read judge (BJ_JUDGE=read, as every Olmo-Hybrid / OLMo-3 competence spec): a prompt is right iff the top token of one forward is the expected answer''s first token (digit or colour word); the greedy judge is recorded as correct_greedy, not used.'
controls:
- 'each step alone (the recall and the named lookup) for memory -> prompt'
n: 'all of pointer_v5 len8: 150 scenes per topic (3 topics) x 2 answer kinds x 2 families = 1,800 items'
seeds: [872]
notes: 'Mechanical copy of qwen35_9b_d3v5_len8_competence (Dan, 23 Oct ~01:30: fill the grid); not opened before Dan''s predictions. Only the target and run name change, and the judge and dependency are this model''s own committed competence pattern (BJ_JUDGE=read and olmo_hybrid_7b_port_smoke, as olmo_hybrid_7b_d3v4_seed2_competence). Data: data/pointer_v5/len8/ (per-file seeds 87208, 87228, 87238). The OLMo tokenizer is not Qwen''s: pointer_swap drops (and counts) the scenes not token-aligned under it.'
