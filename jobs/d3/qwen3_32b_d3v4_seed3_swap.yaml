question: >-
  On Qwen3-32B's third draw, does the copied label pick the same place for the 1st and 2nd asked statement and the
  donor's entity from the 3rd on?
why_it_matters: 'Finding 5 on fresh scenes of a second model (on the first draw Qwen3-32B tied position and identity from the 3rd on).'
hypotheses:
  H-confirms: 'A and B hold. Prior 0.55 (the first draw tied from the 3rd on: B is the open part) (copied from qwen3_32b_d3v4_seed2_swap)'
decision_rule: >-
  scripts/finding5_confirm.py (committed before this run): memory -> prompt, the donor's last two tokens copied at the decisive layer, items split by the place k of the donor's asked statement; A: 1st and 2nd pooled, position - identity with its entity-cluster 95% lower bound > 0; B: 3rd-5th pooled, identity - position >= 0 (point) with its lower bound >= -0.05; confirms iff A and B, partly if one, fails if neither. Per topic and named -> prompt reported, not decisive. Decisive layer: the last of 48, 49, 50 whose donor-digit share has its Wilson upper bound < 0.10 (the fixed
  rule the other models' layers follow), read before the split.
controls:
- 'same entity, statements reshuffled; random push of the same size; another topic''s prompt (pointer_swap''s own)'
n: 'every eligible scene, up to 150 per topic, memory -> prompt and named -> prompt'
