id: d3v6_competence_27b
title: "D3 v6 gate: can Qwen3.6-27B answer pointer_v6's scenes (extra sentence before the list / before the question, long statements)?"
thread: D3
gpus: 1
mem_gb: 70
est_gpu_hours: 0.5
depends_on: []
command: >-
  uv run python scripts/pointer_v6.py manifest --name d3v6_competence_27b
  --why "D3 v6 gate: pointer_v6's four layouts of the same scenes (nothing moves, an extra sentence before the list in
  one prompt, before the question in one prompt, long statements), every alt and control prompt and each step alone"
  && uv run python scripts/pointer_v6.py competence --name d3v6_competence_27b
  && uv run python scripts/pointer_v6.py errors --name d3v6_competence_27b
question: >-
  Does Qwen3.6-27B answer pointer_v6's org prompts, alt prompts and controls (85 entities, 3 x 3 wordings, 4 layouts
  of the same 450 scenes), and are long statements answered right less often than the same scenes with short ones?
why_it_matters: >-
  Gate for d3v6_swap_27b (the patching reads only scenes answered right in every layout), and the plain-answer half
  of Dan's hypothesis (21 Oct): "on longer sentences the numbering is worse; more errors".
hypotheses:
  H-gate: 'every topic, family and layout >= 85% right (Wilson lower bound) on the org prompt. Prior 0.75'
  H-long-errors (Dan): 'memory -> prompt, pooled over topics: share right, long minus still, has upper bound < 0
    (Newcombe 95%; `errors` stage). Prior 0.4'
decision_rule: >-
  pointer_v1's competence rule (an item is eligible iff every prompt is right); the swap samples scenes eligible in
  every layout. H-long-errors: pointer_v6.py errors, memory -> prompt, pooled: long minus still upper bound < 0;
  named -> prompt and per topic reported.
controls:
- 'each step alone (the recall and the named lookup) for memory -> prompt'
- 'the same scenes in every layout (only the extra sentence''s place and the statements'' length differ)'
n: 'all of pointer_v6 main: 150 scenes per topic x 4 layouts x 2 families (3,600 items)'
seeds: [0]
notes: '~0.5 GPU-h (pointer_v4x''s 2,700-item gate took ~0.35 h).'
