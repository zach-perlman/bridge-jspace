id: muse30b_d1_topics2_map
title: "Muse Glimmer 30B: D1 precheck and map"
thread: D1
gpus: 1
mem_gb: 75
est_gpu_hours: 1.5
depends_on:
- muse30b_lens_gate_v2
- muse30b_competence
command: >-
  BJ_TARGET=muse-glimmer-30b uv run python scripts/d1_precheck.py --gate muse30b_lens_gate_v2 --competence muse30b_d1_topics2_competence && BJ_TARGET=muse-glimmer-30b uv run python scripts/statement_positions.py map --name muse30b_d1_topics2_smoke --families PP PM --n 3 --layers 28 32 --tasks-set d1_topics_v2 --tasks-competence muse30b_d1_topics2_competence --why "smoke: not a result" && BJ_TARGET=muse-glimmer-30b uv run python scripts/statement_positions.py map --name muse30b_d1_topics2_map --families PP PM --n 180 --tasks-set d1_topics_v2 --tasks-competence muse30b_d1_topics2_competence --why "D1 on Muse: the map"
question: >-
  Where is a stated bridge in transit for PP and PM on Muse?
why_it_matters: >-
  A sixth model from another lab (Meta), with every test the other five have, so the cross-model table has no gaps.
hypotheses:
  H-replicates: 'Prior 0.3'
decision_rule: >-
  Opens iff the lens gate v1 passes and >= 2 topics have >= 30 eligible scenes (d1_precheck). d1_verdict's map rule at the 27B's layers scaled by depth [26, 36), --keep-min 0.8 (lookups keep their answer under the lens-part patch on >= 80%, else not interpretable) and the recall control (PM lens part >= 30%); then replicates iff the lens part alone switches <= 0.10 of lookups and the rest >= 0.50. Per topic reported; rand_omp the fitting null.
controls:
- 'as the same test on the other models'
n: '180 scenes'
seeds: [841, 844]
notes: "Dan, 22 Oct night: Muse Glimmer 30B (Meta) as a sixth model, every experiment, the rules copied unchanged from the other models; layers by the fixed rules or the 27B's scaled by depth (x 52/64). Not opened before Dan's predictions; README and figures only after he opens the results."
