  BJ_TARGET=qwen3.5-9b uv run python scripts/statement_positions.py parts --name qwen35_9b_d1_necessity_parts --map qwen35_9b_d1_topics2_map --why "B1: the parts in the band at the bridge's word" --lo 6 --sets bridge_word bind_bridge --force bridge_word:6 bridge_word:8 bridge_word:10 bridge_word:12 bridge_word:14 bind_bridge:6 bind_bridge:8 bind_bridge:10 bind_bridge:12 bind_bridge:14
  && BJ_TARGET=qwen3.5-9b uv run python scripts/d1_verdict.py --rule necessity --map qwen35_9b_d1_topics2_map --parts qwen35_9b_d1_necessity_parts --tasks-set d1_topics_v2 --cells bridge_word:6 bridge_word:8 bridge_word:10 bridge_word:12 bridge_word:14 bind_bridge:6 bind_bridge:8 bind_bridge:10 bind_bridge:12 bind_bridge:14
figures_command: BJ_TARGET=qwen3.5-9b uv run python scripts/d1_verdict.py --rule necessity --parts qwen35_9b_d1_necessity_parts --figures
question: >-
  On Qwen3.5-9B, in the band at the bridge's word, does taking the lens-readable part out of a stated bridge's change cost the lookups nothing while it costs the recalls, beyond a random part of the same size?
why_it_matters: >-
  The second model for d1_necessity_27b (the model's own change, not an added lens push). Lens: J++ (neuronpedia, published).
hypotheses:
  H-holds: 'in each position set the claim holds at a majority of the band cells. Prior: Dan''s (predictions/), none set by the agent'
  H-not: 'it does not hold. Prior: Dan''s'
decision_rule: >-
  Written 23 Oct ~15:45 +0200 before any run: d1_necessity_27b's rule (scripts/d1_verdict.py --rule necessity), on Qwen3.5-9B. Cells: the bridge's word and the bridge's sentence at layers 6, 8, 10, 12, 14 (the 9B's coarse grid, every 2nd layer), lookups and recalls. LOOKUP: the lens-readable part J not needed iff F(full) - F(not_jspace) <= 0.10 (point), at a cell where F(full) >= 0.50 on lookups (the agent's proposed gate; else not interpretable). RECALL: J needed iff F(full) - F(not_jspace) >= 0.20 (point) AND that drop is larger than F(full) - F(not_rand_sub), with the 95% lower bound of the difference > 0 (paired bootstrap over scenes, 2000 resamples, seed 0). CELL: holds iff both. MODEL (the agent's proposal): per position set, holds iff it holds at a majority of its 5 cells (3 or more; not interpretable cells count as not holding); the model holds iff both sets hold; every cell reported, with the parts' shares of the change's squared norm. On the map, layers 12 and 14 of both sets are not in transit for lookups.
controls:
- 'not_rand_sub: the change minus a random part of the lens part''s size (rand_sub, seed 888 + layer)'
- 'recalls (PM) on the same scenes and patch; the lookup gate (the whole change switches >= 50% of lookups); the random-direction nulls (reported)'
n: '180 scenes per family (PP and PM), d1_topics_v2, 10 cells'
seeds: [23]
notes: "Dan, 23 Oct 15:30 (B1), A100 queue. Same scenes, map, lens and code path as qwen35_9b_d1_topics2_parts, with --force. Seeds: data 23, nulls 0, random dictionary 777 + layer, random subspace 888 + layer, bootstrap 0. Timing basis: qwen35_9b_d1_topics2_parts ran 852 s on one A100 for 23k reads; this run ~76k reads: ~0.8 h, est 0.9 GPU-h; peak memory of that run 31 GB. Not opened before Dan predicts."
