  The J-space claims rest on Qwen3.6-27B; Neel asked for a larger model early. Qwen3.5-122B-A10B has a published J++ and needs no port on an H200.
hypotheses:
  H-replicates: 'as the map spec. Prior 0.4'
decision_rule: >-
  scripts/d1_verdict.py's map rule at the 27B's layers scaled by depth (fixed 2026-10-22 before these runs): the decisive cell is PP's statement cell (bind_bridge, bridge_word, context) in transit at the coarse layers in [24, 33) where C's whole copy flips the most lookups (ties: earlier layer, then bind_bridge, bridge_word, context). Replicates iff there the lens-readable part alone switches <= 0.10 of lookups and everything else >= 0.50 while PM's lens-readable part switches >= 0.30 (the lens gate: a failing control means no claim about the lens on this model). Per topic (animals, elements, Greek letters) the same verdict on the topic's rows; a topic counts only if its own control passes.
controls:
- 'O (another pair of picks swapped, off the path); a random direction at each row''s norm; a 25-atom OMP over a random dictionary; PM as the positive control on the same scenes'
n: 'as the map'
