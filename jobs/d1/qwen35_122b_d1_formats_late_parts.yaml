question: >-
  In tables and JSON, at later cells (the bridge's row / object and the whole context, at layers 30, 33 and 36), does the lens-readable part of a stated bridge's change still switch the lookups on Qwen3.5-122B, and does it still switch the recalls?
why_it_matters: >-
  The second scene set for the late-switch test of qwen35_122b_d1_late_parts: finding 2 also failed on the 122B in tables and JSON at the map's cell (the context at layer 24: the lens part switched 41% [34, 48] of lookups, n=180; tables 49% [39, 59], n=88; JSON 34% [25, 44], n=92). A late switch in prose only, or in all three formats, reads differently.
hypotheses:
  H-late-switch: 'as qwen35_122b_d1_late_parts, pooled over both formats. Prior: Dan''s (predictions/), none set by the agent'
  H-fails: 'as qwen35_122b_d1_late_parts, pooled. Prior: Dan''s'
  H-inconclusive: 'neither. Prior: Dan''s'
decision_rule: >-
  Written 23 Oct ~12:00 +0200 before any run: qwen35_122b_d1_late_parts's rule (scripts/d1_verdict.py --rule late-switch; same bars and controls; the agent's four choices confirmed by Dan 23 Oct 12:30), applied to the formats scenes pooled over tables and JSON. The hypothesis was named "late binding" until Dan renamed it "late switch" (23 Oct afternoon, before any run; the logic is unchanged): the map shows the bridge still at its position at the later layers, so the form changes, not the place. Late switch holds iff at some decisive cell the lens part's lookup switching has Wilson upper bound <= 0.05, the rest switches >= 0.30 of lookups (point), the lens part switches >= 0.30 of recalls there (point) with its Wilson lower bound above rand_sub's upper bound on recalls, and (amended by Dan 23 Oct 12:30, before any run) it stays quiet: at every later decisive cell of the same position set (the bridge's row / object, or the context) the lens part's lookup switching has Wilson upper bound <= 0.10, so a lens part that goes quiet and then comes back does not hold. Finding 2 fails iff at every decisive cell the lens part's lookup switching has Wilson lower bound >= 0.20 and above rand_sub's upper bound on lookups. Otherwise inconclusive. A cell decides iff the lens-free map qwen35_122b_d1_formats_map has it in transit for lookups: bind_bridge 30, context 30, 33 and 36; bind_bridge 33 and 36 are reported only (C's whole copy flips 48% and 44% of lookups there, not in transit). context:24 is the earlier reference, not decisive. Only layers 33 and 36 are new evidence: bind_bridge:30, context:30 and context:24 repeat cells of qwen35_122b_d1_formats_parts on the same 180 scenes (a determinism check, not new evidence). Reported as in qwen35_122b_d1_late_parts, including the rest at the lens part's size (not_jspace_matched, not decisive here). Per format (table 88 scenes, JSON 92 in the earlier run) and per topic the same rule on their rows, reported only (with ~90 items a Wilson upper bound <= 5% needs 0 switches).
controls:
- 'rand_sub: C''s copy projected per row on a random subspace (seed 888 + layer) keeping the lens part''s share of the row''s squared norm'
- 'PM (recalls) on the same scenes as the positive control: the identical patch at statement cells'
- 'reported: not_jspace_matched (the rest, each row rescaled to the lens part''s norm), jspace_matched, rand_omp, the lens part''s random-direction null'
- 'the map''s transit picks the decisive cells; the lens gate (qwen35_122b_lens_gate_v2, via scripts/d1_precheck.py)'
- 'determinism: bind_bridge:30, context:30 and context:24 repeat qwen35_122b_d1_formats_parts''s cells on the same scenes (that run on one H200, this one split over two H100s)'
n: '180 scenes per family (PP and PM), d1_formats_v1, right on every prompt, both formats in scene order, 7 cells'
seeds: [41]
notes: "Dan, 23 Oct ~11:40 ('if cheap, the formats scenes as a second spec'). Amended by Dan 23 Oct 12:30, before any run: late binding also needs the lens part to stay quiet (Wilson upper bound <= 10% of lookups) at every later decisive cell of the same position set; the agent's four choices confirmed. Updated 23 Oct afternoon (A4, Dan, before any run): renamed 'late switch' (rule logic unchanged; d1_verdict's rule id late-switch); not_jspace_matched added last (after rand_sub), earlier parts, seeds and nulls unchanged; on the rented 2x H100 PCIe 80 GB box (sesterce-h100x2): gpus 2, BJ_DEVICE_MAP=auto; mem_gb 150 in total over both GPUs (peak of the earlier formats parts run 130 GB), to be confirmed by the box agent. Same scenes, map and code path as qwen35_122b_d1_formats_parts_b16 with --force for the cells; the precheck command as that spec (only the lens gate matters). Data seed 41 (d1_formats_v1); nulls 0, random dictionary 777 + layer, random subspace 888 + layer. Batch 16. Timing basis: qwen35_122b_d1_formats_parts_b16 ran 2185 s on one H200 for 9 cells (51k reads); this run ~49k reads: ~0.6-0.8 h on one H200, assumed 1.5-2x slower split over two H100 PCIe: ~0.9-1.4 h wall, est 2.8 GPU-h (2 GPUs). Independent of qwen35_122b_d1_late_parts. Not opened before Dan predicts. H100 smoke (23 Oct): bind_bridge:30 reproduced within 3 points; context:30 moved 3.3 points and its recall control fell under 30% (hardware / two-GPU split noise: clean logits differ by 0.27 on average); Dan said launch; compare later layers with this run's own layer-30 cells, not with the H200 run's."
