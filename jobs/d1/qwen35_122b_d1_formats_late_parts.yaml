  BJ_TARGET=qwen3.5-122b-a10b uv run python scripts/d1_precheck.py --gate qwen35_122b_lens_gate_v2 --competence qwen35_122b_d1_topics2_competence --min-topics 0
  && BJ_TARGET=qwen3.5-122b-a10b BJ_DEVICE_MAP=auto BJ_SUITE_BATCH=16 uv run python scripts/statement_positions.py parts --name qwen35_122b_d1_formats_late_parts --map qwen35_122b_d1_formats_map --why "Late switch in tables and JSON on 122B: the parts at the later cells" --lo 24 --sets bind_bridge context --force bind_bridge:30 bind_bridge:33 bind_bridge:36 context:24 context:30 context:33 context:36
