- olmo3_7b_instruct_jpp_d1_topics2_map
command: >-
  BJ_TARGET=olmo-3-7b-instruct-jpp uv run python scripts/d1_precheck.py --gate olmo3_7b_instruct_jpp_lens_gate --competence olmo3_7b_instruct_d1_topics2_competence
  && BJ_TARGET=olmo-3-7b-instruct-jpp uv run python scripts/statement_positions.py parts --name olmo3_7b_instruct_jpp_d1_topics2_parts --map olmo3_7b_instruct_jpp_d1_topics2_map --why "D1 on OLMo with our J++: the parts" --lo 16 --sets bind_bridge bridge_word lookup_x context question
  && BJ_TARGET=olmo-3-7b-instruct-jpp uv run python scripts/d1_verdict.py --map olmo3_7b_instruct_jpp_d1_topics2_map --parts olmo3_7b_instruct_jpp_d1_topics2_parts --tasks-set d1_topics_v2 --lo 16 --onset 22
question: >-
  At the decisive transit cell, does the J++-readable part of a stated bridge's change move lookups (PP), and does it move recalls (PM, the positive control)?
why_it_matters: >-
  Finding 2 (the lookup ignores the lens-readable part) on another family, with the lens type every other model uses.
hypotheses:
  H-replicates: 'the gate and the control pass and the split replicates. Prior 0.3 (agent''s)'
  H-not-interpretable: 'the control fails or no transit cell. Prior 0.5 (agent''s)'
  H-not: 'the control passes, the split does not replicate. Prior 0.2 (agent''s)'
decision_rule: >-
  Runs iff our J++ passes gate v1 and >= 2 topics have >= 30 eligible scenes (scripts/d1_precheck.py). scripts/d1_verdict.py's map rule at the 27B's layers scaled by depth [16, 22) (unchanged from olmo3_7b_instruct_d1_topics2_parts): the decisive cell is PP's statement cell in transit at the coarse layers in that window with the most C flips. Replicates iff there the lens-readable part alone switches <= 0.10 of lookups and the rest >= 0.50, while PM's lens-readable part switches >= 0.30 (the positive control; failing it means no claim about the lens on this model). Per topic the same verdict on the topic's rows. Primary lens (Dan, 23 Oct ~00:30, fixed before any J++ result): ours, the published recipe on 64 prompts; Zach's OLMo fit reported alongside when shared; if ours fails and his passes, both are reported; no silent switch.
controls:
- 'O (another pair of picks swapped, off the path); a random direction at each row''s norm; a 25-atom OMP over a random dictionary; PM as the positive control on the same scenes; the lens gate'
n: 'as the map'
seeds: [0]
notes: "Dan, 23 Oct ~00:30: every lens result on J++. Not opened before Dan's predictions."
