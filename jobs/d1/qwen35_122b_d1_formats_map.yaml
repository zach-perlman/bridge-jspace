notes: "mechanical copy of d1_formats_map_27b for Qwen3.5-122B (Dan, 23 Oct ~00:55: the whole grid on the 2x H200); not opened before Dan's predictions. Primary lens: neuronpedia's published J++ for Qwen3.5-122B-A10B (frozen, pinned in src/bridge_jspace/pins.py; fit on bf16 weights, run here on FP8). Only BJ_TARGET, run names, the precheck, the batch and the layers change; layers: the 27B's scaled by depth x 48/64 (smoke 32 36 -> 24 27; cells from 32 -> 24; window [32, 44) -> [24, 33)), as the 122B's own prose D1 specs. The precheck is the first step and reads the 122B's prose D1 competence (qwen35_122b_d1_topics2_competence, written by qwen35_122b_d1_topics2_map_r2's first step; hence the dependency), so a failed gate stops this chain before the formats competence is spent; with --min-topics 0 the competence only feeds the script, not the decision. Memory (Dan, 00:55): FP8 weights ~127 GB of a 143 GB H200, so mem_gb 135, BJ_BATCH=16 and BJ_GEN_BATCH=16 (the queued 122B specs use BJ_BATCH=16); tasks_v2's competence generates in fixed batches of 64 (no knob), as qwen35_122b_d2_formats and qwen35_122b_d1_topics2_map_r2 do. Data: data/tasks_v2/d1_formats_v1 (scripts/tasks_v2.py make, seed 41: PP and PM, animals, elements, Greek letters, markdown tables and tool-output JSON, level 0, C and O token-aligned). Batch 16 for the read-heavy steps (Dan, 23 Oct ~01:20: known to fit on one H200, Oct 20); J-space removal at BJ_ABL_BATCH=8 (Zach's 122B run with the random-dictionary control)."
