  Finding 2 (a lookup ignores the lens-readable part of a stated bridge) holds in prose on two models; the outside review asks for less toy formats for the lens claim itself.
hypotheses:
  H-both: 'replicates in tables and in JSON. Prior 0.45 (copied from qwen35_9b_d1_formats_map)'
  H-one: 'one format replicates, the other does not or its control fails. Prior 0.3 (copied from qwen35_9b_d1_formats_map)'
  H-none: 'neither (the control fails, or the split does not hold). Prior 0.25 (copied from qwen35_9b_d1_formats_map)'
decision_rule: >-
  Opens iff this model's J++ gate v1 (gemma4itf_lens_gate_v2) passes and >= 2 topics of d1_formats_v1 have >= 30 eligible scenes (scripts/d1_precheck.py --tasks-set d1_formats_v1; it runs right after the formats competence it reads, and again before parts and readwrite). scripts/d1_verdict.py's map rule (window [30, 41), the prose runs' window on this model, gemma4itf_d1_topics2_map / _parts / _rw), unchanged: the decisive cell is PP's statement cell (the pick row / object, the bridge's cell, the context) in transit with the most C flips; with --keep-min 0.8 as in the prose runs (under the lens-part patch the lookups must keep their original answer on >= 80% of items, else not interpretable); replicates iff there the lens-readable part alone switches <= 0.10 of lookups and the rest >= 0.50, while PM's lens-readable part switches >= 0.30 (the control; failing it: not interpretable). The same verdict per format (format_verdicts) and per topic. Finding 2 holds in tables and JSON on this model iff the pooled verdict and both format verdicts replicate (fixed 22 Oct 23:30 before these runs).
controls:
- 'O (another pair of picks swapped, off the path); a random direction at each row''s norm; a 25-atom OMP over a random dictionary; PM as the positive control on the same scenes'
- 'the lens gate (gemma4itf_lens_gate_v2, via scripts/d1_precheck.py); the keep-answer gate (--keep-min 0.8)'
