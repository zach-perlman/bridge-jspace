id: qwen35_122b_d1_late_parts
title: "Late switch (Qwen3.5-122B): does the lookup stop using the lens-readable part of a stated bridge at later layers?"
thread: D1
gpus: 2
mem_gb: 150
est_gpu_hours: 2.4
command: >-
  BJ_TARGET=qwen3.5-122b-a10b uv run python scripts/d1_precheck.py --gate qwen35_122b_lens_gate_v2 --competence qwen35_122b_d1_topics2_competence --min-topics 0
  && BJ_TARGET=qwen3.5-122b-a10b BJ_DEVICE_MAP=auto BJ_SUITE_BATCH=16 uv run python scripts/statement_positions.py parts --name qwen35_122b_d1_late_parts --map qwen35_122b_d1_topics2_map --why "Late switch on 122B: the parts at the later cells" --lo 24 --sets bind_bridge context --force bind_bridge:30 bind_bridge:33 bind_bridge:36 context:24 context:30 context:33 context:36
  && BJ_TARGET=qwen3.5-122b-a10b uv run python scripts/d1_verdict.py --rule late-switch --map qwen35_122b_d1_topics2_map --parts qwen35_122b_d1_late_parts --tasks-set d1_topics_v2 --cells bind_bridge:30 bind_bridge:33 bind_bridge:36 context:30 context:33 context:36 --reference context:24
figures_command: BJ_TARGET=qwen3.5-122b-a10b uv run python scripts/d1_verdict.py --rule late-switch --parts qwen35_122b_d1_late_parts --figures
question: >-
  At later cells (the bridge's sentence and the whole context, at layers 30, 33 and 36), does the lens-readable part of a stated bridge's change still switch the lookups on Qwen3.5-122B, and does it still switch the recalls?
why_it_matters: >-
  Finding 2 (a lookup ignores the lens-readable part of a stated bridge) failed on the 122B at the map's cell (the context at layer 24: the lens part switched 29% [23, 36] of lookups, n=180; recalls 38% [31, 45]; the rest 75% [68, 81]). The lens-free map shows the bridge still at its position at layers 33-38, so if the finding holds later on the 122B, what changes is the form the lookup reads there, not the place (a late switch); if the lens part keeps switching lookups at every later cell, finding 2 fails on the 122B.
hypotheses:
  H-late-switch: 'at some decisive later cell the lens part switches <= 5% of lookups (Wilson upper bound) while the rest switches >= 30% (point), there the lens part still switches >= 30% of recalls, above a random subspace of its size, and it stays <= 10% of lookups (upper bound) at the later decisive cells of the same position set. Prior: Dan''s (predictions/), none set by the agent'
  H-fails: 'at every decisive later cell the lens part switches >= 20% of lookups (Wilson lower bound), above a random subspace of its size: finding 2 fails on the 122B. Prior: Dan''s'
  H-inconclusive: 'neither (e.g. the lens part drops to 5-20%, or the split holds but a control fails). Prior: Dan''s'
decision_rule: >-
  Written 23 Oct ~12:00 +0200 before any run (scripts/d1_verdict.py --rule late-switch; the replication rule is untouched). The hypothesis was named "late binding" until Dan renamed it "late switch" (23 Oct afternoon, before any run; the logic is unchanged): the map shows the bridge still at its position at layers 33-38, so the form changes, not the place. Precheck as the 122B D1 specs: runs only if the lens gate passed (qwen35_122b_lens_gate_v2; else exit 3, logged). Cells: the bridge's sentence (bind_bridge) and the context at layers 30, 33, 36 (all on the 122B's coarse grid, every 3rd layer; 33 is the 122B's answer onset, so these cells are forced past the parts stage's usual window). A cell decides iff the lens-free map (qwen35_122b_d1_topics2_map, fixed) has it in transit for lookups: bind_bridge 30 and 33, context 30, 33 and 36; bind_bridge 36 is reported only (C's whole copy flips 36% of lookups there, not in transit). context:24 is re-run as the earlier reference (rand_sub there; the earlier 29% reproduced), not decisive. Rates: share of items whose top token is the other bridge's answer, Wilson 95%, pooled over topics. LATE SWITCH holds iff at some decisive cell (a) the lens part's (jspace) lookup switching has Wilson upper bound <= 0.05, (b) the rest (not_jspace) switches >= 0.30 of lookups (point estimate), (c) recall control: the lens part switches >= 0.30 of recalls at that cell (point; PP and PM get the identical patch at statement cells, so the lens part is big enough to act there), (d) random-subspace control: on recalls the lens part's Wilson lower bound is above rand_sub's upper bound (the lens part acts beyond its size), and (e) it stays quiet (amended by Dan 23 Oct 12:30, before any run): at every later decisive cell of the same position set (the bridge's sentence, or the context) the lens part's lookup switching has Wilson upper bound <= 0.10; a lens part that goes quiet and then comes back does not hold. FINDING 2 FAILS on the 122B iff at every decisive cell the lens part's lookup switching has Wilson lower bound >= 0.20 and above rand_sub's upper bound on lookups (not a size effect). Otherwise INCONCLUSIVE, the reason named. The two are exclusive (an upper bound <= 5% cannot meet a lower bound >= 20%). Confirmed by Dan 23 Oct 12:30 (proposed by the agent): the lower bound (not the point) for 'fails'; controls (c) and (d) and the rand_sub condition in 'fails'; transit as the decisive-cell filter. Reported per cell for lookups and recalls (the lookup vs recall split): whole copy, lens part, rest, the rest at the lens part's size (not_jspace_matched, added 23 Oct afternoon for A2, not decisive here), rand_sub, jspace_matched, rand_omp, the lens part's random-direction null, median shares of the change (lens part, rand_sub, rand_omp); per topic (not decisive). Only layers 33 and 36 are new evidence: bind_bridge:30, context:30 and the reference context:24 repeat cells of qwen35_122b_d1_topics2_parts on the same 180 scenes (a determinism check, not new evidence).
controls:
- 'rand_sub (new, 23 Oct): C''s copy projected per row on a random subspace (the first k directions of a random orthonormal basis, seed 888 + layer), k chosen per row so it keeps the lens part''s share of the row''s squared norm (the same size per position, item and cell)'
- 'PM (recalls) on the same scenes as the positive control: the identical patch at statement cells'
- 'reported: not_jspace_matched (the rest, each row rescaled to the lens part''s norm), jspace_matched (per row the same distribution as rand_sub, independent random directions per row), rand_omp (25-atom OMP over a random dictionary, smaller share), the lens part''s random-direction null'
- 'the map''s transit (C''s whole copy against O''s copy and a random-direction copy) picks the decisive cells; the lens gate (qwen35_122b_lens_gate_v2, via scripts/d1_precheck.py)'
- 'determinism: bind_bridge:30, context:30 and context:24 repeat qwen35_122b_d1_topics2_parts''s cells on the same scenes (that run on one H200, this one split over two H100s)'
n: '180 scenes per family (PP lookups and PM recalls), d1_topics_v2 (the draw-2 topics run''s scenes, right on every prompt), 7 cells'
seeds: [0]
notes: "Dan, 23 Oct ~11:40: pre-register now and run on a rented H200 (no box up at writing; a fresh 1x or 2x H200). Amended by Dan 23 Oct 12:30, before any run: late binding also needs condition (e), the lens part staying quiet (Wilson upper bound <= 10% of lookups) at every later decisive cell of the same position set; the agent's four choices confirmed. Updated 23 Oct afternoon (A4, Dan, before any run): the hypothesis renamed 'late switch' (rule logic unchanged; d1_verdict's rule id late-switch); the part not_jspace_matched added last (after rand_sub), so every earlier part, seed and null keeps its place; the run moves to the rented 2x H100 PCIe 80 GB box (sesterce-h100x2): gpus 2, the model split over both with BJ_DEVICE_MAP=auto (FP8 needs compute capability >= 8.9: the H100 has 9.0); mem_gb 150 is the total free memory over both GPUs (an idle H100 shows ~79 GiB free; the earlier 122B parts runs peaked at 129-130 GB), to be confirmed by the box agent. Same scenes, map, lens (published J++, pinned) and code path as qwen35_122b_d1_topics2_parts_r3, with --force for the cells (bypasses the map's transit filter: every family gets every cell; d1_verdict then uses the map's transit). Seeds: nulls 0, random dictionary 777 + layer, random subspace 888 + layer. Batch 16 for the read-heavy steps (as the other 122B specs). Timing basis: qwen35_122b_d1_topics2_parts_r3 ran 1842 s on one H200 for 9 cells x 2 families x 180 (51k reads); this run has 7 cells and 4 more reads per cell (~49k reads): ~0.5-0.7 h on one H200; split over two H100 PCIe (slower memory, the blocks run one GPU after the other) assumed 1.5-2x slower: ~0.8-1.2 h wall, est 2.4 GPU-h (2 GPUs). No depends_on: its inputs (the map, the competence run, the lens gate) are committed. Not opened before Dan predicts. H100 smoke (23 Oct): bind_bridge:30 reproduced within 3 points; context:30 moved 3.3 points and its recall control fell under 30% (hardware / two-GPU split noise: clean logits differ by 0.27 on average); Dan said launch; compare later layers with this run's own layer-30 cells, not with the H200 run's."
