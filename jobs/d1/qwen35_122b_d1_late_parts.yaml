id: qwen35_122b_d1_late_parts
title: "Late binding (Qwen3.5-122B): does the lookup stop using the lens-readable part of a stated bridge at later layers?"
thread: D1
gpus: 1
mem_gb: 135
est_gpu_hours: 0.7
command: >-
  BJ_TARGET=qwen3.5-122b-a10b uv run python scripts/d1_precheck.py --gate qwen35_122b_lens_gate_v2 --competence qwen35_122b_d1_topics2_competence --min-topics 0
  && BJ_TARGET=qwen3.5-122b-a10b BJ_BATCH=16 uv run python scripts/statement_positions.py parts --name qwen35_122b_d1_late_parts --map qwen35_122b_d1_topics2_map --why "Late binding on 122B: the parts at the later cells" --lo 24 --sets bind_bridge context --force bind_bridge:30 bind_bridge:33 bind_bridge:36 context:24 context:30 context:33 context:36
  && BJ_TARGET=qwen3.5-122b-a10b uv run python scripts/d1_verdict.py --rule late-binding --map qwen35_122b_d1_topics2_map --parts qwen35_122b_d1_late_parts --tasks-set d1_topics_v2 --cells bind_bridge:30 bind_bridge:33 bind_bridge:36 context:30 context:33 context:36 --reference context:24
figures_command: BJ_TARGET=qwen3.5-122b-a10b uv run python scripts/d1_verdict.py --rule late-binding --parts qwen35_122b_d1_late_parts --figures
question: >-
  At later cells (the bridge's sentence and the whole context, at layers 30, 33 and 36), does the lens-readable part of a stated bridge's change still switch the lookups on Qwen3.5-122B, and does it still switch the recalls?
why_it_matters: >-
  Finding 2 (a lookup ignores the lens-readable part of a stated bridge) failed on the 122B at the map's cell (the context at layer 24: the lens part switched 29% [23, 36] of lookups, n=180; recalls 38% [31, 45]; the rest 75% [68, 81]). If the 122B binds the bridge later, the finding may hold at a later cell (late binding); if the lens part keeps switching lookups at every later cell, finding 2 fails on the 122B.
hypotheses:
  H-late-binding: 'at some decisive later cell the lens part switches <= 5% of lookups (Wilson upper bound) while the rest switches >= 30% (point), there the lens part still switches >= 30% of recalls, above a random subspace of its size, and it stays <= 10% of lookups (upper bound) at the later decisive cells of the same position set. Prior: Dan''s (predictions/), none set by the agent'
  H-fails: 'at every decisive later cell the lens part switches >= 20% of lookups (Wilson lower bound), above a random subspace of its size: finding 2 fails on the 122B. Prior: Dan''s'
  H-inconclusive: 'neither (e.g. the lens part drops to 5-20%, or the split holds but a control fails). Prior: Dan''s'
decision_rule: >-
  Written 23 Oct ~12:00 +0200 before any run (scripts/d1_verdict.py --rule late-binding; the replication rule is untouched). Precheck as the 122B D1 specs: runs only if the lens gate passed (qwen35_122b_lens_gate_v2; else exit 3, logged). Cells: the bridge's sentence (bind_bridge) and the context at layers 30, 33, 36 (all on the 122B's coarse grid, every 3rd layer; 33 is the 122B's answer onset, so these cells are forced past the parts stage's usual window). A cell decides iff the lens-free map (qwen35_122b_d1_topics2_map, fixed) has it in transit for lookups: bind_bridge 30 and 33, context 30, 33 and 36; bind_bridge 36 is reported only (C's whole copy flips 36% of lookups there, not in transit). context:24 is re-run as the earlier reference (rand_sub there; the earlier 29% reproduced), not decisive. Rates: share of items whose top token is the other bridge's answer, Wilson 95%, pooled over topics. LATE BINDING holds iff at some decisive cell (a) the lens part's (jspace) lookup switching has Wilson upper bound <= 0.05, (b) the rest (not_jspace) switches >= 0.30 of lookups (point estimate), (c) recall control: the lens part switches >= 0.30 of recalls at that cell (point; PP and PM get the identical patch at statement cells, so the lens part is big enough to act there), (d) random-subspace control: on recalls the lens part's Wilson lower bound is above rand_sub's upper bound (the lens part acts beyond its size), and (e) it stays quiet (amended by Dan 23 Oct 12:30, before any run): at every later decisive cell of the same position set (the bridge's sentence, or the context) the lens part's lookup switching has Wilson upper bound <= 0.10; a lens part that goes quiet and then comes back does not hold. FINDING 2 FAILS on the 122B iff at every decisive cell the lens part's lookup switching has Wilson lower bound >= 0.20 and above rand_sub's upper bound on lookups (not a size effect). Otherwise INCONCLUSIVE, the reason named. The two are exclusive (an upper bound <= 5% cannot meet a lower bound >= 20%). Confirmed by Dan 23 Oct 12:30 (proposed by the agent): the lower bound (not the point) for 'fails'; controls (c) and (d) and the rand_sub condition in 'fails'; transit as the decisive-cell filter. Reported per cell for lookups and recalls (the lookup vs recall split): whole copy, lens part, rest, rand_sub, jspace_matched, rand_omp, the lens part's random-direction null, median shares of the change (lens part, rand_sub, rand_omp); per topic (not decisive).
controls:
- 'rand_sub (new, 23 Oct): C''s copy projected per row on a random subspace (the first k directions of a random orthonormal basis, seed 888 + layer), k chosen per row so it keeps the lens part''s share of the row''s squared norm (the same size per position, item and cell)'
- 'PM (recalls) on the same scenes as the positive control: the identical patch at statement cells'
- 'reported: jspace_matched (per row the same distribution as rand_sub, independent random directions per row), rand_omp (25-atom OMP over a random dictionary, smaller share), the lens part''s random-direction null'
- 'the map''s transit (C''s whole copy against O''s copy and a random-direction copy) picks the decisive cells; the lens gate (qwen35_122b_lens_gate_v2, via scripts/d1_precheck.py)'
n: '180 scenes per family (PP lookups and PM recalls), d1_topics_v2 (the draw-2 topics run''s scenes, right on every prompt), 7 cells'
seeds: [0]
notes: "Dan, 23 Oct ~11:40: pre-register now and run on a rented H200 (no box up at writing; a fresh 1x or 2x H200). Amended by Dan 23 Oct 12:30, before any run: late binding also needs condition (e), the lens part staying quiet (Wilson upper bound <= 10% of lookups) at every later decisive cell of the same position set; the agent's four choices confirmed. Same scenes, map, lens (published J++, pinned) and code path as qwen35_122b_d1_topics2_parts_r3, with --force for the cells (bypasses the map's transit filter: every family gets every cell; d1_verdict then uses the map's transit). New part rand_sub; every earlier part, seed and null unchanged (rand_sub is last in the parts dict, so the earlier parts' null seeds keep their index). Seeds: nulls 0, random dictionary 777 + layer, random subspace 888 + layer. Batch 16 for the read-heavy steps (as the other 122B specs: known to fit one H200); peak memory of the earlier parts run 129 GB, mem_gb 135 so an idle H200 (139.8 GiB free) passes jobq's memory check. Timing basis: qwen35_122b_d1_topics2_parts_r3 ran 1842 s on one H200 for 9 cells x 2 families x 180 (51k reads); this run has 7 cells and 2 more reads per cell (~44k reads, 4 layers instead of 3): ~0.45-0.7 h. No depends_on: its inputs (the map, the competence run, the lens gate) are committed. Not opened before Dan predicts."
