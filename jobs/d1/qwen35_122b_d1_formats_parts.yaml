question: >-
  At the decisive cell, does the lens-readable part switch lookups (PP) and recalls (PM), per format?
why_it_matters: >-
  Finding 2 (a lookup ignores the lens-readable part of a stated bridge) holds in prose on two models; the outside review asks for less toy formats for the lens claim itself.
hypotheses:
  H-both: 'replicates in tables and in JSON. Prior 0.45 (copied from d1_formats_parts_27b)'
  H-one: 'one format replicates, the other does not or its control fails. Prior 0.3 (copied from d1_formats_parts_27b)'
  H-none: 'neither (the control fails, or the split does not hold). Prior 0.25 (copied from d1_formats_parts_27b)'
decision_rule: >-
  Precheck (Dan, 23 Oct ~00:55, before these runs), the first step: runs only if the model's lens gate v1 passed (qwen35_122b_lens_gate_v2; scripts/d1_precheck.py --min-topics 0: only the gate matters; else the job stops with exit 3 and is logged). scripts/d1_verdict.py's map rule (window [24, 33), the 122B's prose window: the 27B's [32, 44) scaled by depth x 48/64, as qwen35_122b_d1_topics2_*_r2), unchanged: the decisive cell is PP's statement cell (the pick row / object, the bridge's cell, the context) in transit with the most C flips; replicates iff there the lens-readable part alone switches <= 0.10 of lookups and the rest >= 0.50, while PM's lens-readable part switches >= 0.30 (the control; failing it: not interpretable). The same verdict per format (format_verdicts) and per topic. Finding 2 holds in tables and JSON on this model iff the pooled verdict and both format verdicts replicate (fixed 22 Oct 23:30 before these runs).
controls:
- 'O (another pair of picks swapped, off the path); a random direction at each row''s norm; a 25-atom OMP over a random dictionary; PM as the positive control on the same scenes'
- 'the lens gate (qwen35_122b_lens_gate_v2, via scripts/d1_precheck.py)'
n: '180 scenes (PP and PM), d1_formats_v1, right on every prompt, both formats in scene order'
