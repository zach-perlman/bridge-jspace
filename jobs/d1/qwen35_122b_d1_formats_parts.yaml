notes: "mechanical copy of d1_formats_parts_27b for Qwen3.5-122B (Dan, 23 Oct ~00:55: the whole grid on the 2x H200); not opened before Dan's predictions. Primary lens: neuronpedia's published J++ for Qwen3.5-122B-A10B (frozen, pinned in src/bridge_jspace/pins.py). Only BJ_TARGET, run names, the precheck, the batch and the layers change (cells from 24, onset 33: the 27B's 32 and 44 x 48/64). BJ_TARGET is set on d1_verdict too: its decisive-cell grid is every N_LAYERS/16-th layer of the target (every 3rd on the 122B: 24 27 30 in the window, the cells parts runs at); without it the default target's every-4th grid applies (24 28 32). Memory (Dan, 00:55): FP8 weights ~127 GB of a 143 GB H200, so mem_gb 135 and BJ_BATCH=16 (the queued 122B specs use 16). Data: data/tasks_v2/d1_formats_v1 (seed 41). Batch 16 for the read-heavy steps (Dan, 23 Oct ~01:20: known to fit on one H200, Oct 20); J-space removal at BJ_ABL_BATCH=8 (Zach's 122B run with the random-dictionary control)."
