question: >-
  Does the lens read the stated bridge at the transit cells, and does a lens write move lookups or recalls?
why_it_matters: >-
  D1 (finding 2: a lookup ignores the lens-readable part of a stated bridge) rests on one model; per topic its control passed on animals, elements and Greek with ~30 scenes each, too few for per-topic verdicts. Lens on this model: J++ (neuronpedia, published, target layer 31).
hypotheses:
  H-replicates: 'the lens gate passes and the split replicates. Prior 0.35'
  H-no-lens: 'the lens gate fails (PM lens part < 30%): no claim about the lens on this model. Prior 0.5'
  H-not: 'the gate passes and the split does not replicate. Prior 0.15'
decision_rule: >-
  scripts/d1_verdict.py's map rule with the 27B's layers scaled by depth (fixed 2026-10-22 evening, before these runs): the decisive cell is PP's statement cell (bind_bridge, bridge_word, context) in transit at the coarse layers in [16, 22) (the 27B's [32, 44) of 64 layers, on 32) where C's whole copy flips the most lookups (ties: earlier layer, then bind_bridge, bridge_word, context). Then the 27B's verdict: replicates iff the lens-readable part alone switches <= 0.10 of lookups and everything else >= 0.50 while PM's lens-readable part switches >= 0.30 (the lens gate: without it the run says nothing about the lens, 'not interpretable'). Per topic reported as on the 27B. The rw stage's lens read (the lens's top word = the stated bridge) is reported as the second gate number.
controls:
- 'O (another pair of picks swapped, off the path); a random direction at each row''s norm; a 25-atom OMP over a random dictionary (the fitting null); PM as the positive control on the same scenes'
