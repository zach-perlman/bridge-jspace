question: >-
  Does the lens read the stated bridge at the transit cells, and does a lens write move lookups or recalls?
why_it_matters: >-
  D1 (finding 2: a lookup ignores the lens-readable part of a stated bridge) rests on one model; per topic its control passed on animals, elements and Greek with ~30 scenes each, too few for per-topic verdicts. Lens on this model: J++ (neuronpedia, the frozen 27B lens).
hypotheses:
  H-replicates: 'pooled replicates and no topic does not replicate. Prior 0.75'
  H-topic-fails: 'at least one topic does not replicate (its lens part moves > 10% of lookups, or the rest < 50%). Prior 0.1'
  H-control: 'the pooled control fails (PM lens part < 30%). Prior 0.15'
decision_rule: >-
  scripts/d1_verdict.py with --cell context:32 (fixed 2026-10-22 evening, before these runs: the cell d1_topics_map_27b chose by the lens-free rule). At that cell, pooled over the three topics: replicates iff the lens-readable part alone switches <= 0.10 of PP lookups and everything else >= 0.50, while PM's lens-readable part switches >= 0.30 (the positive control); a failing control: not interpretable. Per topic, the same verdict on the topic's own rows (topic_verdicts); a topic counts only if its own control passes. Finding 2 generalises across topics on this model iff the pooled verdict replicates and no topic 'does not replicate'. If the map does not put PP or PM in transit at context:32, the cell has no parts rows and the run is not interpretable. Reported, not decisive: digits vs words, the other transit cells, the nulls.
controls:
- 'O (another pair of picks swapped, off the path); a random direction at each row''s norm; a 25-atom OMP over a random dictionary (the fitting null); PM as the positive control on the same scenes'
n: '180 scenes (PP and PM each; the first 180 eligible in scene order, 60 per topic), animals, elements, Greek letters, prose, 3 entities (level 0), scenes right on every prompt'
seeds: [23]
