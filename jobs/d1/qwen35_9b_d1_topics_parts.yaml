id: qwen35_9b_d1_topics_parts
title: "D1 topics, the first draw (Qwen3.5-9B): which part of a stated bridge's change does the lookup use?"
thread: D1
gpus: 1
mem_gb: 40
est_gpu_hours: 0.2
depends_on:
- qwen35_9b_d1_topics_map
command: >-
  BJ_TARGET=qwen3.5-9b uv run python scripts/statement_positions.py parts --name qwen35_9b_d1_topics_parts --map qwen35_9b_d1_topics_map --why "D1 on four topics (the 27B's first draw) on Qwen3.5-9B: the lens-readable part vs the rest at the transit cells" --lo 16 --sets bind_bridge bridge_word lookup_x context question && BJ_TARGET=qwen3.5-9b uv run python scripts/d1_verdict.py --map qwen35_9b_d1_topics_map --parts qwen35_9b_d1_topics_parts --tasks-set d1_topics_v1 --lo 16 --onset 22
question: >-
  At the decisive cell, does the stated bridge's lens-readable part switch lookups (PP) and recalls (PM) on Qwen3.5-9B's second draw of scenes?
why_it_matters: >-
  Finding 2 (a lookup ignores the lens-readable part of a stated bridge) on Qwen3.5-9B rests on one draw of scenes (d1_topics_v2, qwen35_9b_d1_topics2_*); the 27B's first draw (d1_topics_v1, no context shared with v2) is the second. Lens on this model: J++ (neuronpedia, published, target layer 31).
hypotheses:
  H-replicates: 'the lens gate passes and the split replicates. Prior 0.35 (copied from qwen35_9b_d1_topics2_parts)'
  H-no-lens: 'the lens gate fails (PM lens part < 30%): no claim about the lens on this model. Prior 0.5 (copied from qwen35_9b_d1_topics2_parts)'
  H-not: 'the gate passes and the split does not replicate. Prior 0.15 (copied from qwen35_9b_d1_topics2_parts)'
decision_rule: >-
  scripts/d1_verdict.py's replication rule as for qwen35_9b_d1_topics2_parts: d1_topics_map_27b's rule (amended 2026-10-22 17:36 +0200 by Dan) with the 27B's layers scaled by depth x 32/64. The decisive cell is chosen from the lens-free map alone: among PP's statement cells (bind_bridge, bridge_word, context) in transit at the map's coarse-grid layers in [16, 22) (the 27B's [32, 44)), the one where C's whole copy flips the most PP lookups (point estimate; ties: the earlier layer, then bind_bridge, bridge_word, context). At that cell, pooled over the four topics: replicates iff the lens-readable part alone switches <= 0.10 of PP lookups and everything else >= 0.50, while PM's lens-readable part switches >= 0.30 (the positive control); a failing positive control, or no PM parts row at the cell: not interpretable; else does not replicate. Reported, not decisive: per topic (animals, planets, elements, Greek letters; topic_verdicts, a topic counting only if its own control passes), digits vs words, the other transit cells, the nulls; the rw stage's lens read (the lens's top word = the stated bridge) as the second gate number. Grid: d1_verdict.py as committed since 076edbb takes the map's coarse grid, every N/16-th layer (16, 18, 20 on 32 layers); qwen35_9b_d1_topics2_parts's verdict ran before that fix (every 4th: 16, 20); on that run's map both grids give the same cell (context:16).
controls:
- 'O (another pair of picks swapped, off the path); a random direction at each row''s norm; a 25-atom OMP over a random dictionary (the fitting null); PM as the positive control on the same scenes'
n: '120 scenes (PP and PM each), four topics, prose, 3 entities (level 0), scenes right on every prompt'
seeds: [22]
notes: >-
  Mechanical copy of d1_topics_parts_27b (Qwen3.5-9B's second draw of finding 2) plus the d1_verdict step of qwen35_9b_d1_topics2_parts, the same call with this draw's names and set (--tasks-set d1_topics_v1 --lo 16 --onset 22; the 27B's draw-1 verdict was run by hand, outside its spec). Changed: the target, run names, mem_gb, the hypotheses (copied from qwen35_9b_d1_topics2_parts), --lo 16 for 32 (depth-scaled, as qwen35_9b_d1_topics2_parts). d1_verdict.py runs at the enqueued commit, i.e. with the N/16 grid of 076edbb (see the rule). GPU-h from the ledger: d1_topics_parts_27b 0.29 h; the 9B's d1_topics_v2 parts took 0.57 of the 27B's (0.24 h vs 0.42 h), so ~0.17 h. Not opened before Dan's predictions.
