question: >-
  Shrunk to the size of the lens-readable part, does the rest of a stated bridge's change still switch the lookups on Qwen3.5-9B where the lens-readable part does not?
why_it_matters: >-
  The second model for the size-versus-form question of d1_rest_size_27b: the lens-readable part is the smaller piece of the change, so its silence on lookups could be its size, not its form. Lens on this model: J++ (neuronpedia, published, target layer 31).
hypotheses:
  H-form: 'at the decisive cell the rest at the lens part''s size switches lookups with Wilson lower bound >= 20% while the lens part''s Wilson upper bound is <= 5%. Prior: Dan''s (predictions/ batch 20), none set by the agent'
  H-size: 'at the decisive cell the rest at the lens part''s size switches <= 10% of lookups (Wilson upper bound): the lookup half of claim 6 carries no information on this model. Prior: Dan''s'
  H-inconclusive: 'neither (on this model also when the lens part itself is not quiet on lookups and the shrunk rest moves more than 10%). Prior: Dan''s'
decision_rule: >-
  Written 23 Oct afternoon before any run: d1_rest_size_27b's rule (scripts/d1_verdict.py --rule rest-size), on Qwen3.5-9B. Cells: the context at layers 16 and 18 and the bridge's sentence at layer 16 (the 9B's coarse grid is every 2nd layer; the 27B's 32 and 36 of 64 scaled to 32 layers). The decisive cell is finding 2's own cell on this model, context:16 (the cell qwen35_9b_d1_topics2_parts's verdict chose from the map); it must be in transit for lookups on the lens-free map qwen35_9b_d1_topics2_map (it is), else not interpretable. The other two cells get the same verdict, reported only (bind_bridge:16 is not in transit for lookups on the map). H-FORM iff at the decisive cell the rest at the lens part's size switches lookups with Wilson lower bound >= 0.20 while the lens part's Wilson upper bound is <= 0.05. H-SIZE iff there the rest at the lens part's size switches lookups with Wilson upper bound <= 0.10. Otherwise INCONCLUSIVE. Agent's choices for Dan to confirm before enqueue: one decisive cell (finding 2's), the others reported; transit as the filter. Reported per cell, lookups and recalls: the whole copy, the lens part, the rest, the rest at the lens part's size, rand_sub, jspace_matched, rand_omp, the lens part's random-direction null; per topic at the decisive cell.
