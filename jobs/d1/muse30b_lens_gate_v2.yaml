  scripts/lens_gate.py v1 / v2 (>= 50% bridge top 10, <= 20% X), window [26, 36) = the 27B's [32, 44) x 52/64; the coarse grid every 3rd layer: 27, 30, 33. v1 opens D1; v2 informational (a failing v2 rewords to the bridge word where it stands).
controls:
