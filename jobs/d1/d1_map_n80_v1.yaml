id: d1_map_n80_v1
thread: D1
gpus: 1
mem_gb: 70
est_gpu_hours: 1.2
depends_on:
- d1_smoke_27b
- d1_rw_v1
command: 'uv run python scripts/statement_positions.py map --name d1_map_n80_v1 --why "D1 confirmatory map: n=80 per family
  at the layers where H-loc is decided (32-52)" --n 80 --layers 32 34 36 38 40 44 48 52'
examples_command: uv run python scripts/statement_positions.py examples --name d1_map_n80_v1
figures_command: uv run python scripts/statement_positions.py figures --name d1_map_n80_v1 --against d1_map_v1
question: Same as d1_map_v1, at n=80 per family and only layers 32-52 (where H-loc vs H-early-handoff is decided).
why_it_matters: 'Every "around" measure (copy split, lens read/write) was taken at the question tokens only. For bound bridges
  the bridge is stated in the context and only referred to in the question (lens reads BL there 7%; question copy moves
  BL only 10-17% at 32-40). If BL''s bridge is still in transit at the statement positions at layers 32-40, the "around"
  result for lookups (claim C2: memory through the J-space, prompt lookups around it) may be a location artefact; d1_parts_v1
  / d1_rw_v1 then test the J-space there. If BL has left the statements by 32, H-loc''s location premise fails at the question-token
  layers. This run is the confirmatory version of d1_map_v1''s transit verdicts: n=80 gives Wilson half-widths of about
  +-0.11 at 50% instead of +-0.17 at n=32, on the same rule.'
hypotheses:
  H-loc: 'BL (and BLR): a statement set (bind_bridge, bridge_word, lookup_x or context) is in transit (C copy flips >= 50%,
    above controls) at >= 1 of layers 32-40, while the question set flips <= 20% there (map_A8_v1: 5-10%)'
  H-early-handoff: BL's statement sets stop being in transit before layer 32 (last transit layer <= 28) and no set flips
    >= 50% at 32-40 except context (the bridge is spread over the lookup rows / question words)
  prior: 'Prior (Dan''s agent, before any run): H-loc 0.55 (the question copy only takes over BL at 48-52, so the bridge
    must sit somewhere upstream at 32-40), H-early-handoff 0.45. Sanity expectations: every B family''s bridge_word copy
    flips >= 90% at layer 0; RL/RR/R statement copies exact no-ops; countries B question set in transit by layer 40 (control_split
    map_v1: 81% at 40).'
decision_rule: 'Fixed before the run (module docstring of scripts/statement_positions.py). Transit cell: C''s copy gives
  X''s answer in >= 50% of cases and its Wilson 95% lower bound exceeds the upper bound of every control''s change rate
  (O''s copy where non-zero; the random-direction copy at the same per-position norms); zero-delta cases count as unchanged.
  Handoff per family and statement set = the last transit layer. H-loc''s location premise holds for BL if any statement
  set is in transit at a layer in [32, 44); it fails if none is. Run invalid if: identity changes the top token in any case,
  all0 misses C''s top token in > 2% of cases, any causality violation (a predicted-zero cell with a non-zero delta), or
  read-vs-greedy agreement < 99%.'
controls:
- 'O (off-path counterfactual: X''s and Z''s lockers / friends / rows / holders swapped) copied at the same cell, where
  its delta is non-zero: rules out "any change to these positions moves the answer"'
- 'random direction per position at the C copy''s norm (same cell): rules out a norm / disruption effect, and is the only
  control at the binding statements (O is exactly zero there)'
- 'cue-only families (RL, RR, countries R): C''s statement copies are exact no-ops by construction (verified numerically
  on every case and layer; read on the first 5 cases)'
- identity copy and C-at-every-position-at-layer-0 per case (hook checks); read vs greedy on the first 10 cases per family
- 'paired readers: BL/BR (BLR/BRL) share scenes, so their statement-position patches are identical'
n: 80 per family (BL, BR, RL, RR, BLR, BRL, countries R, B), layers 32 34 36 38 40 44 48 52
seeds:
- 0
notes: 'Not a replacement: d1_parts_v1 / d1_rw_v1 use d1_map_v1''s cells. Reads: d1_map_v1''s 67,996 x (8/14 layers) x (80/32
  cases) ~ 97k; at the measured 31 reads/s ~ 0.9 h + load; est 1.2 h. Rules and hypotheses copied from d1_map_v1 unchanged.'
