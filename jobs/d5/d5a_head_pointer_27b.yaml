id: d5a_head_pointer_27b
title: 'D5a: after a patch moves the lookup to another statement, does the late head (layer 51, head 22) look at the new statement? (and the J-lens''s word, on the same tokens)'
thread: D5
gpus: 1
mem_gb: 70
est_gpu_hours: 0.3
depends_on:
- d5a_head_pointer_smoke_27b
command: >-
  uv run python scripts/d5a_head_pointer.py manifest --name d5a_head_pointer_27b
  --why "D5a task b: does layer 51 head 22 (and the next 4 late heads) follow the pointer when pointer_swap's alt patch
  at layers 48 / 50 moves the answer, on d3v4_swap_main's pointer_v4 scenes; the J-lens's word read on the same tokens"
  --n 150 --families RL DL RR --competence d3v4_competence_27b
  && uv run python scripts/d5a_head_pointer.py run --name d5a_head_pointer_27b
  && uv run python scripts/d5a_head_pointer.py summarise --name d5a_head_pointer_27b
examples_command: uv run python scripts/d5a_head_pointer.py examples --name d5a_head_pointer_27b --k 3
figures_command: uv run python scripts/d5a_head_pointer.py figures --name d5a_head_pointer_27b
question: 'On unedited scenes layer 51 head 22 looks most at the asked statement from the last token (100% of held-out
  pointer_v1 scenes), but also on recall questions (95%), where the statement is not needed (d2_lookup_heads,
  UNVERIFIED). D3''s patch of the alt prompt''s last tokens / tokens after the question at layers 48 or 50 moves the
  answer to another statement of the org prompt (to the statement at the alt prompt''s slot, or the alt entity''s).
  Item by item: after the patch, does the head look most at the statement the new answer comes from (it follows the
  pointer), or still at the org prompt''s asked statement (it tracks something the patch does not change)? Is that
  better than the J-lens''s word read on the same tokens?'
why_it_matters: 'D5a asks for a pointer read-out next to the J-lens, which reads the word but not the pointer. A head
  whose attention follows the patched pointer item by item would be that read-out (one head''s attention, no fit) and
  would place the pointer in the head''s query at layer 51; a head that stays on the asked statement would mean its
  100% on unedited scenes reflects the bridge''s identity or position in the context, not the lookup in progress. The
  recall control separates the two: there the answer moves without any lookup.'
hypotheses:
  H_head_follows: 'memory → prompt, layer 51 head 22: on rows whose answer moved to another statement it looks most at
    the new answer''s statement (entity-cluster lower bound >= 60%), and on rows whose answer stayed at the asked
    statement (lower bound >= 80%). Prior 0.5'
  H_head_static: 'it stays on the asked statement when the answer moves (lower bound >= 60%). Prior 0.35'
  H_head_beats_lens: 'on the same moved rows the head names the new statement more often than the J-lens''s top entity
    at the last token (layer 50, what the head reads): paired entity-cluster lower bound > 0. Prior 0.6'
  H_controls: 'the same-entity patch and the random push change <= 10% of answers in each lookup family (d3v4_swap_main:
    0% [0, 1] for both). Prior 0.9'
decision_rule: 'Fixed before the run (scripts/d5a_head_pointer.py docstring "Decision rule", written into the manifest).
  Items: pointer_v4 main, d3v4_swap_main''s scenes (pointer_swap.sample_cases, seed 0, n=150 per topic, eligible in
  every family by d3v4_competence_27b): countries, animals, body (85 queried entities, 9 wordings), families memory →
  prompt (primary), named → prompt (reference), memory → memory (recall control). Edits per item: the org prompt''s
  block output at the last two tokens, or at every token after the question, replaced at layer 48 or at layer 50 by
  the alt prompt''s (dissoc), the same-entity prompt''s (same), or a random direction of the dissoc patch''s per-position
  norm added (rand); one batched forward with the unedited row. Rows: per item and edit; outcome kept / slot / word /
  other statement / off the prompt by pointer_swap''s role map; moved = slot, word or other statement, its new
  statement the org statement holding the new answer (memory → memory: the alt entity''s statement). Reader: the
  statement with the most attention from the last token (summed over its tokens) for each listed head, recomputed
  from the edited forward; the J-lens: the top of the five entity tokens at the last token, block 50. Primary cut:
  memory → prompt, dissoc, the four settings pooled; intervals by entity cluster (queried entity resampled within
  topic, 4,000 draws, seed 0), Wilson second; judged only with >= 35 moved and >= 35 kept rows. H_head_follows: moved
  rows new statement lower bound >= 60% AND kept rows asked statement lower bound >= 80%. H_head_static: moved rows
  asked statement lower bound >= 60%. Else neither. The other 4 heads: the same numbers, no verdict.'
controls:
- 'same-entity patch (the same entity at the same slot, the rest reshuffled): every hypothesis predicts no move; the
  head should stay on the asked statement'
- 'random push of the dissoc patch''s per-position norm: no move'
- 'memory → memory (recall questions): the answer moves without a lookup; does the head move to the bridge''s new
  statement anyway?'
- 'the J-lens''s word read on the same tokens and rows (paired)'
- 'check.json: a self-patch (the org prompt''s own state) leaves the logits unchanged; the answer roles agree with
  d3v4_swap_main on the same items and edits'
n: '1,350 org prompts (150 scenes per topic x 3 topics x 3 families), 4 patch settings x 3 sources each; moved rows
  expected (d3v4_swap_main, memory → prompt): ~23% / 81% (last tokens, layer 48 / 50), ~35% / 32% (tokens after the
  question): ~770 moved rows of 1,800'
seeds:
- 0
notes: 'Forwards: per item one of 3 rows (org, alt, same-entity block outputs at 48 and 50) and one of 14 rows (the
  unedited row, a self-patch check and 12 edits); ~2,700 forwards on ~85-token prompts, ~8 min, + model and lens load
  ~5 min. Heads: 51:22 (pre-registered), then 59:3, 59:1, 55:23, 59:21: the next by the same read-out on
  d2_lookup_heads (pointer_v1 scenes, held out from pointer_v4). Local 0.8B CPU smoke (qwen35_08b_smoke_d5a_cpu1,
  scratchpad; heads 23:0 and 23:5, patch layers 18 / 19, lens layer 22): every stage ran, the self-patch exact (0.0).
  Results: results/d5a_head_pointer/d5a_head_pointer_27b/.'
