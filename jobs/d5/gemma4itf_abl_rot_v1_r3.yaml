  BJ_TARGET=gemma-4-31b-it-full uv run python scripts/d1_precheck.py --gate gemma4itf_lens_gate_v2 --competence gemma4itf_d1_topics2_competence_r3 --min-topics 0
  && BJ_TARGET=gemma-4-31b-it-full BJ_FORMAT=chat BJ_ABL_BATCH=4 uv run python scripts/ablate_pilot.py --name gemma4itf_abl_rot_v1
