id: olmo3_7b_instruct_jpp_rw_dose_raw_v1
title: "Lens read / write dose on OLMo-3-7B-Instruct with our J++ (raw): does the lens write recall but not lookups? (finding 1)"
thread: D5
gpus: 1
est_gpu_hours: 0.15
mem_gb: 30
depends_on:
- olmo3_7b_instruct_jpp_lens_gate
command: >-
  BJ_TARGET=olmo-3-7b-instruct-jpp uv run python scripts/d1_precheck.py --gate olmo3_7b_instruct_jpp_lens_gate --competence olmo3_7b_instruct_d1_topics2_competence --min-topics 0
  && BJ_TARGET=olmo-3-7b-instruct-jpp BJ_FORMAT=raw uv run python scripts/read_write.py --name olmo3_7b_instruct_jpp_rw_dose_raw_v1
  --why "finding 1 (lens read / write dose) on olmo-3-7b-instruct (raw) with our J++: olmo3_7b_instruct_rw_dose_raw_v1's cells" --from-competence olmo3_7b_instruct_competence_raw_v1
  --n 80 --layers 15 18 21 24 --scales 0.5 1 2 4 8 16
question: In olmo-3-7b-instruct (raw), does our J++ read the bridge at the question tokens (top-10) and can the lens direction v_X - v_I write it (flips to X's answer), for countries (positive control) and for RL vs RR?
why_it_matters: 'Every lens result must use J++ (Dan, 23 Oct). Gate G3 (the lens must read AND write countries, which failed on Gemma) and slide 1''s push half (Qwen: RL read 95% but never written; RR written 30-36%), now with J++ at the plain J-lens run''s cells.'
hypotheses:
  H_gate: 'countries R/B: lens top-10 read >= 70% and lens flips >= 50% at some scale <= 4x with random <= 10% (27B: 95-98% flips at 2-8x) (copied from olmo3_7b_instruct_rw_dose_raw_v1)'
  H_rw_split: RL read >= 70% but lens flips <= random + 5 points at every scale; RR flips >= 20 points above random at its best scale (copied from olmo3_7b_instruct_rw_dose_raw_v1)
  H_rw_none: RL and RR alike (both written or neither) (copied from olmo3_7b_instruct_rw_dose_raw_v1)
decision_rule: Runs iff our J++ passes gate v1 (scripts/d1_precheck.py, --min-topics 0; only the gate matters here). GATE G3 passes iff the countries criterion in H_gate holds at layers 15/18/21 (single layer, best scale); layer 24 is descriptive only. read-not-written for RL holds iff H_rw_split; reported with Wilson CIs, n=80 (copied from olmo3_7b_instruct_rw_dose_raw_v1). Primary lens (Dan, 23 Oct ~00:30); ours on 64 prompts for Qwen3-32B and OLMo, Zach's for Gemma and Muse; no silent switch. The plain J-lens run is reported beside it, labelled "plain J-lens".
controls:
- random direction at the same norm per scale
- C's full copy (the upper bound of a write)
- X's rank in the clean readout (read floor)
- countries as the positive control
- 'the plain J-lens run olmo3_7b_instruct_rw_dose_raw_v1, labelled "plain J-lens"'
n: 80 per family (BL, BR, RL, RR; countries R, B)
seeds:
- 10000*case+layer (random directions)
- 0
notes: "Mechanical copy of olmo3_7b_instruct_rw_dose_raw_v1 (Dan, 23 Oct ~01:30: the full J++ lens table); not opened before Dan's predictions. Only BJ_TARGET and the name change: the same raw format, competence run, layers and scales. No examples or figures stage: read_write.py has none, as the source. Waits for the OLMo J++ pin (target olmo-3-7b-instruct-jpp)."
