question: In olmo-3-7b-instruct (chat), does its J-lens read the bridge at the question tokens (top-10) and can
  the lens direction v_X - v_I write it (flips to X's answer), for countries (positive control) and for RL vs RR?
why_it_matters: 'Gate G3 (the lens must read AND write countries, which failed on Gemma) and the ladder''s second
  measure (Qwen: RL read 95% but never written; RR written 30-36%). D5b / claim C2 (memory vs prompt: recall needs
  the J-space, prompt lookups go around it). If the split is present in the base model, post-training is not what
  creates it (the ''around'' route is a pretraining mechanism, e.g. binding/lookback pointers); if it first appears
  at SFT/DPO/RLVR, the split is a property of post-trained chat models. A null on Instruct with a passing gate says
  the Qwen result does not generalise to OLMo.'
hypotheses:
  H_gate: 'countries R/B: lens top-10 read >= 70% and lens flips >= 50% at some scale <= 4x with random <= 10% (27B:
    95-98% flips at 2-8x)'
  H_rw_split: RL read >= 70% but lens flips <= random + 5 points at every scale; RR flips >= 20 points above random
    at its best scale
  H_rw_none: RL and RR alike (both written or neither)
decision_rule: GATE G3 passes iff the countries criterion in H_gate holds at layers 15/18/21 (single layer, best
  scale); layer 24 is descriptive only. read-not-written for RL holds iff H_rw_split; reported per checkpoint with
  Wilson CIs, n=80.
controls:
- random direction at the same norm per scale
- C's full copy (the upper bound of a write)
- X's rank in the clean readout (read floor)
- countries as the positive control
n: 80 per family (BL, BR, RL, RR; countries R, B)
seeds:
- 10000*case+layer (random directions)
- 0
