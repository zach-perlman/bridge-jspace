id: muse30b_abl_rot_v1
title: "J-space removal on Muse Glimmer 30B with Zach's J++: does recall break while lookups survive? (finding 1)"
thread: D5
gpus: 1
est_gpu_hours: 1.0
mem_gb: 75
depends_on:
- muse30b_lens_gate_v2
- muse30b_competence
- muse30b_competence_extra
command: >-
  BJ_TARGET=muse-glimmer-30b uv run python scripts/d1_precheck.py --gate muse30b_lens_gate_v2 --competence muse30b_d1_topics2_competence --min-topics 0
  && BJ_TARGET=muse-glimmer-30b BJ_FORMAT=chat BJ_ABL_BATCH=4 uv run python scripts/ablate_pilot.py --name muse30b_abl_rot_v1
  --why "finding 1 (J-space removal) on Muse with Zach's J++: abl_rot_v1 at the 27B's layers scaled by depth (x 52/64: 26 29 33)" --n 100 --layers 26 29 33 --comp-main muse30b_competence_chat_v1
  --comp-computed none --countries-build --rotated --no-random
question: In Muse Glimmer 30B (chat format), does removing the J-space (25-atom OMP over Zach's J++'s letter-token vectors) at layers 26/29/33 break recall chains (BR, RR) but not prompt lookups (BL, RL), while the same-size rotated removal leaves every family intact?
why_it_matters: 'Finding 1 (J-space removed: recall 19-22% right, lookup 99%) rests on Qwen3.6-27B alone. Muse is a sixth model from another lab (Meta), with every test the other five have.'
hypotheses:
  H_split: 'J-space removal at 26/29/33 leaves BL/RL >= 90% and drops BR/RR by >= 30 points (copied from olmo3_7b_instruct_abl_rot_chat_v1, H_pre, for one model)'
  H_none: 'no gap >= 20 (copied from olmo3_7b_instruct_abl_rot_chat_v1, H_none)'
  prior: 'Prior (Dan''s agent, before any run): H_pre 0.35, H_none 0.3 (copied from olmo3_7b_instruct_abl_rot_chat_v1)'
decision_rule: 'Runs iff Zach''s J++ passes gate v1 (scripts/d1_precheck.py, --min-topics 0: only the gate matters here). GATE G2: the rotated removal keeps accuracy >= 0.90 on every family/step (items right unedited); else the J-space rows are not interpreted (Gemma''s failure mode). The random-dictionary removal is dropped: it does not fit next to a 27B-size model on an 80 GB GPU (d2_abl_read_*_27b_v2: --no-random), so G2 reads the rotated control alone. Split measure: gap = mean(BL, RL) - mean(BR, RR) accuracy under J-space removal, clean prompts; ''present'' if the paired-bootstrap 95% CI lower bound >= 20 points, ''absent'' if the upper bound <= 10, else ''inconclusive'' (copied from olmo3_7b_instruct_abl_rot_chat_v1). Layers: the 27B''s 32/36/40 x 52/64, rounded half up as muse30b_d4_where (26, 29.25, 32.5 -> 26 29 33). Primary lens (Dan, 23 Oct ~00:30): ours on 64 prompts for Qwen3-32B and OLMo, Zach''s for Gemma and Muse; no silent switch.'
controls:
- 'rotated: the J-space fit turned by a fixed random rotation (exact same norm removed, position by position)'
- 'hop rows: the last step alone, to separate the step from the chain'
- 'countries R/B (built now from exp09 eligibility on this model): word answers, a known J-space-heavy family'
n: 100 per family (BL, BR, RL, RR clean + hop; countries R, B)
seeds:
- 888
- 0
notes: "Mechanical copy of olmo3_7b_instruct_abl_rot_chat_v1 (the 27B's ablate_pilot/abl_rot_v1 on a new target; --no-random and a smaller batch as the 27B's own copies on this box) (Dan, 23 Oct ~01:30: the full J++ lens table); not opened before Dan's predictions. Cases from muse30b_competence_chat_v1 (muse30b_competence_extra, lens-free). Depends on muse30b_competence only for the precheck's competence file. Zach's caveat: his Muse J++ is weak in the middle layers. Memory: Muse's weights are larger than the 27B's; an OOM is possible (the remedy is a design change for Dan). No examples or figures stage: ablate_pilot.py has none, as the source."
