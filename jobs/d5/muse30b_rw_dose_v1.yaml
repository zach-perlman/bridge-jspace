id: muse30b_rw_dose_v1
title: "Lens read / write dose on Muse Glimmer 30B with Zach's J++: does the lens write recall but not lookups? (finding 1)"
thread: D5
gpus: 1
est_gpu_hours: 0.4
mem_gb: 75
depends_on:
- muse30b_lens_gate_v2
- muse30b_competence
- muse30b_competence_extra
command: >-
  BJ_TARGET=muse-glimmer-30b uv run python scripts/d1_precheck.py --gate muse30b_lens_gate_v2 --competence muse30b_d1_topics2_competence --min-topics 0
  && BJ_TARGET=muse-glimmer-30b BJ_FORMAT=chat uv run python scripts/read_write.py --name muse30b_rw_dose_v1
  --why "finding 1 (lens read / write dose) on Muse with Zach's J++: dose_v1 at the 27B's layers scaled by depth (x 52/64: 26 29 33)" --from-competence muse30b_competence_chat_v1
  --n 80 --layers 26 29 33 --scales 0.5 1 2 4 8 16
question: In Muse Glimmer 30B (chat), does Zach's J++ read the bridge at the question tokens (top-10) and can the lens direction v_X - v_I write it (flips to X's answer), for countries (positive control) and for RL vs RR?
why_it_matters: 'Gate G3 (the lens must read AND write countries, which failed on Gemma with the base-model lens) and slide 1''s push half (Qwen3.6-27B: RL read 95% but never written; RR written 30-36%; read_write/dose_v1), on a sixth model from another lab.'
hypotheses:
  H_gate: 'countries R/B: lens top-10 read >= 70% and lens flips >= 50% at some scale <= 4x with random <= 10% (27B: 95-98% flips at 2-8x) (copied from olmo3_7b_instruct_rw_dose_chat_v1)'
  H_rw_split: RL read >= 70% but lens flips <= random + 5 points at every scale; RR flips >= 20 points above random at its best scale (copied from olmo3_7b_instruct_rw_dose_chat_v1)
  H_rw_none: RL and RR alike (both written or neither) (copied from olmo3_7b_instruct_rw_dose_chat_v1)
decision_rule: Runs iff Zach's J++ passes gate v1 (scripts/d1_precheck.py, --min-topics 0; only the gate matters here). GATE G3 passes iff the countries criterion in H_gate holds at layers 26/29/33 (single layer, best scale). read-not-written for RL holds iff H_rw_split; reported with Wilson CIs, n=80 (copied from olmo3_7b_instruct_rw_dose_chat_v1). Layers - the 27B's 32/36/40 x 52/64, rounded half up as muse30b_d4_where. Primary lens (Dan, 23 Oct ~00:30); ours on 64 prompts for Qwen3-32B and OLMo, Zach's for Gemma and Muse; no silent switch.
controls:
- random direction at the same norm per scale
- C's full copy (the upper bound of a write)
- X's rank in the clean readout (read floor)
- countries as the positive control
n: 80 per family (BL, BR, RL, RR; countries R, B)
seeds:
- 10000*case+layer (random directions)
- 0
notes: "Mechanical copy of olmo3_7b_instruct_rw_dose_chat_v1 (the 27B's read_write/dose_v1 on a new target) (Dan, 23 Oct ~01:30: the full J++ lens table); not opened before Dan's predictions. Cases from muse30b_competence_chat_v1 (muse30b_competence_extra, lens-free). Depends on muse30b_competence only for the precheck's competence file. Zach's caveat: his Muse J++ is weak in the middle layers. No examples or figures stage: read_write.py has none, as the source."
