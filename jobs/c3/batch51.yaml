  ## Dumbest ways to be wrong, to check in the verify pack

  The 4- and 8-locker scenes must keep every locker sentence at the same token length (so slots are positions, not lengths); the DAS pairs must hold the answer digit fixed across the pair (a position counterfactual, not a value one); d* must be read on held-out entities, not on the fit half; the midpoint swap's norm must be reported (half of a full swap at 2× is one real change's size, so a null result could be a dose effect — add a 4× midpoint arm); the random R's IIA at k = 2 was 0.30 in 49.8, so the random bar is per k, not one number.
