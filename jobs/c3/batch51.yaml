brief: |
  # Batch 51 — launch instruction for the coder agent (Dan, 28 Oct 17:10 Paris)

  Launch everything below now, in parallel on the three boxes, after what is already running on each (Z1 Muse, Z2 27B / Muse, Z3, 49.2 Muse r5 stay as queued). Freeze is Thursday ~16:00 Paris; anything that lands after it goes to the supplement with a "landed after freeze" line, not to the main page. Conventions of batch 47 throughout: results are pulled **sealed** and opened only after Dan's Q51.x lines are committed; matched random controls everywhere; gate 0.80 per reader; cluster bootstrap over bridge items (10k, seed 0); verify pack per run (5 rendered prompts per model, 10 random rows per arm, the rule and the verdict in `verdict.md`). "Swap" = adding or exchanging a part of the state. No new models except 51.6, no reruns of 49.x, no README edits from 51.x before opening. Do not share Z1 numbers with Zach before the formal opening.

  ## 0. Do first (≤ 45 min, before any GPU job)

  1. `jobs/c3/batch51.yaml` with the seven specs below; one run name per model per test (`x51_<test>_<model>`).
  2. Append **Q51.1–Q51.7** to `predictions/2026-10-28_dan.md` as questions with options only (text in §3). Dan writes his lines; nothing opens before that.
  3. Per-box queues (9B first in every test — it gives the early read):
     - **mats:** 51.1 (9B → 27B → Muse) → 51.3 (9B → 27B → Muse)
     - **speedup:** [Z2 as queued] → 51.7 (9B → 27B) → 51.2 (9B → Muse → 27B) → 51.6 only if idle after 02:00
     - **helper:** [49.2 Muse r5, Z3 as queued] → 51.5 (9B → 27B) → 51.4 (9B → Muse → 27B)
     If a box idles, pull the next unstarted model of the highest-ranked test from any column (rank order: 51.1, 51.7, 51.5, 51.3, 51.2, 51.4, 51.6).
  4. CPU items of §2 run on the mats box CPU in the given order while GPUs are busy.
  5. Status to Dan at 19:30, 23:00, Thu 08:00 and Thu 13:00: what is sealed, what is running, ETA, anything that failed a gate or OOMed and what you changed.

  ## 1. The seven tests

  ### 51.1 Dose curves with a matched random part at every dose — 9B, 27B, Muse (~0.5 GPU-h each)

  - **Items, layer, operation:** 49.1's (main test, locker-first items, L = 12 / 32 / 26; Δ = h_S − h_O at the bridge word; J++ part = 25 OMP atoms; "the rest" = Δ minus the J++ part; the address U as in 49.1).
  - **Arms:** α ∈ {0.5, 1, 1.5, 2, 3} at β = 0 (the J++ part alone, scaled), each with a random part of the same share at the same gain; β ∈ {0.25, 0.5, 0.75, 1, 1.5} at α = 0 (the rest alone), with and without the address, each with a random part of the same share. Plain-text loss at the bridge word per arm. Read both readers (lookup, recall) as in 49.1.
  - **Rules, fixed in advance.** (i) "The lookup is blind to the J++ part": switch minus random ≤ 0.10 at every α whose plain-text loss stays under 2× the whole change's — on all three. (ii) "The recall reads the J++ part above its share": at the first α where the J++ part alone switches ≥ 0.3, J minus random ≥ 0.2 — per model. (iii) "Together only" (Muse): (1,1) from 49.1 ≥ 0.8 while the best single-part dose under the loss bar stays ≤ 0.3.
  - **Output:** one figure, four curves per model (two readers × two parts), random dashed, the loss bar marked; a per-model, per-reader fit logit(switch) = a·α + b·β (+ c·αβ), report b/a and whether c is needed. The 49.1 heatmaps move to the supplement.

  ### 51.7 Z1 on the full carrier: the change at the bridge token at every layer ≤ L — 9B, 27B (~1 GPU-h each)

  - **Why:** on Zach's passages the whole change at one layer redirects 0.57 / 0.38 of lookups (fact-after items 0.36 / 0.11; fact-first 0.78 / 0.67). The order and token-map results predict it: with text after the bridge name, later tokens read the name below L. 47.4's before-L arm tests this and lets the split be read on the full carrier.
  - **Items:** Z1's items and strata (fact-first / fact-after), same gate, same lens files, same layers.
  - **Arms (as the ladder defines per-layer removal):** overwrite the bridge name's last token at every layer l ≤ L with h_S,l (**whole before-L**); with h_S,l minus the J++ part of Δ_l using layer l's own 25 atoms (**without J++ before-L**); with h_S,l minus a random part of Δ_l of the same share (**random before-L**). Δ_l from the clean S and O runs. Z1's one-layer arms sit beside from the stored rows, no rerun. Readers K (lookup) and M (recall). Plain-text loss per arm.
  - **Rules, fixed in advance.** (i) "The slice explanation": the whole before-L raises the lookup's switch on fact-after items by ≥ 0.3 over the one-layer whole, and on fact-first brings the lookup within 0.10 of the recall. (ii) On the full carrier, per model and reported per stratum with fact-first decisive: recall extra loss − lookup extra loss ≥ 0.3 and lookup ≤ 0.10 → "the split holds on the full carrier"; lookup ≥ 0.20 → "the lookup follows the lens on the full carrier"; else in between. (iii) If fact-after lookups stay under 0.5 even under whole before-L: "the link is made away from the bridge token" — only then the window-patching read (the bridge token at layers ≤ L plus the bridge's fact sentence), 50 items, descriptive.
  - **Output:** one figure per model: stratum × reader, one-layer vs before-L, three arms.

  ### 51.5 The anatomy by depth on Zach's passages — 9B, 27B (~1 GPU-h each)

  - 47.8's sweep (every 2nd layer) on Z1's items, fact-first stratum first; the whole change at the bridge name's last token per layer; K and M readers; extra loss without J++ per layer (one-layer removal, the layer's own atoms); no slot probe (no slots); add the identity / position split per layer only if Z3 shows position answers.
  - **Rule, fixed in advance:** "the same read window as ours" if the last layer where each reader's switch ≥ 0.3 lies within 4 layers of ours (9B: both readers to ~L16, the recall to L24; 27B: from 49.4). Report against Zach's swap window (L4–20, gone by L25).
  - **Output:** one figure in the 6b layout, his passages beside our scenes.

  ### 51.3 DAS at scale — 9B first, then Muse, 27B (~2 GPU-h each)

  - **Method:** 48.1's custom DAS unchanged (orthonormal R, interchange h ← h_O + RRᵀΔ at the bridge word at L; same optimizer and early stopping on dev IIA).
  - **Pairs:** identity — every locker-first scene where the whole change switches the given reader, pooled from the main test, the clean design and the routes scenes (target 300–600 pairs per reader; entities held out 60 / 20 / 20); address — routes position counterfactuals over all slot pairs (≥ 300 pairs).
  - **k:** recall {4, 16, 64, 128}; lookup {4, 16}; address {2, 4, 8}.
  - **Rules:** 48.1's and 49.8's unchanged, plus: "no low-dimensional recall subspace at this token and layer" if the recall's own-IIA < 0.5 at k = 128 with ≥ 300 pairs — a result, not a failure to converge.
  - **Report:** own-IIA per k; cross-IIA (lookup subspace on the recall and back; address subspace on each reader); the lookup subspace's energy in U / W_E / J++ / outside; the address subspace's overlap with U and with 47.2's W.

  ### 51.2 Joint head ablation under the address swap — 9B, Muse, 27B (~1 GPU-h each)

  - **Items and arms:** 49.7's (the address swap μ_k − μ_j at 2×, locker-first scenes). Attention layers only; on the 9B note the DeltaNet layers in the report.
  - **Ranking:** by each head's attention move under the swap, on a fit half; evaluate on the other half.
  - **Ablation:** mean-ablate the head's output at the last token and at the question tokens; top k ∈ {1, 3, 5, 10}, all heads of the best layer, the top 10 across layers — each under the swap; control: a random set of k heads from the same layers.
  - **Read:** the lookup's switch to the swapped-in slot; identity answers; the recall.
  - **Rules, fixed in advance.** "A small set carries the dereference": some k ≤ 10 cuts the position switch by ≥ 0.5 of its swap value while identity answers and the recall move ≤ 0.10 and the random set cuts ≤ 0.15. "Distributed": all heads of the best layer cut < 0.3. CPU beside: per item, summed attention move vs switched (logistic fit, AUC).

  ### 51.4 Does the address travel? The swap at the last token — 9B, Muse, 27B (~0.5 GPU-h each)

  - **Items:** routes C0 scenes; layers L and L + 4.
  - **Arms at the last token:** μ_k − μ_j with U fit at the bridge word (not refit), doses 1× and 2× as in the pointer swap; the same with U_last fit on the last token's states (fit half, evaluate on the other); random vectors of the same norm. Report the swap's norm relative to the last token's state norm at L.
  - **Read:** lookup share answering slot k; the recall beside; the slot probe at the last token by layer from cached states.
  - **Rules, fixed in advance.** "The code travels": the bridge-fit swap sends ≥ 0.3 of lookups to slot k (random ≤ 0.05). "Re-encoded on copy": bridge-fit ≤ 0.10 while last-token-fit ≥ 0.3. "Not at the last token": both ≤ 0.10 while the probe reads the slot there ≥ 0.8.

  ### 51.6 Optional — Lightning, the main test (speedup, only if idle after 02:00; ~2 GPU-h)

  - Step 1 (dev, 60 scenes): the whole change's switch rate per reader by layer, every 2nd layer; rule fixed in advance: pick the earliest layer where both readers switch ≥ 0.3. Step 2: the main test's three arms at that layer, 200 scenes. If no layer passes step 1: report "the bridge word does not redirect the lookup at any layer on Lightning", no step 2.

  ## 2. CPU tonight (no GPU; in this order)

  1. **Z1 table** from the stored outcomes (9B, 27B; Muse when it lands): reader × arm × stratum with cluster-bootstrap intervals over passages; per-relation split; the 9B's v2nb rows separate from v2. Keep it sealed with Z1.
  2. **Route split of the lookup's J++ dependence** (all three, from the routes runs): extra loss without J++ on identity-route vs position-route items.
  3. **The recall under the address swap by dose** (pointer-swap data): share of recalls that change and share naming the swapped-in slot's item at 1× / 2× / 4×.
  4. **49.3 concatenation probe** (cached per-token states): all tokens of the locker sentence concatenated, ridge, entities held out; ≥ 0.85 vs chance decides the E10/E11 sentence.
  5. **49.1 additive vs conjunctive fit** per model (feeds the 51.1 figure).

  ## 3. Q51.x — questions for the predictions file (options only; Dan writes the answers)

  - Q51.1: the lookup blind to the J++ part at every dose — 9B / 27B / Muse; the recall reads it above its share — per model; Muse "together only" — yes / no.
  - Q51.2: a small set (k ≤ 10) / distributed — per model.
  - Q51.3: a recall subspace found at ≤ 128 with ≥ 300 pairs — per model; the lookup subspace mostly address / mostly outside everything named; the learned address overlaps U ≥ 0.6 — yes / no.
  - Q51.4: travels / re-encoded on copy / not at the last token — per model.
  - Q51.5: the read window on his passages ends within 4 layers of ours — 9B / 27B.
  - Q51.6: a layer passes step 1 on Lightning — yes / no; if yes, the split holds there — yes / no.
  - Q51.7: the slice explanation (fact-after lookups rise ≥ 0.3 under before-L) — 9B / 27B; on the full carrier: split holds / lookup follows the lens / in between — 9B / 27B.

  ## 4. Thursday

  09:00–13:00 hand check of the A-claim numbers (main gap ×3, order, routes, address remove / swap, 47.5, 47.1 27B, 47.8 9B) through the dashboard, 10 items each, into VERIFIED.md, plus 49.5's row-for-row. 13:00 final pulls. 16:00 freeze: what is opened and checked goes on the page; the rest to the supplement, labelled. Friday: slides only.
addendum_2: |
  # Batch 51 — addendum 2 (Dan, 28 Oct 18:15): 51.10 Does the intermediate pass through J-space? Read / write statistics per position, per reader

  **Why.** Neel: it is strange that the intermediate does not go through J-space. Our "the lookup is blind to the J++ part" is a statement about the *bridge token*. The workspace paper's claim is about where a multi-step computation's intermediate lives; the latent two-hop literature (Yang et al. 2024; Biran et al. 2024) finds the bridge entity at the **last token** in the middle layers. We have two second hops with the same first hop: the recall (parametric: entity → fact) and the lookup (in-context: entity → its locker). So the question is asked at the positions where the second hop is made — the question's "pick" token and the last token — and answered with read and write statistics per reader.

  **Models, items, layers.** 9B (every 2nd layer L2–L38), 27B and Muse (every 4th layer, plus L and L ± 2). Main-test locker-first items (200 per model after the gate), both readers; O / S pairs as in the main test (the question text is identical in O and S, so the last token's state differs only through the context).

  **Positions.** (P1) the bridge word; (P2) the question's "pick" token; (P3) the last token (before the answer).

  **Read (cached states, mostly CPU).** At each position and layer, per reader's prompt:
  - the lens readout: the rank of the bridge entity's first token in the J-lens scores at that position (Zach's read directions / W_g rows); report the share of items with the entity in the top-1 and top-5 by layer; the same for the *other* entity on the S prompt;
  - a linear probe for the bridge entity (scene-level split, classes = the entities of the family; chance = 1/classes) on three inputs: the projection onto the span of his top-10 read directions at that token and layer (**through the lens**), the full residual (**readable at all**), the complement (**outside the lens**);
  - the layer at which the answer digit becomes top-1 in the plain logit lens at P3 (the read must precede it to count as an intermediate).

  **Write (GPU).** At P2 and P3 (and P1 beside, so every position has the same operations), one layer at a time:
  - **his J-part swap:** replace the top-10 read directions' coordinates of h_O with those of h_S at that position and layer (Zach's jswap definition, his code path);
  - **the J++ part of the change added:** h_O + the OMP-25 part of (h_S − h_O) at that position, gain 1 and 2 (our 49.1 definition);
  - **a random part of the same share** for each of the two above;
  - **the whole state patched** (h_O ← h_S at that position and layer): the upper bound for that position.
  Read both readers: switched to S's answer. Plain-text loss per arm.

  **Remove (GPU, P3 only, light).** His knock-out at the last token only (top-10 per layer over the band around the read peak) and the J++-25 removal at the last token at one layer: cost per reader against matched random. (The bridge-token removal exists: 47.5, 49.2.)

  **Rules, fixed in advance (per reader, per model).**
  - "The intermediate is in J-space at the last token" (read): the through-the-lens probe ≥ 0.8 and lens top-5 ≥ 0.5 at some layer before the answer digit's layer, while the full-residual probe ≥ 0.9 there.
  - "Writable through J-space at the last token": at the layer of the read peak (or the best layer), his swap or the J++ part of the change (gain ≤ 2) switches ≥ 0.5 of what the whole-state patch switches at that layer, with the random part ≤ 0.10.
  - "Readable, not used": read holds, write fails.
  - "Routes around J-space": read fails at every layer before the answer (through-the-lens probe < 0.5 while the full-residual probe ≥ 0.9 at some layer — i.e. the entity is there, outside the lens), and write fails.
  - "Not represented at the last token at all": the full-residual probe < 0.5 at every layer before the answer — then the second hop is made elsewhere (P2 or the context), and the P2 rows decide.
  Same clauses at P2. P1 reports the swap for both readers beside 49.1's J(α, 0) (the bridge-token write).

  **Output.** One figure per model: rows P1 / P2 / P3, columns layers, panels lookup / recall; heat = through-the-lens probe accuracy, contour or marker = swap switch share, a vertical line at the answer digit's layer; and one summary table: per reader, the first layer the intermediate is lens-readable at P3, the peak swap switch at P3 vs the whole-state patch, and the same at P2. **This is the direct answer to Neel's comment**: either the lookup's intermediate passes through J-space at the question even though the bridge word's identity does not, or the in-context hop routes around the lens end to end.

  **Cost.** 9B ~1 GPU-h; 27B, Muse ~2 GPU-h each; read statistics ~30 min CPU per model on cached states.

  **Queue.** 51.10 ranks above 51.2 and 51.4. Consolidated rank: 51.1, 51.7, 51.5, 51.10, 51.8, 51.3, 51.9, 51.2, 51.4, 51.6. Per box: mats 51.1 → 51.3; speedup 51.7 → 51.10 (9B → 27B) → 51.8 → 51.2; helper 51.5 → 51.10 (Muse) → 51.9 → 51.4; 51.6 last anywhere.

  **Q51.10 (options; per reader, per model):** in J-space at the last token (read and write) / readable, not used / routes around J-space / not represented at the last token. And at the "pick" token: the same four.

  **Dumbest ways to be wrong, to check in the verify pack.** The probe classes leak through the question text (identical in O and S — fine) or through the locker sentences' order (hold scenes out, not items); the lens readout at P3 in late layers is the digit, not the entity (the answer-layer line handles it); his swap at P3 moves the answer by moving the *digit* directly rather than the entity (check: on the recall, a swap that switches should switch to S's fact, not to any digit — report "switched to S's answer" vs "changed to another digit" separately); the whole-state patch at P3 at late layers switches trivially (it is the upper bound per layer, read the ratio at the read peak, not the max).
addendum_3: |
  # Batch 51 — addendum 3 (Dan, 28 Oct 19:00): 51.11 What is the address, independent of how we built it? Dimension, agreement of methods, geometry

  **Why.** The finding is worded "four directions at the bridge word (class means over slots, layout removed)". Four is our construction (five slot classes → rank 4), not a property of the model. The general statement should say what the code is: how many dimensions it takes as the number of slots grows, whether three independent methods find the same subspace, and whether the slots are coded as categories, as an order, or as a line. Each outcome below has its wording fixed in advance.

  **Models.** 9B first (all parts), Muse (parts 1–3), 27B (part 2 only, reduced). Layer L as fixed. Entities held out everywhere (fit / test halves by bridge entity).

  ## Part 1. Dimension vs number of slots (~3 GPU-h on the 9B)

  - **Scenes.** Locker-first routes-style scenes with S ∈ {3, 4, 6, 8} locker sentences (3 and 6 exist; generate 4 and 8 with the same generator, same token-length alignment). Position counterfactual pairs: the bridge item's locker sentence moved to another slot, digits kept (the lookup's answer unchanged, the position changes); ≥ 300 pairs per S, all ordered slot pairs represented.
  - **Three constructions of the code at the bridge word:**
    - **mass-mean U_S**: class means over the S slots, layout removed → rank S − 1 (the current method);
    - **label-free P_S**: top-k principal components of {h_S′ − h_S} over the pairs (no labels);
    - **learned R_S**: DAS, orthonormal R ∈ R^(d×k), interchange h ← h_O + RRᵀΔ trained so the lookup answers the position route; k ∈ {1, 2, 3, 4, 5, 7}.
  - **Read, per S and k:** own-IIA of R_S,k on held-out pairs; the same interchange through the top-k of P_S; the swap through U_S (its native rank). Random R and shuffled-pair R as nulls.
  - **Minimal dimension** d*(S) = the smallest k with own-IIA ≥ 0.80 (random ≤ 0.15).
  - **Rules, fixed in advance.**
    - "An ordinal (low-dimensional) code": d*(S) ≤ 2 for every S up to 8.
    - "One dimension per slot": d*(S) ≥ S − 2 for every S and d*(8) ≥ 5.
    - "Low-dimensional but growing": d*(S) between 3 and S − 3 at S = 8, monotone in S.
    - Else: in between.
  - **Output:** one figure: own-IIA vs k, one curve per S, random dashed; a table d*(S).

  ## Part 2. Do three methods find the same code? (~1 GPU-h per model)

  - At S = 6 (and S = 3 beside): the three bases at their working dimension (U_6 rank 5; P_6 top-d*; R_6 at d*).
  - **Geometric agreement:** pairwise mean cos² of principal angles between the three subspaces, against random subspaces of the same dimensions (≈ k/d).
  - **Functional agreement (the one that matters):** the swap μ_k − μ_j at 2× sent through each basis's projector (U Uᵀ(μ_k − μ_j), P Pᵀ(…), R Rᵀ(…)) → share of lookups answering slot k; **cross-removal:** remove U from the state, then swap through R: does the swap still work? Remove R, swap through U. If the subspaces coincide functionally, each removal kills the other's swap.
  - **Rules, fixed in advance.**
    - "One code, three bases": every projected swap reaches ≥ 0.6 of the whole swap's effect, and each cross-removal cuts the other's swap by ≥ 0.6.
    - "Partly overlapping codes": projected swaps reach ≥ 0.6 but cross-removals cut < 0.3 (the function survives in the other basis: redundant directions).
    - "Different codes": a projected swap through P or R reaches < 0.3.
  - **Output:** a 3 × 3 table per model: rows = removed basis (none / U / P / R), columns = swap basis; cell = share of lookups to the target.

  ## Part 3. Geometry: categories, an order, or a line? (~0.5 GPU-h on the 9B and Muse; CPU for the means)

  - **Means (CPU, S = 6 and 8):** pairwise distances between slot means ‖μ_i − μ_j‖ vs |i − j|; the first principal component's score per slot; the angle structure (a simplex has equal pairwise distances; a line has distance ∝ |i − j|; a curve has distance growing with |i − j| but saturating).
  - **Interpolation swaps (GPU):** from a bridge item in slot 1, add 2 × ((μ_3 − μ_1)/2) (the midpoint toward slot 3) and 2 × ((μ_5 − μ_1)/2); from slot 6 toward slot 1 the same. Read: which slot the lookup answers: the midpoint slot (2 / 3), the far slot, the near slot, or the original. Random vectors of the same norm beside.
  - **Rules, fixed in advance.**
    - "A metric order (the code is a line or a curve)": midpoint swaps send ≥ 0.3 of lookups to the midpoint slot, from both ends.
    - "Categories": midpoint swaps send < 0.1 to the midpoint slot while the full swaps reach ≥ 0.4 of the target.
    - "First vs the rest" (the old reading): midpoints work only from slot 1.
  - **Output:** one figure: the slot means in the first two principal components, with the midpoint swap outcomes as arrows.

  ## Part 4. Wording fixed in advance, by outcome

  | Part 1 | Part 2 | Part 3 | The finding's wording |
  |---|---|---|---|
  | ordinal (≤ 2 dims) | one code | metric order | "The lookup's position route runs through a **two-dimensional slot code** at the bridge word that orders the locker sentences; any of three methods finds it; it can be removed, added alone and swapped, and the lens cannot read it." |
  | one per slot | one code | categories | "… through a **one-code-per-slot address** at the bridge word (one dimension per locker sentence), found alike by class means, by counterfactual differences and by a learned subspace; removable, swappable, not readable by the lens." |
  | growing | partly overlapping | any | "… through a **low-dimensional slot code** (about k dimensions for S slots) that several bases span in part; the hand-built directions are one basis of it." |
  | any | different codes | any | "Our four directions are one of several subspaces that move the lookup by slot; the code is not a single subspace at this layer" (and the address claims are re-graded to the mass-mean construction only). |

