id: x50_z2_muse_s
title: "Batch 50 Z2 on Muse L26 and L36: our change-removal on Zach's jsuite v2 passages, never-named bridge (M start, the bridge only described in the question). The question describes another entity of the passage; Delta = h_S - h_O at the description's last token, per reader (K = lookup, M = recall); whole / without J++ / without a random part of its share; description competence step (47.3's); sealed"
thread: C3
gpus: 1
mem_gb: 75
est_gpu_hours: 0.5
command: >-
  BJ_TARGET=muse-glimmer-30b BJ_DEVICE_MAP= uv run python scripts/x50_zach.py run --part z2 --name muse30_x50_z2
question: >-
  When the bridge is never named and must be computed from a description in the question ("the country that is home to
  Machu Picchu"), does the lookup of the computed bridge (K final) still go around the J++ part of the change at the
  description's last token while the recall (M final) needs it, or is the computed bridge handed through the lens?
why_it_matters: >-
  The one that matters most (batch 50): his swap site, three operations on one site (his swap: sufficient; his erase:
  not necessary; our removal from the change, followed in a conflict). Our 47.3 said 9B / Muse (a), 27B (a'); if his
  passages agree, the 27B's lens-leaning lookup is a model property, not a scene artefact.
hypotheses:
  Q50.2: "Dan's answer in predictions/2026-10-28_dan.md (Q50.2); not committed when this spec was written, so the run is sealed: no verdict in the job (scripts/x50_zach.py verdict refuses until the answer is committed)."
decision_rule: >-
  Fixed in advance (jobs/c3/batch50.yaml, Z2, verbatim): per model, the 47.3 rule: (a) the split holds: gap >= 0.3,
  lookup <= 0.10; (a') the computed bridge is handed through the lens: lookup >= 0.20; (d) in between.
  As computed (fixed before any run; Dan may override before it). Items: v3 is not on the box, so Zach's v2 facts
  module, jsuite_v2_test_chat (seed 2601, his main set), and jsuite_v2nb_test_chat (his second seed) when fewer than 200
  passages are eligible on the main set (expected: the main set alone cannot reach 200). A passage = one of his M-start
  scenes: its MK item (every entity's true fact stated, the bridge named only in a neutral or fact sentence, never in
  the question: our lookup, reader K) and its MM item (the bridge's fact not stated: our recall, reader M), same
  question (the bridge described) and answer. Leak filter: a description holding O's or S's answer or a derived word
  (jsuite_v2_tables.DERIV) is dropped (none of v2's 361 descriptions does). S: the question describes another entity of
  the passage (true fact stated in the K passage, another answer) by one of its v2 descriptions, the description ending
  at the same token index (only the description's tokens change); the options in a seeded order per scene (seed 5001).
  Plan check on Muse's tokenizer: 126 of 358 passages with an aligned option (167 options, 133 descriptions); second seed 122 more.
  Competence step (47.3's), inside the job and recorded: per description 10 prompts (5 wordings: his hop-1 question,
  "Which <noun> is <d>?", "Name <d>.", "What is the name of <d>?", "I am thinking of <d>. Which <noun> is it?"; x 2
  instructions; no passage; 12 greedy tokens); kept if the reply's first line names the entity (or a v2 alt name) in
  >= 0.90; a passage needs O's description kept and takes its first option whose description is kept. The read: his chat
  framing, the top token against the answer's first token; switch = the other entity's answer. Gate: O's read accuracy
  >= 0.80 per reader over every passage past the competence step; eligible: both readers say and read O's and S's
  answers right; the first 200 in passage order. The reads run whatever the gate says; a failed gate is "not tested" in
  the verdict (the gate over Zach's competence-kept passages beside). Delta = h_S - h_O at the description's last token
  at L26 and at L36 (both reported, the rule at each), per reader, added on O. Arms: whole; without J++ (signed OMP, k = 25, the letter-token J++ atoms at L, the
  pinned lens); without a random part of its share (X0's random subspace, seed 888 + L). Extra loss = X0's excess; gap =
  M's minus K's on the same cluster-bootstrap draws (bridge entity, 10,000, seed 0). Point estimates decide (EPS 1e-9);
  an undefined extra loss holds no clause.
  Scored by hand: scripts/x50_zach.py verdict --part z2.
controls:
- 'the J++ part against a random part of its own share (X0''s random subspace, seed 888 + L)'
- 'the recall (M) on the same passage and the same counterfactual (the gap)'
- 'the description competence step (>= 0.90 per description) and the read gate (0.80 per reader)'
- 'beside: Zach''s stored per-item J++ top-10 knock-out at L36-42 on the same passages, all positions and question-only (his nearest stored erase at the description), joined by item id; results/ablate_v2/muse30_jsuite_v2_test_chat_ko_cand2_v1 and muse30_jsuite_v2_test_chat_ko_cand2_L36-42_posquestion_v1; no M-start swap rows exist (jswap covers P and T starts), no rerun'
n: 'up to 200 eligible passages (126 + 122 aligned passages before the competence step): the job will likely end below 200'
seeds: [2601, 5001, 0, 888]
notes: "Speedup-box copy of x50_z2_muse (28 Oct ~16:45: speedup idle, mats busy; one id, one box; run name unchanged). Sealed: the run writes manifest, desc_competence, cases, competence, gate.json, outcomes, norms; no verdict. By hand after Dan's Q50.2 is committed (CPU): uv run python scripts/x50_zach.py verdict --part z2 (the table, the verify-pack view of 10 random passages, seed 0, and the figure beside his knock-out). Seeds: 2601 his set, 5001 the option order per scene, 0 the bootstrap and the view, 888 + L the random subspace. Plan: results/x50_zach/plan-20261028T150904Z/. Estimate: x47_3_muse (700 short competence scenes, 300 read scenes, 8 arms) took 776 s on one H100; this job has ~2,500 description prompts (12 tokens, batched by length), up to 240 passages of ~350 tokens through the competence step, 800 forwards for the change and 200 x 2 readers x 4 rows of reads: about 0.15 h with the model load; 0.3 with margin (Dan: ~0.8 GPU-h)."
