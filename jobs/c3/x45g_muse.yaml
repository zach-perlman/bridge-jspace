  H-batch45: 'Q45.1, Q45.2 in docs/predictions_batch45.md (committed before any result is opened)'
decision_rule: >-
  Fixed in advance (jobs/c3/batch45.yaml, 45g): (a) 'Two routes for the recall' if, on at least 3 of 4 models, in locker-before scenes the recall's extra loss with both removed is at least 0.3 and at least 0.2 above the larger single removal (paired CI excluding 0); (b) 'J++ is the recall's only route when the pick is the first mention' if, in locker-after scenes, J++ alone gives at least 0.3 and adding the pointer adds less than 0.1. Scored by x0_massmean.py score45g after Dan's predictions are committed (sealed until then).
