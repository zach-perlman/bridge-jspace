id: x52_lightning_carrier
title: "Batch 52 C coverage (Lightning extra f, 1 of 2): Z1 on the full carrier (51.7): the change at the bridge token at every layer <= L14 on Zach's passages (Lightning's Z1 run), the J++ part and its random twin removed at every layer; no prediction"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.4
depends_on: [x52_lightning_zach]
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  L=$(uv run python scripts/x51_lightning.py layer) && export BJ_PREDICTED_LAYER=$L &&
  test -f results/x50_zach/nem35l_x52_z1/gate.json &&
  uv run python scripts/x51_carrier.py run --name nem35l_x52_carrier &&
  uv run python scripts/x51_carrier.py verdict --coverage
question: >-
  On Lightning, on Zach's passages: does changing the bridge token at every layer up to L14 (the full carrier) let the
  split hold, and does the fact-after lookup switch (51.7's (i)-(iii))?
why_it_matters: >-
  51.7 (the carrier before L) on the second family; amendment 3 extra f. Designed for the 9B and 27B; Lightning repeats it
  on its own Z1 run.
hypotheses:
  none: "No prediction (batch 52 addendum): coverage run on an already-scored rule."
decision_rule: >-
  The rules verbatim from jobs/c3/x51_7_27b.yaml (jobs/c3/batch51.yaml 51.7; first scored in
  results/x51_carrier/x51_7-20261028T171646Z): "(i) "The slice explanation": the whole before-L raises the lookup's
  switch on fact-after items by >= 0.3 over the one-layer whole, and on fact-first brings the lookup within 0.10 of the
  recall. (ii) On the full carrier, per model and reported per stratum with fact-first decisive: recall extra loss -
  lookup extra loss >= 0.3 and lookup <= 0.10 -> "the split holds on the full carrier"; lookup >= 0.20 -> "the lookup
  follows the lens on the full carrier"; else in between. (iii) If fact-after lookups stay under 0.5 even under whole
  before-L: "the link is made away from the bridge token" -- only then the window-patching read ..., 50 items,
  descriptive." As computed: x51_7_27b's text with Lightning's Z1 run nem35l_x52_z1 (its chosen passages, its order) and
  L = Z1's first layer, the committed L14 (blocks 0..14). Verdict in the job (verdict --coverage, x52_carrier-<UTC>/).
controls:
- "every removal against a random part of the same share per layer (X0's random subspace, seed 888 + layer)"
- "the one-layer whole at L (Z1's) beside the whole before L"
- "our none read against Z1's stored none read (item by item)"
n: "Lightning's Z1 chosen passages (up to 200), fact-first / fact-after strata; 15 blocks (0..14)"
seeds: [888, 0]
notes: "Batch 52 C, amendment 3 extra f; on mats behind x52_lightning_zach (it reads that run's folder in the box's checkout; depends_on; the command checks Z1's gate.json first). Code: x51_carrier.COVERAGE_RUNS, z1_run (batch 50's or the coverage Z1 run), verdict --coverage (51.7's RUNS and own verdict unchanged). Wallclock (ledger): x51_7_27b 0.33 h with 33 blocks; Lightning has 15 blocks and runs ~0.5x Muse's per-row time; est ~15 min, 0.4 GPU-h; opens before the freeze."
