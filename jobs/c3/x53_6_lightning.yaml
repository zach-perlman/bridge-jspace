id: x53_6_lightning
title: "Batch 53.6 on nemotron-3.5-lightning (L14): the recall, lens identity vs address, in conflict. At the bridge word: the lens part toward item B (25 J++ atoms of B's change) plus the address swap toward item C's slot (s = 2, the probe run's pointer means); the recall's answer classed B / C / original; x6_routes' C0 scenes with three distinct legs counts; no prediction; UNVERIFIED"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.3
depends_on: []
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  L=$(uv run python scripts/x51_lightning.py layer) && export BJ_PREDICTED_LAYER=$L &&
  uv run python scripts/x53_identity_address.py run --name nem35l_x53_6 --why "Batch 53, test 53.6 (jobs/c3/batch53.yaml, Dan 29 Oct 09:30): the recall, lens identity toward B vs the address swap toward C's slot (s = 2) at the bridge word at L$L on Lightning; no prediction" &&
  uv run python scripts/x53_identity_address.py verdict --runs nem35l_x53_6
question: >-
  When the bridge word carries two conflicting signals, the lens part of B's identity and an address pointing at C's
  locker slot, which does the recall follow: B's attribute (the lens identity), C's (the address), or both?
why_it_matters: >-
  Batch 53 (Dan, 29 Oct 09:30), test 53.6 (priority 8 in the 09:50 list), on the brief's second model: whether the
  recall reads the item through the lens identity or through the address the lookup uses.
hypotheses:
  none: "No prediction (batch 53: every rule fixed in Dan's brief before any run)."
decision_rule: >-
  Verbatim from jobs/c3/batch53.yaml (brief, 53.6): "9B, Lightning. At the bridge word: the lens part toward item B
  plus the address swap toward item C's slot (s = 2). Read: the recall answers B's, C's or the original. Rule: "the
  recall follows the lens identity" if B's share >= 2x C's; "follows the address" if C's >= 2x B's; else both." As
  computed: as jobs/c3/x53_6_9b.yaml (scripts/x53_identity_address.py, unchanged), on Lightning at its committed L14
  (BJ_PREDICTED_LAYER from x51_lightning.py layer; the layer of its routes, probe and write runs): x6_routes' C0 pairs
  (seed 2510, 1,400 per condition) with three distinct legs counts (511 of 1,400 on Lightning's tokenizer), X0's
  competence and X0's gate (0.80 per reader on O) on these, the first 300 eligible; the lens part = P_J (h_{S_B} -
  h_O), 25 signed-OMP atoms of our Lightning J++ (sha 3306b6e4) at L14; the address swap = 2 (mu_{j_C} - mu_{j_A}), mu
  = x0_massmean.pointer_means(nem35l_x52_probe) (x8_write's means on Lightning, not refit); the rule on the recall
  under both, the clauses in the brief's order, "neither (no B or C answers)" when both shares are 0; CIs over the
  original bridge item (10,000, seed 0) beside; the same arms beside. Verdict in the job:
  results/x53_identity_address/x53_identity_address-<UTC>/.
controls:
- "the lens part alone (B's identity, no address) and the address alone (no lens part): what each signal does by itself"
- "the lens part plus a random direction of the address's norm (seeded): the address's effect beyond its size"
- "O unedited (the floor); the lookup read on every arm beside (B's / C's / A's locker digit)"
- "X0's gate on the scenes read (0.80 per reader on O) and X0's eligibility (both readers right on O and S_B)"
n: "the first 300 eligible of 511 C0 scenes with three distinct legs counts (x6_routes' generator, 1,400 per condition, seed 2510; Lightning's routes run kept 530 of its 700 C0 scenes eligible); 5 arms x 2 readers"
seeds: [2510, 5306, 888, 0]
notes: "Batch 53, test 53.6 (coordinator ~10:00: moved to this agent). Lightning is named in 53.6's brief (a batch 53 test, not batch 52 coverage). Box: any idle 80 GB GPU. Code: scripts/x53_identity_address.py as committed with x53_6_9b (a8c1a516); reads without a gradient on the pinned HF-hub kernels as every Lightning run. The pointer means load from the committed results/x0_probe/nem35l_x52_probe/states.npz (checked on CPU). Writes results/x53_identity_address/nem35l_x53_6/ and the verdict folder x53_identity_address-<UTC>/. Cost (ledger, results/jobq/ledger_sesterce-speedup.jsonl): x52_lightning_routes ran competence on 2,100 scenes and the routes arms in 1,088 s, x52_lightning_write 372 s; here competence on 511 scenes (~4 min), 600 state forwards and 600 batched reads of 5 rows (~3 min), load ~1.5 min: ~9 min; est 0.3. Memory: 62-64 GB (x52_lightning_routes peaked at 63.7). Disk on the Mac before the spec: 185 GB free. UNVERIFIED; into EXPERIMENTS.md with a card and the figure."
