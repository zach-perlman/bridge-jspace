id: x47_7a_27b
title: 'Batch 47.7(a) on the 27B (L32): question-first routes scenes, does the model prefetch the number at the bridge word,
  and is a prefetched value in the J-space? Routes shares, the value probe and the lens''s digit rank, question-first vs question-last;
  arms whole / without J++ (digits allowed) / random / without U / random'
thread: C3
gpus: 1
mem_gb: 75
est_gpu_hours: 0.8
command: 'export BJ_TARGET=qwen3.6-27b BJ_DEVICE_MAP=; uv run python scripts/x47_value.py run --part a --name x47_7a_27b --why
  "batch 47, test 47.7(a) (jobs/c3/batch47.yaml; Q47.7): the routes scenes with each reader''s question before the context;
  routes shares under every arm question-first, the whole change question-last beside it, the lookup''s O state at the bridge
  word in both renderings for the value probe and the lens''s digit rank; sealed"'
question: When the question comes before the context in the same user turn, does the lookup's answer under the whole change
  ever follow the locker value (the number of the moved item's new locker sentence), does a linear probe read the answer digit
  at the bridge word where it could not with the question last, and if a value route appears, is it carried by the J++ part
  and visible to the lens?
why_it_matters: The routes test says the lookup keeps an address at the bridge word, never the number, when the question comes
  last (value 0 of 300 on four models). If the model prefetches the number once it knows the question, 'never the value' is
  a fact about question order, not about the representation; and whether a prefetched value lives in the J-space tests the
  workspace account's 'surfaced to the J-space on demand'. 'Address regardless' is the stronger version of 'never the value'.
hypotheses:
  Q47.7: 'Dan''s answer in predictions/2026-10-28_dan.md (Q47.7); not committed when this spec was written, so the run is
    sealed: no verdict in the job (scripts/x47_value.py verdict refuses until the answer is committed).'
decision_rule: 'Fixed in advance (jobs/c3/batch47.yaml, 47.7, amendment 1). As computed (fixed before any run; Dan may override
  before the enqueue): the layer fixed in advance (32); the change h_S - h_O at the bridge word; arms whole, without the J++
  part (signed OMP, k = 25, over the lens atoms of the letter tokens AND the digit tokens: the main test''s letter-only restriction
  is lifted here), without a random part of its share (X0''s random subspace, seed 888 + layer), without U (x0_massmean''s
  Alf of the x0_probe_v4 states, not refit), without a random part of its share; the lookup''s answer classified identity
  / position / value / original / other by the top token at the read step; route shares with cluster-bootstrap intervals over
  bridge items (10,000, seed 0); a value at a bar counts as at the bar (EPS 1e-9). Sealed: no verdict in the job (scripts/x47_value.py
  verdict refuses until Dan''s Q47.7 is committed). Question-first prompt: the user turn is ''Question: <q> <the digit instruction>\n\n<context>'',
  the chat template, the assistant turn prefilled ''Answer:'' (question-last: x6_routes'' prompt, ''<context>\n<q> <instruction>'';
  the instruction block moves with the question). With the question first the two readers'' prompts differ before the bridge,
  so the change is computed per reader from its own prompts (question-last: one change from the lookup''s prompt, read by
  both). The bridge is asserted the same token at the same offset from the context''s first token in both renderings, one
  token at one index in O and S (0 of 1,400 dropped on this tokenizer; its absolute index moves by the question block, 20
  / 21 tokens on Qwen, 19 / 20 on Muse). Digits vs slots: a permutation chi-square test on the generated set, asserted p >=
  0.01 (this tokenizer''s set: O p = 0.29, S p = 0.58). Gate 0.80 per reader and condition on the question-first prompts (below
  it: not tested); eligible = both readers say and read O and S right in both renderings (the question-last competence rows
  are the x6_routes run''s, its prompts being these exactly, asserted); the first 300 per condition. Value probe: x0_probe''s
  ridge probe for the answer digit at the lookup''s O state at the bridge word, 5 folds with whole entities held out, one
  state per O context, question-first vs question-last. Lens: the rank of the answer digit among the 10 digit tokens under
  the lens''s vectors at that state (X0''s digit check), the share ranked first. Rule per model: prefetch on demand if the
  question-first C2 value share >= 0.15 and the probe >= 0.6 (the premise, question-last value <= 0.05 and probe <= 0.4, checked
  and reported); the prefetched value is in the J-space (read only where prefetch holds) if without J++ the value share falls
  >= 0.3 beyond the random part and the lens ranks the digit first in >= 0.4 of items; address regardless if the value share
  <= 0.05 and the probe within 0.1 of question-last. Over the models: a label holds on >= 2 of 3. Beside it: the position
  share question-first minus question-last (the whole change, paired) with its interval. C0 (the sanity swap) question-first
  against x6_routes'' reference (within 0.10; Muse >= 0.5): written to c0_check.json, the run does not stop; a failed model
  is labelled ''C0 failed'' at the verdict.'
controls:
- a random part at the J++ part's share and at U's share of the change, per item
- the whole change question-last in the same run (the paired position / value difference) and the x6_routes runs (value 0
  of 300)
- the recall reader on its own question-first patch
- 'the value probe question-last at the same layer on the same scenes (x0_probe v4: 9B / 27B at chance, Muse 0.33), and the
  lens rank question-last (8% / 13% first on the 9B / 27B)'
- C0 (the sanity swap) question-first against the question-last reference
n: 700 scenes per condition generated (C0, C2; seed 2510, x6_routes' scenes), 0 dropped at the question-first encoding, the
  first 300 eligible per condition
seeds:
- 0
- 888
- 2510
- 4707
