question: In the varied scenes (prose, JSON, tables), when the asked pick becomes another item whose locker statement moved
  and took a new number, does the lookup's answer under the whole change at the bridge word ever follow the value, and in
  JSON / table formats does it follow the position, carried by the per-format refit pointer?
why_it_matters: '''Never the value'' is shown on the templated routes scenes only. If it holds in every format, the address
  account generalizes beyond the template; if a position route appears in JSON / table and the refit pointer carries it, the
  pointer account does too.'
hypotheses:
  Q47.7: 'Dan''s answer in predictions/2026-10-28_dan.md (Q47.7); not committed when this spec was written, so the run is
    sealed: no verdict in the job (scripts/x47_value.py verdict refuses until the answer is committed).'
decision_rule: 'Fixed in advance (jobs/c3/batch47.yaml, 47.7, amendment 1). As computed (fixed before any run; Dan may override
  before the enqueue): the layer fixed in advance (32); the change h_S - h_O at the bridge word; arms whole, without the J++
  part (signed OMP, k = 25, over the lens atoms of the letter tokens AND the digit tokens: the main test''s letter-only restriction
  is lifted here), without a random part of its share (X0''s random subspace, seed 888 + layer), without U (x0_massmean''s
  Alf of the x0_probe_v4 states, not refit), without a random part of its share; the lookup''s answer classified identity
  / position / value / original / other by the top token at the read step; route shares with cluster-bootstrap intervals over
  bridge items (10,000, seed 0); a value at a bar counts as at the bar (EPS 1e-9). Sealed: no verdict in the job (scripts/x47_value.py
  verdict refuses until Dan''s Q47.7 is committed). Scenes: tasks_v2 x0b_v2''s scenes with both readers (x0b_generalize''s
  alignment); locker-first = the bridge''s locker statement before the asked pick; t = x0b''s alt candidate (the first other
  person''s pick, by name, with a different locker and memory number) whose locker statement is before the pick; u = a third
  locker item before the pick with a number different from x''s and t''s (seeded per scene, seed 4708); e = a number 1-9 not
  in the scene (seeded); S = t''s and u''s locker statements trade places (x7_pcf.swap_lockers), t''s number becomes e, the
  asked pick x becomes t; identity -> locker(t), position -> locker(u), value -> e, original -> locker(x), asserted distinct;
  the bridge one token at one index in O and S and S equal to O after the bridge, else dropped and counted. Both number styles
  (the answers are read as digits, as x0b). No refit basis was fit on the 27B in 45d, so no refit-pointer arm: whole / J++
  / U only, on every varied scene. Gate 0.80 per reader and format on the unedited prompts; eligible = both readers say and
  read O and S right; at most 300 per format in scene order. Rule: ''never the value generalizes'' if the value share <= 0.05
  in every format on every model (every cell tested); ''a position route in JSON / table'' per cell if the position share
  >= 0.2 and the refit pointer''s removal cuts it >= 0.3 beyond the random part.'
