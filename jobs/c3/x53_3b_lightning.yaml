id: x53_3b_lightning
title: "Batch 53.3b on nemotron-3.5-lightning, BELOW GATE (exploratory; Z1-P's K read 0.794 < 0.80): the last-token conflict test on word answers (Zach's named-bridge passages, jsuite_v2_1_test_chat: PP = the lookup copies a made-up word, PM = the recall) at each reader's own answer layer minus 1, 2, 3 and 51.10's read peak; arms whole / without the lens part / without a random part / the lens part alone; plus the check: 53.3's lookup on the locker scenes at its answer layer minus 1 and minus 3 (gate passes there); no prediction; hollow; UNVERIFIED"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.3
depends_on: []
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  L=$(uv run python scripts/x51_lightning.py layer) && export BJ_PREDICTED_LAYER=$L &&
  uv run python scripts/x53_lastconflict.py run-words --name nem35l_x53_3b --why "Batch 53, test 53.3b (jobs/c3/batch53.yaml test_53_3b, Dan 10:05): the last-token conflict test on word answers on Lightning, below Z1-P's gate (exploratory, hollow); no prediction" &&
  uv run python scripts/x53_lastconflict.py run --mode ans13 --name nem35l_x53_3l --why "Batch 53, test 53.3b's check (jobs/c3/batch53.yaml test_53_3b): 53.3's lookup on the locker scenes at its answer layer minus 1 and minus 3 on Lightning (items at L$L, as 51.10's); no prediction" &&
  uv run python scripts/x53_lastconflict.py verdict-words --runs nem35l_x53_3b --locker-runs nem35l_x53_3l
question: >-
  On word answers, does the last-token asymmetry of 53.3 hold: does the recall act through the lens part near its
  answer layer while the lookup, which copies a made-up word from the passage, computes outside it? And is 53.3's
  lookup label on the locker scenes the same one layer earlier and one later (not a layer choice)?
why_it_matters: >-
  Batch 53.3b (Dan, 29 Oct 10:05; priority right after 53.1b / 53.1): 53.3 found the lookup outside the lens at the
  last token on Muse and Lightning, in between on the Qwens; words instead of digits test whether that is the copy.
  Lightning is named in 53.3b's model list (a batch 53 test).
hypotheses:
  none: "No prediction (batch 53: every rule fixed in Dan's brief before any run)."
decision_rule: >-
  Verbatim from jobs/c3/batch53.yaml (test_53_3b): "the last-token conflict test on word answers. jsuite_v2_1_test_chat,
  named bridge: PP (the lookup copies a made-up word from the passage, e.g. "Hungarian") and PM (the recall, same
  answer vocabulary). 9B, 27B, then Muse, Lightning. Layers per reader: its own answer layer minus 1, 2 and 3 (to rule
  out a layer-choice artefact), plus 51.10's read peak. Arms as 53.3, without the redundant "rest alone": whole;
  without the lens part; without a random part of the same share; the lens part alone. 53.3's validity bar (S_whole
  >= 0.30, >= 30 switches). Rule per reader and layer: 53.3's labels. Across readers: "copy bypasses the lens" if at
  answer - 1 and - 2 the recall is "through the lens" and the lookup "outside" on >= 3 of 4 models; "digits only" if
  on words the lookup goes through the lens like the recall; else in between. Also rerun 53.3's lookup on the locker
  scenes at its own answer - 1 and - 3 (the same items), to check the asymmetry is not a layer choice." 53.3's labels
  (jobs/c3/x53_3_9b.yaml): "computes outside the lens at the last token" if the loss without the lens part is <= 0.10
  beyond random and the rest alone switches >= 0.7 of the whole; "through the lens" if the loss is >= 0.30 beyond
  random; else in between. As computed: as jobs/c3/x53_3b_9b.yaml (the same code), on Lightning: passages = Z1-P's
  chosen passages on Lightning (results/x50_zach/nem35l_x52_z1p, gate.json order) of jsuite_v2_test_chat, whose PP
  and PM items jsuite_v2_1_test_chat keeps unchanged (same ids, asserted): 129 passages (Z1-P's 71 of his second seed
  left out). Z1-P's gate fails on Lightning (K 0.794 < 0.80, M 0.922): BELOW GATE, exploratory, eligible passages only,
  hollow marks, never in the claims table or grades (Dan's 09:50 standing rules); the run's manifest and the verdict
  say so (below_gate); its cells are reported (hollow) and never counted toward a clause of the rule across readers
  (x53_lastconflict.across_readers: >= 3 of 4 then needs the other three models). The
  answer layer per reader = the plain logit lens at O's last token (51.10's settle rule, the lower median over the
  passages); the read peak = 51.10's (results/x51_jread/nem35l_x52_jread/peak.json: lookup 32, recall 36); a layer
  without a J++ map (our Lightning J++: L0-L50) is dropped and named. The check: 53.3's run on the locker scenes
  (51.10's 59 locker-first items at the committed L14, whose gate passes: PP 0.957, PM 0.816; 53.3's arms) for the
  lookup alone at its answer layer (51.10's: 45) minus 1 and minus 3 (L44, L42). Verdict in the job:
  results/x53_lastconflict/x53_lastconflict_words-<UTC>/.
controls:
- "without a random part of the lens part's share (X0's random subspace, seed 888 + layer): the reference of the loss"
- "O unedited (the floor) and the whole change (the ceiling) read on the same passages"
- "53.3's validity bar per cell (S_whole >= 0.30, >= 30 switches)"
- "the locker check: 53.3's lookup at answer - 1 and - 3 beside its answer - 2 (x53_3_lightning)"
n: "129 Z1-P passages of jsuite_v2_test_chat on Lightning (below Z1-P's gate; 2 readers, 3-4 layers each: answer - 1, - 2, - 3 and the read peak) and 51.10's 59 locker-first items for the check (the lookup, 2 layers)"
seeds: [888, 0]
notes: "Batch 53.3b (Dan 10:05; coordinator ~10:10: spec it now, queued behind 53.1b / 53.1). Box: any 80 GB GPU. Code: scripts/x53_lastconflict.py as committed with x53_3b_9b (108480b6); run-words records below_gate in the manifest when Z1-P's gate failed, and the verdict marks the model ○. Reads on the pinned HF-hub kernels, no gradient. Writes results/x53_lastconflict/nem35l_x53_3b/, nem35l_x53_3l/ (the check), and the verdict folder x53_lastconflict_words-<UTC>/. The joint verdict over the models by hand (CPU): x53_lastconflict.py verdict-words --runs <every 53.3b run> --locker-runs <every check run>. Cost (ledger, results/jobq/ledger_sesterce-another.jsonl / speedup): x52_z1p_lightning 694 s (competence on 529 passages plus 200 x 2 readers x 3 arms at one layer); x53_3_lightning 71 s; here 516 forwards (258 recording every layer, passages of 142-436 tokens), 258 batched reads of 13-17 rows, then the check (118 forwards, 59 reads of 9 rows), two loads (~50 s setup each): ~8-10 min; est 0.3. Memory: x52_z1p_lightning peaked at 63.1 GB. Disk on the Mac before the spec: 147 GB free. UNVERIFIED; into EXPERIMENTS.md with a card and the figure, hollow."
