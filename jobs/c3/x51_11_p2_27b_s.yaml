  export BJ_TARGET=qwen3.6-27b BJ_DEVICE_MAP= BJ_DAS_GDN=torch PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  uv run python scripts/x51_addr.py run --part 2 --name x51_11_p2_27b --why "Batch 51, test 51.11 (jobs/c3/batch51.yaml addendum_3; Q51.11): part 2 on qwen3.6-27b at L32 (S = 6 built in the job: the 27B has no part 1); sealed"
question: >-
  What is the address at the bridge word, independent of how we built it: how many dimensions it takes as the number
  of locker sentences grows (S = 3, 4, 6, 8), whether three independent methods (class means U, label-free
  counterfactual PCA P, learned DAS R) find the same subspace, and whether the slots are coded as categories, as an
  order or as a line?
why_it_matters: >-
  The finding is worded "four directions at the bridge word (class means over slots, layout removed)". Four is our
  construction (five slot classes -> rank 4), not a property of the model. 51.11 changes a headline wording: each
  outcome's sentence is fixed in advance (addendum 3, part 4), and in every case 'four' becomes a note on the first
  construction. Dan ranks it above 51.2 and 51.4; the minimum if the night runs short is parts 1 and 2 on the 9B.
hypotheses:
  Q51.11: "Dan's answer in predictions/2026-10-28_dan.md (Q51.11: part 1 ordinal / one per slot / growing / in between - 9B; Muse; part 2 one code / partly overlapping / different - 9B; Muse; 27B; part 3 metric order / categories / first vs the rest - 9B; Muse); not committed when this spec was written, so the job is sealed: no verdict in the run; scripts/x51_addr.py verdict and view refuse until the answer is committed."
decision_rule: >-
  Fixed in advance (jobs/c3/batch51.yaml addendum_3, part 2), verbatim: "One code, three bases": every projected
  swap reaches >= 0.6 of the whole swap's effect, and each cross-removal cuts the other's swap by >= 0.6. "Partly
  overlapping codes": projected swaps reach >= 0.6 but cross-removals cut < 0.3. "Different codes": a projected swap
  through P or R reaches < 0.3. Output: rows = removed basis (none / U / P / R), columns = swap basis; cell = share
  of lookups to the target. As computed (fixed before any run; Dan may override before the enqueue;
  scripts/x51_addr.py's docstring is the full text): scenes = x47_six's generator (its pools, sentences, encoding,
  chat rendering, X0's read) at S locker sentences first, then three picks; a pair = the bridge's locker sentence
  and the sentence at slot j trade places in S, each keeping its digit (x7_pcf's 'same item moved, digits kept'):
  the lookup's answer is the same in O and S (asserted per pair), the target is O's digit at slot j; every locker
  sentence 9 tokens on all three tokenizers, slot k at a fixed token index (checked per scene, the modal layout
  kept; plan: no scene dropped); S = 3 and 6 regenerated with this generator (the stored routes / 47.2 scenes carry
  a new digit in S). Entities: the bridge animal, split 60 / 20 / 20 over the generator's 32-animal pool (19 / 6 /
  7, x48_das.split_entities, seed 0), one split for every S and part; every number on held-out entities (test; part
  3 select + test). Part 2 (S = 6 decisive, S = 3 beside), from part 1's S folders (--part1): bases at the working
  dimension U_6 (rank 5), P_6 top-d*(6), R_6 at d*(6) (d* > 7: k = 7, flagged). Items: test-entity scenes eligible
  on O and S, per start slot the first 20 (S = 3: 40) round-robin over targets. Per item and target t != j: the swap
  2 (mu_t - mu_j) (x8_write's pointer swap at 2x) and 2 B B^T (mu_t - mu_j) for B in U, P, R, each beside a seeded
  random direction of its norm; cross-removal: the swapped state's X-coordinates reset to the train states' mean
  hbar, h <- (h + v) - X X^T (h + v - hbar), for X in U, P, R and every swap (removal acts after the swap so a swap
  inside X is removed with it), and each removal alone. reach_B = share(swap through B) / share(whole swap); cut(X
  -> B) = 1 - share(X removed, swap through B) / share(swap through B), the six X != B, paired cluster bootstrap.
  Labels on point estimates: one code = every reach >= 0.6 and every cut >= 0.6; partly = every reach >= 0.6 and
  every cut < 0.3; different = reach_P or reach_R < 0.3; else in between (a nan ratio meets no bar). Note: mu_t -
  mu_j lies in U's span by construction, so the U column equals the whole swap (reach_U = 1). Geometry: pairwise
  mean cos^2 of the principal angles against max rank / d and 20 seeded random pairs. The 27B (part 2 only,
  'reduced'): no part 1 run, so the job builds S = 6 itself with part 1's code (the same scenes, read, gate, U / P
  fit and DAS per k) without the shuffled-target twins (a part 1 null, not used by part 2) and reads own-IIA per k
  on the test pairs for d*(6); no S = 3 beside. Part 4 (verdict, CPU): the addendum's wording table, the first row
  whose labels match; a part a model lacks matches only 'any' (the 27B can only reach row 4).
controls:
- 'a seeded random direction of the same norm beside every swap (whole, U, P, R)'
- 'each removal alone (no swap): how far removing the basis moves the lookup by itself'
- 'the self-removals (X removed, swap through X): must kill the swap (the removal works)'
- 'random subspaces of the same ranks for the geometry (max rank / d and 20 seeded pairs)'
- 'the recall read in every cell (collateral)'
