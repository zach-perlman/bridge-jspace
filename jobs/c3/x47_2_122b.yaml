question: >-
  In six-locker scenes on the 122B, is the address's order code ordinal (a line over slots that one shift vector moves
  along), categorical (first locker vs the rest), or slot-specific (pairwise moves work, no common shift)?
why_it_matters: >-
  Dan 18:20 item 6: claim 8 (six lockers) is "not run" on the 122B (fig11).
hypotheses:
  none: "No prediction (coverage_122b_1820): coverage run on an already-scored rule."
decision_rule: >-
  The rules verbatim from jobs/c3/x47_2_muse.yaml (jobs/c3/batch47.yaml 47.2; first scored in
  results/x47_six/x47_2-20261028T113102Z), as copied in jobs/c3/x52_lightning_six.yaml: ""Ordinal": the first PCA
  component of the slot means is monotone in slot (|Spearman| >= 0.9) and v sends >= 0.25 of lookups to slot k+1 from
  >= 4 of 5 start slots, the random vector <= 0.05; "Categorical, first vs rest": v works only from slot 1 (others <
  0.10) and U's removal on 2-6 moves is within 0.10 of random; "Slot-specific": pairwise writes reach >= 0.25 on most
  pairs but no single v does. Dumbest ways: (1) position share near 0 under the whole change -> "not interpretable"
  (the whole-change routes split reported first); (2) mu_2 - mu_1 reported separately and v fit without it; (3)
  letters A-H if digits run out." As computed: x47_2_muse's text (scripts/x47_six.py, its scenes, fallback to five
  slots by its competence gate, gate 0.80, never lowered: if five slots fail too, "not tested") at the 122B's L33, the
  old U from qwen35_122b_x0_probe_v4 (x6_routes.STATES). Cells under 30 switches left out. Verdict in the job
  (verdict --coverage on the 122B's run).
controls:
- "every removal and write against a random part / a random vector of the same share / norm (seed RAND_SEED)"
- "C0 (the sanity swap at six slots)"
- "the fit half and the test half of the moves disjoint (split seed)"
n: "about 300 fit and 300 test scenes (20 eligible per ordered pair of 30) and 100 C0, as on Muse"
