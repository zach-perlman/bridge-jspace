notes: "DRAFT, NOT QUEUED; optional, cut first (the rule does not read it). Enqueue only after Dan's Q45.14 answer is committed. Mixes runs: the size-matched number comes from our box at this commit, the J++ number it is divided by from Zach's H200 run (25 Oct, befea152), as Zach's own pca runs were separate runs. Alternative (open question for Dan): rerun all five conditions at L36-42 on our box, so both layer sets come from one box and commit and the record's +59.9 / +34.6 is reproduced: ~1.6 h on an H200, 2.1-2.4 h on one H100 PCIe, instead of this job. Overlap: Zach's amendment 57 note 1 pre-registered Muse's dose grid at L36-42 with top10_pcasize on 150 items per word; it did not run (Muse's weights are not cached on his box): coordinate with Zach so the same control is not answered twice. BJ_GRAM_PROJ unset (QR, as the record run). Seed: 0 the scorer's bootstrap (the principal directions are deterministic). Cost: the record run spent 1,110 s per condition at L36-42 on an H200 (4,440 s / 4) and 214 s outside the band: 1,110 + 214 + ~60 s for the principal directions = ~1,385 s = 0.38 h on an H200; x 1.3-1.5 for one H100 PCIe (assumed, not measured) = 0.50-0.58 h."
