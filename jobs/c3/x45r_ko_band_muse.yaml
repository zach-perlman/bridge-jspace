  export BJ_TARGET=muse-glimmer-30b BJ_DEVICE_MAP=; unset BJ_GRAM_PROJ; uv run python scripts/ablate_v2.py --name muse30_jsuite_v2_test_chat_ko_cand2_L36-42_pca_x45r_v1 --why "batch 45, test 45r (jobs/c3/batch45.yaml; Q45.14): the size-matched control (paper10_pcasize) of Zach's v2 knock-out at his band L36-42; J++, rotated and logit lens there are in muse30_jsuite_v2_test_chat_ko_cand2_v1" --plan bands --bands 36-42 --conditions paper10_pcasize --tasks jsuite_v2_test_chat --tasks-competence muse30_jsuite_v2_test_chat_competence_cand2_v1 --tasks-words PP PK PM PA PN MP MK MM MA MN TP TK TM TA TN --tasks-level all --n 1000 --kinds clean --batch 16 --read cand2 && uv run python scripts/jsuite2_score.py muse30_jsuite_v2_test_chat_ko_cand2_L36-42_pca_x45r_v1 --set jsuite_v2_test_chat
question: >-
  On Muse at L36-42, how much of Zach's knock-out effect (M - K +59.9) does a removal of the same size along the
  residual's top principal directions give? Reported beside 45r's rule at L36-42, not in it.
why_it_matters: >-
  Dan's 45r compares the methods with Zach's three controls; the record Muse run at L36-42 has the rotated and
  logit-lens ones but not the size-matched one (docs/breadth/README.md, Section 7: "·" for Muse). Without it, the band's
  J++ effect beyond the logit lens (25.3 points) cannot be compared with a same-size removal, as it is on the other
  models (size-matched / J++: 0.24 on the 27B, 0.17 on the 9B, 0.15 on Lightning).
hypotheses:
  Q45.14: "Dan's answer in predictions/2026-10-26_dan.md (Q45.14), one line per layer set; enqueue only after it is committed. This job's number is reported beside the rule, not scored."
decision_rule: >-
  Fixed in advance (Dan, 27 Oct ~14:40; jobs/c3/batch45.yaml, 45r), verbatim: "'carried, not needed' if our gap >= 0.3
  while his M - K < 15 or within 10 of the logit-lens control, at the same layers." As computed: see jobs/c3/batch45.yaml
  45r and x45r_x0_muse (identical text). At L36-42 the rule reads M - K(paper10) and M - K(unembed10) from the record run
  muse30_jsuite_v2_test_chat_ko_cand2_v1 (+59.9 and +34.6); this job adds paper10_pcasize's M - K (facts/paper10_pcasize/
  start=all, contrast "M-K") and its ratio to the record's paper10 M - K, reported beside, not in the rule.
controls:
- 'paper10_pcasize: paper10''s size at each position along the residual''s top 256 principal directions at each band layer (64 pinned WikiText rows), as Zach''s amendment 48 note 1'
- 'the record run''s paper10, paper10_rot, unembed10 and unembed10_rot at the same band and items (not rerun)'
