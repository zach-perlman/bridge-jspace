question: >-
  Descriptive, beside 45r's rule: on Muse at L36-42, how much of Zach's knock-out effect (M - K +59.9) does a removal
  of the same size along the residual's top principal directions give?
why_it_matters: >-
  At L36-42 45r reports Zach's record run descriptively (Dan ~15:05): M - K +59.9, logit lens +34.6, J-specific excess
  25.3. That run has the rotated and logit-lens controls but not the size-matched one (docs/breadth/README.md, Section
  7: "·" for Muse), so the late band's excess cannot be set against a same-size removal, as on the other models
  (size-matched / J++: 0.24 on the 27B, 0.17 on the 9B, 0.15 on Lightning).
hypotheses:
  Q45.16: "Dan's answer in predictions/2026-10-26_dan.md (Q45.16); enqueue only after it is committed. This run is descriptive: not in the rule, not scored."
decision_rule: >-
  Not in the rule (Dan ~15:05: L36-42 is his record run, reported descriptively; paper10_pcasize there is optional,
  queued last, cut first). 45r's rule is in jobs/c3/batch45.yaml (45r) and x45r_ko_l23_29_muse. Reported: this run's
  jsuite2_score facts/paper10_pcasize/start=all, contrast "M-K", point estimate with its CI beside it, and its ratio to
  the record run's paper10 M - K (+59.9).
controls:
- 'paper10_pcasize: paper10''s size at each position along the residual''s top 256 principal directions at each band layer (64 pinned WikiText rows), as Zach''s amendment 48 note 1'
- 'the record run''s paper10, paper10_rot, unembed10 and unembed10_rot at the same band and items (not rerun)'
