id: x47_0_verbal
title: "Batch 47, test 47.0 (descriptive, not sealed): is the pointer verbalizable? The J++ lens's readout of a pointer write, its reconstruction by lens atoms, and the lens's blindness; 9B L12, 27B L32, Muse L26 in turn on one GPU, then the summary table"
thread: C3
gpus: 1
mem_gb: 75
est_gpu_hours: 1.2
depends_on: []
command: >-
  { BJ_TARGET=qwen3.5-9b BJ_DEVICE_MAP= uv run python scripts/x47_verbal.py run --name qwen35_9b_x47_verbal; a=$?;
  BJ_TARGET=qwen3.6-27b BJ_DEVICE_MAP= uv run python scripts/x47_verbal.py run --name x47_verbal_27b; b=$?;
  BJ_TARGET=muse-glimmer-30b BJ_DEVICE_MAP= uv run python scripts/x47_verbal.py run --name muse30_x47_verbal; c=$?;
  uv run python scripts/x47_verbal.py summary --runs qwen35_9b_x47_verbal x47_verbal_27b muse30_x47_verbal; s=$?;
  echo "exit 9B=$a 27B=$b Muse=$c summary=$s"; test $a -eq 0 -a $b -eq 0 -a $c -eq 0 -a $s -eq 0; }
question: >-
  Neel's question (batch 47, 47.0): read through the J++ lens, does a pointer write (h + 2 (mu_k - mu_j) at the bridge
  word, the write that moves the lookup) say anything, can the lens's atoms express the pointer at all, and does the
  lens's readout move more than under a random vector of the same size?
why_it_matters: >-
  The lookup goes around the lens through the pointer. Whether the pointer is merely unread by the lens or also
  inexpressible in its atoms decides the README's monitoring bullet; the sanity swap (J++ and U removed together leave
  0.45 / 0.53 / 0.74 of lookups) answers the other reading (augment the lens with the pointer).
hypotheses:
  H-none: "none: descriptive (47.0 has no prediction question); the spec's readings in jobs/c3/batch47.yaml are applied as written (scripts/x47_verbal.py docstring)"
decision_rule: >-
  Descriptive, jobs/c3/batch47.yaml 47.0, operationalized in scripts/x47_verbal.py before any run: a case = one routes
  item and one write (both k != j); per readout the best rank (1 = top, whole vocabulary) of the ordinal set and of the
  digits, the KL(h || h + write); statistic = the median over cases, null = the same median with each of 200 random
  directions (seed 4701) scaled to each write's norm; ranks beyond the null below its 5th percentile, KL above its
  95th. Reconstruction: nonneg OMP (bridge_jspace.omp) over the lens's unit atoms, k = 25 and 100, every non-special
  token and the letter tokens; the pointer's share = the larger of the writes' and U +/-'s mean share, against the 200
  random directions' mean share. Per model "not verbalizable" = k = 25 unrestricted ratio <= 2, ordinal statistic not
  (<= 20 and beyond the null), KL within the null's 95th percentile; "partly verbalizable" = an ordinal or digit
  statistic <= 20 and beyond the null, or ratio >= 3; else "neither". Over the models: not verbalizable if all three
  are, partly if any is. Case-level shares with cluster-bootstrap intervals over bridge items (10,000, seed 0) beside.
controls:
- '200 random directions of the same norm per write (seed 4701): the null for every reading'
- 'the identity direction mu_alt - mu_org at the same norm: the positive comparison (the new item''s name rank, KL, reconstruction)'
- 'h alone (the unwritten readout); the letter-token restriction beside the unrestricted atoms'
- 'x8_write''s lookup answers on the same items and writes (s = 2); a read check: O''s top token against x8_write''s unedited row'
n: "100 items per model (x8_write's first 100 eligible routes C2 items, O prompts, locker sentences first), 2 writes each = 200 cases; identity on the items whose two animals have class means (9B 100, 27B 100, Muse 96, checked by the plan stage on the tokenizers)"
seeds: [2510, 4701, 0]
notes: "Descriptive, not sealed: results may be opened as they land (Dan's brief). No figure (figures only for scored rules); the summary writes results/x47_verbal/summary-<UTC>/verbal.md (one table, the readings, the sanity-swap line with its source, a draft sentence for the README's monitoring bullet, not edited into the README). Each model runs whatever the others do; the summary reports a missing run. Inputs from committed files only: U and mu from x0_massmean on x6_routes.STATES (results/x0_probe/*/states.npz), the items from results/x8_write/{qwen35_9b_x8_write, x8_write_27b, muse30b_x8_write}/outcomes.jsonl. Cost: no competence pass (items taken from x8_write); 100 forwards and ~40,000 lens readouts per model (seconds); the nonneg OMP dominates: ~264 vectors x 2 dictionaries x (k = 25, 100), ~1.2-2 s each with NNLS on the CPU (measured 1.1 s per vector on a Mac CPU at d = 4096 with a small dictionary) = 10-18 min per model; model loads ~2-3 min each (x8_a ledger: 9B 7.6 min, 27B 11.9 min, Muse 10.3 min including a 700-scene competence pass). Est. 1.0-1.2 h on one H100. Peak memory: Muse's ~57 GB (x8_a_muse) + the every-token dictionary (202,048 x 6,656 fp32 = 5.4 GB) + readout buffers (< 1 GB)."
