id: x4_probe
title: "X4 probe (forward passes only): does a first-mention pointer to the locker statement form when it names the item in another language or by symbol? 27B L32 on GPU0, 9B L12 on GPU1"
thread: C3
gpus: 2
mem_gb: 110
est_gpu_hours: 0.3
depends_on: [x0_probe_power]
command: >-
  uv run python -c "import torch" &&
  { CUDA_VISIBLE_DEVICES=0 BJ_DEVICE_MAP= uv run python scripts/x4_alias.py probe --name x4_probe_27b --why "X4 probe (jobs/c3/X4.md)" & p27=$!;
  CUDA_VISIBLE_DEVICES=1 BJ_DEVICE_MAP= BJ_TARGET=qwen3.5-9b uv run python scripts/x4_alias.py probe --name qwen35_9b_x4_probe --why "X4 probe (jobs/c3/X4.md)" & p9=$!;
  wait $p27; s27=$?; wait $p9; s9=$?; echo "exit 27B=$s27 9B=$s9"; test $s27 -eq 0 -a $s9 -eq 0; }
question: >-
  On alias_pointer_v1's scenes in X0's frame (5 locker statements, then 3 English picks), at the asked person's bridge word, org run: is the index of the bridge's locker statement (its first mention) linearly readable when the statements name the items in another language (animals) or by chemical symbol (elements), within each form (cross-validated by entity) and by a probe trained on the verbatim scenes?
why_it_matters: >-
  In X0's scenes the bridge word carries a first-mention pointer to its locker sentence that the lens does not read and the lookup does not need. X4 asks whether the lookup's independence from J++ needs a verbatim key match; the probe asks first whether the pointer forms at all without one.
hypotheses:
  H-pointer: 'the pointer is readable within the translated and the symbol forms. Prior: Dan''s, predictions batch 29'
  H-transfer: 'a probe trained on the verbatim scenes reads it in the translated scenes. Prior: Dan''s, batch 29'
decision_rule: >-
  Descriptive (jobs/c3/X4.md section 3). Probe (b) on the org states at the bridge word, the predicted layer: within each key form (one-hot ridge, cross-validated by bridge entity), and verbatim -> translated / symbol (transfer); baselines chance, majority, the asked pick's position only; 95% CIs from a cluster bootstrap over bridge entities. Results not opened or summarized before Dan's batch-29 commit.
controls:
- 'the verbatim form on the same scenes'
- 'chance, majority and pick-position baselines'
n: '400 scenes per form (animals verbatim / translated, elements verbatim / symbol); 8 and 6 bridge entities'
seeds: [2910, 0]
notes: "Forward passes only (~1,600 per model, ~5 min). The probe analysis runs on the CPU after the pull. The patch test (x4_patch) follows."
