id: x48_2b_muse
title: "Batch 48, test 48.2 design B on the Muse (L26): where the recall's retrieval happens. Mean-ablate the MLP writes at the bridge token for layers 27-51 (scene mean, not zero); control 1 the same at the asked person's token; control 2 at the bridge token for layers 0-13; both readers' accuracy on unedited prompts"
thread: C3
gpus: 1
mem_gb: 75
est_gpu_hours: 0.15
command: >-
  export BJ_TARGET=muse-glimmer-30b BJ_DEVICE_MAP=; uv run python scripts/x48_enrich.py run_b --name muse30_x48_2b --why "batch 48, test 48.2 design B (jobs/c3/batch48.yaml; Q48.2): the MLP writes at the bridge token mean-ablated for layers l > L26, against the asked person's token and against layers l <= 13 at the bridge token; both readers on unedited prompts; sealed"
question: >-
  Does the recall's retrieval run through the bridge token's late MLPs: does replacing the MLP writes at the bridge
  token for layers l > L by their scene means cost the recall its accuracy while the lookup keeps its, and while the
  same ablation at the asked person's token, or at the bridge token's early layers, costs neither reader?
why_it_matters: >-
  The account under test (batch 48) says the recall is fact retrieval at the bridge token: its MLPs after L write the
  item's attributes there, and the last token reads them out; the lookup needs the bridge token's content too
  (identity and address) but not those writes. If the recall survives the ablation, the attribute is fetched at the
  last token instead (consistent with Zach's late question band); still a result about where, and design A at the
  last token covers it. The controls separate "the MLPs retrieve" from "we broke the input".
hypotheses:
  Q48.2: "Dan's answer in predictions/2026-10-28_dan.md (Q48.2 B); not committed when this spec was written, so the run is sealed: no verdict in the job (scripts/x48_enrich.py verdict refuses until the answer is committed)."
decision_rule: >-
  Fixed in advance (jobs/c3/batch48.yaml, 48.2 rule B): "The recall's retrieval runs through the bridge token's late
  MLPs" if recall accuracy falls >= 0.4 while lookup accuracy stays within 0.1, and both controls stay within 0.1 for
  both readers. If the recall survives: the attribute is fetched at the last token; report.
  As computed (fixed before any run; Dan may override before the run): items = the main-test X0 run's 200 chat items
  at L26 (muse30b_x0_necessity), the unedited O prompts of both readers. The MLP write of a block = the output of the
  module the block adds to the residual after its token mixer: on the Muse (dense, 52 blocks, sliding / full attention
  3:1, each block `mlp` then `post_feedforward_layernorm` before the add, Gemma-style) the `post_feedforward_layernorm`
  module's output, i.e. the MLP's scaled write, so the ablation replaces exactly what enters the residual (recorded in
  the manifest). Scene mean: per layer and role, the mean of that write over the 200 items' unedited O prompts at the
  role's position (bridge: the bridge token; person: the last token of the asked person's name in the asked pick
  sentence). Arms (forward hooks replace the write at the position by the mean on the prompt's forward): none;
  bridge_late = the bridge token, layers 27-51 (25 modules); person_late = the person's token, layers 27-51 (25
  modules, control 1); bridge_early = the bridge token, layers 0-13 (l <= L/2; 14 modules, control 2). Read: X0's chat
  read (the prompt with the digit's space token appended); accuracy = the share of items whose top token is O's
  answer; drop = accuracy(none) - accuracy(arm), point estimates, paired cluster-bootstrap CIs over bridge entities
  (10,000, seed 0) beside. Holds on a model if the recall's drop under bridge_late >= 0.4, |the lookup's drop under
  bridge_late| <= 0.1, and |drop| <= 0.1 for both readers under person_late and under bridge_early; on the batch if on
  both models. Scored by hand: scripts/x48_enrich.py verdict (EPS 1e-9 at the bars).
controls:
- 'person_late: the same ablation (the same 25 modules, the same layers) at the asked person''s token: a token the lookup and the recall both depend on through attention; neither reader may lose more than 0.1'
- 'bridge_early: the ablation at the bridge token for layers l <= L/2 (0-13, 14 modules): the early identity must stay; neither reader may lose more than 0.1'
- 'the lookup under bridge_late: it needs the bridge token''s content (identity and address) and must stay within 0.1, else the input is broken, not the retrieval'
- 'none: the unedited read of both readers (the baseline accuracy; the main run''s gate had PP 0.97, PM 0.89 on all scenes)'
n: 'the main-test run''s 200 chat items at L26 (40 bridge entities), both readers, 4 arms (plan check on the Muse tokenizer: person token one token in 181, two in 19; the last one is ablated)'
seeds: [0]
notes: "Batch 48 (Dan, 28 Oct ~02:30), merged priority 48.2 B late (after 47.6(a)(b)); queue after 48.2 A. Sealed: the run writes manifest (hooked modules, module counts per arm), plan, cases, means.pt (the scene means), outcomes (both readers, 4 arms, top token, right, p_org, switched), 10 examples' greedy texts; no verdict. By hand after Dan's Q48.2 is committed: uv run python scripts/x48_enrich.py verdict --runs-a qwen35_9b_x48_2a muse30_x48_2a --runs-b qwen35_9b_x48_2b muse30_x48_2b (CPU). Cost: 200 forwards for the means + 200 x 2 readers x 4 arms = 1,600 reads + 80 greedy examples, ~1,900 unbatched forwards; x45p_muse (~2,850 forwards) took 167 s all in; est 4 min, 0.15 GPU-h. Note for Dan: as written, control 2 (l <= L/2) ablates 14 modules against bridge_late's 25 (control 1 matches at 25); the counts are recorded, not matched, for control 2. Reads the main run from results/ (copied into the checkout): muse30b_x0_necessity must be on the box."
