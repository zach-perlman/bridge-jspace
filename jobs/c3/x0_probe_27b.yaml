id: x0_probe_27b
title: "X0 descriptive (added after data), Qwen3.6-27B L32: what does the bridge's word hold in the org run (answer digit, locker sentence, identity)?"
thread: C3
gpus: 1
mem_gb: 75
est_gpu_hours: 0.2
depends_on: [x0_hw_gate_27b]
command: >-
  uv run python scripts/x0_probe.py run --name x0_probe_27b --source x0_necessity_27b_chat --layer 32
figures_command: uv run python scripts/x0_probe.py figures --name x0_probe_27b
question: >-
  At the 27B's layer 32, at the asked person's bridge word in the org run (chat), split by whether the bridge's locker sentence comes before or after the asked pick sentence: can a linear probe read (a) the lookup's answer digit, (b) the index of the sentence holding the bridge's locker, (c) the bridge's identity (positive control), above the majority and chance baselines?
why_it_matters: >-
  X0 says the 27B and 9B lookups flip mostly in locker-before scenes and do not need the J++ part (9B) or need more atoms of it (27B); the digit check found no digit route. The probes ask what the word holds instead: the answer value itself, or an address of where it is.
hypotheses:
  H-value: '(a) high in locker-before and at chance in locker-after: the answer value is stored at the word, not in J++ form. Prior: none set (descriptive, after data; Dan''s reading)'
  H-address: '(b) high in locker-before with (a) at chance: the word stores an address (a lookback-style pointer). Prior: none set (Dan''s reading)'
decision_rule: >-
  Descriptive, added after data, not part of X0's rule (Dan, 24 Oct evening). Linear probes (one-hot ridge, standardized features, penalty by inner 4-fold CV) on h_org at the bridge's word, layer 32; (a) and (b) cross-validated by bridge entity (5 folds, entities held out), (c) by item (5 folds, entities spread: a held-out entity is an unseen class). Per target and stratum (locker before / after / both): accuracy against chance (1 / classes) and the training folds' majority class; for (b) also the structure-only baseline (the agent's addition: the most frequent locker index given the asked pick's sentence index). 95% CIs from a cluster bootstrap over bridge entities (10,000 resamples, seed 0); probe - best baseline on the same draws. Primary: the 200 X0 items of x0_necessity_27b_chat; secondary: every chat scene of d1_topics_v3. Reading (Dan, before the run): (a) high before and at chance after -> value at the word; (b) high before with (a) at chance -> address.
controls:
- 'locker-after scenes: the locker sentence follows the word, so (a) and (b) cannot be read from it there (control by construction)'
- 'the bridge identity probe (positive control: the pipeline reads what the word surely holds)'
- 'majority-class and chance baselines, cross-validated; the structure-only baseline for (b)'
n: '200 X0 items (101 locker-before, 99 locker-after; 38 / 33 entities) and every chat scene of d1_topics_v3 (600)'
seeds: [0]
notes: "Order (Dan, 24 Oct evening): after the single-change alt, before the 122B. Cost: one model load, 600 forwards (~10 min). States saved fp16 in results (states.npz, ~6 MB), so further probes are CPU-only."
