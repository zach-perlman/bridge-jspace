  export BJ_TARGET=qwen3.6-27b BJ_DEVICE_MAP= PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  uv run python scripts/x51_travel.py run --name x51_4_27b --why "Batch 51, test 51.4 (jobs/c3/batch51.yaml; Q51.4): routes C0 scenes, the pointer swap s (mu_k - mu_j), s = 1, 2, at the last token at L32 and L36, bridge-word means (x8, not refit) and last-token means (fit half), random vectors of the same norm; slot probe at the last token by layer; sealed"
question: >-
  Does the slot address written at the bridge word travel to the last token? Added at the read token instead of the
  bridge word, does x8's address (mu_k - mu_j, fit at the bridge word) still send the lookup to locker k; if not, does a
  difference of slot means fit on the last token's own states do it; and does a probe read the slot there?
why_it_matters: >-
  The address is readable, removable and writable at the bridge word, and the question's attention does not show who
  dereferences it (49.7). If the same code works at the read token, the address is copied there unchanged; if only a
  last-token refit works, it is re-encoded on the way; if neither works while a probe reads the slot, the slot is there
  but the lookup does not read it from the last token.
hypotheses:
  Q51.4: "Dan's answer in predictions/2026-10-28_dan.md (Q51.4, per model: (a) travels / (b) re-encoded on copy / (c) not at the last token / (d) in between); not committed when this spec was written, so the run is sealed: per-item files only, no verdict; scripts/x51_travel.py verdict and view refuse until the Dan: line is committed."
decision_rule: >-
  Fixed in advance (jobs/c3/batch51.yaml, 51.4), verbatim: "The code travels": the bridge-fit swap sends >= 0.3 of
  lookups to slot k (random <= 0.05). "Re-encoded on copy": bridge-fit <= 0.10 while last-token-fit >= 0.3. "Not at the
  last token": both <= 0.10 while the probe reads the slot there >= 0.8. As computed (fixed before any run; Dan may
  override before the verdict): items = x8_write.eligible's gate and eligibility on the routes generator's C0 scenes
  (seed 2510; O; gate 0.80 per reader on O's read accuracy; the first 300 eligible); j = the bridge item's locker slot,
  k = each other slot; the last token = the read position of X0's chat read (the digit's space token appended to O);
  layers L = 32 and L + 4 = 36. Arms at the last token's block output (X0's AddRows), both readers: bridge_swap = s
  (mu_k - mu_j), mu = x0_massmean.pointer_means on x0_probe_v4_27b (x8's means, fit at the bridge word at L, not
  refit, the same vector at L + 4), every item; last_swap = s (mu'_k - mu'_j), mu' = plain class means by j of the
  lookup prompt's last-token states at that layer over the fit half (bridge entities sorted, random.Random(0) shuffle,
  first half fit; x49_attn.split_halves), read half only; each with a Gaussian vector of its own norm (one per item, k,
  layer and s; seed 4401); s in {1, 2} (raw multiples, as x8_write / 49.7). The share = the lookup's top token is slot
  k's digit (x8_write.classify "target"). Over the four cells (L or L + 4, s = 1 or 2), point estimates, EPS 1e-9 at
  the bars: travels if some cell has bridge_swap >= 0.30 and its own bridge_random <= 0.05; else re-encoded if every
  cell's bridge_swap <= 0.10 and some cell's last_swap >= 0.30; else not at the last token if every cell's bridge_swap
  and last_swap <= 0.10 and the probe's accuracy at the last token at L or L + 4 >= 0.80; else in between. Probe =
  x0_probe.cv_predict (one-hot ridge on standardized features, 5 outer folds holding out whole bridge entities, penalty
  by an inner 4-fold CV) on the lookup's last-token states, slot j, every layer; majority baseline and chance 1/3 beside.
  Cluster-bootstrap CIs over bridge items (10,000, seed 0) beside; a per-layer label beside (descriptive). Code:
  scripts/x51_travel.py (rule, analyse).
controls:
- "a Gaussian vector of each swap's norm at the same token, layer and dose (seed 4401): the travels clause needs it <= 0.05"
- "two fits of the code: x8's bridge-word means (not refit) and means refit on the last token's own states (fit half, read on the other half)"
- "none (O unedited): the lookup reads O's answer; the clean answer kept (original share) under every arm, the collateral"
- "the recall on the identical edits (changed, and whether it gives slot k's item's legs)"
- "norms: the swap's norm over ||h_last|| at L (and x8's swap over ||h_bridge|| at L beside); the probe's majority baseline and chance"
