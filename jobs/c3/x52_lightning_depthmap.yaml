id: x52_lightning_depthmap
title: "Batch 52 C coverage (Lightning lane mats; outside the key rows: E11's token x layer map, D1 + D2): the main-test design only (the clean design's gate fails on Lightning), the conflict run's 200 items at L14, every 4th layer as Muse; S's state placed into O at one token group and one layer, the cumulative margins and window patching; no prediction"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.6
depends_on: []
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  L=$(uv run python scripts/x51_lightning.py layer) && export BJ_PREDICTED_LAYER=$L &&
  test -f results/x0_necessity/nem35l_x52_conflict/outcomes.jsonl &&
  uv run python scripts/x47_depthmap.py run --designs main --name nem35l_x52_depthmap --why "Batch 52 part C (jobs/c3/batch52.yaml amendment 3), coverage: D1 + D2 on Lightning, the main-test design only (its clean one-pick design fails the gate: recall 0.751), the conflict run's items at L$L, every 4th layer; no prediction: coverage run on an already-scored rule" &&
  uv run python scripts/x47_depthmap.py verdict --designs main --coverage --runs nem35l_x52_depthmap
question: >-
  On Lightning, in the main test: where (token group x layer) does the changed prompt's state carry each reader's
  switch, and when does the recall stop reading the bridge word (D1, D2)?
why_it_matters: >-
  E11 (token by layer) on the depth page; the decisive design there is the clean one (one token differs), which is not
  tested on Lightning; the main test is the 'beside' design, reported as such.
hypotheses:
  none: "No prediction (batch 52 addendum): coverage run on an already-scored rule."
decision_rule: >-
  The rules verbatim from jobs/c3/x47_d1_muse_r2.yaml (jobs/c3/batch47.yaml D1 and D2): "D1: (a) in locker-after
  scenes the lookup's mass sits at the locker sentences, not at the bridge word, at every layer (bridge-word cells <=
  0.25 everywhere; some locker-sentence cell >= 0.5); (b) in locker-first scenes the lookup's bridge-word mass ends
  before the recall's (the last layer with bridge-word switch >= 0.3 is earlier for the lookup, by >= 2 layers on the
  9B, >= 4 on Muse); (c) the recall's map has a second hot token, the item's earlier mention, in locker-first scenes
  (>= 0.3 at some layer), absent in locker-after. D2: "the handover from the mention to the question" if l_R(recall)
  lies at or below the start of Zach's late band on the 9B and 27B." scripts/x47_depthmap.py: "Each rule is scored on
  each design; the Q-depth answer per model reads the clean design (one token differs), the main test beside it." On
  Lightning: the main test only (--designs main; the clean design's gate fails, recall 0.751, amendment 1: no gate
  change), so every reading is the 'beside' one and the decisive clean cell is "not tested"; (b)'s gap as Muse's (>= 4,
  the same every-4th grid); D2 reported (Lightning, like Muse, has no late band of Zach's in the script). Items: the
  conflict run nem35l_x52_conflict's 200 scenes at L14 (x45b_binding.MAIN_RUN; the 60 dev scenes excluded there).
controls:
- "none (O unedited), a (47.4's (a): the change at L), S read on S, beside every cell"
- "47.4's state check under the bridge swap at blocks 0..L (a failure fails the job after its files are written)"
- "cluster-bootstrap intervals over bridge items (10,000, seed 0)"
n: "the conflict run's 200 main-test items (Lightning; locker-first / locker-after / mixed as x45m's groups)"
seeds: [0, 4513]
notes: "Batch 52 C, amendment 3, lane mats. NEEDS the conflict run's results in the box's checkout: enqueue on mats only after results/x0_necessity/nem35l_x52_conflict is pulled and committed (the command checks outcomes.jsonl exists before loading). Code: x47_depthmap.STEP gains Lightning (Muse's 4), --designs (run / verdict) and COVERAGE_RUNS + verdict --coverage (D1's RUNS and own verdict unchanged). Wallclock (ledger): x47_d1_muse_r2 1.20 h for 513 items (main 200 + clean 313); main only = 200 items, Lightning ~0.5x Muse's time per row: est ~20-30 min, 0.6 GPU-h; opens before the freeze."
