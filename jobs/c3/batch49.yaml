  - id: 2
    by: Dan, 28 Oct ~14:20
    title: three corrections that make 49.1, 49.2 and 49.7 clean
    queue_change: none
    "49.1": >-
      Add the arm (alpha = 0, beta = 2, U removed from the rest): Delta' = 2 (Delta - P_J Delta - U U^T Delta) (a random
      part of U's share removed instead, beside). Reason: at (0, 2) the recall could switch by dereferencing the doubled
      address to the item's earlier mention (as under a strong pointer swap), not by reading identity from the rest. Rule
      (a) "weights, not routes" now requires the recall's switch at (0, 2, no U) >= 0.5; if (0, 2) >= 0.5 but (0, 2, no U)
      <= 0.2, report "the rest moves the recall only through the address" (a third outcome, informative). The
      off-manifold check stands: plain-text loss at the bridge word under each corner against (1, 1).
    "49.2": >-
      The J++ part of Delta exists only at the bridge word. On rungs (3)-(5) the removal at the other tokens is the
      projection of that token's state onto the span of the same 25 atoms (the bridge item's lens identity, wherever it
      appears), with the random subspace of the same share per token. Rung (6) uses Zach's definition (the top-10
      lens-read directions per token, his code path) over his band. State this in the spec and in the figure's subtitle
      so rungs (5) and (6) are read as two definitions, not one.
    "49.7": >-
      (i) Aggregate read, fixed in advance beside the per-head rule: the summed move over the five candidate heads, and
      over every head of the best layer; "distributed dereference" if the sum >= 0.30 while no single head reaches 0.30.
      (ii) Necessity of the found head (one extra arm, same job): under the swap, zero the best head's output at the last
      token (and, separately, at the question tokens); "the head carries the position route" if the lookup's switch to
      slot k's locker falls by >= 0.5 of its swap value while identity answers change <= 0.10 and the recall <= 0.10. The
      only ablation in the batch; specific because the two routes predict different outcomes. (iii) Weights-level check
      (descriptive, CPU after the run): for the best head, S[k, k'] = (W_Q mu^q_k)^T (W_K mu^src_k'), mu^q_k the mean
      last-token state by the picked item's slot, mu^src_k' the mean state of slot-k' locker-sentence tokens, from the
      run's cached states; report diagonal dominance (mean diagonal minus mean off-diagonal, in units of the off-diagonal
      spread); RoPE left out (say so); the actual attention logits on slot k's tokens under none / swap / random beside
      it. (iv) The 9B caveat in the verdict text: three of four layers are Gated DeltaNet; if the lookup switches under the
      swap with no movement in any full-attention head, write "the dereference is not in full attention on this model"
      and let Muse decide.
    predictions: >-
      Q49.1: add "the rest moves the recall only through the address" as a third option (when Q49.1 is written from the
      brief). Q49.7: add P(the best head is necessary by the rule above), 9B; Muse; and P(distributed, no single head).

tests:
  - id: "49.7"
    title: Does the question's attention follow the written address?
    models: ["qwen3.5-9b (~0.5 GPU-h)", "muse-glimmer-30b (~0.5 GPU-h)", "qwen3.6-27b last"]
    question: >-
      The address is probe-readable, removable and writable; nothing shows who dereferences it. If a swap of the address
      at the bridge word moves the question's attention onto the locker sentence of the written slot, the dereference is
      in hand at the head level.
    design: >-
      Routes C0 scenes, locker-first (x6_routes' C0 items, the ones x8_write used). Arms at the bridge word at L: none;
      the pointer swap mu_k - mu_j at s = 2 (x8_write's operation, pointer_means not refit); a random vector of the same
      norm. Record attention weights from the last token and from each question token to every token, at every
      full-attention layer > L (the 9B's full-attention layers only; all layers on Muse). Aggregate per head: mass on
      each locker sentence (all its tokens). Candidate heads: the five with the most mass on any locker sentence under
      none, chosen on a fit half of the items; read on the other half. Per head, per item: move = (mass on slot k's
      sentence - mass on slot j's sentence) under the arm, minus the same under none; j = the bridge item's slot, k = the
      written slot.
    rules:
      follows: >-
        "The attention follows the address": on items where the lookup switched to slot k's locker, >= 1 of the five heads
        has move >= 0.30 (paired CI excluding 0) under the swap, <= 0.05 under the random vector, and that head's move on
        non-switched items is <= 0.10.
      elsewhere: >-
        "Dereference elsewhere": no head reaches 0.15 while the lookup switches >= 0.3; the address is consumed by a
        route the full-attention heads do not show (on the 9B, the Gated DeltaNet layers are the suspect; say so).
      report_beside: >-
        The best head's layer and index, its attention entropy under each arm, and the per-token breakdown of its mass on
        slot k's sentence (item token / number token / the rest).
    figure: >-
      For the best head per model: three bar groups (none / swap / random) over the three locker sentences; beside it,
      the lookup's answer shares under the same arms.
    dumbest_ways: >-
      1) The head moves under any perturbation of the token (the random vector is the control; also the entropy). 2) The
      mass moves only to the number token of slot k (report per token; a move to the number alone still counts, but say
      it). 3) On the 9B the route is in DeltaNet (report the total full-attention mass change; if the lookup switches with
      no attention change anywhere, write "not in full attention").
    cpu: >-
      The attention recording hook is tested on the fake model before the job (attention weights returned for the
      full-attention layers; DeltaNet layers skipped and logged). The hand-check pack adds 49.7's best-head bars (10
      items) when it lands.
    prediction: Q49.7
  - id: "49.8"
    title: DAS for the address
    models: ["qwen3.5-9b (~0.5 GPU-h), after 48.1's verdict exists"]
    design: >-
      x48_das's code; pairs = routes position counterfactuals (same item, its locker sentence moved to another slot, the
      counterfactual answer = that slot's locker); R_pos with k in {2, 4, 8}; entities held out 60/20/20; random and
      shuffled-target baselines.
    reads: >-
      own-IIA; energy of U (4-d, first-vs-rest) inside R_pos; energy of W (47.2's five-slot subspace, fit on the
      six-locker scenes, applied here) inside R_pos; R_pos's energy inside the J++-25 part; the cross read: R_pos applied,
      does the recall move (should not).
    rules:
      ours: >-
        "The learned address is ours": at k = 4, >= 0.6 of U's energy lies in R_pos (random k/d ~ 0.001) with own-IIA
        >= 0.6 and the recall's cross-IIA <= 0.1.
      two_codes: >-
        "Two address codes": own-IIA >= 0.6 but U's energy in R_pos <= 0.2; then report which one the writes used (47.2's
        slot-specific result) and the angle between them.
    prediction: Q49.8
