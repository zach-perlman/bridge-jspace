id: x45s_a_lightning
title: "45s-a on Nemotron-3.5-Lightning, our main test (DRAFT, not queued; Dan predicts first, Q46.2): two people swap picks; the bridge word's change at L27 (fixed in advance), whole / without its J++ part (k = 25, signed) / without a random part of the same share, both readers; sealed"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.25
depends_on: [x45s_smoke_lightning]
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_SUITE_BATCH=16;
  uv run python scripts/x0_necessity.py run --name nem35l_x45s_main --set d1_topics_v3 --renderings chat --layers 27 --alt cf --dicts jpp --curve-dicts jpp --curve-k --no-nonneg --sealed --why "45s-a (Dan 27 Oct ~15:00; Q46.2): our main test on Lightning, two people swap, the bridge word at L27 (the middle of Zach's pre-registered band L27-33), J++ k = 25 signed vs a random part of its share; sealed"
question: >-
  On Nemotron-3.5-Lightning, at L27 (fixed in advance), in our main test (two people swap picks): does the recall need
  the J++ part of the bridge word's change while the lookup does not?
why_it_matters: >-
  Our split holds on all four models we ran (Qwen3.5-9B, Qwen3.6-27B, Qwen3.5-122B, Muse), at layers fixed in advance;
  Lightning is the second family Zach tested and our side has never run on it. His knock-out finds a J-specific
  memory-vs-stated gap there (M - K +52 at L27-33, logit lens +2; EXPERIMENTS.md l.207); this asks whether the bridge
  word itself carries the recall's J++ part on the same model and depth.
hypotheses:
  Q46.2: "Dan's answer in predictions/2026-10-27_dan.md (Q46.2); enqueue only after it is committed."
decision_rule: >-
  The main test's rule, verbatim from its original spec (jobs/c3/x0_necessity_27b_chat.yaml): "jobs/c3/X0.md
  "Decision rule" with amendment 1 (24 Oct, before data), on this run's chat rendering at layer 32: confirmed iff lookup
  excess <= 0.10 and recall Jdep >= 0.30 (23 Oct); killed iff lookup excess >= 0.20 or recall Jdep < 0.20 (24 Oct); not
  confirmed otherwise (24 Oct); can't tell if either reader's cell is invalid (S_whole < 0.30 or < 30 items switched;
  24 Oct). Point estimates, top-token read; cand read descriptive." Here the layer is Lightning's L27 (Dan, 27 Oct
  ~15:00), in place of 32; no new thresholds. As computed (fixed by the agent before any run; Dan may override before
  the run): J++ k = 25 signed OMP over the letter-token J++ vectors of Zach's lens at L27 (the "jpp" arm), excess =
  Jdep - Rdep with Rdep against X0's random subspace at the J++ part's own share (seed 888 + 27); the gate as X0's (unedited
  org accuracy under the top-token read >= 0.80 for both readers on all scenes, and >= 150 eligible scenes), a failed
  gate or n is "can't test" (no 0.75 rerun here); the first 200 eligible scenes in scene order. W_U, W_E and the random
  dictionary are not run (Dan: arms whole / without J++ / without its random part); the k curve and the non-negative
  arm are not run. Sealed: no verdict in the job; scripts/x45s.py verdict (by hand, after Q46.2 is committed) writes
  the rule's outcome and beside it, not in the rule: the gap (recall's extra loss minus the lookup's) with its paired
  cluster-bootstrap CI over bridge items (10,000, seed 0), its logit-difference (x0_logit_diff) and probability
  (x0_prob_and_shares) versions from the same rows, all of them split by sentence order (the original bridge's locker
  sentence before / after the asked pick, x0_strata 'org locker vs asked pick'), X0's labels, and a verify-pack view
  (10 random scenes, seed 0, the prompt as the model reads it with the patch position marked, each arm's answer).
controls:
- 'without a random part of the J++ part''s share (X0''s random subspace, seed 888 + layer): the reference of each extra loss'
- 'both readers on the identical patch (one change per scene)'
- 'X0''s valid-cell bar (S_whole >= 0.30 and >= 30 switches), in the rule (can''t tell)'
- 'the read gate (0.80) on all scenes'
- 'the smoke (x45s_smoke_lightning): kernels, lens, no-op patch, write at the bridge word'
n: 'the first 200 eligible scenes of d1_topics_v3 in scene order (as the main test on every model; < 150 eligible = can''t test), 2 readers; tokenizer check 27 Oct: 516 of 600 scenes made (84 dropped: the bridge is not one token at one position), all answers one token'
seeds: [24, 0, 888]
notes: "DRAFT, NOT QUEUED (Dan 27 Oct ~15:00). Enqueue only after Dan's Q46.2 answer is committed and x45s_smoke_lightning has passed (it needs Zach's lens file and mamba-ssm revision). Verdict by hand after Q46.2 is committed: BJ_TARGET=nemotron-3.5-lightning uv run python scripts/x45s.py verdict --main nem35l_x45s_main --clean nem35l_x45s_clean --smoke nem35l_x45s_smoke (refuses until Q46.2 and Q46.3 hold Dan's committed answers). Layer: L27 = block 30 of 52 (58% depth), a Mamba block (attention at 5, 12, 19, 26, 33, 42), inside the lens's fitted layers 0-50. Risk known before the run, from stored data: on Muse (also 52 blocks) the bridge word's change stopped switching lookups past L28 (whole-change switches 0.35 / 0.27 / 0.04 at L26 / 28 / 30; recall 0.58 / 0.49 / 0.41; muse30b_x0_necessity_depth), so a lookup cell below X0's bar, 'can't tell', is a real outcome here. Points for Dan: n is the first 200 eligible scenes, as the main test everywhere (45s-b takes every scene, as 45m); BJ_SUITE_BATCH=16 (Zach's Lightning value; with 4 rows per read batch any value >= 4 gives the same batches). Seeds: 24 the set, 0 the bootstrap and examples, 888 + layer the random subspace. Cost (timing ledger, sesterce-h100x2, H100 PCIe; the 45r spec's linear model from Muse: 4.1e-6 h per read, 0.198 h fixed for the load and competence on ~550 scenes): 200 scenes x 2 readers x 4 reads (none, whole, no J++, no random part) = 1,600 reads; 0.198 + 1,600 x 4.1e-6 = 0.21 h at Muse's speed, est 0.25 (Zach's same-task runs: Lightning 0.42-0.55x Muse's time per row)."
