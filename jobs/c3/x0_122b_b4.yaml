id: x0_122b_b4
title: "122B grid b4 (Dan, 25 Oct ~00:20; held-out model): the mass-mean A, V and layout-free Alf directions fit on b3's states, removed and kept alone, both readers; PCA at Alf's share as the reference; duplicate-pick pairs by nearest class mean"
thread: C3
gpus: 2
mem_gb: 150
est_gpu_hours: 0.4
depends_on: [x0_122b_b3]
command: >-
  BJ_TARGET=qwen3.5-122b-a10b BJ_DEVICE_MAP=auto uv run python scripts/x0_massmean.py run --name qwen35_122b_x0_massmean_grid --single qwen35_122b_x0_single --states qwen35_122b_x0_probe_v4 --mode grid
  && BJ_TARGET=qwen3.5-122b-a10b uv run python scripts/x0_dup_nearest.py --fresh qwen35_122b_x0_probe_v4 --single qwen35_122b_x0_single --states qwen35_122b_x0_amnesic --out qwen35_122b_x0_massmean_grid
question: >-
  On the 122B at L33, does removing the layout-free pointer directions (Alf) from the one-change edit cost the lookup and not the recall, as on the 9B; what do A and V do, removed and kept alone; and does the alt state point at the first mention in the duplicate-pick pairs?
why_it_matters: >-
  The grid rows "the lookup uses the Alf directions, lookup-specifically" and "the lookup uses the value" on the held-out model.
hypotheses:
  H-lookup-specific: 'Alf removal is lookup-specific. Prior: Dan''s Q31.5 (batch 31)'
decision_rule: >-
  Fixed in advance (Dan, 25 Oct ~00:20; the 9B thresholds). Alf removed: (a) lookup-specific iff lookup excess >= 0.20 (lower CI > 0) and recall <= 0.10 or at most half the lookup's; (b) both readers iff both lose >= 0.10 and not (a); (c) neither iff the lookup's lower CI <= 0; else (d). V removed: the lookup's lower CI > 0 -> "the lookup uses the value". A, keep-only arms and PCA at Alf's share: descriptive. Items: the single-change items with both locker sentences before the pick. Cluster bootstrap over bridge entities (10,000 resamples, seed 0). Results stay closed until Dan's batch-31 commit.
controls:
- 'each subspace against a random-subspace part of its own share; each kept subspace against the random part alone'
- 'PCA at Alf''s share (the layer''s top-2,000 directions)'
- 'both readers on the identical patch; subspaces fit on fresh scenes, disjoint from the test items'
n: 'the single-change items of qwen35_122b_x0_single with both locker sentences before the pick'
seeds: [0]
notes: "122B on both GPUs; the CPU stage runs on the box after the GPU one."
