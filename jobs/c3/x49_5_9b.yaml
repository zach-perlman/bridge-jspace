id: x49_5_9b
title: "Batch 49.5 on the 9B: clean-checkout reruns of the headline cells for Thursday's hand check (the main test L12 chat, routes C2, the pointer removal and only-U arms, 47.5's zeroing, 47.8 at L10 and L12), same commands as the runs of record, run names qwen35_9b_clean49_*, compared row for row"
thread: C3
gpus: 1
mem_gb: 40
est_gpu_hours: 1.3
depends_on: []
command: >-
  f=0;
  BJ_TARGET=qwen3.5-9b uv run python scripts/x0_necessity.py run --name qwen35_9b_clean49_x0_necessity --set d1_topics_v3 --renderings chat raw --why "batch 49, test 49.5 (jobs/c3/batch49.yaml): clean-checkout rerun of qwen35_9b_x0_necessity, same command (X0, the 9B, chat and raw; bridge word, layers 6-20 every 2, predicted 12)" || f=$((f+1));
  BJ_DEVICE_MAP= BJ_TARGET=qwen3.5-9b uv run python scripts/x6_routes.py run --name qwen35_9b_clean49_x6_routes || f=$((f+1));
  BJ_DEVICE_MAP= BJ_TARGET=qwen3.5-9b uv run python scripts/x6_routes.py run --name qwen35_9b_clean49_x6_routes_keeponly --conditions C1,C2 --keeponly || f=$((f+1));
  BJ_DEVICE_MAP= BJ_TARGET=qwen3.5-9b uv run python scripts/x47_zero.py run --name qwen35_9b_clean49_x47_5 --why "batch 49, test 49.5 (jobs/c3/batch49.yaml): clean-checkout rerun of qwen35_9b_x47_5, same command (47.5: on S, the bridge word's state without its projection on Δ's 25 OMP atoms at L12 and at L12..15, against a random subspace of the same share)" || f=$((f+1));
  BJ_DEVICE_MAP= BJ_TARGET=qwen3.5-9b uv run python scripts/x47_anatomy.py run --name qwen35_9b_clean49_x47_anatomy --layers 10 12 --why "batch 49, test 49.5 (jobs/c3/batch49.yaml): clean-checkout rerun of qwen35_9b_x47_anatomy at L10 and L12 only (--layers 10 12), otherwise the same command" || f=$((f+1));
  echo "clean49: $f of 5 commands failed"; test $f -eq 0
question: >-
  Do the 9B's headline cells come back row for row when their commands are rerun from one clean, committed checkout
  (the queue's fresh checkout of this job's commit), rather than the working trees (all recorded dirty) that produced
  the runs of record?
why_it_matters: >-
  Thursday's hand check reads these cells (jobs/c3/batch49.yaml, the pack order: main gap; routes 0.48/0.51/0.00;
  pointer removal 0.08 vs 0.54; 47.5 zeroing 0.97/1.00; 47.8 9B position 0.51 at L12). Every run of record was written
  from a tree with uncommitted changes; a clean rerun ties each number to a commit, as amendment 57's clean57 did for
  the breadth cells.
hypotheses:
  none: "49.5 has no prediction question (jobs/c3/batch49.yaml: 'prediction: none'); descriptive."
decision_rule: >-
  Descriptive: row-for-row identity with the runs of record; any difference listed. By hand after `jobq pull` (CPU):
  uv run python scripts/x49_clean.py writes results/checks/clean49_9b.json (per pair: rows record / clean / shared,
  rows only in one run, per compared field the shared rows where it differs, max |diff| of p_org, p_alt and ld, the
  first 10 differing rows, the manifests' code) and docs/handcheck_clean49.md (one line per headline cell, record and
  clean values recomputed from outcomes.jsonl, then one line per pair). Row keys and compared fields per experiment:
  x0_necessity (scene, rendering, layer, reader, upstream, dict, k, omp, arm) -> switched, cand_switched,
  cand_org_first, role, ws_skipped; x6_routes (scene, condition, reader, arm) -> top, route, switched, cand_switched,
  cand_org_first, role; x47_zero (scene, reader, arm) -> kept, to_org, cand_kept, top, role; x47_anatomy (scene,
  condition, reader, layer, arm) -> route, switched, top, top_text, cand_switched, cand_org_first, role, the record's
  rows restricted to L10, L12 and the unedited row. No threshold: identical or not, every difference reported.
controls:
- 'the runs of record themselves (same commands; only the run name changed, and --layers 10 12 on 47.8)'
- 'the 45.0 merge gate (27 Oct, f2b78fdc): the main-test cell at L12 chat already came back identical once (9600 of 9600 rows, qwen35_9b_x0_main_gate_head), from a dirty tree; this job repeats it from a clean one'
n: 'as the runs of record: main test 200 scenes per rendering (chat; raw fails its gate as in the record); routes 300 scenes per condition (C0, C1, C2); keep-only 300 per condition (C1, C2); 47.5 200 scenes; 47.8 200 test scenes and their C0 scenes, at L10 and L12'
seeds: [24, 2510, 0, 777, 888]
notes: "Batch 49 (Dan, 28 Oct), test 49.5; amendment 1 queue order item 6. The queue runs the job in a fresh checkout of its commit (scripts/jobq.py), so the five commands run at this commit with nothing uncommitted. Runs of record and their commands: qwen35_9b_x0_necessity (job qwen35_9b_x0_necessity, jobs/c3/qwen35_9b_x0_necessity.yaml; code 502b920f, dirty); qwen35_9b_x6_routes (job x6_routes_r2, jobs/c3/x6_routes_r2.yaml, the 9B chain's second command; code dc9992a7, dirty; its 20-scene C0 smoke qwen35_9b_x6_routes_c0 is not rerun: the full run makes its own C0 check, c0_check.json); qwen35_9b_x6_routes_keeponly (job x6_routes_keeponly, jobs/c3/x6_routes_keeponly.yaml; code 3d42857c, dirty); qwen35_9b_x47_5 (jobs/c3/x47_5_9b.yaml; code 86a467f5, dirty); qwen35_9b_x47_anatomy (jobs/c3/x47_8_9b.yaml; code 840f31b9, dirty). Run names: pins.check_run_name requires the 9B's prefix qwen35_9b_ (a bare clean_ prefix is refused), so qwen35_9b_clean49_<record name without the prefix>. Environment as recorded: x0_necessity without BJ_DEVICE_MAP (as its record), the others with BJ_DEVICE_MAP= (empty: no split; the same single-GPU load for the 9B); BJ_SUITE_BATCH from the box's .env (64 in the 47.x records; the 45.0 gate reproduced the main-test cell with 64). The --why texts name this test; the manifests record them, nothing reads them. Code paths changed since the records (the point: same command at this commit): scripts/x0_necessity.py 20 commits since 502b920f (new arms and flags off by default: --alt, --atom-slices, --sealed, the 45s layer tables for other targets, manifest fields; 4 commits since the 45.0 gate's f2b78fdc), scripts/x6_routes.py 15 since dc9992a7 and 11 since 3d42857c (flag-gated arms 45a/45e/45k/47.1, warm_cusolver before the model load, thin SVD on the CPU in orthonormal, manifest switches), scripts/x47_zero.py none (and 1 verdict-only commit in its imports), scripts/x47_anatomy.py 2 (--layers, 95158f43; the verdict's answer format). Known source of a non-identity on 47.8 only: with 2 layers a scene's read is 27 rows instead of 196, so the BJ_SUITE_BATCH chunks hold other rows than in the record; bf16 logits may then differ in the last digits (max |diff| reported; a changed top token would be listed). Pre-registration's pack line says '47.8 9B position ... 0.00 at L10'; the record's L10 position share is 4/200 = 0.02 (verdict x47_8-20261028T114551Z: 0.02), reported as computed. Estimate from results/jobq/ledger_sesterce-h100x2.jsonl (H100 PCIe, run_s): qwen35_9b_x0_necessity 1315 s (the same command); the 9B's x6_routes chains ran beside the 27B's in 2-GPU jobs (x6_routes_r2 2449 s, x6_routes_keeponly 1421 s, the 27B's chain the longer), so from the 9B-only x45k_9b_q2 (C0, C2, 9 arms) 867 s: routes (C0-C2, 6 arms) ~1000 s, keep-only (C1, C2, 10 arms) ~800 s; x47_5_9b 458 s; x47_8_9b 1546 s over 15 layers, its stages scaled to 2 layers (competence and forwards unchanged, reads and per-layer fits 2/15) ~800 s; model loads 5 x ~40 s. Sum ~4,600 s = 1.3 GPU-h (Dan's ~1). Results: ~45 MB in results/ (47.8's cache about 8 MB at 2 layers). After the pull: uv run python scripts/x49_clean.py (CPU, seconds)."
