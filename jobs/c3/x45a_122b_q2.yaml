id: x45a_122b_q2
title: "Batch 45a on the 122B L33 (optional, gate 0.75 after the data as its routes runs): first mention or first locker? Routes C2 with one sentence before both prompts (V0-V4)"
thread: C3
gpus: 2
mem_gb: 150
est_gpu_hours: 1.8
depends_on: [x45_0_indep_9b]
command: >-
  BJ_TARGET=qwen3.5-122b-a10b BJ_DEVICE_MAP=auto uv run python scripts/x6_routes.py run --name qwen35_122b_x6_routes_x45a_g75 --conditions C2 --prepend V0,V1,V2,V3,V4 --gate 0.75 --sealed
question: >-
  Is the pointer's first slot "the first locker sentence" or "the first item stated before any other"? When a pick sentence naming an item comes before the lockers, does the pointer part alone still give position answers on moves to or from the first locker?
why_it_matters: >-
  The pointer's wording rests on what slot 0 codes (Dan, batch 45); the 122B only if time (batch45.yaml).
hypotheses:
  H-batch45: 'Q45.3 (45a) in predictions/2026-10-26_dan.md (section Batch 45), committed by Dan before any result is opened (a458b3d9) (the 122B: if time)'
decision_rule: >-
  Fixed in advance (jobs/c3/batch45.yaml, 45a): "First locker stated before any item" if V1, V2 and V3 each cut only-pointer position on first-locker moves to at most half of V0 (paired CI excluding 0) while V4 does not; "Order of lockers, picks ignored" if V1, V2 and V3 stay within 0.10 of V0; otherwise mixed. As computed (x6_routes.first_locker_rule): the lookup's position share with only the pointer part (keep_alf) on the C2 scenes whose pointer move (the O bridge's locker slot -> the S bridge's) involves slot 0, the base scenes every variant has (paired); a variant cuts if its point estimate is <= 0.5 x V0's and the paired cluster-bootstrap 95% CI of V0 minus it has lower bound > 0; within = |variant - V0| <= 0.10 on the point estimates; if both rules hold (possible when V0 <= 0.2) the first is reported and flagged; a variant that misses its gate makes the verdict "not tested". Read beside it (descriptive): without the pointer against its random part; the code's shift beta per variant vs V0, overall and per slot j. Gate: O's read accuracy >= 0.75 per reader, per variant (the 122B's routes gate, lowered after the data on 25 Oct). Cluster bootstrap over bridge items, 10,000 resamples, seed 0.
controls:
- 'V0: the unchanged routes C2 prompts (a rerun; the same base scenes as qwen35_122b_x6_routes_g75)'
- 'V4: a neutral sentence of 10-12 tokens (x8_write.FILLERS, as batch 44 B1)'
- 'every kept or removed part against a random part of the same share of the change (per scene)'
- 'the recall on the identical patch'
n: "up to 300 base C2 scenes eligible in every variant (5 variants each)"
seeds: [2510, 4501, 888, 0]
notes: "Re-queued as x45a_122b_q2 (Dan ~21:20): x45a_122b was cancelled before it ran so that the 45b layer sweep runs before the 122B block; command and rule unchanged. Optional (batch45.yaml: the 122B if time). Both GPUs. Sealed (--sealed): no verdict runs after the job. After Dan's commit of Q45.3, by hand: uv run python scripts/x6_routes.py verdict --name qwen35_122b_x6_routes_x45a_g75; uv run python scripts/x6_routes.py examples --name qwen35_122b_x6_routes_x45a_g75 (CPU). Pointer basis: Alf from qwen35_122b_x0_probe_v4 (not refit)."
