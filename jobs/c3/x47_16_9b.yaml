notes: "Batch 47, amendment 5 (Dan, 28 Oct ~03:10; queue placement after 47.7(c): 47.16 (9B, Muse)). SEALED: the run writes manifest, gate.json (gates per k, stopped_at, skipped, chosen), competence.jsonl, cases.jsonl, states.npz (O's bridge-word states per k), outcomes.jsonl, norms.jsonl, beta.jsonl; no verdict. By hand after Dan's Q47.16 is committed (CPU): uv run python scripts/x47_distance.py verdict --runs qwen35_9b_x47_16 muse30_x47_16 (writes results/x47_distance/x47_16-<time>/ with x47_16.md, x47_16.json and the verify-pack view examples.md: 10 random chosen base scenes per run, seed 0, at every tested k, both readers' prompts as read with the bridge word marked, S beside, every arm's answer). Seeds: 2510 the scenes (x6_routes), 4716 the fillers, 4717 the random directions, 888 + L the random subspace, 0 the bootstrap and the examples. The plan's 5 rendered prompts (base scene 1 at k = 0, 5, 20, 50, the lookup's O as read; base scene 2 at k = 50, the recall's) are in the plan's output (uv run python scripts/x47_distance.py plan, BJ_TARGET=qwen3.5-9b) and in the agent's handoff. x6_routes --filler-tokens inserts one filler sentence; the k-sentence block is rendered in this script (x6_routes untouched). Cost from the ledger (results/jobq/ledger_sesterce-h100x2.jsonl, H100): x45a_9b (5 variants x 700 competence candidates + 1,500 read scenes, prompts ~80 tokens) took 2,621 s. Here 4 x 420 = 1,680 competence candidates and up to 4 x 300 read scenes, with prompts of 74 / 135 / 318 / 682 tokens (mean ~300, x3.8 the routes' length): between 0.58 x 2,621 s = 1,500 s if the cost is per case and 3.8 x that = 5,700 s if it is per token; the 8-token greedy competence step is mostly per case, the reads per token: estimate ~3,000 s = 0.85 h, 1.0 GPU-h with the load (Dan's ~0.6; a stop at k = 50 cuts the longest quarter). x45a_9b peaked at 31.1 GB; reads are 8 rows of at most ~700 tokens; mem_gb 40."
