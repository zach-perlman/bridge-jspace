id: x53_6_9b
title: "Batch 53.6 on the 9B (L12): the recall, lens identity vs address, in conflict. At the bridge word: the lens part toward item B (25 J++ atoms of B's change) plus the address swap toward item C's slot (s = 2, the probe run's pointer means); the recall's answer classed B / C / original; x6_routes' C0 scenes with three distinct legs counts; no prediction; UNVERIFIED"
thread: C3
gpus: 1
mem_gb: 40
est_gpu_hours: 0.2
depends_on: []
command: >-
  export BJ_TARGET=qwen3.5-9b BJ_DEVICE_MAP= PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  uv run python scripts/x53_identity_address.py run --name qwen35_9b_x53_6 --why "Batch 53, test 53.6 (jobs/c3/batch53.yaml, Dan 29 Oct 09:30): the recall, lens identity toward B vs the address swap toward C's slot (s = 2) at the bridge word at L12 on the 9B; no prediction" &&
  uv run python scripts/x53_identity_address.py verdict --runs qwen35_9b_x53_6
question: >-
  When the bridge word carries two conflicting signals, the lens part of B's identity and an address pointing at C's
  locker slot, which does the recall follow: B's attribute (the lens identity), C's (the address), or both?
why_it_matters: >-
  Batch 53 (Dan, 29 Oct 09:30), test 53.6 (priority 8 in the 09:50 list): whether the recall reads the item through the
  lens identity or through the address the lookup uses.
hypotheses:
  none: "No prediction (batch 53: every rule fixed in Dan's brief before any run)."
decision_rule: >-
  Verbatim from jobs/c3/batch53.yaml (brief, 53.6): "9B, Lightning. At the bridge word: the lens part toward item B
  plus the address swap toward item C's slot (s = 2). Read: the recall answers B's, C's or the original. Rule: "the
  recall follows the lens identity" if B's share >= 2x C's; "follows the address" if C's >= 2x B's; else both." As
  computed (scripts/x53_identity_address.py, fixed before the run; built on x6_routes / x8_write as the coordinator
  asked): scenes = x6_routes' generator (seed 2510, 1,400 per condition, prefix-stable: the first 700 are the routes
  runs'), its C0 pairs (O: Iris picked A; S_B: Iris picked B, nothing else); C = the third item; kept where the three
  legs counts differ (the generator makes A's and B's differ; 512 of 1,400 C0 scenes on the 9B's tokenizer); X0's
  competence on these (both readers say and read O's and S_B's answers right) and X0's gate (O's read accuracy >= 0.80
  per reader); the first 300 eligible in generator order. At the bridge word (Iris's pick) at L12 on O: the lens part
  = P_J (h_{S_B} - h_O), X0's 25-atom signed OMP over the letter-token J++ dictionary at L12 (x49_gain.lens_parts);
  the address swap = 2 (mu_{j_C} - mu_{j_A}), mu = x0_massmean.pointer_means(qwen35_9b_x0_probe_v4) (x8_write's means,
  not refit), j = the locker slot in O; the rule's arm adds both. The recall's top token classed B (B's legs), C
  (C's legs), original (A's legs) or other; shares over the scenes; point estimates decide (EPS 1e-9); the clauses in
  the brief's order; neither B's nor C's answer at all (both 0): "neither (no B or C answers)" (both clauses would hold
  by arithmetic alone). Cluster-bootstrap CIs over the original bridge item (10,000, seed 0) beside. Beside, not in
  the rule: the lens part alone, the address alone, the lens part plus a random direction of the address's norm
  (seed 5306), O unedited; the lookup's classes (B's / C's / A's locker digit); ||lens||, ||addr||, ||Δ_B||, the lens
  part's share. Verdict in the job: results/x53_identity_address/x53_identity_address-<UTC>/.
controls:
- "the lens part alone (B's identity, no address) and the address alone (no lens part): what each signal does by itself"
- "the lens part plus a random direction of the address's norm (seeded): the address's effect beyond its size"
- "O unedited (the floor); the lookup read on every arm beside (B's / C's / A's locker digit)"
- "X0's gate on the scenes read (0.80 per reader on O) and X0's eligibility (both readers right on O and S_B)"
n: "the first 300 eligible of 512 C0 scenes with three distinct legs counts (x6_routes' generator, 1,400 per condition, seed 2510); A -> C slot moves balanced (0->1 82, 0->2 80, 1->0 82, 1->2 85, 2->0 91, 2->1 92 before eligibility); 5 arms x 2 readers"
seeds: [2510, 5306, 888, 0]
notes: "Batch 53, test 53.6 (coordinator ~10:00: moved to this agent; Dan's 09:50 list: priority 8). Box: any idle GPU with 40 GB (mats GPU 1 after 53.2's forwards, per the brief's boxes). New script scripts/x53_identity_address.py (plan / run / verdict), tested on x49_das_pos's fake model with x51_das's word-tokenizer C0 scenes (tests/test_x53_identity_address.py: the roles and the ambiguous-legs drop, the classes, the arms' vectors, the labels at the bars, the address arm recomputed through the fake's own read, run and verdict end to end). The pointer means load from the committed results/x0_probe/qwen35_9b_x0_probe_v4/states.npz (checked on CPU). Writes results/x53_identity_address/qwen35_9b_x53_6/ (manifest.json before the model loads, gate.json, cases.jsonl with each scene's roles, norms.jsonl, outcomes.jsonl) and the verdict folder x53_identity_address-<UTC>/ (verdict.md, verdict.json, x53_identity_address.png, examples.md = 10 random scenes, seed 0). Cost (ledger): x51_3_9b's top-up read ~0.7 s per routes scene with competence and the whole change; here competence on 512 scenes (~5 min), 600 state forwards and 600 batched reads of 5 rows (~2 min), load ~1 min: ~8 min; est 0.2. Memory: the 9B's reads peak near 20 GB. Disk on the Mac before the spec: 185 GB free. UNVERIFIED; into EXPERIMENTS.md with a card and the figure."
