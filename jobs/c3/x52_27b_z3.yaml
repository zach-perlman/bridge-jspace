decision_rule: >-
  The rule unchanged, verbatim from jobs/c3/x50_z3_muse.yaml (jobs/c3/batch50.yaml, Z3; first scored in
  results/x50_zach/z3-20261028T163053Z): "Value <= 0.05; report identity / position shares. If position >= 0.2: the
  address exists in scattered-fact passages; then and only then fit a label-free address basis on a held-out half (as
  45d) and run without / only it vs random. If position <= 0.05: "no position route in his layout": the address is a
  property of listed layouts." As computed: x50_z3_muse.yaml's text unchanged (his v2 facts module, level-0 P-start K
  passages with all three facts before the asked person's pointer sentence; sets in order until 200 eligible:
  jsuite_v2_test_chat, jsuite_v2nb_test_chat, jsuite_v2r2_test_chat, jsuite_v2r3_test_chat; B / C order and the value
  seeded 5001; alignment as there; C0 = S0, the pointer's name alone, descriptive; his chat framing, the top token at
  the first answer step, x6_routes.classify; the gate 0.80 on O's read; eligibility O said / read a, S said / read e;
  arms whole (the rule), without J++ (signed OMP, k = 25) and without a random part of its share (seed 888 + L),
  descriptive; cluster bootstrap over the original bridge entity, 10,000, seed 0; point estimates decide, EPS 1e-9;
  position >= 0.20 -> "the address exists in scattered-fact passages", <= 0.05 -> "no position route in his layout",
  else in between; the value check beside) on the 27B's tokenizer. Layer: x50_zach.LAYERS['qwen3.6-27b'] = (32,),
  batch 50's own 27B layer, which is X0's L32 and the start of Zach's 27B band L32-40 (BESIDE_BAND): one layer, as the
  9B's design (the two coincide; Muse and Lightning report two because X0's L lies below his band). The 45d follow-up
  is not in this job (due only if position >= 0.2). Verdict in the job (verdict --coverage, results/x50_zach/x52_z3-<UTC>/).
