notes: "Batch 48 (Dan, 28 Oct ~02:30), 48.1 on the 9B, high in the queue (not cut). Sealed: the run writes manifest, pairs (scene ids and splits), cases, states_L12.pt (h_O, h_S, Delta per pair), R.pt (every R, U, U_fit), train.jsonl (loss curves), geometry.jsonl, readouts.json, outcomes.jsonl, routes_cases / routes.jsonl; no verdict. By hand after Dan's Q48.1 is committed: uv run python scripts/x48_das.py verdict --runs qwen35_9b_x48_das muse30_x48_das (CPU; verdict.md, verdict.json, examples.md = 10 random test pairs, seed 0). Seeds: 0 the split, bootstrap and examples; 48 R's init; 4801 the shuffled targets; 4802 the random R; 4803 the training batches; 2510 x6_routes' scenes. Cost (ledger arithmetic): trainings = 4 k x 2 readers x 2 (real + shuffled) = 16; each 300 steps x 16 rows = 4,800 forward+backward rows, 76,800 in all, in micro-batches of 8 = 9,600 micro-batches; x45p_9b took 115 s for ~3,000 single-prompt passes (0.03 s each, ~70-token prompts), so a batched forward of 8 ~0.1 s and forward+backward ~0.3 s: 9,600 x 0.3 = 2,900 s = 0.8 h; states 150 forwards + reads (28 held-out pairs x 2 readers x 22 arms = 1,232) + routes (160 competence scenes ~1,000 passes, 100 x 2 x 10 reads) ~4,400 passes x 0.03 = 130 s; load ~2 min; total ~0.9 h, est 1.2 (Dan ~1.5 incl. the k sweep). Small test split (7 entities): CIs will be wide; Dan may widen the pool (the one-pick runs) before the run."
