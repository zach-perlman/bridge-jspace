id: x52_lightning_das51
title: "Batch 52, Lightning ports (Dan's 08:55 GPU queue item 3): 51.3 on nemotron-3.5-lightning at L14, ADAPTED DESIGN (the clean one-pick source left out: its gate fails on Lightning; pairs from the main test and routes C0 only, 354 lookup / 350 recall): 48.1's DAS with early stopping on pooled identity pairs and 49.8's on routes position pairs, through the torch Mamba-2 path (BJ_DAS_MAMBA=torch, after x52_lightning_das_gradcheck); no prediction; UNVERIFIED"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 3.0
depends_on: [x52_lightning_das_gradcheck]
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_DAS_MAMBA=torch PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  L=$(uv run python scripts/x51_lightning.py layer) && export BJ_PREDICTED_LAYER=$L &&
  ADAPTED=$(uv run python -c "from scripts import x51_das as Z; print(Z.NO_CLEAN['nemotron-3.5-lightning'])") &&
  NOTE="no prediction: coverage run on an already-scored rule (batch 52, Lightning ports, Dan's 08:55 GPU queue item 3: 51.3 on Lightning at L$L, DAS through the torch Mamba-2 path, BJ_DAS_MAMBA=torch, after x52_lightning_das_gradcheck); $ADAPTED" &&
  uv run python scripts/x51_das.py run --name nem35l_x52_das51 --why "Batch 51, test 51.3 (jobs/c3/batch51.yaml) on Lightning, batch 52 (Dan's 08:55 GPU queue item 3; BJ_DAS_MAMBA=torch): DAS at scale at L$L; identity pairs pooled from the main test and routes C0 (300-600 per reader, entities held out 60/20/20), address pairs from routes C1 (>= 300); recall k 4/16/64/128, lookup 4/16, address 2/4/8; $NOTE" &&
  printf '%s\n' "$NOTE" > results/x51_das/nem35l_x52_das51/coverage.txt &&
  uv run python scripts/x51_das.py verdict --coverage --runs nem35l_x52_das51
question: >-
  On Nemotron 3.5 Lightning at L14, with 300-600 pairs per reader, is there a low-dimensional subspace (k <= 128) of
  the change at the bridge word that mediates the recall; where does the lookup's subspace sit (the address U, W_E, J++
  or outside everything named); and does the learned address (49.8's R_pos) overlap U and 47.2's W?
why_it_matters: >-
  Dan's 08:55 queue, item 3: "then 51.3, 48.1, 51.11 parts 1 and 3". 51.3 is done on the 9B, Muse and the 27B; on
  Lightning the DAS cell was "not tested" until a backward through NemotronH was checked (x52_lightning_das_gradcheck,
  on which this job depends).
hypotheses:
  none: "No prediction (batch 52 addendum): coverage run on an already-scored rule."
decision_rule: >-
  Verbatim from jobs/c3/x51_3_27b.yaml (= x51_3_9b.yaml; first scored on the 9B, Muse and the 27B in
  results/x51_das/verdict-20261028T194630Z): "Fixed in advance (jobs/c3/batch51.yaml, 51.3): 48.1's rules (a)-(d) and
  fallback and 49.8's labels at k = 4, unchanged, plus "no low-dimensional recall subspace at this token and layer" if
  the recall's own-IIA < 0.5 at k = 128 with >= 300 pairs (a result, not a failure to converge). Report own-IIA per k;
  cross-IIA (the lookup subspace on the recall and back; the address subspace on each reader); the lookup subspace's
  energy in U / W_E / J++ / outside; the address subspace's overlap with U and with 47.2's W." As computed: as
  jobs/c3/x51_3_9b.yaml (the same code and choices: 48.1's DAS with early stopping on dev IIA around its loop, every 25
  steps, patience 4, best dev R kept; the global RNG seeded per R; identity pairs = locker-first scenes the stored whole
  change switches for the reader, at most 600 per reader in pool order; routes C0 top-up to 300 if short (not needed
  here); address = routes C1 position pairs topped up to 300; split by entity 60 / 20 / 20, seed 0; chosen k as 48.1;
  test point estimates at the bars, cluster-bootstrap CIs over bridge entities beside; 48.1's k = 64 fallback "not
  tested"), on Lightning at the committed L14, with ONE DESIGN CHANGE, labelled everywhere (coordinator 29 Oct 10:15
  Paris, option A): "adapted design: the clean one-pick source left out (its gate fails on Lightning, recall 0.751 <
  0.80, results/x0_necessity/nem35l_x45s_smoke_clean/gate.json); pairs from the main test and routes C0 only (354 lookup
  / 350 recall, above the 300 bar)". Sources: nem35l_x52_conflict (the main test at L14, the 60 dev scenes excluded;
  58 lookup / 59 recall), nem35l_x52_routes C0 (296 / 291); nothing below gate. Address: the stored 235 position pairs of
  300 C1 scenes, topped up to 300 (78% position; 261 more eligible C1 scenes in the stored generation). U = Alf on
  nem35l_x52_probe (rank 4). W = 47.2's W from results/x47_six/nem35l_x52_six/fit.npz (Lightning's 47.2 coverage run,
  L14, rank 5; x51_das.load_w reads x47_six.COVERAGE_RUNS for Lightning). The run fix BJ_DAS_MAMBA=torch: every forward
  that records a gradient (the DAS training forward) runs NemotronH's Mamba-2 mixer and the other HF-hub kernel forwards
  on transformers' torch reference (x48_das.kernels_off); reads without a gradient (dev IIA, states, every arm, the
  top-up, the routes read) keep the pinned kernels. Verdict in the job: x51_das.py verdict --coverage --runs
  nem35l_x52_das51 ('no prediction', the adapted-design label first, results/x51_das/x52_das51-<UTC>/, never the
  default verdict-<UTC>/).
controls:
- 'untrained random R of the same k (identity 4802 + k, address 4982 + k): IIA, energy and shares beside every trained R'
- 'R trained on shuffled targets (48.1''s and 49.8''s shuffle seeds), early-stopped on its own shuffled dev targets: must sit at the random R'
- 'the whole change and O unedited reread on the select and test pairs (ceiling and floor; IIA / S_whole beside)'
- 'cross reads: R_lookup on the recall, R_recall on the lookup, R_pos on both readers of the identity pairs (each beside the random R of its k), the recall''s move under R_pos on the address pairs'
- 'per source (main / routes) own-IIA at the chosen k on the test pairs, beside the pooled number'
- 'the top-up''s gate: O''s read accuracy >= 0.80 per reader over the top-up scenes, else its pairs are not used (recorded)'
- 'the torch path checked first against the kernels (x52_lightning_das_gradcheck; this job depends on it)'
n: 'plan (CPU, the stored runs, Lightning''s tokenizer, x51_das.py plan): identity 359 scenes, lookup 354 (train 211 / select 74 / test 69), recall 350 (211 / 71 / 68), 42 entities (25 / 8 / 9); no identity top-up; address 235 stored position pairs of 300 C1 scenes (30 entities), topped up to 300'
seeds: [0, 48, 4801, 4802, 4803, 49, 4981, 4982, 2510]
notes: "Batch 52, Dan's 08:55 GPU queue (jobs/c3/batch52.yaml morning_queue) item 3; coordinator 10:15 Paris: option A (adapted design, nothing below gate). depends_on x52_lightning_das_gradcheck (same box; a failed check blocks this job). Run name nem35l_x52_das51 = x51_das.COVERAGE_RUNS['nemotron-3.5-lightning'] (x51_das.RUNS and 51.3's own verdict unchanged). Code: x51_das gains COVERAGE_RUNS, NO_CLEAN (the label; pools() leaves the clean source out for a target without a CLEAN_RUN), ROUTES_RUN['nemotron-3.5-lightning'], load_w through x47_six.COVERAGE_RUNS, the torch_mamba record in the manifest ('mamba_kernel'; 'adapted' too) and verdict --coverage (no seal guard, x52_das51-<UTC>/); tested on the fake model (tests/test_x51_das.py). For scripts/x52_coverage.py (not touched here): track('x52_lightning_das51', 'x51_das/nem35l_x52_das51', 'x51_das/x52_das51-*', note='adapted design'). Cost: 18 trainings (lookup k 4/16, recall 4/16/64/128, address 2/4/8, each with its shuffled twin) x <= 300 steps x 2 micro-batches of 8 (211 identity / ~180 address training rows, batch 16) = <= 10,800 forward + backward micro-batches on the torch path; early stopping ended the 9B's near 70% (x51_3_9b's note): ~7,600. No torch-path NemotronH backward in the ledger yet (the gradcheck measures it); arithmetic as x52_lightning_das48: ~1.0 s per micro-batch -> ~2.1 h (1.5 h if every training stops at ~50%, 3.0 h if none stops early); dev IIA reads every 25 steps with the kernels (~74 rows) ~0.05 h; states (~1,300 forwards), the address top-up (~110 C1 candidates), identity reads (~148 held-out pairs x 2 readers x 23 arms), address and routes reads, geometry, load ~0.2 h: ~2.4 h, est 3.0. Re-estimate from the gradcheck's seconds per micro-batch: at 1.0 s it ends ~2.4 h after it starts, so after the ~15:00 cut-off from any start later than ~12:30. Memory: 62 GB at inference plus the torch path's transients; x51_das.train_fit halves the micro-batch on CUDA OOM (recorded per R). Seeds: 0 split / bootstrap / examples; 48 / 4801 / 4802 / 4803 48.1's init, shuffle, random R, batches; 49 / 4981 / 4982 49.8's; 2510 x6_routes' scenes. UNVERIFIED; coverage mark with the adapted-design label."
