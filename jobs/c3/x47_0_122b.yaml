id: x47_0_122b
title: "122B coverage (Dan 18:20 item 2; gate Dan 18:45): 47.0 on Qwen3.5-122B-A10B (FP8) at L33: the J++ lens's readout of a pointer write, its reconstruction by lens atoms, and the lens's blindness; adapted design: lookup-only gate (the recall, 0.797, is not part of this test); descriptive, no prediction; UNVERIFIED"
thread: C3
gpus: 2
mem_gb: 150
est_gpu_hours: 0.8
depends_on: []
command: >-
  export BJ_TARGET=qwen3.5-122b-a10b BJ_DEVICE_MAP=auto BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  uv run python scripts/x47_verbal.py run --name qwen35_122b_x47_verbal &&
  uv run python scripts/x47_verbal.py summary --runs qwen35_122b_x47_verbal &&
  printf '%s\n' "no prediction: coverage run on an already-scored rule (Dan 18:20 / 18:45; the 122B at L33, FP8); adapted design: lookup-only gate; the recall (0.797) is not part of this test" > results/x47_verbal/qwen35_122b_x47_verbal/coverage.txt
question: >-
  Neel's question (batch 47, 47.0) on the 122B: read through the J++ lens, does a pointer write (h + 2 (mu_k - mu_j)
  at the bridge word, the write that moves the lookup) say anything, can the lens's atoms express the pointer at all,
  and does the lens's readout move more than under a random vector of the same size?
why_it_matters: >-
  Dan 18:20 item 2: claim 9 ("the lens cannot read the address") is "not run" on the 122B (fig11).
hypotheses:
  none: "No prediction (coverage_122b_1820): descriptive; the 47.0 readings of jobs/c3/batch47.yaml as written."
decision_rule: >-
  Descriptive, verbatim from jobs/c3/x47_0_verbal.yaml (jobs/c3/batch47.yaml 47.0, operationalized in
  scripts/x47_verbal.py before any run): a case = one routes item and one write (both k != j); per readout the best
  rank (1 = top, whole vocabulary) of the ordinal set and of the digits, the KL(h || h + write); statistic = the median
  over cases, null = the same median with each of 200 random directions (seed 4701) scaled to each write's norm; ranks
  beyond the null below its 5th percentile, KL above its 95th. Reconstruction: nonneg OMP (bridge_jspace.omp) over the
  lens's unit atoms, k = 25 and 100, every non-special token and the letter tokens; the pointer's share = the larger of
  the writes' and U +/-'s mean share, against the 200 random directions' mean share. Per model "not verbalizable" =
  k = 25 unrestricted ratio <= 2, ordinal statistic not (<= 20 and beyond the null), KL within the null's 95th
  percentile; "partly verbalizable" = an ordinal or digit statistic <= 20 and beyond the null, or ratio >= 3; else
  "neither". Case-level shares with cluster-bootstrap intervals over bridge items (10,000, seed 0) beside. Gate (Dan
  18:45, jobs/c3/batch53.yaml decision_470_1845, before any 47.0 result on the 122B): lookup-only; the items are
  qwen35_122b_x8_write_g75's first 100 eligible routes C2 items (its lookup reads O at 1.00; its recall read 0.797 <
  0.80 is not part of this test); label "adapted design: lookup-only gate; the recall (0.797) is not part of this
  test", not hollow. Same rule as 47.0 otherwise.
controls:
- '200 random directions of the same norm per write (seed 4701): the null for every reading'
- 'the identity direction mu_alt - mu_org at the same norm: the positive comparison'
- 'h alone (the unwritten readout); the letter-token restriction beside the unrestricted atoms'
- 'x8_write''s lookup answers on the same items and writes (s = 2); a read check: O''s top token against x8_write''s unedited row'
n: "100 items (qwen35_122b_x8_write_g75's first 100 eligible routes C2 items), 2 writes each = 200 cases; identity on 100 items (94 pairs; the plan stage on the 122B tokenizer)"
seeds: [2510, 4701, 0]
notes: "Coverage, not hand-checked (Dan 18:20); UNVERIFIED; README untouched. Caveats: J++ fit on bf16 used on FP8; MoE; 2x H100, BJ_DEVICE_MAP=auto. U and mu from x0_massmean on the 122B's routes states (qwen35_122b_x0_probe_v4). Code: x47_verbal.X8_RUN gains the 122B (not RUN_NAME: the three-model summary's default unchanged); ADAPTED writes the label into the manifest and the summary. Cost: the 122B load + 100 forwards + the nonneg OMP (~264 vectors x 2 dictionaries x 2 k; the 122B's d = 3072, smaller than the 27B's); ~0.4 h wall."
