id: x6_routes_keeponly
title: "x6_routes_keeponly (Dan, 25 Oct ~15:50): same item moved and another item moved, adding ONLY the pointer-direction part, a random part of its share, ONLY the J++ part, a random part of its share; 27B L32 on GPU0, 9B L12 on GPU1"
thread: C3
gpus: 2
mem_gb: 120
est_gpu_hours: 1.0
depends_on: [x6_routes_r2]
command: >-
  uv run python -c "import torch" && { { CUDA_VISIBLE_DEVICES=0 BJ_DEVICE_MAP= uv run python scripts/x6_routes.py run --name x6_routes_keeponly_27b --conditions C1,C2 --keeponly; } & p27=$!; { CUDA_VISIBLE_DEVICES=1 BJ_DEVICE_MAP= BJ_TARGET=qwen3.5-9b uv run python scripts/x6_routes.py run --name qwen35_9b_x6_routes_keeponly --conditions C1,C2 --keeponly; } & p9=$!; wait $p27; s27=$?; wait $p9; s9=$?; echo "exit 27B=$s27 9B=$s9"; test $s27 -eq 0 -a $s9 -eq 0; }
question: >-
  Is a part of the change sufficient for a route: does adding only the pointer-direction part move the lookup to the position route, and only the J++ part to the identity route, beyond a random part of the same share?
why_it_matters: >-
  The removals show which parts the routes need; adding one part alone shows whether it carries the route by itself.
hypotheses:
  H-pointer: 'Dan''s Q37.1 (batch 37, committed before the results are shown): with only the pointer part added (another item moved), the position share is >= 0.20 and at least 0.15 above the random part of the same share'
  H-jpp: 'Dan''s Q37.2: with only the J++ part added (another item moved), the identity share is >= 0.20 and at least 0.15 above its random part'
decision_rule: >-
  Fixed in advance (Dan, 25 Oct ~15:50): Q37.1 and Q37.2 per model on the point estimates of the route shares (another item moved), with cluster-bootstrap CIs reported (bridge items, 10,000 resamples, seed 0). The pointer-direction part is the change projected onto the pointer directions (fit on the old fresh scenes, not refit); the J++ part is the 25-atom signed-OMP fit; each random part is the leading columns of the layer's random basis that keep the same share of the change (as elsewhere). Same item moved: descriptive. The removal arms of x6_routes run beside them. Gate 0.80; no sanity swap in this run (Dan's conditions), so no C0 check.
controls:
- 'a random part of each part''s share, added alone'
- 'the recall as a control route'
n: '300 eligible scenes per condition and model (seed 2510, the same scenes as x6_routes_r2)'
seeds: [2510]
notes: "Optional (Dan): after x0_122b_b8, before Tue 21:00. One 2-GPU job, two processes. Results stay closed until Dan's batch-37 answers are committed."
