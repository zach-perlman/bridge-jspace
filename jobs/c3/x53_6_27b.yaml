question: >-
  When the bridge word carries two conflicting signals, the lens part of B's identity and an address pointing at C's
  locker slot, which does the 27B's recall follow: B's attribute (the lens identity), C's (the address), or both?
why_it_matters: >-
  Dan 11:25 (jobs/c3/batch53.yaml critic_1125, order item 4): "53.6 on the 27B and Muse (same rule). Across models:
  "the recall's pointer use tracks the swap's collateral" if the models whose recall the address swap moved (9B,
  Lightning) give "both" and the others give "follows the lens identity"." The 9B and Lightning gave "both"
  (results/x53_identity_address/x53_identity_address-20261029T091645Z).
hypotheses:
  none: "No prediction (Dan 11:25: the rules fixed then, before any run)."
decision_rule: >-
  53.6's rule verbatim (jobs/c3/batch53.yaml brief, 53.6): "At the bridge word: the lens part toward item B plus the
  address swap toward item C's slot (s = 2). Read: the recall answers B's, C's or the original. Rule: "the recall
  follows the lens identity" if B's share >= 2x C's; "follows the address" if C's >= 2x B's; else both." Across models
  (critic_1125, verbatim): ""the recall's pointer use tracks the swap's collateral" if the models whose recall the
  address swap moved (9B, Lightning) give "both" and the others give "follows the lens identity"." As computed: as
  jobs/c3/x53_6_9b.yaml (scripts/x53_identity_address.py, unchanged design), on the 27B at L32 (X0's layer): x6_routes'
  C0 pairs (seed 2510, 1,400 per condition) with three distinct legs counts (512 of 1,400 on the 27B's tokenizer), X0's
  competence and X0's gate (0.80 per reader on O) on these, the first 300 eligible; the lens part = P_J (h_{S_B} -
  h_O), 25 signed-OMP atoms of the 27B's J++ at L32; the address swap = 2 (mu_{j_C} - mu_{j_A}), mu =
  x0_massmean.pointer_means(x0_probe_v4_27b) (x8_write's means, not refit; checked on CPU); the rule on the recall under
  both, the clauses in the brief's order, "neither (no B or C answers)" when both shares are 0 (accepted 10:40); CIs
  over the original bridge item (10,000, seed 0) beside. Across models: the moved models are Dan's list verbatim (the 9B
  and Lightning), the others (the 27B, Muse) wanted at "follows the lens identity"; with all four models "holds" or
  "does not hold", before that "pending" unless already broken (x53_identity_address.across). Verdict in the job (the
  27B alone): results/x53_identity_address/x53_identity_address-<UTC>/; the joint four-model verdict by hand on CPU.
