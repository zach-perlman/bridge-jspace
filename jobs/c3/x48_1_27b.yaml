  Fixed in advance (jobs/c3/batch48.yaml, 48.1): rules (a)-(d) and the fallback as in jobs/c3/x48_1_9b.yaml, read the
  same way (as computed there), on the 27B's stored main-test run x0_necessity_27b_chat (chat, L32): its locker-first
  scenes the whole change switches for at least one reader (plan check: 68 pairs of 200, 34 bridge entities; lookup
