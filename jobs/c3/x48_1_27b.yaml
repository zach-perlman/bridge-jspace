  At the bridge word at L32 of the 27B, is there a low-dimensional subspace of the change that mediates the lookup, one
  that mediates the recall, are they disjoint (own-IIA high, cross-IIA low), and where do they sit against the lens
  (J++-25), the pointer directions U and the input-embedding part W_E-25?
why_it_matters: >-
  The 27B is the third model of the main test; 48.1 names it "if time". A third model makes "two readers, two
  subspaces" a cross-model statement, as the split itself is.
hypotheses:
  Q48.1: "Dan's answers in predictions/2026-10-28_dan.md (Q48.1 asks for the 9B and Muse; the 27B is reported beside them, descriptive unless Dan adds a line); the run is sealed: no verdict in the job."
