id: x45k_muse_q3
title: "Batch 45k on Muse L26 (if time): why does the lookup lose with more J++ atoms? The sanity swap (C0) and another item moved (C2) with J++ removed at 25, 50 and 100 atoms and another scene's 100 atoms refit here, each against a random part of its share; the atoms' overlap with the pointer and the identity direction"
thread: C3
gpus: 1
mem_gb: 70
est_gpu_hours: 0.5
depends_on: [x45_0_indep_9b]
command: >-
  BJ_TARGET=muse-glimmer-30b BJ_DEVICE_MAP= uv run python scripts/x6_routes.py run --name muse30b_x6_routes_x45k_r2 --conditions C0,C2 --jpp-ks 25 50 100 --jpp-other --c0-min 0.5
question: >-
  On the 27B the main test's lookup extra loss grows with the J++ atoms (0.12 / 0.30 / 0.60 at k = 25 / 50 / 100; about 0 on the other models). Do the extra atoms take out the identity route, the pointer, or any fitted directions?
why_it_matters: >-
  The 9B's J++ part at k = 100 holds more of the change (44%) than the 27B's (31%), so "removed too much" does not explain the curve. Which route the lookup loses as k grows, and how much the k atoms overlap the pointer and the identity direction, tell a lens-readable route from overfitting.
hypotheses:
  H-batch45: 'Q45.9 (45k) in predictions/2026-10-26_dan.md (section Batch 45), committed by Dan before any 45k code or run (8025b808); overrides (Dan ~22:05) committed before any 45k job (1fad1c34)'
decision_rule: >-
  Fixed in advance (jobs/c3/batch45.yaml, 45k, with its overrides). "Identity route is lens-readable on the 27B" if on the 27B, from k = 25 to k = 100, identity answers in C2 fall by at least 0.2 more than with the random part, while position answers fall by less than 0.1 (or rise); and on the 9B neither falls by at least 0.1. "Pointer becomes lens-readable on the 27B" if position answers in C2 fall by at least 0.2 more than with the random part, and the k = 100 span's mean cos^2 with U is at least 0.5. "Generic fitting" if jpp_other at k = 100 costs the 27B lookup at least 2/3 of what this scene's J++ costs (override 2: read on the main test, job x45k_generic_27b against results/x0_necessity/x0_kmatch_27b; the routes jpp_other arm in this job is descriptive). Otherwise "can't tell". Report all four per model. As computed (fixed before the run): "fall from k = 25 to k = 100 by at least x more than with the random part" = [share(no_jpp25) - share(no_jpp100)] - [share(no_jpp25_rand) - share(no_jpp100_rand)] >= x, C2 lookup route shares, point estimates (paired cluster-bootstrap CIs beside them); "position falls by less than 0.1 (or rises)" = the same difference for position < 0.1; the 9B clause: both identity's and position's difference < 0.1. Mean cos^2 with U = per C2 item ||P_span(atoms) U||_F^2 / rank(U), averaged over the items; with the identity direction, ||P_span(atoms) u||^2 / ||u||^2. "Costs the lookup" = the lookup's extra loss (switches lost without the part minus without its random part, over the whole change's switches). Each label is evaluated per model. Overrides (Dan ~22:05): 1. precondition: the 27B's C0 lookup extra loss at k = 100 (no_jpp100 vs its random part) is reported; below 0.2, Q45.9 is "can't tell: the main-test curve does not reproduce in routes scenes", whatever the other clauses say; 3. precedence for Q45.9: "Generic fitting" if it holds, otherwise the labels that hold on the 27B, otherwise "can't tell". Code: x6_routes.jppk_rule per run, jppk-summary over the runs (x6_routes.jppk_labels; generic_rule on the main test). no_jpp25 is the existing no_jpp arm (signed OMP, k = 25); thresholds with a 1e-9 tolerance (a value exactly at a bar counts as at it). Gates as the routes test (read accuracy 0.80; Muse's C0 >= 0.50, Dan's G2, as D1). Cluster bootstrap over the bridge item, 10,000 resamples, seed 0.
controls:
- 'every removed part against a random part of its own share (per scene)'
- 'jpp_other at k = 100: the 100 atoms signed OMP picks for another scene of the same condition (x0_parts.partners, seed 0, no shared bridge), refit here by least squares (descriptive here; the generic-fitting control runs on the main test)'
- 'the 9B (x45k_9b), whose lookup does not lose with more atoms in the main test'
- 'the recall on the identical patch'
n: '300 scenes per condition (C0, C2) where they pass the gate; every scene kept (an entity with no class mean gets None for the identity overlap)'
seeds: [2510, 888, 0]
notes: "Rerun once of x45k_muse_q2 (failed: cusolver could not create its handle while the 122B block loaded beside it; orthonormal now takes its thin SVD on the CPU). New run name: the failed run left a partial dir. Re-queued as _q2 (cancelled before it ran) behind 45n, 45b on Muse and 45m (Dan ~22:35). Unsealed (Q45.9 committed): the verdict runs after the job. Per item in norms.jsonl: share_jpp / share_jpp50 / share_jpp100 / share_jppother100, cos2_U_jpp{25,50,100}, cos2_id_jpp{25,50,100}, jpp_other_partner; the partners and the k list in the manifest (x45k). Estimate: the routes run with the pointer arms is ~11 min per condition on Muse (the D1 identity run, 17 edits per reader, took 21 min for C0 and C2 on the H100); 6 more arms ride in the same batched read (12 edits per reader, under the batch of 64), plus signed OMP at k = 50 / 100 and the geometry (under a minute). Queued only if time (Q45.9 is scored on the 27B; Muse's labels are reported beside). After the 27B and 9B jobs and x45k_generic_27b, by hand (CPU): uv run python scripts/x6_routes.py jppk-summary --names x6_routes_x45k_27b,qwen35_9b_x6_routes_x45k,muse30b_x6_routes_x45k --generic-run x0_parts/x0_jppother100_27b --kmatch-run x0_necessity/x0_kmatch_27b; uv run python scripts/x6_routes.py examples --name muse30b_x6_routes_x45k_r2 (CPU)."
