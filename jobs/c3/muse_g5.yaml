id: muse_g5
title: "Muse Glimmer 30B grid (Dan, 26 Oct, overnight; held out): natural passages and the translated / symbol keys at L26 (GPU0); the replication on fresh scenes (GPU1)"
thread: C3
gpus: 2
mem_gb: 140
est_gpu_hours: 2.0
depends_on: [x6_routes_r2]
command: >-
  uv run python -c "import torch" && { { export CUDA_VISIBLE_DEVICES=0; export BJ_TARGET=muse-glimmer-30b BJ_DEVICE_MAP=; bash scripts/muse_step.sh x5_natural muse30b_x5_natural 'uv run python scripts/x5_natural.py run --name {N}'; bash scripts/muse_step.sh - x4_probe 'uv run python scripts/x4_alias.py probe --name muse30b_x4_probe'; bash scripts/muse_step.sh x4_alias muse30b_x4_patch 'uv run python scripts/x4_alias.py run --name {N}'; } & p0=$!; { export CUDA_VISIBLE_DEVICES=1; export BJ_TARGET=muse-glimmer-30b BJ_DEVICE_MAP=; bash scripts/muse_step.sh x0_replicate muse30b_x0_replicate 'uv run python scripts/x0_replicate.py run --name {N}'; } & p1=$!; wait $p0; s0=$?; wait $p1; s1=$?; echo "exit GPU0=$s0 GPU1=$s1"; test $s0 -eq 0 -a $s1 -eq 0; }
question: >-
  On Muse Glimmer 30B (another family, held out), do the Qwen results hold: natural passages and the translated / symbol keys at L26 (GPU0); the replication on fresh scenes (GPU1)?
why_it_matters: >-
  Every result so far is Qwen; Muse is the cross-family check (Dan). Rules are the ones fixed for the Qwens.
hypotheses:
  H-muse: 'Dan''s batch 38 (Q38.1-Q38.12), committed before any Muse result (82d47e49)'
decision_rule: >-
  Fixed in advance (Dan, 25 Oct ~23:00): every rule as for the Qwens; layers L13 / L26 / L34 by depth (L26 the layer fixed in advance). Gates: G1 both readers >= 0.80 right on the original prompts; if in [0.75, 0.80), the run is redone as *_g75 with the gate at 0.75, after the data, descriptive, not scored; below 0.75 not tested (scripts/muse_step.sh). G2 the sanity swap's switch rate >= 0.50 per layer (--c0-min). G3 the 25 J++ directions hold >= 10% of the change's energy (median) at L26, read from the outputs; else J++ arms on Muse are "not interpretable".
controls:
- 'as each script on the Qwens: random parts at each part''s share; the recall as a control route; the sanity swap'
n: 'as on the Qwens (200 main-test scenes per swap; 300 routes scenes per condition; the sets'' eligible scenes)'
seeds: [0, 2510]
notes: "Two lanes per job (GPU0, GPU1), each a chain of scripts/muse_step.sh calls; an OOM / CUDA failure is retried once, a code error skipped. FIFO order after x0_122b_b10 keeps the dependencies; jobs do not depend on each other, so one failed step does not block the rest. Results stay committed unopened until Dan's batch-38 commit (done: 82d47e49)."
