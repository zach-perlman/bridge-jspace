id: x53_monitor_lightning_s
title: "Batch 53, test 53.2 (the monitor test) on Nemotron-3.5-Lightning, forwards: the states at the bridge word and the last token, every second layer, main test and the JSON varied scenes, O and S, both readers; each state's J++ lens part at k = 25 / 100 (sealed: no probe, no label; the probes run on CPU)"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.35
depends_on: []
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  L=$(uv run python scripts/x51_lightning.py layer) && export BJ_PREDICTED_LAYER=$L &&
  test -f results/x0_necessity/nem35l_x52_conflict/outcomes.jsonl &&
  uv run python scripts/x53_monitor.py run --name nem35l_x53_monitor
question: "What can a J-space readout decode, compared with the full state? At the bridge word and the last token, every second layer: (a) which item is the bridge, (b) its locker slot (the address), (c) the lookup's answer digit, (d) the recall's answer, from the full residual, the J++ lens part (k = 25, 100), a random subspace of the same k, and PCA top-k."
why_it_matters: "Dan's 53.2 (batch 53 brief, 09:30): whether a monitor that reads J-space sees the bridge's identity, its address and the answers, or is blind to some of them while the full state holds them. The main test's states are cached (52 B, x52_answer_map read_main), but the J++ part needs the lens maps and W_U (not on the Mac) and the JSON scenes were cached at one layer and the bridge word only (x0b states.npz): this job records exactly that."
hypotheses:
  none: "rule fixed in advance in jobs/c3/batch53.yaml (53.2); no prediction (batch 53: no predictions; results UNVERIFIED until the next day's verification)"
decision_rule: "Fixed in advance (jobs/c3/batch53.yaml brief 53.2, Dan 29 Oct 09:30), verbatim: \"Rule: “J-space blind to X” if the J++ probe is within 0.10 of the random subspace at every layer while the full residual reaches >= 0.8 at some layer; “J-space carries X” if J++ >= 0.8 and >= 0.3 above random; else in between.\" As computed (fixed before any run; scripts/x53_monitor.py): per model, dataset (main / json), position (B the bridge word; T the last token: the lookup's prompt for (a), (b), (c), the recall's for (d)), target X and k (25, 100), on the point estimates (EPS 1e-9 at the bars), over every cached layer (every second layer from L0 through n_layers - 2): blind iff |J++_k - random_k| <= 0.10 at every layer and full >= 0.8 at some layer; carries iff at some layer J++_k >= 0.8 and J++_k - random_k >= 0.3; else in between (noted when full < 0.8 everywhere). Targets per row (O and S rows of each item): (a) the bridge item (the asked person's pick: O's bridge, S's cf bridge); (b) its locker slot, the ordinal of its locker statement among the scene's locker statements (main 3, JSON 3-9); (c) the lookup's answer digit; (d) the recall's answer. Features per layer: full = the block output; J++_k = the state's J++ lens part, X0's signed OMP over the J++ letter-token atoms (x0_necessity.dictionary('jpp')) applied to the state, the least-squares fit on the first k atoms it picks; random_k = the projection of the state on a random k-dimensional subspace (the first k columns of a Haar random orthonormal basis, seed 888 + layer + 1000 x probe seed: probe seed 0 is X0's basis); PCA_k = the projection of the state (centred on the training rows) on the training rows' top-k principal directions. Probe: multinomial logistic regression with sklearn's objective (0.5 ||W||^2 + C x summed log-loss, intercept unpenalised), C = 1.0 for every feature, target, layer and model ('same regularisation'), features standardised with the training rows' mean and sd, fit by scipy L-BFGS in the training rows' span (exact for an L2 penalty; sklearn is not in the project's dependencies, so it is not added for this). Held-out entities: (b) and (c) 5-fold cross-validation grouped by the row's bridge entity (a held-out entity is never in training); (a) and (d) cannot be (a held-out entity is an unseen class for (a), and each element's and Greek letter's recall answer is its own: x0_probe's precedent, Dan 24 Oct), so they are grouped by scene (a scene's O and S rows together, entities spread over the folds). 5 seeds (0-4): each a different random assignment of the groups to the 5 folds; accuracy = the out-of-fold share right, averaged over the seeds (decides); 95% CIs by cluster bootstrap over the row's bridge entity (10,000, seed 0) beside; chance = the training folds' majority class, beside."
controls:
- "a random subspace of the same k (the brief's control; a different random subspace per probe seed)"
- "PCA top-k fit on the training rows only (a label-free k-dimensional subspace as large as J++'s)"
- "the full residual (what any linear monitor could read)"
- "the training folds' majority class (chance) per target"
- "the main test's states checked against 52 B's cached states (x52_answer_map read_main) at B and T"
n: "main: 200 items (37 bridge entities) x O / S x 2 readers = 800 forwards; json: 415 aligned x0b_v2 JSON scenes (28 entities) = 1,660 forwards; 26 layers (L0-L50); plan results/x53_monitor/plan-20261029T090835Z/plan-lightning.json (BJ_PREDICTED_LAYER=14, x51_lightning layer)"
seeds: [888, 0, 1, 2, 3, 4]
notes: "Batch 53, 53.2 (Dan 09:30; mats GPU 1 per the brief's box plan). One forward per prompt (item x reader x O / S); the block outputs at B and T at every cached layer and the read's top token; per layer on the GPU the J++ part of every state at k = 25 / 100 (X0's signed OMP run to 100 atoms; the first 25 are the k = 25 fit's). Saved fp16 layer-major (states_<set>_{h,jpp25,jpp100,atoms}.npy, gitignored: ~0.16 / 0.32 GB per array for main / json on Lightning), cases_<set>.jsonl with the labels and reads, manifest before any GPU work. No probe, no label on the box: the CPU stage (scripts/x53_monitor.py probe / verdict) runs after the pull, verdict to results/x53_monitor/x53_monitor-<UTC>/. Estimate: 52 B's answer map on Lightning (read + write 0.3 h) for the read part, plus 1,660 longer JSON forwards and the OMP. Lightning's main items come from its X0 run at L = 14 (x51_lightning layer, as 52 B's read)."

