id: x52_lightning_attn
title: "Batch 52 C coverage (Lightning, key row 10): attention under the address swap (49.7) at L14: x8_write's items, the swap s (mu_k - mu_j) at s = 2 at the bridge word, a random vector of its norm; the softmax attention from the last / question tokens at every attention block after L14 (19, 26, 33, 42; NemotronH port); candidate heads on the fit half, read and the best head zeroed on the other; no prediction"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.5
depends_on: [x52_lightning_write]
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  L=$(uv run python scripts/x51_lightning.py layer) && export BJ_PREDICTED_LAYER=$L &&
  test -f results/x8_write/nem35l_x52_write/outcomes.jsonl &&
  uv run python scripts/x49_attn.py run --name nem35l_x52_attn --why "Batch 52 part C (jobs/c3/batch52.yaml amendment 3), coverage, key row 10: 49.7's attention under the address swap on Lightning at the committed L$L (attention blocks after L: 19, 26, 33, 42), x8_write's items; no prediction: coverage run on an already-scored rule" &&
  uv run python scripts/x49_attn.py verdict --coverage --runs nem35l_x52_attn
question: >-
  On Lightning: when the written address sends the lookup to another locker, does some attention head after L14 move
  its attention from the original locker sentence to the written one (49.7's "follows"), is the dereference elsewhere,
  or distributed; and does zeroing the best head undo the switch?
why_it_matters: >-
  Row 10 of the coverage matrix (Fig. 13); Lightning has softmax attention in 6 of its 52 blocks (5, 12, 19, 26, 33, 42),
  four of them after L14, so the test applies (amendment 3: list the attention layers first; the window L..end holds
  four).
hypotheses:
  none: "No prediction (batch 52 addendum): coverage run on an already-scored rule."
decision_rule: >-
  The rules verbatim from jobs/c3/x49_7_muse.yaml (jobs/c3/batch49.yaml 49.7 with amendment 2, Dan 28 Oct ~14:20; first
  scored in results/x49_attn/x49_7-20261028T154511Z): "Read half, decisive query site the last token (the question
  tokens' mean beside, the same rules) ... "The attention follows the address": on the pairs where the lookup switched
  to slot k's locker under the swap, >= 1 of the five candidate heads has mean move >= 0.30 with its CI excluding 0, its
  mean move under the random vector on the same pairs <= 0.05, and its mean move on the non-switched swap pairs <= 0.10.
  "Dereference elsewhere": the switch share >= 0.3 and no recorded head (every layer > L, every head) reaches a mean
  move of 0.15 on the switched pairs. Otherwise neither. (1) Aggregate ... "distributed dereference" if either sum >=
  0.30 while no single candidate reaches 0.30. (2) Necessity: the best head ... zeroed at the last token, and separately
  at the question tokens ... "the head carries the position route" if the switch to slot k falls by >= 0.5 of its swap
  value while the identity answers ... change <= 0.10 and the recall's answer changes <= 0.10." The rule for hybrid
  models ("not in full attention": on a model with linear token mixers, if 'elsewhere' holds, "the dereference is not in
  full attention on this model") applies to Lightning's Mamba-2 blocks as to Muse's / the 9B's Gated DeltaNet. As
  computed: x49_7_muse's text with Lightning's sources (x8_write's items nem35l_x52_write, mu from nem35l_x52_probe) at
  L14; recorded layers = the softmax-attention blocks after L14 from the config (19, 26, 33, 42), the others (Mamba-2,
  MoE) skipped and listed; NemotronH attention recomputed by the port (no q / k norm, no rotary, its GQA and scaling;
  tests/test_nemotronh_attention.py checks it equals the model's own eager attention). Cells under 30 switches left out
  (amendment 3). Verdict in the job (verdict --coverage, x52_attn-<UTC>/).
controls:
- "a random vector of the swap's norm (one per item and k, seed W.RAND_SEED)"
- "the non-switched swap pairs (move <= 0.10)"
- "the clean answers lost when the best head is zeroed (none + zero vs none)"
n: "x8_write's items on Lightning (up to 300 routes C2 scenes), fit / read halves by entity"
seeds: [2510, 0]
notes: "Batch 52 C, amendment 3, lane speedup after x52_lightning_write (the GPU0 chain moved to speedup; depends_on; the command checks the write run first). Port (this commit): bridge_jspace.knockout gains OTHER (NemotronH's MoE / MLP blocks), layer_kind reads NemotronH's block_type, attention_module (self_attn or NemotronH's mixer), config_layer_kinds maps 'moe' / 'mlp' to OTHER; x49_attn.capture_queries recomputes NemotronHAttention (plain q / k, NoPE); zero_head and the necessity arm hook the mixer's o_proj. Tested on a tiny random NemotronH (transformers' classes, CPU, eager): the recomputed probabilities equal the model's own attention weights (atol 1e-5), zero_head zeroes one head's o_proj-input slice at the given positions only. Not run on the real model before this job: its first minutes are the check (it fails loudly if a layer is not softmax attention). Wallclock (ledger): x49_7_muse 0.19 h; est ~15-20 min, 0.5 GPU-h; opens before the freeze."
