id: x6_routes_r2
title: "Which route does the lookup follow, identity vs position vs value (Dan, 25 Oct ~01:50; after Gur-Arieh et al. 2025): C0 sanity on 20 scenes, then C0-C2 on 300 scenes each; 27B L32 on GPU0, 9B L12 on GPU1"
thread: C3
gpus: 2
mem_gb: 120
est_gpu_hours: 1.2
depends_on: [x0_replicate]
command: >-
  uv run python -c "import torch" &&
  { { CUDA_VISIBLE_DEVICES=0 BJ_DEVICE_MAP= uv run python scripts/x6_routes.py run --name x6_routes_c0_27b --smoke && CUDA_VISIBLE_DEVICES=0 BJ_DEVICE_MAP= uv run python scripts/x6_routes.py run --name x6_routes_27b; } & p27=$!; { CUDA_VISIBLE_DEVICES=1 BJ_DEVICE_MAP= BJ_TARGET=qwen3.5-9b uv run python scripts/x6_routes.py run --name qwen35_9b_x6_routes_c0 --smoke && CUDA_VISIBLE_DEVICES=1 BJ_DEVICE_MAP= BJ_TARGET=qwen3.5-9b uv run python scripts/x6_routes.py run --name qwen35_9b_x6_routes; } & p9=$!; wait $p27; s27=$?; wait $p9; s9=$?; echo "exit 27B=$s27 9B=$s9"; test $s27 -eq 0 -a $s9 -eq 0; }
question: >-
  When the change at the bridge word comes from a source prompt in which the bridge's locker sentence moved (C1) or the bridge itself changed and moved (C2), does the lookup's answer follow the item's identity, its locker sentence's position, or the locker value? And how do removing the J++ part and the pointer directions shift that?
why_it_matters: >-
  The lookup does not need the J++ part, survives a misdirected first-mention pointer, yet loses flips without the pointer directions (9B). Counterfactuals in which each route predicts a different answer tell which information it reads from the bridge word.
hypotheses:
  H-routes: 'shares per route in C1 and C2; Dan''s batch 32 (committed before the results are shown)'
decision_rule: >-
  Fixed in advance (Dan, 25 Oct ~01:50): a route counts as used if its share is >= 0.20 with lower CI >= 0.10 (cluster bootstrap over the bridge item, 10,000 resamples, seed 0). C0 must reproduce the one-pick lookup switch rate within 0.10, or the model's run stops (the reference, chosen by the agent before the run: the whole change's lookup switch rate on the one-pick scenes with both locker sentences before the pick, x0_massmean_lf's items: 9B 0.99, 27B 1.00). The recall is a control: C2 should follow B, C1 stay on A. Arms: whole; without the J++ part (k = 25); without a random part of its share; without the pointer directions (Alf, fit on the old fresh scenes, not refit) and without a random part of their share. The change's norm is reported per condition. Gate: O's read accuracy >= 0.80 per reader and condition; eligible as in X0; the first 300 per condition.
controls:
- 'C0 (the one-pick swap in these scenes) against the main test''s one-pick rate'
- 'the recall as a control route'
- 'random parts at the J++ part''s and the pointer directions'' shares'
- 'S''s digits disjoint from O''s; the bridge at the same token index in O and S (asserted; 0 of 2,100 generated cases dropped for it)'
n: '300 eligible scenes per condition and model (700 generated per condition)'
seeds: [2510]
notes: "Rerun of x6_routes: its command failed before any run started (a bash syntax error from the YAML folded scalar; Dan ~02:30 gave permission to fix and restart). One 2-GPU job, two chains: the C0 check on 20 scenes, then the full run (only if C0 passes). Queued before b6 (Dan ~00:20: b6 is dropped first if the night runs out); the 122B only if the GPU is free afterwards."
