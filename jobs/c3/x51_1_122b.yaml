id: x51_1_122b
title: "122B coverage (Dan 18:20, coverage_122b_1820 item 5): the dose curves (51.1) on Qwen3.5-122B-A10B (FP8) at L33: the J++ part alone at alpha 0.5..3 and the rest alone at beta 0.25..1.5 (with and without the address), each with its random twin of the same share at the same gain; the X0 r2 run's locker-first items; no prediction; UNVERIFIED"
thread: C3
gpus: 2
mem_gb: 150
est_gpu_hours: 0.5
depends_on: []
command: >-
  export BJ_TARGET=qwen3.5-122b-a10b BJ_DEVICE_MAP=auto BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  test -f results/x0_necessity/qwen35_122b_x0_necessity_r2/outcomes.jsonl && test -f results/x0_probe/qwen35_122b_x0_probe_v4/states.npz &&
  uv run python scripts/x51_dose.py run --name qwen35_122b_x51_1 --why "122B coverage (Dan 18:20, jobs/c3/batch53.yaml coverage_122b_1820 item 5): 51.1's dose curves at L33, the X0 r2 run's locker-first items, U from qwen35_122b_x0_probe_v4; no prediction: coverage run on an already-scored rule" &&
  uv run python scripts/x51_dose.py verdict --coverage
question: >-
  On the 122B: added by itself, does the J++ part move the recall more than a random part of its size, and the
  lookup no more (51.1's (i), (ii)); does the rest by itself move the lookup, and how much of that goes with the address?
why_it_matters: >-
  'Does each part, added by itself, move its reader?' (Part I, Fig. 16) on the largest model; Dan 18:20.
hypotheses:
  none: "No prediction (coverage_122b_1820): coverage run on an already-scored rule."
decision_rule: >-
  The rules verbatim from jobs/c3/x51_1_muse.yaml (jobs/c3/batch51.yaml 51.1; first scored in
  results/x51_dose/x51_1-20261028T170335Z), as copied for Lightning in jobs/c3/x52_lightning_dose.yaml: (i) "The
  lookup is blind to the J++ part": switch minus random <= 0.10 at every alpha whose plain-text loss stays under 2x
  the whole change's -- on all three. (ii) "The recall reads the J++ part above its share": at the first alpha where
  the J++ part alone switches >= 0.3, J minus random >= 0.2 -- per model. (iii) "Together only" (Muse). As computed:
  x52_lightning_dose's text with the 122B's source: the main test's eligible items of qwen35_122b_x0_necessity_r2 at
  L33 (X0's gate 0.80 per reader, asserted from its gate.json), locker-first only (x49_gain.select_items: 53 items);
  U = x47_atoms.pointer_basis (the address fit on qwen35_122b_x0_probe_v4's states, never refit); 49.1 never ran on
  the 122B, so its J(1,1) check and the fit's grid cells from 49.1 are left out (J(1,1) is read from this run's own
  whole arm); (i)'s "on all three" read on the 122B alone; (iii) is Muse's and not read. Verdict in the job (verdict
  --coverage, x52_dose-<UTC>/, with Lightning's run beside).
controls:
- "every dose's random twin of the same share at the same gain (X0's random subspace, seed 888 + L)"
- "the rest without a random part of the address's share (R_U)"
- "the plain-text loss bar per dose (2x the whole change's)"
n: "the X0 r2 run's locker-first main-test items at L33 (53), both readers"
seeds: [888, 0]
notes: "Coverage, not hand-checked (Dan 18:20); UNVERIFIED; the README untouched until after the 30 Oct check. Caveats: J++ fit on bf16 used on FP8; MoE (~10B active); 2x H100, BJ_DEVICE_MAP=auto; U fit on the probe run's routes states (the probe has no gate; the 122B's routes test itself ran with its gate lowered to 0.75, not used here). Code: x51_dose.COVERAGE_RUNS gains the 122B; x49_gain.SOURCES has its r2 run. Cost: 53 items x 2 readers x 32 arms + the loss reads ~ 7k reads + the load: ~15-20 min wall on 2 GPUs."
