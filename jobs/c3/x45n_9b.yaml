question: >-
  When the locker comes after the pick, does the locker-sentence copy still switch the lookup without the J++ part of
  each copied token?
why_it_matters: >-
  45b held: copying S's states into the locker-sentence tokens at L switches about 0.6 of S's lookups. If the copy works
  without its J++ part, the link the locker sentences carry is outside the lens, as the bridge word's pointer is.
hypotheses:
  Q45.11: "Dan's answer in predictions/2026-10-26_dan.md (Q45.11), committed before any 45n code (3d59e139)."
decision_rule: >-
  Fixed in advance (jobs/c3/batch45.yaml, 45n): "the copied link is outside the lens" if the copy without J++ still
  switches at least 0.8 of what the full copy switches, and at least as much as the copy without the random part minus
  0.1, on both 9B and 27B; Muse reported. As computed: the lookup's switch rate over 45b's items that pass Dan's sanity
  check (O and S the same length and token ids after the bridge word), point estimates; x45b_binding.py link-verdict.
