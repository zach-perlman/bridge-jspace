  agreement.json. By hand (CPU): uv run python scripts/x51_answer.py verdict and view. Estimate: unchanged from
  r1's spec (0.15 h, from the box ledger's x49_1 / x50_z2 wall times; Dan's brief ~0.3 per model per set); r2 adds
  one arm (no_F: 2 more reads per item) and one pass over the letter dictionary for the readout norms plus the CPU
  related-key mask (seconds). No items, layers or reads differ from the source run.
