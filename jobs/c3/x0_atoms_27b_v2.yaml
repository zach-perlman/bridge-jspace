id: x0_atoms_27b_v2
title: "X0 descriptive (added after data), Qwen3.6-27B L32: which J++ atoms make up the bridge edit's J++ part (letter atoms, and every token incl. digits)?"
thread: C3
gpus: 1
mem_gb: 75
est_gpu_hours: 0.25
depends_on: [x0_hw_gate_27b]
command: >-
  uv run python scripts/x0_atoms.py run --name x0_atoms_27b_letters --source x0_necessity_27b_chat --layer 32 --n 20 --seed 0 --vocab letters
  && uv run python scripts/x0_atoms.py run --name x0_atoms_27b_all --source x0_necessity_27b_chat --layer 32 --n 20 --seed 0 --vocab all
question: >-
  For 20 random X0 items at the 27B's L32 and 20 asked-first items (seed 0), which J++ atoms does the signed OMP fit of Δ at the bridge's word select (ranks 1-25 and 26-100, with coefficients): the bridge (org / alt), the other changed person's name, names, digits, number words, other context words, or other tokens? Once over X0's letter atoms, once over every non-special token (digits included).
why_it_matters: >-
  The digit check (A) asks whether the lookup reads a digit the letter dictionary cannot remove; the atoms show what the removed part is made of and whether digits enter when they are allowed.
hypotheses:
  H-bridge: 'the bridge tokens lead the ranks. Prior: none set (descriptive, after data)'
  H-digits: 'with every token allowed, digit atoms enter the top 25 for locker-before items. Prior: none set'
decision_rule: >-
  Descriptive, added after data, not part of X0's rule (critic via Dan, 24 Oct). Per item, ranks 1-25 (k = 25 fit) and 26-100 (k = 100 fit) with token, coefficient and mark; mark shares by rank band, all items vs asked-first. Check: the letters run's k = 25 share against X0's shares.jsonl.
controls:
- 'the letters run''s k = 25 share against X0''s shares.jsonl (the same fit, recomputed)'
n: '20 random + 20 asked-first items of x0_necessity_27b_chat (seed 0), twice (letter atoms; every token)'
seeds: [0]
notes: "Replaces x0_atoms_27b (cancelled before it ran): digits and number words are tagged, and a second pass uses every non-special token. Cost: ~15 min (two model loads)."
