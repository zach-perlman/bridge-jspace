id: x52_lightning_zero
title: "Batch 52 C coverage (Lightning, amendment 2's full grid): 47.5 one-layer zeroing on Lightning at the committed L14: on S, the bridge word's state without its projection on the change's 25 OMP atoms at L14 (and at L14..17, per-layer lens), against a random subspace of the same share; main-test scenes (the 60 dev scenes kept out), both readers; rule unchanged; no prediction"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.25
depends_on: []
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  L=$(uv run python scripts/x51_lightning.py layer) && export BJ_PREDICTED_LAYER=$L &&
  NOTE="no prediction: coverage run on an already-scored rule (batch 52 C, amendment 2: full grid on Lightning, L$L; hollow gate)" &&
  uv run python scripts/x47_zero.py run --name nem35l_x52_zero --exclude-dev results/x51_lightning/nem35l_x52_layer_r2/gate.json --why "Batch 52 C coverage: 47.5 on Lightning, on S the bridge word's state without its projection on Δ's 25 OMP atoms at L$L and L$L..+3, against a random subspace of the same share; main-test scenes, dev scenes out; $NOTE" &&
  printf '%s\n' "$NOTE" > results/x47_zero/nem35l_x52_zero/coverage.txt &&
  uv run python scripts/x47_zero.py verdict --coverage
question: >-
  On Lightning: does the recall follow the J++ part at one layer, or need it? Zeroing the change's 25 OMP atoms on the
  changed prompt at L14, against a random part of the same share: how much of S's answers does each reader keep?
why_it_matters: >-
  Amendment 2: the full grid on Lightning (the depth page's "Zeroing at one layer (47.5)" row; Zach's zeroing beside
  our conflict test on the second family).
hypotheses:
  none: "No prediction (batch 52 addendum): coverage run on an already-scored rule."
decision_rule: >-
  The rule unchanged, verbatim from jobs/c3/x47_5_muse.yaml (jobs/c3/batch47.yaml, 47.5; first scored in
  results/x47_zero/x47_5-20261028T113106Z): "Followed, not needed at one layer" if the recall keeps >= 0.80 of its
  answers under the zeroing, within 0.10 of the random arm; "needed" if it loses >= 0.30 beyond random. The lookup
  reported beside. Design, verbatim: "On S (the changed prompt), at the bridge token at L: project out the 25 OMP atoms
  of Delta from h_S; the random subspace of the same share; also the same over L..L+3 with the per-layer lens (OMP per
  layer). Both readers. Measure: share of S's answers kept." As computed: x47_5_muse.yaml's text unchanged (X0's read
  gate 0.80 per reader, >= 150 eligible; both readers say and read O's and S's answers right; the first 200 eligible in
  scene order; signed OMP over the J++ lens's letter-token atoms; random basis seed 888 + l; point estimates decide,
  EPS 1e-9; cluster bootstrap over bridge items, 10,000, seed 0) on Lightning at the committed L14 (amendment 1;
  BJ_PREDICTED_LAYER from x51_lightning.py layer) and L14..17 (the J++ lens maps L0-L50). Lightning's 60 dev scenes
  (results/x51_lightning/nem35l_x52_layer_r2/gate.json 'dev', which chose L14) are kept out of the items, as in its
  conflict run (--exclude-dev; the gate and its counts over all scenes). The README-verb clause ("needed on all three")
  is a cross-model clause: not re-scored (the coverage verdict reads Lightning alone). Verdict in the job (verdict
  --coverage, results/x47_zero/x52_zero-<UTC>/).
controls:
- "the random subspace of the same share of ||h_S||^2 at each edited layer (X0's random basis, seed 888 + l)"
- "S unedited (keeps ~1 by eligibility; reported)"
- "the lookup on the identical edit (reported beside)"
- "L..L+3 beside one layer (per-layer lens and OMP; descriptive)"
n: "200 main-test scenes (d1_topics_v3, chat), the first eligible in scene order outside the 60 dev scenes, where the gate passes (Lightning's main gate: lookup 0.957, recall 0.816; hollow mark)"
seeds: [888, 0]
notes: "Batch 52 C, amendment 2 full grid (coordinator 03:00 Paris); box speedup. Lightning's gate was chosen after the 60-scene pre-check was seen (hollow mark, Dan 01:10); L14 stands. Code: x47_zero gains COVERAGE_RUNS (nem35l_x52_zero), verdict --coverage (no seal guard, 'no prediction', x52_zero-<UTC>/) and --exclude-dev (x0_necessity's flag; the excluded scenes recorded in the manifest); MODELS / RUNS and 47.5's own verdict unchanged. Runs on Lightning as it is: X0's build_cases / competence / gate / read_logits and model.run(record=...) (the conflict run's path), the J++ lens's maps at L14..17 asserted before the competence pass. Retry once, then skip with the reason logged. Wallclock (ledger_sesterce-h100x2): x47_5_muse 558 s, x47_5_27b 709 s; Lightning ~0.5-1x Muse per row: est ~8-12 min, 0.25 GPU-h; opens before the freeze."
