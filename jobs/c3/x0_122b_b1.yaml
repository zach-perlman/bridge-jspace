decision_rule: >-
  Fixed in advance (Dan, 25 Oct ~00:20: each 122B spec states its rule before the run with the 9B / 27B thresholds). Holds iff lookup excess <= 0.10 (upper CI <= 0.20) and recall-lookup gap >= 0.20 (lower CI >= 0.10); fails iff lookup excess >= 0.20 or the gap's upper CI < 0.10; otherwise mixed (X0b's pooled rule, the one-change thresholds). Descriptive: 50 / 100 atoms; W_U, W_E and random dictionaries each against a random part of its own share (X0's arms); the atoms table (on the two-change run, as for the 27B). Cluster bootstrap over bridge entities (10,000 resamples, seed 0). Results stay closed until Dan's batch-31 commit.
