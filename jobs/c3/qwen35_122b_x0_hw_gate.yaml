id: qwen35_122b_x0_hw_gate
title: "X0 hardware gate, Qwen3.5-122B-A10B (2x H100 box): does this box reproduce one 23 Oct 2x H100 cell?"
thread: C3
gpus: 2
mem_gb: 150
est_gpu_hours: 0.5
depends_on: [x0_hw_gate_27b]
command: >-
  BJ_TARGET=qwen3.5-122b-a10b BJ_DEVICE_MAP=auto BJ_BATCH=16 uv run python scripts/statement_positions.py parts --name qwen35_122b_x0_hw_gate_parts --map qwen35_122b_d1_topics2_map --why "122B hardware gate: one 23 Oct 2x H100 cell (bind_bridge:33) rerun on this box" --lo 24 --sets bind_bridge --force bind_bridge:33
  && BJ_TARGET=qwen3.5-122b-a10b uv run python scripts/x0_hw_gate.py --new qwen35_122b_x0_hw_gate_parts --ref qwen35_122b_d1_late_parts --cell bind_bridge:33
question: >-
  Does this 2x H100 80GB PCIe box reproduce, read for read, the 23 Oct cell bind_bridge:33 of qwen35_122b_d1_late_parts (computed on a 2x H100 box, the model split with BJ_DEVICE_MAP=auto): the same scenes, map, lens and code path?
why_it_matters: >-
  The 122B's X0 compares with nothing earlier, but its 23 Oct numbers drifted 4-7 points between H200 and H100; the gate shows this box's reads are stable before X0 runs on it.
hypotheses:
  H-same: 'the reads agree on >= 97% of rows without random draws. Prior: Dan''s, predictions/2026-10-24_dan.md Q26.8'
  H-differs: 'below 97%: the 122B''s X0 does not start; the disagreeing rows are reported. Prior: Dan''s, Q26.8'
decision_rule: >-
  As x0_hw_gate_27b: rows matched on item, set, layer, part, source and null flag; PASS iff the share of rows without random draws (full, lens2, not_lens2, jspace, not_jspace, jspace_wo_own, not_jspace_matched; non-null; both readers) whose read role matches the 23 Oct row is >= 0.97; else FAIL (exit 3) and the 122B's X0 does not run. The random-draw arms are reported, not gated.
controls:
- 'the reference run itself (the 23 Oct 2x H100 cell)'
- 'the random-draw arms reported beside the gate'
n: '180 scenes x 2 readers of d1_topics_v2 at bind_bridge:33 (7056 rows per cell in the reference)'
seeds: [0]
notes: "Needs a worker owning both GPUs (start-worker --gpus 0,1). Weights Qwen/Qwen3.5-122B-A10B-FP8 @ a099dee7 (40 LFS files sha256-checked on download, 24 Oct) and the 122B J++ @ e166deb5 (sha256 b771e502, = pins). The reference's command used BJ_DEVICE_MAP=auto BJ_BATCH=16, as here. Caveats: bf16 J++ on FP8 weights, MoE, 2x H100. Cost: model load (~119 GB) + one cell: ~20-30 min."
