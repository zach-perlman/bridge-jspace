  As x6_routes: a route is used if its share is >= 0.20 with lower CI >= 0.10; C0 must reproduce the one-pick, locker-first lookup switch rate within 0.10 (the 122B's reference), or the run stops. Changed after the data (Dan, 25 Oct ~13:15): each reader's read accuracy on the original prompts is rounded to 2 decimals before the 0.80 gate. Eligible items are unchanged: both readers say and read the original and swapped prompts' answers right.
