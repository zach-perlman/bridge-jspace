id: x45r_ko_l26_muse
title: "Batch 45r on Muse, Zach's side at our layer (DRAFT, not queued; Dan predicts first, Q45.14): his v2 knock-out (top 10 J++ directions removed at every token) at L26 alone, with his controls (rotated, logit lens and its rotation, size-matched), on his v2 facts items"
thread: C3
gpus: 1
mem_gb: 75
est_gpu_hours: 0.6
depends_on: []
command: >-
  export BJ_TARGET=muse-glimmer-30b BJ_DEVICE_MAP=; unset BJ_GRAM_PROJ; uv run python scripts/ablate_v2.py --name muse30_jsuite_v2_test_chat_ko_cand2_L26_x45r_v1 --why "batch 45, test 45r (jobs/c3/batch45.yaml; Q45.14): Zach's v2 knock-out and its controls at L26, our change-removal's layer; record run's items and settings otherwise" --plan bands --bands 26 --conditions paper10 paper10_rot unembed10 unembed10_rot paper10_pcasize --tasks jsuite_v2_test_chat --tasks-competence muse30_jsuite_v2_test_chat_competence_cand2_v1 --tasks-words PP PK PM PA PN MP MK MM MA MN TP TK TM TA TN --tasks-level all --n 1000 --kinds clean --batch 16 --read cand2 && uv run python scripts/jsuite2_score.py muse30_jsuite_v2_test_chat_ko_cand2_L26_x45r_v1 --set jsuite_v2_test_chat
question: >-
  On Muse, at L26 (our change-removal's layer), does Zach's knock-out find the J++ directions needed: recall answers
  lost minus stated-fact answers lost (M - K) at least 15, and more than 10 points from the logit lens's own top 10?
  Together with x45r_x0_muse this decides 45r at L26.
why_it_matters: >-
  Zach's knock-out was run on Muse only at L36-42 (M - K +59.9 [55, 65], logit lens +34.6 [29, 40]); our
  change-removal only at L26 and below (gap 0.85 [0.68, 0.98] at L26). The Muse disagreement between the halves
  (docs/depth/README.md, limits) can be depth or method; his knock-out at our layer separates them. On natplus dev
  (muse30_natplus_dev_chat_sweep_cand_v1, paper10, cand read), the 7-layer windows covering L26 (L21-27, L24-30) left
  the memory-final words (P->M, M->M) right in 84-97% of items (unedited 100%; at L36-42: 22-31%).
hypotheses:
  Q45.14: "Dan's answer in predictions/2026-10-26_dan.md (Q45.14), one line per layer set; enqueue only after it is committed."
decision_rule: >-
  Fixed in advance (Dan, 27 Oct ~14:40; jobs/c3/batch45.yaml, 45r), verbatim: "'carried, not needed' if our gap >= 0.3
  while his M - K < 15 or within 10 of the logit-lens control, at the same layers." As computed: see jobs/c3/batch45.yaml
  45r and x45r_x0_muse (identical text). This job gives the L26 set's "his M - K" (paper10) and the logit-lens control
  (unembed10): scripts/jsuite2_score.py, facts/<condition>/start=all, contrast "M-K", point estimates; "not needed" =
  M - K(paper10) < 15, or |M - K(paper10) - M - K(unembed10)| <= 10. The rotated controls and the size-matched control
  (paper10_pcasize) and the stated facts' own loss are reported beside, not in the rule.
controls:
- 'paper10_rot: the same removal vectors turned by a fixed random rotation (seed 888 + layer, drawn on the CPU)'
- 'unembed10: paper10''s procedure over the logit lens''s directions (the unit unembedding rows of letter tokens, final-norm gain folded in); the rule''s control'
- 'unembed10_rot: its rotation'
- 'paper10_pcasize: paper10''s size at each position along the residual''s top 256 principal directions at L26 (64 pinned WikiText rows), the size-matched control'
- 'the stated final K and the other finals P, A, N under every condition (reported)'
n: '2,705 prompts: jsuite_v2_test_chat facts, 15 start x final words, the items Muse gets right in muse30_jsuite_v2_test_chat_competence_cand2_v1 (540-541 per final at start=all); rebuilt on CPU 27 Oct with the Muse tokenizer: the same 2,705 (word, id) pairs as the record run muse30_jsuite_v2_test_chat_ko_cand2_v1'
seeds: [888, 0]
notes: "DRAFT, NOT QUEUED (Dan 27 Oct ~14:40): enqueue only after Dan's Q45.14 answer is committed. Settings as Zach's record Muse run (muse30_jsuite_v2_test_chat_ko_cand2_v1: cand2 read, batch 16, exact-length batches, all positions, n 1000 per word, level all) except the band (one layer, L26) and the added size-matched condition. One band per run: jsuite2_score pools a run's bands, so L26 and L36-42 are separate runs. BJ_GRAM_PROJ unset: the QR projection, as the record run (Zach's later runs use the Gram form, equal to ~1e-13). A one-layer knock-out is a seventh of the band's edits: a small M - K here may be dose, not depth (the rotated and size-matched controls are at the same dose; a 7-layer band centred on L26, L23-29, is an open option for Dan, ~2.1-2.4 GPU-h). Runs on our box (Muse's weights are cached there; not on Zach's H200, EXPERIMENTS.md 27 Oct). Seeds: 888 + layer the rotation, 0 the scorer's bootstrap (1,000 draws over relation:bridge). Cost: Zach's record run took 4,654 s on an H200 (summary.json): 4,440 s in the band for 4 conditions x 7 layers, so 1,110 s per condition and 214 s outside the band. Split from Muse's own muse30_full2_ko_v1 (620 prompts, 2 conditions; L10-16 481 s, L0-50 3,224 s): per condition 240 s at 7 layers and 1,612 s at 51, so 31.2 s per layer and 22 s of forward; x 2,705 / 620 = 4.36: 136 s per layer and 96 s of forward per condition (the record's 1,110 s per condition at 7 layers implies ~145 s per layer). Here: 5 conditions x (96 + 145) s + 214 s + ~60 s for the principal directions = ~1,480 s = 0.41 h on an H200; on one H100 PCIe x 1.3-1.5 (assumed from the spec sheets, not measured on this workload) = 0.53-0.62 h; jsuite2_score ~1 min on the CPU. mem_gb 75 as the other 1-GPU Muse jobs (no peak recorded for ablate_v2 on Muse); if it runs out of memory, rerun with --batch 8 and say so."
