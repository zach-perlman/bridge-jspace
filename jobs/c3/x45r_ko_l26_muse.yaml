notes: "DRAFT, NOT QUEUED. Descriptive (Dan ~15:05). Queue order within 45r: after x45r_ko_l23_29_muse, before x45r_ko_band_muse; enqueue only after Dan's Q46.1 answer is committed and Zach has confirmed this use of his method. Settings as x45r_ko_l23_29_muse except the band (one layer). BJ_GRAM_PROJ unset (QR, as the record run). Seeds: 888 + layer the rotation, 0 the bootstraps. Cost: Zach's record run took 1,110 s per condition at 7 layers on an H200 and 214 s outside the band. Split from Muse's own muse30_full2_ko_v1 (620 prompts, 2 conditions; L10-16 481 s, L0-50 3,224 s): per condition 240 s at 7 layers and 1,612 s at 51, so 31.2 s per layer and 22 s of forward; x 2,705 / 620 = 4.36: 136 s per layer and 96 s of forward per condition (the record's 1,110 s at 7 layers implies ~145 s per layer). Here: 5 conditions x (96 + 145) s + 214 s + ~60 s for the principal directions = ~1,480 s = 0.41 h on an H200; on one H100 PCIe x 1.3-1.5 (assumed, not measured) = 0.53-0.62 h."
