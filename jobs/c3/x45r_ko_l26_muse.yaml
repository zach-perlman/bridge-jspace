question: >-
  Descriptive, beside 45r's rule: on Muse, what does Zach's knock-out cost at L26 alone, the one layer our
  change-removal edits (M - K, the logit lens's M - K and the J-specific excess, with the rotated and size-matched
  controls)?
why_it_matters: >-
  45r's rule reads his knock-out over the band L23-29 (his band width, Dan ~15:05). The one-layer knock-out at L26 is
  the closest match to our single-layer edit; set beside the band, it shows how much of the band's effect one layer
  gives (a seventh of the edits).
hypotheses:
  Q46.1: "Dan's answer in predictions/2026-10-27_dan.md (Q46.1); enqueue only after it is committed. This run is descriptive: not in the rule, not scored."
decision_rule: >-
  Not in the rule (Dan ~15:05: L26 alone is descriptive). 45r's rule is in jobs/c3/batch45.yaml (45r) and
  x45r_ko_l23_29_muse. Reported from this run's jsuite2_score file, facts/<condition>/start=all, contrast "M-K", point
  estimates with their CIs beside them: M - K under paper10, paper10_rot, unembed10, unembed10_rot and paper10_pcasize;
  the J-specific excess (paper10 minus unembed10, paired bootstrap CI over relation:bridge, 10,000, seed 0); size-matched
  / J++; the stated facts' own loss.
controls:
