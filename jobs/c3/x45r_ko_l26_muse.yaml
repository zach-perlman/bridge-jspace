- 'unembed10: paper10''s procedure over the logit lens''s directions'
- 'unembed10_rot: its rotation'
- 'paper10_pcasize: paper10''s size at each position along the residual''s top 256 principal directions at L26 (64 pinned WikiText rows)'
- 'the stated final K and the other finals P, A, N under every condition (reported)'
