id: x52_lightning_natural
title: "Batch 52 C coverage (Lightning extra a, 2 of 2): the split in natural passages (x5_natural: notes, news, forum posts, emails with distractors) at L14: whole / without J++ / without a random part; no prediction"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.3
depends_on: []
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  L=$(uv run python scripts/x51_lightning.py layer) && export BJ_PREDICTED_LAYER=$L &&
  uv run python scripts/x5_natural.py run --name nem35l_x52_natural &&
  printf '%s\n' "no prediction: coverage run on an already-scored rule (batch 52 C; Lightning L14; x5's gate 0.80, unchanged)" > results/x5_natural/nem35l_x52_natural/coverage.txt
question: >-
  On Lightning, in natural passages: is the gap (the recall's extra loss minus the lookup's) at least 0.30?
why_it_matters: >-
  'Does the split hold in other texts?' (Part I, natural passages) on the second family; amendment 3 extra a.
hypotheses:
  none: "No prediction (batch 52 addendum): coverage run on an already-scored rule."
decision_rule: >-
  The rule as the depth page's card quotes it, fixed in advance (scripts/x5_natural.py; scored on the 27B and Muse,
  the 9B's gate lowered after the data): natural passages: "holds if the gap is at least 0.30 with its lower bound at
  least 0.15; fails at 0.10 or below; otherwise mixed." As computed: x5_natural.py run as muse30b_x5_natural
  (jobs/c3/muse_g5.yaml: "x5_natural.py run --name {N}"): its set, gate 0.80 per reader (no lowered gate: a failed gate
  is not tested), at Lightning's committed L14 (amendment 1). Verdict in the job (not sealed). Cells under 30 switches
  left out (amendment 3; the card leaves the lookup's natural cells out where few switch).
controls:
- "without a random part of the J++ part's share (X0's random subspace, seed 888 + L)"
- "the read gate (0.80 per reader)"
n: "x5_natural's eligible passages on Lightning's tokenizer"
seeds: [888, 0]
notes: "Batch 52 C, amendment 3 extra a; any free Lightning box (no code change: x5_natural reads X0's PREDICTED, the committed L14 through BJ_PREDICTED_LAYER). Wallclock (ledger): x5_natural_9b_g75 0.14 h, the 122B 0.31 h; est ~10-15 min, 0.3 GPU-h; opens before the freeze."
