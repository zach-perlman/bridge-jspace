id: x51_5_9b
title: "Batch 51.5 on the 9B: the anatomy by depth on Zach's passages. 47.8's per-layer sweep (every 2nd layer L2-L30) on Z1's 200 items (his v2 passages, the pointer's name changed), fact-first stratum first; per layer the whole change at the name's last token and the change without its J++ part (the layer's own 25 atoms) against random parts of the same share; K (lookup) and M (recall); no slot probe; sealed"
thread: C3
gpus: 1
mem_gb: 40
est_gpu_hours: 0.5
depends_on: []
command: >-
  export BJ_TARGET=qwen3.5-9b BJ_DEVICE_MAP=;
  uv run python scripts/x51_depth.py run --name qwen35_9b_x51_5 --why "batch 51, test 51.5 (jobs/c3/batch51.yaml; Q51.5, sealed): the anatomy by depth on Zach's passages, the 9B, every 2nd layer L2-L30, Z1's 200 items, fact-first first"
question: >-
  On Zach's passages, how deep does the change at the bridge name still redirect each reader, layer by layer, and does
  its read window end where it ends on our scenes? Per layer, does the lookup need the J++ part of the change and does
  the recall?
why_it_matters: >-
  47.8 gave the depth picture on our locker scenes only. If the read window on his natural passages ends within a few
  layers of ours, the depth at which the bridge's change is read is a property of the model, not of our layout; if it
  ends much earlier or later, our depth claims (L, the window, the handoff) are scene-specific. Zach's own swap window
  (L4-20, gone by L25) is reported beside.
hypotheses:
  Q51.5: "Dan's answer in predictions/2026-10-28_dan.md (Q51.5, P(yes) per model: 9B / 27B); not committed when this spec was written, so the job is sealed: per-item outputs only, no verdict; scripts/x51_depth.py verdict / view refuse until it is committed."
decision_rule: >-
  Fixed in advance (jobs/c3/batch51.yaml, 51.5, verbatim): "the same read window as ours" if the last layer where each
  reader's switch >= 0.3 lies within 4 layers of ours (9B: both readers to ~L16, the recall to L24; 27B: from 49.4).
  Report against Zach's swap window (L4-20, gone by L25).
  Reference values (ours), written here before any 51.5 run: computed by scripts/x51_depth.py reference() (the same
  switch_rates / window_end code the verdict applies to his passages) on the stored 47.8 run qwen35_9b_x47_anatomy (C2
  test half, 200 scenes; lookup switch = identity + position + value, recall switch = the changed item), and equal to
  the opened verdict results/x47_anatomy/x47_8-20261028T154518Z: lookup last >= 0.3 at L16 (L14 0.97, L16 0.46, L18
  0.06), recall at L14 (L12 0.83, L14 0.73, L16 0.17). So on the 9B: the lookup's window end on his passages within
  L12-L20, the recall's within L10-L18. NOTE: the brief's "the recall to L24" does not match the stored run (its recall
  is 0.17 at L16, 0.00 at L24); the computed L14 is used, as instructed, and Dan may override before the run.
  As computed (fixed before any run; Dan may override before it): Items: Z1's chosen passages on the 9B
  (results/x50_zach/qwen35_9b_x50_z1: gate.json's order joined to cases.jsonl; Z1's gate passed, O read K 0.95 / M 0.84;
  200 items, 182 from jsuite_v2_test_chat and 18 from jsuite_v2nb_test_chat; 100 fact-first, 100 fact-after), re-aligned
  with x50_zach.z1_cases on the tokenizer before the run (plan: 200 of 200 the same). Sweep: L2-L30 every 2nd (47.8's 9B
  grid, 15 layers). Delta_l = h_S - h_O at the pointer name's last token per reader (K and M passages differ before it),
  added at layer l alone on O. Arms: whole; no_jpp (minus the signed-OMP J++ part, k = 25, the layer's own letter-token
  atoms); no_jpp_ratoms (minus a random part of the same share from random lens atoms of the layer, seed 777 + l:
  47.8's control); no_jpp_rand (minus a random part of the same share in X0's random subspace, seed 888 + l: Z1's
  control, so L12 reproduces Z1's arms). Switch = Z1's read (top token = the first token of S's answer). Window end =
  the last sampled layer whose whole-change switch share (point estimate) >= 0.30 (EPS 1e-9); none if no layer reaches
  it. Holds iff, for both readers, his window end exists and |his - ours| <= 4; decided on all of Z1's items (both
  strata pooled), each stratum's window end beside; a run that stopped after the fact-first stratum is decided on
  fact-first alone and labelled partial. Z1's gate failed -> not tested (numbers descriptive). Beside, per layer with
  cluster-bootstrap CIs over the bridge entity (10,000, seed 0): each reader's switch share pooled and per stratum,
  the extra loss without J++ (X0's excess against no_jpp_ratoms; against no_jpp_rand beside); Zach's swap window:
  each reader's first and last layer >= 0.3 against L4-L20 and whether every sampled layer >= L25 is < 0.3, on his
  passages and on our scenes. The identity / position split per layer is an optional flag of the run stage (--split:
  Z3's items, its competence and gate on this model, the whole change at every sweep layer, x6_routes' routes;
  descriptive), OFF in this spec: batch51.yaml asks for it only if Z3 shows position answers, and Z3 is sealed and was
  not read; to add it, append --split to the command before enqueueing.
  Scored by hand: scripts/x51_depth.py verdict (verdict.md, x51_5.json, the figure), then view.
controls:
- "the J++ part's removal against a random part of the same share per item: random lens atoms of the layer (seed 777 + layer, 47.8's) and X0's random subspace (seed 888 + layer, Z1's); achieved shares in norms.jsonl"
- "the recall (M) on the same passage and the same change, every layer"
- "Z1's gate (0.80 per reader on O) and both readers right on O and S, from Z1's run; the items re-aligned on the tokenizer before any GPU work (the run asserts all of them)"
- "none (O unedited) read once per item and reader beside every arm"
- "ours by the same code: the reference window ends recomputed from the stored 47.8 run in the verdict and checked against this spec's values"
n: "200 passages (Z1's chosen on the 9B: 100 fact-first, 100 fact-after; 120 bridge entities, the bootstrap's clusters); 15 layers x 4 arms + none = 61 reads per passage and reader, 24,400 reads"
seeds: [777, 888, 0]
notes: "Batch 51 (Dan, 28 Oct 17:10), test 51.5, helper queue after 49.2 Muse r5 and Z3: 51.5 9B -> 27B. Sealed: the run writes manifest (Z1's gate, the reference, the switches), gate.json (Z1's gate summary, the re-alignment, the run order), cases.jsonl (the 200 items in run order), outcomes.jsonl (rewritten after each stratum: the fact-first rows are on disk before the fact-after passages start) and norms.jsonl (per item, layer and reader: the change's norm, the J++ share, the two random shares); no verdict. After Dan's Q51.5 is committed, by hand (CPU): uv run python scripts/x51_depth.py verdict (both runs: verdict.md with the rule, the numbers with CIs, n and the label per model; x51_5.json; x51_5_depth.png in fig06b's layout, our scenes from the opened 47.8 verdict beside his passages, each with the extra loss without J++ under it), then view (5 rendered prompts per model and 10 random rows per arm, seed 0). Plan: results/x51_depth/plan-20261028T164603Z/. Seeds: 777 + layer the random lens atoms, 888 + layer the random subspace, 0 the bootstrap and the view. GPU estimate from results/jobq/ledger_sesterce-h100x2.jsonl (one H100 PCIe): x47_8_9b ran 1546 s for 84,800 reads of ~75-token prompts (6.4M prompt tokens) plus 1,300 forwards, 15 per-layer fits with probes and 700 competence scenes; x50_z1_9b ran 1009 s, mostly Z1's competence (544 passages), which 51.5 does not repeat. 51.5: 24,400 reads of ~260-token prompts (6.3M prompt tokens, one read call of 61 rows per passage and reader at the default batch of 128), 800 forwards recording 15 layers, 60 signed-OMP fits (15 layers x 2 strata x 2 readers): about 0.35 h with the model load; 0.5 with margin (Dan: ~1 GPU-h)."
