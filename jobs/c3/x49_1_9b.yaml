title: "Batch 49.1 on the 9B (L12): the gain map. At the bridge word, alpha x the change's J++ part + beta x the rest added to the original prompt, alpha, beta in {0, 0.5, 1, 1.5, 2}; random corners, the (0, 2, no U) arm and its twin, the K = 100 corners; main-test scenes with the locker before the pick, both readers"
thread: C3
gpus: 1
mem_gb: 40
est_gpu_hours: 0.15
