notes: "Batch 49 (Dan, 28 Oct), 49.1, queue item 3 (amendment 1: 9B -> 27B -> Muse). Sealed: the run writes manifest (switches, U's record), plan (counts), gate (the source run's, asserted), cases, outcomes (both readers, 39 arms: the 25-cell grid, 4 random corners, the no-U arm and its twin, 4 + 4 K = 100 corners; switched, top token, role, p_org, p_alt, ld), norms (per item: ||Delta||, the shares of ||Delta||^2 of P_J Delta, its random twin, U U^T Delta, its random twin, U U^T P_J Delta and the K = 100 part), losses (per item and arm: the loss at the bridge word on O's next token) and 10 examples' greedy texts (seed 0, every arm); no verdict. By hand after Dan's Q49.1 is committed (CPU, after all three models): uv run python scripts/x49_gain.py verdict (the rule per model, the 5x5 tables, the corners, the loss check and the verify-pack view: 10 random items per run, seed 0, O's prompt as read with the bridge word marked, every arm's top token and greedy text); figure: scripts/story_b49.py build_gain. Estimate from the box ledger (results/jobq/ledger_sesterce-h100x2.jsonl): x47_4_9b (stored X0 items, no competence pass) ran 264.5 s for 609 items x (3 single forwards + 2 reads of 7 rows) ~ 10.4k row-forwards, 0.025 s per row; here 75 items x (2 forwards + 2 x 39 rows + 39 rows cut after the bridge word) ~ 7.5k rows ~ 190 s, plus the examples' greedy texts (10 items x 2 x 39 rows x 8 tokens) ~ 60 s and two OMPs: ~ 250 s + setup = 0.08 h -> 0.15 (Dan's brief: ~0.5)."
