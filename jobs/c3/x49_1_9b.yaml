command: >-
  export BJ_TARGET=qwen3.5-9b BJ_DEVICE_MAP=;
  uv run python scripts/x49_gain.py run --name qwen35_9b_x49_1 --why "Batch 49, test 49.1 (jobs/c3/batch49.yaml, amendment 2; Q49.1): the gain map at L12, alpha P_J Delta + beta (Delta - P_J Delta) on 25 arms, random corners, (0, 2, no U) and its twin, K = 100 corners; main-test locker-first scenes of qwen35_9b_x0_necessity; sealed"
question: >-
  Is the difference between the readers a difference of weights on the same two parts, rather than two routes? Each
  reader's switch as a function of the gain of the change's J++ part (alpha) and of the rest (beta).
why_it_matters: >-
  Decides "weights vs routes" (amendment 1's queue item 3): if the recall switches on a doubled J++ part alone and on the
  doubled rest with the address taken out, while the lookup ignores the J++ part, the two readers weigh the same two
  codes differently; if the doubled rest never moves the recall, they take two routes.
hypotheses:
  Q49.1: "Dan's answer in predictions/2026-10-28_dan.md (Q49.1, per model: 9B; 27B; Muse); not committed when this spec was written, so the job is sealed: per-item outputs only, no verdict; scripts/x49_gain.py verdict refuses until the answer is committed."
decision_rule: >-
  Fixed in advance (jobs/c3/batch49.yaml, 49.1, with amendment 2's 49.1 item), verbatim: (a) "Weights, not routes": the
  recall's switch at (2,0) >= 0.5 and at (0,2, no U) >= 0.5, random corners <= 0.15; the lookup's switch at (2,0) <=
  0.10 and at (0,1) >= 0.6. (b) "Routes": the recall's switch at (0,2) <= 0.2 while (2,0) >= 0.5. (a') "The rest moves
  the recall only through the address": (0,2) >= 0.5 but (0,2, no U) <= 0.2. (c) "Neither"; report the two heatmaps. As
  computed (fixed before any run; Dan may override before the verdict): scenes = the main test's eligible items of
  qwen35_9b_x0_necessity at L12 (chat; X0's gate 0.80 per reader on O unedited and >= 150 eligible, asserted from its
  gate.json), rebuilt by x47_cumulative.select, x45m.group_of locker-first only (75 items, 32 bridge items; plan in
  results/x49_gain/plan-20261028T132841Z). Delta = h_S - h_O at the bridge word at L; P_J Delta = X0's 25-atom signed
  OMP part over the J++ lens's letter-token atoms at L; arm (alpha, beta) adds alpha P_J Delta + beta (Delta - P_J
  Delta) at the bridge word at L on O (X0's AddRows). Random corners = the same with R Delta, X0's random part at P_J
  Delta's share of ||Delta||^2 (random basis seed 888 + L), at (0,1), (1,0), (2,0), (0,2). (0,2, no U) = 2 (Delta - P_J
  Delta - U U^T Delta) as written in amendment 2 (U = x47_atoms.pointer_basis, not refit); its twin = 2 (Delta - P_J Delta
  - R_U Delta), R_U the random part at U U^T Delta's share. Switch = X0's chat read (top token = S's answer's first
  token). "Random corners <= 0.15" is computed on the recall's R(1,0) and R(2,0) (the random part where the J++ part is
  written; R(0,1) and R(0,2) keep most of the change); the literal all-four reading is reported beside. Point estimates
  decide (EPS 1e-9 at the bars); cluster-bootstrap CIs over the bridge items (10,000, seed 0) beside. Dumbest ways: (1)
  plain-text loss at the bridge word (O's next token) under (2,0), (0,2), (2,2), (0,2, no U) against (1,1), a corner
  above 2x flagged, descriptive; (2) the four corners with K = 100 and their random twins (this model only),
  descriptive; (3) the gate, asserted. Code: scripts/x49_gain.py verdict (rule, loss_numbers).
controls:
- "the random part of the J++ part's share (X0's random subspace, seed 888 + L) in its place at the four corners"
- "the random part of U's share in place of U U^T Delta beside the (0, 2, no U) arm"
- "J(0,0) = O unedited (reads O's answer by eligibility; reported) and J(1,1) = X0's whole arm (against the source run's stored switches; reported)"
- "the lookup on the identical edits"
- "plain-text loss at the bridge word against (1, 1) (dumbest way 1)"
- "the four corners at K = 100 (dumbest way 2)"
n: '75 main-test scenes with the locker before the pick (32 bridge items), the source run''s eligible items at L12, chat'
