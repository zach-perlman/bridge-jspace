id: x52_lightning_heads
title: "Batch 52 C coverage (Lightning, after the attention port; 51.2): joint head ablation under the address swap at L14: heads ranked by their attention move in Lightning's 49.7 run (attention blocks 19 / 26 / 33 / 42), top-k sets (k = 1, 3, 5, 10) and the best layer mean-ablated at the last / question tokens against random sets of the same size in the same layers; no prediction"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.6
depends_on: [x52_lightning_attn]
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  L=$(uv run python scripts/x51_lightning.py layer) && export BJ_PREDICTED_LAYER=$L &&
  test -f results/x49_attn/nem35l_x52_attn/attention.npz &&
  uv run python scripts/x51_heads.py run --name nem35l_x52_heads --why "Batch 52 part C (amendment 3), coverage: 51.2's joint head ablation on Lightning at the committed L$L, on its 49.7 run nem35l_x52_attn; no prediction: coverage run on an already-scored rule" &&
  uv run python scripts/x51_heads.py verdict --coverage --runs nem35l_x52_heads
question: >-
  On Lightning: does a small set of attention heads after L14 carry the dereference of the written address (a top-k
  set cuts >= 0.5 of the switch with identity and recall answers untouched and random sets <= 0.15), or is it
  distributed (51.2's labels)?
why_it_matters: >-
  51.2 (joint head ablation, Fig. 10d's successor) on the second family; it follows only on the attention port, which
  landed in 48ba12a9.
hypotheses:
  none: "No prediction (batch 52 addendum): coverage run on an already-scored rule."
decision_rule: >-
  The rules verbatim from jobs/c3/x51_2_muse.yaml (jobs/c3/batch51.yaml 51.2, Dan 28 Oct 17:10; first scored in
  results/x51_heads/x51_2-20261028T190358Z): "Read half; decisive site the last token (49.7's decisive site), the
  question tokens beside under the same rules ... "A small set carries the dereference": some top-k set, k in {1, 3, 5,
  10}, cuts >= 0.5 while the identity answers ... move <= 0.10 and the recall's answer moves <= 0.10 (swap + ablation vs
  swap), and the random sets of k heads from the same layers cut <= 0.15 (mean over the draws). "Distributed": every
  head of the best layer together cuts < 0.3. Label: small set if it holds, else distributed if it holds, else
  neither; both flags reported." As computed: x51_2_muse's text on Lightning's 49.7 coverage run nem35l_x52_attn (its
  items, halves and stored attention), the heads of its recorded attention blocks after L14 (19, 26, 33, 42; 32 query
  heads each, 2 KV heads); mean ablation of a head's slice of o_proj's input (NemotronH: no output gate; the port's
  attention_module). Cells under 30 switches left out (amendment 3). Verdict in the job (verdict --coverage).
controls:
- "random head sets of the same size in the same layers (N_DRAWS draws, HEAD_SEED); for the best layer, random sets from the other recorded layers"
- "a no-ablation baseline read beside each arm"
- "identity answers and the recall's answer under the ablation (collateral)"
n: "Lightning's 49.7 read half (its switched swap pairs), both readers, 2 sites"
seeds: [0]
notes: "Batch 52 C, amendment 3; speedup behind x52_lightning_attn (reads its attention.npz from the box's checkout; depends_on; checked first). Code: x51_heads uses knockout.attention_module (the port) for the o_proj hooks, SOURCE includes x49_attn's coverage runs, COVERAGE_RUNS + verdict --coverage (51.2's RUNS and own verdict unchanged). Wallclock (ledger-based): x51_2_muse est 0.6; Lightning has 4 attention layers x 32 heads; est ~20-30 min, 0.6 GPU-h; opens before the freeze."
