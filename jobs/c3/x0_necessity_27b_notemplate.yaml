  H-gate: 'unedited org accuracy under the decisive read >= 0.80 for both readers. Prior: Dan''s, predictions/2026-10-24_dan.md Q25.1'
  H-raw-same: 'raw gets the chat verdict at layer 32. Prior: Dan''s, Q25.5'
decision_rule: >-
  jobs/c3/X0.md with amendment 1: the rule of x0_necessity_27b_chat applied to the raw rendering, reported beside chat; chat decides. Gate: >= 0.80 unedited org accuracy under the decisive read for both readers, else "can't test". Not opened before Dan's batch-25 answers are committed.
controls:
