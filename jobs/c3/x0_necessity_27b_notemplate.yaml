- 'the random Gaussian dictionary at k = 25 (the fitted null, rand_omp)'
- 'both readers on the identical patch'
- 'the valid-cell bar on the whole edit (S_whole >= 0.30 and >= 30 items)'
- 'the competence gate (>= 80% under the decisive read; greedy text and cand accuracy beside it)'
n: 'up to 200 eligible scenes of d1_topics_v3 (600 generated), 2 readers each; < 150 eligible = can''t test'
