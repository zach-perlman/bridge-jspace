id: x53_3_9b
title: "Batch 53.3 on the 9B: the conflict test at the last token (P3) at 51.10's read-peak layer (L24 both readers) and the answer layer minus 2 (L27 both); arms whole / without the lens part / without a random part of its share / the lens part alone / the rest alone; 51.10's 75 locker-first items, both readers; no prediction; UNVERIFIED"
thread: C3
gpus: 1
mem_gb: 40
est_gpu_hours: 0.1
depends_on: []
command: >-
  export BJ_TARGET=qwen3.5-9b BJ_DEVICE_MAP= PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  uv run python scripts/x53_lastconflict.py run --name qwen35_9b_x53_3 --why "Batch 53, test 53.3 (jobs/c3/batch53.yaml, Dan 29 Oct 09:30): the conflict test at the last token on the 9B, at 51.10's read peak and the answer layer minus 2; no prediction" &&
  uv run python scripts/x53_lastconflict.py verdict --runs qwen35_9b_x53_3
question: >-
  At the last token (the read position, whose next token is the answer), does each reader's change from O to S act on
  the answer through the lens part (its 25 J++ atoms) or outside it, at 51.10's read-peak layer and two layers before
  the answer layer?
why_it_matters: >-
  Batch 53 (Dan, 29 Oct 09:30), test 53.3, priority 3 (09:50 standing rules): the main conflict test reads the bridge
  word; 53.3 asks the same question where the answer is read out.
hypotheses:
  none: "No prediction (batch 53: every rule fixed in Dan's brief before any run)."
decision_rule: >-
  Verbatim from jobs/c3/batch53.yaml (brief, 53.3): "9B, 27B, Muse, Lightning; at 51.10's read-peak layer and the
  answer layer minus 2. The change = S's last-token state minus O's at that layer; the lens part = its 25 J++ atoms;
  arms: whole; without the lens part; without a random part of the same share; the lens part alone; the rest alone.
  Rule per reader: "computes outside the lens at the last token" if the loss without the lens part is <= 0.10 beyond
  random and the rest alone switches >= 0.7 of the whole; "through the lens" if the loss is >= 0.30 beyond random;
  else in between." As computed (scripts/x53_lastconflict.py, fixed before the run): layers per reader from
  results/x51_jread/qwen35_9b_x51_10/peak.json (read peak: lookup 24, recall 24) and the newest 51.10 read,
  results/x51_jread/read-qwen35_9b_x51_10-20261028T185634Z/read.json (answer layer: lookup 29, recall 29; minus 2 = 27);
  items = 51.10's (x51_jread.select on qwen35_9b_x0_necessity at L12), its 75 locker-first items (32 entities), as
  51.10's write arms; each reader's own O and S prompts as read (X0's chat read, the digit's space token appended), Δ
  = h_S - h_O at the last token at the layer; the lens part = X0's 25-atom signed OMP over the letter-token J++
  dictionary at the layer (x49_gain.lens_parts), the random part = X0's random subspace part at its share (seed 888 +
  layer); each arm added at the last token at the layer on O (AddRows): whole Δ, without the lens part Δ - P_J Δ,
  without a random part Δ - R Δ, the lens part alone P_J Δ, the rest alone Δ - P_J Δ (in this additive patch the same
  vector as "without the lens part": read separately, reported under the brief's name); switch = the top token is S's
  answer's first token. The loss beyond random = X0's excess (S_no_rand - S_no_jpp) / S_whole; the rest alone's share
  = S_rest / S_whole; point estimates decide (EPS 1e-9 at the bars); cluster-bootstrap CIs over the original bridge
  entities (10,000, seed 0, paired) beside; S_whole = 0: "not tested (the whole change switches no item)"; X0's
  validity bar (S_whole >= 0.30 and >= 30 switches) beside, not in the rule. Verdict in the job:
  results/x53_lastconflict/x53_lastconflict-<UTC>/ (the script's only verdict prefix; never a default README folder).
controls:
- "without a random part of the lens part's share (X0's random subspace, seed 888 + layer): the reference of the loss"
- "O unedited (the floor) and the whole change (the ceiling) read on the same items"
- "the rest alone read separately from 'without the lens part' (the same vector: the two reads must agree)"
- "the source run's gate (X0: 0.80 per reader on O unedited, >= 150 eligible) asserted"
n: "51.10's 75 locker-first items (32 bridge entities) on the 9B, 2 readers, 2 layers (L24, L27): 1,650 reads + 300 state forwards (plan: x53_lastconflict.py plan)"
seeds: [888, 0]
notes: "Batch 53, test 53.3 (Dan's brief 29 Oct 09:30; standing rules 09:50: priority 3). Box: mats (coordinator ~09:55: after Muse 47.16 r2; no depends_on, enqueue it behind that job). New script scripts/x53_lastconflict.py (plan / run / verdict), tested on 51.10's fake model (tests/test_x53_lastconflict.py: the layers from 51.10's files, the arms' vectors, the labels at the bars, the cell numbers recomputed from planted reads, run and verdict end to end). Writes results/x53_lastconflict/qwen35_9b_x53_3/ manifest.json (before the model loads), plan.json, cases.jsonl, norms.jsonl (||Δ||, the lens and random shares per item, reader and layer), outcomes.jsonl; the verdict folder x53_lastconflict-<UTC>/ (verdict.md, verdict.json, x53_lastconflict.png, examples.md = 10 random items, seed 0). Cost (ledger, results/jobq/ledger_sesterce-h100x2.jsonl): x51_10_9b ran 591 s for ~54,000 reads and 800 cached forwards on the same items; here 300 forwards and 150 batched reads of 11 rows, plus load (~40 s setup) and two J++ dictionaries: ~3 min; est 0.1. Memory: x51_10_9b peaked at 26 GB. Disk on the Mac before the spec: 185 GB free. UNVERIFIED; into EXPERIMENTS.md with a card and the figure."
