id: x47_13_9b
title: "Batch 47.13 on the 9B (L12), the GPU part: the lens's top item at the bridge word on every scene of the varied-scene run (x0b_v2) and of the named source (x0_probe v4, d1_topics_v4), from their stored states; the lookup's unedited read on every d1_topics_v4 scene, which x0_probe never took; SEALED until Q47.13"
thread: C3
gpus: 1
mem_gb: 40
est_gpu_hours: 0.15
depends_on: [x0_probe_power, x0b_v2]
command: >-
  export BJ_TARGET=qwen3.5-9b BJ_DEVICE_MAP=; uv run python scripts/x47_errors.py gpu --name qwen35_9b_x47_errors
question: >-
  On the scenes where the unedited lookup answers wrong, is the lens's top item at the bridge word (J++ readout over the
  scene's locker items, as the digit check ranks the digits) still the right item, so that the identity was right and
  only the address was wrong? And how many of the 1,500 d1_topics_v4 scenes (the source test 47.13 names) does the
  lookup get wrong at all?
why_it_matters: >-
  Test 47.13 (batch47.yaml, amendment 4) reads the address probe's slot against the wrong answer's slot on the wrong
  items; its second clause needs the lens's top item there. The CPU count (scripts/x47_errors.py count, results/x47_errors/)
  already holds the per-item rows from the varied-scene run; the lens readout needs the unembedding, so it runs here.
  The named source (x0_probe_power) stores states but no read: on the sibling d1_topics_v5 set the lookup is wrong on
  0 of 528 (9B), 0 of 528 (27B), 3 of 463 (Muse), so the reads say whether the named source can be counted at all.
hypotheses:
  Q47.13: "Dan's answer in predictions/2026-10-28_dan.md (Q47.13); not committed when this spec was written, so the run is sealed: no verdict in the job (scripts/x47_errors.py verdict refuses until the answer is committed)."
decision_rule: >-
  Fixed in advance (jobs/c3/batch47.yaml, 47.13): "the address predicts the error" if the probe's slot matches the wrong
  answer's slot in >= 0.5 of wrong items (chance ~ 0.33 with three lockers; the layout baseline beside), and the lens's
  top item at the bridge word is still the right item in >= 0.8 of those. As computed (the agent, before any count; Dan
  may override; scripts/x47_errors.py docstring): wrong items = the varied-scene run's unedited lookup answers that are
  wrong (x0b_generalize/qwen35_9b_x0b_v2, competence.jsonl; 100 of 2,255 on the 9B), the one local source with a stored
  read and a stored bridge-word state at L for every scene; the slot probe (x0b's probe (b): one-hot ridge per format x
  locker order on the scenes the lookup gets right, the wrong item's entity held out, penalty by entity-held-out CV)
  against the ordinal of the locker statement stating the answered digit (no statement = no match); "of those" = the
  matched wrong items; a model with fewer than 30 wrong items is not tested; cluster bootstrap over bridge items
  (10,000, seed 0); a value at a bar is at the bar. This job adds lens.jsonl (per scene: the items' lens order, the top
  item, the bridge's rank) and v4_reads.jsonl; it prints counts only. Scored by hand: uv run python scripts/x47_errors.py
  verdict --runs qwen35_9b_x47_errors x47_errors_27b muse30_x47_errors (CPU).
controls:
- 'the majority slot, the layout-conditioned majority and the pick-ordinal-conditioned majority of the training scenes, each matched against the wrong slot beside the probe'
- 'the probe against the gold slot on the same wrong items (does the probe still read the right address when the model errs)'
- 'the lens top item on every scene (right ones included): the identity readout''s rate where the lookup is right, beside its rate on the wrong items'
- 'the bridge token reproduced by the item-token rule on every scene (a scene where it is not is dropped and counted)'
n: '2,255 x0b_v2 scenes with a read and a state (100 wrong, 91 with a slot, 40 bridge items) + 1,500 d1_topics_v4 scenes (read here; lens on all)'
seeds: [0]
notes: "Batch 47 amendment 4 (Dan, 28 Oct ~03:00), CPU test; this is its one small GPU part. Needs on the box: results/x0b_generalize/qwen35_9b_x0b_v2/{states.npz, cases.jsonl, competence.jsonl} and results/x0_probe/qwen35_9b_x0_probe_v4/{states.npz, manifest.json} (the latter from x0_probe_power via depends_on); the stage fails loudly without them. Cost: model load + lens vectors for ~3 x 3,750 item tokens + 1,500 unedited lookup forwards with 8 greedy tokens: ~10 min on an H100. Sealed: the stage writes manifest, lens.jsonl and v4_reads.jsonl and prints counts (rows, dropped, wrong), no rate."
