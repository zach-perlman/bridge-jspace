id: x51_2_27b_r2
title: 'Batch 51.2 on Qwen3.6-27B (L32): joint head ablation under the address swap. 49.7''s items and swap 2 (mu_k - mu_j)
  at the bridge word; every recorded attention head ranked by its attention move on the fit half; on the read half the top
  k in {1, 3, 5, 10}, all heads of the best layer, each mean-ablated at the last token and at the question tokens under the
  swap; matched random sets of k heads from the same layers (5 draws); SEALED until Q51.2'
thread: C3
gpus: 1
mem_gb: 75
est_gpu_hours: 1.0
depends_on: []
command: 'export BJ_TARGET=qwen3.6-27b BJ_DEVICE_MAP= PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True; uv run python scripts/x51_heads.py
  run --name x51_2_27b --why "batch 51, test 51.2 (jobs/c3/batch51.yaml; Q51.2): 49.7''s items and swap at L32; heads ranked
  by their last-token attention move on the fit half (49.7''s stored attention); top 1/3/5/10, the best layer, matched random
  sets mean-ablated at the last / question tokens on the read half; sealed"'
question: Under the address swap, do a few heads whose attention follows the written address carry the switch together (ablating
  them jointly undoes it), or is the dereference spread over many heads?
why_it_matters: 49.7 found heads whose last-token attention moves to the written slot's sentence (moves > 1) but zeroing the
  single best head left the switch unchanged on all three models. Joint ablation separates redundancy among a few heads (a
  small set) from a distributed read (even the whole best layer cuts < 0.3); on the 9B and 27B three of four layers are Gated
  DeltaNet, which no head ablation here touches.
hypotheses:
  Q51.2: 'Dan''s answer in predictions/2026-10-28_dan.md (Q51.2, per model: (a) a small set (k <= 10) / (b) distributed /
    (c) neither); not committed when this spec was written, so the run is sealed: no verdict in the job (scripts/x51_heads.py
    verdict and view refuse until the Dan: line is committed).'
decision_rule: 'Fixed in advance (jobs/c3/batch51.yaml, 51.2, Dan 28 Oct 17:10). Read half; decisive site the last token (49.7''s
  decisive site), the question tokens beside under the same rules; cluster bootstrap over bridge entities (10,000, seed 0);
  EPS 1e-9 at the bars. switch = the read-half swap pairs'' share where the lookup answers slot k''s locker (the swapped-in
  slot); cut = (switch - switch under the ablation) / switch, both read in this run. "A small set carries the dereference":
  some top-k set, k in {1, 3, 5, 10}, cuts >= 0.5 while the identity answers (read pairs answering slot j''s locker under
  the swap; share whose lookup answer changes under the ablation) move <= 0.10 and the recall''s answer moves <= 0.10 (swap
  + ablation vs swap), and the random sets of k heads from the same layers cut <= 0.15 (mean over the draws). "Distributed":
  every head of the best layer together cuts < 0.3. Label: small set if it holds, else distributed if it holds, else neither;
  both flags reported. CPU beside (verdict stage): per read pair, the summed attention move at the last token (every recorded
  head; the top 10 beside) vs switched, from 49.7''s stored forward; logistic fit (on the standardised sum, slope also per
  unit) and AUC with its cluster-bootstrap interval. Report beside: per set and site the switch with and without the ablation,
  the cut with its interval, identity / recall changed, the clean answers lost (none + ablation vs none, both readers), the
  random draws'' cut mean, SD, min and max. As computed (fixed before any run; Dan may override): items = 49.7''s (x8_write.eligible:
  the routes test''s C2 scenes, O, gate 0.80 per reader, the first 300; the run asserts they are 49.7''s run''s items in order
  and the same fit / read halves by bridge entity, random.Random(0)); heads = those 49.7 recorded (every softmax-attention
  layer > L; Gated DeltaNet layers skipped and logged); ranking = every recorded head by its mean attention move at the last
  token on the fit half''s switched swap pairs (no fit pair switched: every fit swap pair), read from 49.7''s stored attention.npz
  and outcomes (no rerun of 49.7; move = (mass on slot k''s sentence - mass on slot j''s) under the swap minus the same under
  none), ties lower layer then head; the one ranking (last-token move) serves both ablation sites; top k is taken across layers,
  so ''the top 10 across layers'' is the k = 10 set (one arm, not two); best layer = the layer of the rank-1 head (49.7''s
  best-layer convention); random control per top-k set = the same number of heads in each of its layers, drawn from that layer''s
  other heads (top-ranked heads of the same layer are not excluded), 5 draws; for the best-layer set (no head left in that
  layer) 5 draws of its size from the other recorded layers; random.Random(512), drawn in a fixed order; mean ablation = the
  head''s slice of o_proj''s input (its attention output after the gate, head_dim wide) replaced at the site''s positions
  by its mean over the fit half''s unedited prompts of the same reader at the same position: the last (read) token; the question
  tokens by index within the question (8 lookup / 9 recall tokens, fixed per reader, asserted); each reader ablated at its
  own positions (the recall''s prompt is one token longer; 49.7 had zeroed the recall at the lookup''s positions); every batch
  row (none and both swaps) ablated; reads = X0''s batched chat read (one batch of 3 rows per reader, set and site), a no-ablation
  baseline read beside; classes as x8_write (target = slot k''s digit, original = slot j''s, third, other); the switched label
  for the CPU-beside fit is 49.7''s (the forward that recorded the attention).'
controls:
- a random set of k heads from the same layers per top-k set (5 draws, seed 512; mean, SD, min-max of its cut); it must cut
  <= 0.15 for 'small set'
- 'the best-layer set: 5 random sets of its size from the other recorded layers (beside; no head is left in the layer)'
- heads ranked on the fit half (49.7's stored attention), every ablation read on the other half (split by bridge entity, seed
  0)
- 'collateral: identity answers and the recall under each ablation (<= 0.10 each for ''small set''); the clean answers lost
  (none + ablation vs none, both readers) beside'
- a baseline read without ablation in the same job (the swap's switch the cut is a share of)
