id: x52_lightning_varied
title: "Batch 52 C coverage (Lightning extra a, 1 of 2): the split in varied scenes (x0b_v2: prose / JSON / table, levels, look-alike names, filler, paraphrased questions) at L14: whole / without J++ / without a random part per cell; no prediction"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 1.0
depends_on: []
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  L=$(uv run python scripts/x51_lightning.py layer) && export BJ_PREDICTED_LAYER=$L &&
  uv run python scripts/x0b_generalize.py run --name nem35l_x52_x0b --set x0b_v2 --why "Batch 52 part C (amendment 3, extra a), coverage: the split in varied scenes on Lightning at the committed L$L; no prediction: coverage run on an already-scored rule" &&
  printf '%s\n' "no prediction: coverage run on an already-scored rule (batch 52 C; Lightning L14, hollow gate on the main test; x0b's own per-cell gate here)" > results/x0b_generalize/nem35l_x52_x0b/coverage.txt
question: >-
  On Lightning, in prose, JSON and tables: does the recall lose its switches without the J++ part while the lookup
  does not, as on the main test?
why_it_matters: >-
  'Does the split hold in other texts?' (Part I) on the second family; amendment 3 extra a.
hypotheses:
  none: "No prediction (batch 52 addendum): coverage run on an already-scored rule."
decision_rule: >-
  The rule as the depth page's card quotes it, fixed in advance (jobs/c3/X0b.md; scored on the 9B, 27B and Muse,
  results/x0b_generalize/*/verdict-*): varied scenes, pooled: "holds if the lookup loses at most 0.10 beyond random
  (upper bound at most 0.20) and the gap is at least 0.20 (lower bound at least 0.10); fails if the lookup loses at
  least 0.20." As computed: x0b_generalize.py's run as muse30b_x0b_v2 (jobs/c3/muse_g4b.yaml: "x0b_generalize.py run
  --name {N} --set x0b_v2"): the full set, per-cell gate (domain x format x level: >= 0.80 unedited org accuracy, both
  readers; failing cells left out), at most 40 eligible scenes per cell, J++ k = 25 and the k = 50 / 100 curve, at
  Lightning's committed L14 (amendment 1; the only layer, as Muse's L26). Verdict and figures in the job (not sealed).
controls:
- "without a random part of the J++ part's share per cell (X0's random subspace, seed 888 + L)"
- "the per-cell read gate (failing cells left out and listed)"
n: "x0b_v2's cells on Lightning's tokenizer, at most 40 eligible scenes per cell (Muse: 2,535 cases built)"
seeds: [888, 0]
notes: "Batch 52 C, amendment 3 extra a; any free Lightning box. Code: x0b_generalize.LAYERS gains Lightning (14,), and the run asserts X0's predicted layer is in its layers. Wallclock (ledger): muse_g4b (x0b_v2 on Muse, one GPU) ~1.1 h; Lightning ~0.5x Muse's time per row; est ~40-60 min, 1.0 GPU-h; opens before the freeze."
