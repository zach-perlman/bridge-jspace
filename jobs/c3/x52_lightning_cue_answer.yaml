id: x52_lightning_cue_answer
title: "Batch 52 C coverage (Lightning, amendment 2's full grid): 51.12's answer-direction control on 47.3's described bridge (the cue set, r2: number-word answer directions) on Lightning at L14, on fill2's 47.3 run; arms whole / without J++ / without J++ minus the answer atoms / without the answer atoms, each against a random part; the readout check first; rule unchanged; no prediction"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.15
depends_on: [x52_lightning_fill2]
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  L=$(uv run python scripts/x51_lightning.py layer) && export BJ_PREDICTED_LAYER=$L &&
  test -f results/x47_cue/nem35l_x52_cue/cues.json && test -f results/x47_cue/nem35l_x52_cue/gate.json &&
  NOTE="no prediction: coverage run on an already-scored rule (batch 52 C, amendment 2: full grid on Lightning, L$L; hollow gate)" &&
  uv run python scripts/x51_answer.py run --set cue --name nem35l_x52_cue_answer &&
  printf '%s\n' "$NOTE" > results/x51_answer/nem35l_x52_cue_answer/coverage.txt &&
  uv run python scripts/x51_answer.py verdict --set cue --coverage
question: >-
  On Lightning at L14, on 47.3's described bridge: is what each reader follows in the lens part the bridge item or the
  answer word (51.12's cue set)?
why_it_matters: >-
  Amendment 2: the full grid on Lightning; completes the depth page's "Described bridge (47.3, and 51.12's cue r2)" row
  on Lightning (47.3 is fill2).
hypotheses:
  none: "No prediction (batch 52 addendum): coverage run on an already-scored rule."
decision_rule: >-
  The rules verbatim from jobs/c3/x51_12_cue_27b_r2m.yaml (jobs/c3/batch51.yaml addendum_4, 51.12, and
  addendum_4_amendment, Dan 20:20; first scored in results/x51_answer/x51_12-20261028T201842Z): "Rules, fixed in
  advance (per model, per reader). “The lens effect is the entity”: arm 2 keeps ≥ 0.7 of arm 1’s extra loss and arm 3
  costs ≤ 0.10 beyond random. “The lens effect is the answer”: arm 2 falls to ≤ 0.3 of arm 1 and arm 3 alone costs ≥
  0.5 of arm 1. Else: mixed, report both shares." With the amendment's number-word answer directions (for 47.3 all four
  lockers' words) and its readout check first ("the answer word is not read at the bridge word (lens rank > 50 on ≥ 90
  % of items)" decides before the arms). As computed: x51_12_cue_27b_r2m's text with Lightning's source: items = 47.3's
  Lightning run nem35l_x52_cue (fill2; x47_cue.COVERAGE_RUNS) at the committed L14, rebuilt by x47_cue.scenes from its
  kept cues and checked position and ids item by item; the gate asserted from the source's gate.json and cues.json
  (failed = not tested). Cells under 30 switches are left out (amendment 3). Verdict in the job (x51_answer.py verdict
  --set cue --coverage, x52_answer-<UTC>/).
controls:
- "a random part of the same share (X0's random subspace, seed 888 + L) beside each of the three removals"
- "the lens-readout check of the answer word at the edited token (rank > 50 on >= 90 % of items: not read), stated before the arms"
- "arm 1 against the stored run's no_jpp / no_jpp_rand item by item (and none / whole); agreement.json"
- "O unedited and the whole change read with the same edits batch"
n: "the items of nem35l_x52_cue (47.3 on Lightning; up to its N_ITEMS) at L14"
seeds: [888, 0]
notes: "Batch 52 C, amendment 2 (coordinator 03:10 Paris: a lookup-table change only). Box speedup, depends_on x52_lightning_fill2 (47.3's run in the box's checkout; checked before loading). Code: x51_answer.COVERAGE_RUNS['cue'] = Lightning's run and source_of('cue') reads x47_cue's RUNS with its COVERAGE_RUNS (lookups; the 9B / 27B sources unchanged, tested). Checked on a planted run (the 27B's cue r2 relabelled): verdict --set cue --coverage passes. Retry once, then skip with the reason logged. Wallclock (ledger): x51_12_cue_27b_r2m 231 s, x51_12_cue_9b_r2m 131 s: est ~5 min, 0.15 GPU-h."
