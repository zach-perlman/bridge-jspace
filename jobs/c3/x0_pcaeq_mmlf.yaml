id: x0_pcaeq_mmlf
title: "PCA at J++'s share (Q30.1 committed before the run) + word-orthogonal jw + layout-free mass-mean address (Dan ~21:50-22:05; descriptive, after data; the last two without a prediction): single-change Δ, 27B L32 on GPU0 and 9B L12 on GPU1"
thread: C3
gpus: 2
mem_gb: 120
est_gpu_hours: 1.3
depends_on: [x0_parts, x0_massmean]
command: >-
  uv run python -c "import torch" &&
  { { CUDA_VISIBLE_DEVICES=0 BJ_DEVICE_MAP= uv run python scripts/x0_parts.py run --name x0_pcaeq_27b --single x0_single_27b_r2 --parts pca_eq,jwo,jpp;
      a=$?; CUDA_VISIBLE_DEVICES=0 BJ_DEVICE_MAP= uv run python scripts/x0_massmean.py run --name x0_massmean_lf_27b --single x0_single_27b_r2 --states x0_probe_v4_27b --mode layout_free;
      test $a -eq 0 -a $? -eq 0; } & p27=$!;
  { CUDA_VISIBLE_DEVICES=1 BJ_DEVICE_MAP= BJ_TARGET=qwen3.5-9b uv run python scripts/x0_parts.py run --name qwen35_9b_x0_pcaeq --single qwen35_9b_x0_single_r2 --parts pca_eq,jwo,jpp;
      a=$?; CUDA_VISIBLE_DEVICES=1 BJ_DEVICE_MAP= BJ_TARGET=qwen3.5-9b uv run python scripts/x0_massmean.py run --name qwen35_9b_x0_massmean_lf --single qwen35_9b_x0_single_r2 --states qwen35_9b_x0_probe_v4 --mode layout_free;
      test $a -eq 0 -a $? -eq 0; } & p9=$!;
  wait $p27; s27=$?; wait $p9; s9=$?; echo "exit 27B=$s27 9B=$s9"; test $s27 -eq 0 -a $s9 -eq 0; }
question: >-
  (1) Equal-share PCA: with the layer's top-2,000 PCA directions taken per item up to J++'s share of ||Δ||² (k chosen per item), on the single-change items, does removing that part cost the recall but not the lookup (like J++), cost both readers, or neither? (2) Word-orthogonal jw: with J++ (k = 25) fit on Δ minus its word part over atoms projected off the word's span (so it holds none of the word's energy), does removing it still cost the recall with the word intact? (3) Layout-free mass-mean address: with A rebuilt after subtracting each layout group's mean (Alf), does removing Alf still cost the 9B lookup, and does keeping only Alf still flip it?
why_it_matters: >-
  (1) The PCA control in x0_parts was at about twice J++'s share (34-39% vs 14-19% of ||Δ||²); the other dictionaries met the equal-share standard. Until this run the README may not say that J++ is special beyond the layer's geometry. (2) Removing the mass-mean address A cost the 9B lookup 0.31 [0.18, 0.44]; the address classes are confounded with what the word can see of the layout, so A may carry position information rather than an address.
hypotheses:
  H-pca: 'Dan''s Q30.1 (committed before the run): (d) the models differ, or mixed, 80%'
  H-beyond-word: 'the recall still loses >= 0.20 with the word intact. No prediction committed before the run (Dan, ~22:05)'
  H-position: 'the 9B lookup effect disappears with the layout-free A. No prediction committed before the run'
decision_rule: >-
  Descriptive, added after data. (1) Q30.1 committed before the run; (2) and (3): no prediction committed before the run (Dan, ~21:55 / ~22:05). (1) Pre-stated reading (Dan, ~21:50), per model: recall-specific like J++ -> "J++-specific" means "aligned with the layer's main directions"; hurts both -> J++ is the only dictionary that separates the readers; inert -> J++ is special at equal share. Branches (Q30.1's options): recall-specific = lookup excess <= 0.10, recall excess >= 0.20 with lower CI > 0; hurts both = lookup excess >= 0.10 and both readers' excess with lower CI > 0; inert = both readers' upper CI < 0.10; anything else: none of the three. J++ (k = 25) is rerun beside it on the same items as the reference. (2) Pre-stated reading (Dan, ~22:05): recall still loses >= 0.20 with the word intact -> "recall needs J++ components beyond the word"; <= 0.10 -> "the word and the other J++ components are redundant: either suffices" ('loses', set by the agent before the run: the point estimate of the recall's excess against a random part of its own share). (3) Pre-stated reading (Dan, ~21:50): if the 9B lookup effect disappears with the layout-free A, the reading is "position information", not "address". "Disappears" (set by the agent before the run, Q28.1's criterion): the 9B lookup's excess with Alf removed has a lower CI <= 0. A is rerun beside Alf on the same items. Both: cluster bootstrap over bridge entities (10,000 resamples, seed 0); top-token read, both readers on the identical patch. No new runs or arms after this, whatever it shows (Dan, ~21:55 / ~22:05).
controls:
- 'a random-subspace part at each part''s own share (removal) and the random part alone (keeping)'
- 'both readers on the identical patch'
- 'J++ (k = 25) and A rerun beside the new parts on the same items'
- 'the word-orthogonal part''s energy in the word''s span is asserted < 1e-3 per item'
- 'equal_share is checked against signed OMP at k = 25 on the PCA atoms on every run (assert); tests/test_x0_parts_equal_share.py'
n: '(1), (2) the 200 single-change items per model; (3) the single-change items with both locker sentences before the pick (70 on the 27B, 73 on the 9B); Alf from 758 locker-before states in 31 layout groups'
seeds: [0]
notes: "One 2-GPU job, two chains (27B on GPU0, 9B on GPU1), each: x0_parts pca_eq then x0_massmean layout_free; the second runs even if the first fails, and the chain fails if either does. Queue (Dan ~21:50): x0b_parts_r2 -> this -> X4."
