  Dan 11:30 (batch53.yaml q122b_1130): the largest model gives the clean split (lookup 0.00 at L33, still 0.00 at k =
  100); its 53.1 (Q-before, number) with the paired difference says whether the pointer's independence of the
  question's position holds there too.
hypotheses:
  none: "no prediction (batch 53: exploration day; rules fixed by Dan 11:10 / 11:25 / 11:30 before any run)"
decision_rule: >-
  Dan 11:30 (jobs/c3/batch53.yaml q122b_1130, item 3), verbatim: "If mats frees up today (2xH100; check the lens file
  and the FP8 weights are on a box first): on the 122B, 53.1 (Q-before, number) with the paired difference, then 51.12
  E1 (answer control). Rules verbatim, no prediction, UNVERIFIED. Priority: after 53.2, before 53.7." Dan 11:10
  (next_1110, item 3), verbatim: "Rule: the conflict test's, verbatim; across: "the pointer does not depend on the
  question's position" if the lookup loses <= 0.10 in both cells on a model." Dan 11:25 (critic_1125), verbatim: "Add
  the paired difference (Q-before minus Q-after) with its cluster-bootstrap CI, 27B now (CPU), Muse and Lightning when
  they land. Wording: "order dependence" only if that CI excludes 0." The conflict test's rule (x0_necessity, X0.md) and
  the brief's 53.1 cells and gate as jobs/c3/x53_2x2_muse.yaml. As computed (scripts/x53_2x2.py; fixed before any run):
  the 122B at L33 (x0_necessity.PREDICTED, X0.md's rule); scenes = the main test's 600, all of which build on the
  122B's tokenizer, and the (Q-after, number) cell rebuilds the stored main test qwen35_122b_x0_necessity_r2 id for id
  (600 / 600, checked on the CPU at the pinned revision's tokenizer files); per cell X0's gate (0.80 per reader over
  600, >= 150 eligible, the first 200), a failed gate = "not tested (gate x < 0.80)", never lowered, no below-gate run.
  (Q-after, number) checked item by item against qwen35_122b_x0_necessity_r2 at L33 (agreement.json). Across (Dan
  11:10): holds iff both cells' lookup <= 0.10; does not hold as soon as a tested cell is above 0.10 (Dan 11:25: the
  correct reading); can't tell while a cell is untested. Paired difference (Dan 11:25): the lookup's extra loss beyond
  random in (Q-before, number) minus (Q-after, number) on the scenes both cells read, cluster bootstrap over the bridge
  entity (10,000, seed 0, the same draws for both cells); "order dependence" only if its 95% CI excludes 0.
