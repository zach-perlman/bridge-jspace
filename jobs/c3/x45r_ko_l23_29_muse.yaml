  export BJ_TARGET=muse-glimmer-30b BJ_DEVICE_MAP=; unset BJ_GRAM_PROJ; uv run python scripts/ablate_v2.py --name muse30_jsuite_v2_test_chat_ko_cand2_L23-29_x45r_v1 --why "batch 45, test 45r (jobs/c3/batch45.yaml; Q46.1): Zach's v2 knock-out and its controls at mid depth, band L23-29 (7 layers around our L26); the record run's items and settings otherwise" --plan bands --bands 23-29 --conditions paper10 paper10_rot unembed10 unembed10_rot paper10_pcasize --tasks jsuite_v2_test_chat --tasks-competence muse30_jsuite_v2_test_chat_competence_cand2_v1 --tasks-words PP PK PM PA PN MP MK MM MA MN TP TK TM TA TN --tasks-level all --n 1000 --kinds clean --batch 16 --read cand2 && uv run python scripts/jsuite2_score.py muse30_jsuite_v2_test_chat_ko_cand2_L23-29_x45r_v1 --set jsuite_v2_test_chat
question: >-
  On Muse at mid depth, where our change-removal finds the J++ part carried (gap 0.85 at L26), does Zach's knock-out
  over a 7-layer band around it (L23-29) find the J++ directions needed: recall answers lost minus stated-fact answers
  lost (M - K) at least 15, and more than 10 points above what the logit lens's own top 10 cost (the J-specific
  excess)?
why_it_matters: >-
  The two halves disagree on Muse and have never been run at the same depth. Ours, at L26 (fixed in advance):
  gap 0.85 [0.68, 0.98] (recall 0.75, lookup -0.10; muse30b_x0_necessity, 200 scenes). Zach's, at L36-42 only: M - K
  +59.9 [55, 65], logit lens +34.6 [29, 40], so a J-specific excess of 25.3 (muse30_jsuite_v2_test_chat_ko_cand2_v1);
  docs/depth/README.md lists "Zach's knock-out finds the split weak outside Qwen, our change-removal finds it on Muse"
  as a limit. If at mid depth his knock-out finds J++ not needed while our change-removal finds it carried, "carried"
  and "needed" are different properties; if it finds it needed there too, the halves agree and the disagreement was
  about depth. On natplus dev (muse30_natplus_dev_chat_sweep_cand_v1, paper10, cand read), the 7-layer windows L21-27
  and L24-30 left the memory-final words right in 84-97% of items (unedited 100%; at L36-42: 22-31%).
hypotheses:
  Q46.1: "Dan's answer in predictions/2026-10-27_dan.md (Q46.1); enqueue only after it is committed."
decision_rule: >-
  Fixed in advance (Dan, 27 Oct ~14:40; jobs/c3/batch45.yaml, 45r), verbatim: "'carried, not needed' if our gap >= 0.3
  while his M - K < 15 or within 10 of the logit-lens control, at the same layers." Dan's readings (~15:05, before any
  run): "within 10" is one-sided, on the J-specific excess = his J++ M - K minus his logit-lens M - K; "carried" = our
  gap at L26; his knock-out at mid depth = band L23-29; point estimates decide, CIs beside them. As computed (fixed by
  the agent before any run): (1) Our gap = the stored, fixed-in-advance main test at L26 (muse30b_x0_necessity: chat,
  J++ k = 25 signed, the first 200 of 395 eligible scenes of d1_topics_v3, lens sha 90fc5e52): the recall's (PM) extra
  loss minus the lookup's (PP), extra loss = Jdep - Rdep = 0.75 - (-0.10) = 0.85, paired cluster-bootstrap CI over
  bridge entities [0.68, 0.98] (10,000, seed 0, x45m.group_cells; recomputed 27 Oct from outcomes.jsonl). Both cells
  pass X0's bar (S_whole 0.58 with 117 switches, 0.35 with 70). No new run on our side. (2) His M - K = this run's
  scripts/jsuite2_score.py facts/paper10/start=all, contrast "M-K" (points lost on the memory final M minus on the
  stated final K; items Muse gets right unedited; starts P, M, T pooled; R excluded), point estimate, its bootstrap CI
  (1,000 draws over relation:bridge, seed 0) beside it. (3) J-specific excess = M - K(paper10) - M - K(unembed10), both
  from this run, point estimate; its CI beside it from a paired bootstrap over relation:bridge (both conditions on the
  same draws, 10,000, seed 0), computed from rows.jsonl at scoring time. (4) "Not needed" = M - K < 15, or excess <= 10.
  (5) Labels: "carried, not needed" = our gap >= 0.3 and not needed; "carried and needed" = our gap >= 0.3, M - K >= 15
  and excess > 10; "not carried" = our gap < 0.3; "can't tell" = our L26 cell fails X0's bar. With the stored gap
  (0.85, valid), only the first two can occur. (6) Reported beside, not in the rule: paper10_rot, unembed10_rot and
  paper10_pcasize (M - K, and size-matched / J++), the stated facts' own loss (K), x45r_ko_l26_muse (L26 alone,
  descriptive), and the record run at L36-42 (+59.9 / +34.6 / excess 25.3, descriptive; x45r_ko_band_muse adds its
  size-matched control, optional). Scored by hand from jsuite2_score/muse30_jsuite_v2_test_chat_ko_cand2_L23-29_x45r_v1.json.
controls:
- 'paper10_rot: the same removal vectors turned by a fixed random rotation (seed 888 + layer, drawn on the CPU)'
- 'unembed10: paper10''s procedure over the logit lens''s directions (the unit unembedding rows of letter tokens, final-norm gain folded in); the rule''s control (the J-specific excess)'
- 'unembed10_rot: its rotation'
- 'paper10_pcasize: paper10''s size at each position along the residual''s top 256 principal directions at each band layer (64 pinned WikiText rows), the size-matched control'
- 'the stated final K and the other finals P, A, N under every condition (reported)'
