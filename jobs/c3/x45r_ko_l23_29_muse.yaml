notes: "DRAFT, NOT QUEUED (Dan 27 Oct ~14:40 / ~15:05). Enqueue only after Dan's Q46.1 answer is committed and Zach has confirmed this use of his method (the message in the 45r report); 45r runs before 45s if Zach has confirmed, else after it. Queue order within 45r: this job, then x45r_ko_l26_muse (descriptive), then x45r_ko_band_muse (optional, last, cut first). Our side is not rerun: muse30b_x0_necessity (fixed in advance, batch 38, 82d47e49) has the same lens sha, set file sha (364c234b, unchanged), readers, scenes and arms as a rerun would, and muse30b_x0_necessity_depth (another commit, another arm set) reproduces its L26 reads item for item (1,200 of 1,200 switches and logit differences identical). Settings as Zach's record Muse run (cand2 read, batch 16, exact-length batches, all positions, n 1000 per word, level all) except the band and the added size-matched condition. One band per run: jsuite2_score pools a run's bands. BJ_GRAM_PROJ unset: the QR projection, as the record run. Runs on our box (Muse's weights are cached there, not on Zach's H200). Seeds: 888 + layer the rotation, 0 the bootstraps. Cost: Zach's record run took 4,654 s on an H200 (summary.json): 4,440 s in the band for 4 conditions x 7 layers, so 1,110 s per condition at 7 layers and 214 s outside the band; the removal cost does not depend on depth (muse30_natplus_dev_chat_sweep_cand_v1: 361-371 s per 7-layer window from L0-6 to L42-48). Here: 5 x 1,110 + 214 + ~60 s for the principal directions = ~5,824 s = 1.62 h on an H200; on one H100 PCIe x 1.3-1.5 (assumed from the spec sheets, not measured on this workload) = 2.10-2.43 h; jsuite2_score ~1 min on the CPU. mem_gb 75 as the other 1-GPU Muse jobs (no peak recorded for ablate_v2 on Muse); if it runs out of memory, rerun with --batch 8 and say so."
