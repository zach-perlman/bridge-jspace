id: x51_3_9b
title: "Batch 51.3 on the 9B (L12): DAS at scale. 48.1's DAS (early stopping on dev IIA) on pooled identity pairs (main test + clean design + routes C0; 520 lookup / 514 recall pairs) and 49.8's on routes position pairs (topped up to 300); recall k = 4, 16, 64, 128, lookup 4, 16, address 2, 4, 8; random and shuffled-target baselines"
thread: C3
gpus: 1
mem_gb: 40
est_gpu_hours: 0.9
depends_on: []
command: >-
  export BJ_TARGET=qwen3.5-9b BJ_DEVICE_MAP= BJ_DAS_GDN=torch;
  uv run python scripts/x51_das.py run --name qwen35_9b_x51_3 --why "Batch 51, test 51.3 (jobs/c3/batch51.yaml; Q51.3): DAS at scale at L12; identity pairs pooled from the main test, the clean design and routes C0 (300-600 per reader, entities held out 60/20/20), address pairs from routes C1 (>= 300); recall k 4/16/64/128, lookup 4/16, address 2/4/8; sealed"
question: >-
  With 300-600 pairs per reader instead of 48.1's few dozen, is there a low-dimensional subspace (k <= 128) of the change
  at the bridge word at L that mediates the recall; where does the lookup's subspace sit (the address U, W_E, J++ or
  outside everything named); and does the learned address (49.8's R_pos) overlap U and 47.2's W?
why_it_matters: >-
  48.1 and 49.8 ran on 31-187 pairs with 5-9 test entities; a null there could be too few pairs. At this scale a recall
  own-IIA below 0.5 at k = 128 is a result (no low-dimensional recall subspace at this token and layer), and the lookup
  subspace's energy says which named code the lookup reads.
hypotheses:
  Q51.3: "Dan's answers in predictions/2026-10-28_dan.md (Q51.3: (i) a recall subspace found at k <= 128 with >= 300 pairs, P(yes) per model; (ii) the lookup subspace mostly in U / mostly outside everything named, per model; (iii) the learned address overlaps U >= 0.6, P(yes) per model); not committed when this spec was written, so the job is sealed: no verdict in the run; scripts/x51_das.py verdict and view refuse until the answer is committed."
decision_rule: >-
  Fixed in advance (jobs/c3/batch51.yaml, 51.3): 48.1's rules (a)-(d) and fallback and 49.8's labels at k = 4,
  unchanged, plus "no low-dimensional recall subspace at this token and layer" if the recall's own-IIA < 0.5 at k = 128
  with >= 300 pairs (a result, not a failure to converge). Report own-IIA per k; cross-IIA (the lookup subspace on the
  recall and back; the address subspace on each reader); the lookup subspace's energy in U / W_E / J++ / outside; the
  address subspace's overlap with U and with 47.2's W.
  As computed (fixed before any run; Dan may override before the enqueue): method = scripts/x48_das.py's DAS unchanged
  (orthonormal R via torch.nn.utils.parametrizations.orthogonal; h <- h_O + R R^T (h_S - h_O) at the bridge token at L12
  of the O prompt; Adam lr 1e-3, batch 16 in micro-batches of 8, at most 300 steps; cross-entropy of the target at X0's
  chat read position), with early stopping on dev IIA added around its loop (48.1's code has none although the brief
  says "same ... early stopping"): every 25 steps the select (dev) split's IIA under the current R, the best R kept,
  stop after 4 reads without a gain; x51_das.train_early reproduces x48_das.train_subspace step for step without dev
  rows (tested); the global torch RNG seeded with the R's seed before each training (the orthogonal parametrisation
  draws from it; 48.1 / 49.8 left it unseeded). Identity pairs = every locker-first scene the stored whole change
  switches for the reader, from qwen35_9b_x0_necessity (main test, cf; 72 lookup / 75 recall), qwen35_9b_x45m_fresh
  (clean design, alt fresh; 150 / 149) and qwen35_9b_x6_routes C0 (the asked pick changes from A to B, nothing else;
  298 / 290); C1 (same item) and C2 (also two locker sentences moved) are not identity pairs; scenes rebuilt with the
  tokenizer and asserted equal to the stored ids; per reader at most 600 in pool order; a reader under 300 topped up
  with further routes C0 scenes of x6_routes' generator (seed 2510) read on the GPU (X0's competence, then the whole
  change) until 300 (not needed on the 9B). Split by bridge entity 60 / 20 / 20 over the pooled pairs (46 entities: 28
  / 9 / 9), seed 0. Address pairs = x6_routes C1 scenes (every slot pair i -> j) the whole change sends to the position
  answer: the stored run's 187 of 300, then further generator C1 scenes read on the GPU in generator order until 300
  (x49_das_pos.position_pair; split by entity, seed 0). One R per reader and k (lookup k 4, 16; recall 4, 16, 64, 128),
  R_pos per k (2, 4, 8); an untrained random R per k and an R trained on shuffled targets per R (48.1's and 49.8's
  seeds). Reads on the select and test pairs with X0's chat read (AddRows at L12): identity pairs, both readers, arms
  none / whole / every R_lookup, R_recall, R_pos / random R per k / shuffled R; address pairs as 49.8 (lookup route,
  recall move); 48.1's routes read (R_lookup alone on 100 C2 scenes) for rule (d). Chosen k per reader as 48.1 (the
  smallest k <= 16 with select own-IIA >= 0.7, else the best select own-IIA); every rule read on the test entities'
  pairs, point estimates at the bars (EPS 1e-9), cluster-bootstrap CIs over bridge entities (10,000, seed 0) beside.
  48.1's fallback reads the lookup at k = 64, which 51.3 does not train: reported "not tested". Q51.3 (i) found = >= 300
  recall pairs and test own-IIA >= 0.5 at some k <= 128; (ii) the shares of R_lookup R_lookup^T Delta (chosen k) inside
  U, the J++-25 atoms, the W_E-25 atoms and outside their union on the test pairs, each part >= 0.5 named "mostly"
  (descriptive; the parts overlap); (iii) U's energy in R_pos at k = 4 = ||R_pos^T U||_F^2 / rank U >= 0.6. U =
  x0_massmean Alf on qwen35_9b_x0_probe_v4 (rank 4); W = 47.2's W, scripts/x47_six.py's fit,
  results/x47_six/qwen35_9b_x47_2/fit.npz (rank 5), not refit. Scored by hand: scripts/x51_das.py verdict (CPU).
controls:
- 'untrained random R of the same k (QR of a seeded Gaussian; identity 4802 + k, address 4982 + k): IIA, energy and shares beside every trained R'
- 'R trained on shuffled targets (the training rows'' targets permuted once; 48.1''s and 49.8''s shuffle seeds), early-stopped on its own shuffled dev targets: must sit at the random R'
- 'the whole change and O unedited reread on the select and test pairs (ceiling and floor; IIA / S_whole beside)'
- 'cross reads: R_lookup on the recall, R_recall on the lookup, R_pos on both readers of the identity pairs (each beside the random R of its k), the recall''s move under R_pos on the address pairs'
- 'per source (main / clean / routes) own-IIA at the chosen k on the test pairs, beside the pooled number'
- 'the top-up''s gate: O''s read accuracy >= 0.80 per reader over the top-up scenes, else its pairs are not used (recorded)'
