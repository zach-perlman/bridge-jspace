notes: "Batch 51 (Dan, 28 Oct 17:10), 51.3, mats queue after 51.1 (9B -> 27B -> Muse). Sealed: the run writes manifest (before any GPU work), pairs.json, cases.jsonl, topup.jsonl, states_L12.pt, R.pt, stops.json (per R the best step, its dev IIA, where it stopped, micro-batch and OOM retries), train.jsonl, geometry.jsonl, readouts.json, outcomes.jsonl, routes*.jsonl, address/ (49.8's layout); no verdict. By hand after Dan's Q51.3 is committed: uv run python scripts/x51_das.py verdict --runs qwen35_9b_x51_3 muse30_x51_3 x51_3_27b, then view (the verify pack). Seeds: 0 split, bootstrap, examples; 48 / 4801 / 4802 / 4803 48.1's init, shuffle, random R, batches; 49 / 4981 / 4982 49.8's; 2510 x6_routes' scenes. Cost (ledger): x48_1_9b_r2 (BJ_DAS_GDN=torch) 16 trainings in 1,830 s, x49_8_9b 6 trainings in 777 s: ~0.18 s per micro-batch of 8; here 18 trainings x <= 600 micro-batches = 1,940 s, + dev reads (~7%) ~2,080 s; address top-up ~210 scenes x ~0.7 s = 150 s; states, reads (~180 held-out pairs x 2 readers x 23 arms), geometry, routes read and load ~500 s; total ~0.75 h, est 0.9 (Dan ~2). Caveats: the test split has 9 bridge entities (CIs wide); the recall's identity pairs are 56% routes C0 (animals) - own-IIA per source is reported."
