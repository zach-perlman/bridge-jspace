  none: "No prediction (coverage_122b_1820): coverage run on an already-scored rule."
decision_rule: >-
  The rule verbatim from jobs/c3/x47_1_muse.yaml (jobs/c3/batch47.yaml 47.1; first scored in
  results/x47_atoms/x47_1-20261028T113101Z), as copied in jobs/c3/x52_lightning_atoms47.yaml: "On routes scenes, for
  identity answers; on the main test, for extra loss: (a) "the lookup's identity route sits in lens atoms beyond the
  recall's 25": without 26-100, identity answers fall >= 0.30 beyond the random part (paired CI excluding 0) and the
  recall's extra loss without 26-100 is <= 0.10, on >= 2 of 3 models; (b) "continuum": both readers lose >= 0.20
  beyond random without 26-100; (c) "outside the lens": without 26-100, identity answers fall < 0.10 beyond random ...
  Report each slice's share of the change." Read on the 122B alone ("on >= 2 of 3 models" not applicable). As
  computed: x47_1_muse's text at the 122B's L33: routes C2 scenes (seed 2510, gate 0.80 per reader, NOT lowered: the
  122B's earlier routes runs passed only at 0.75 (recall 0.797), so if this gate fails the routes part is "not tested"
  and no verdict line is written for it); the address from qwen35_122b_x0_probe_v4; the main test's first 200
  eligible scenes. Verdicts: x6_routes' and x0_necessity's in the job, then x47_atoms verdict --coverage
  (x52_atoms47-<UTC>/, beside Lightning's) only if the routes part ran.
