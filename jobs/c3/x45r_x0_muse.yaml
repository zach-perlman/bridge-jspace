question: >-
  On Muse, at the same layers as Zach's knock-out (L26 and L36-42), does our change-removal find the J++ part carried
  (the recall's extra loss minus the lookup's, the gap, at least 0.3) where his knock-out finds it not needed (M - K
  below 15, or within 10 of the logit-lens control)? This job is our side: the gap at L26 and at each of L36..L42.
why_it_matters: >-
  The two halves disagree on Muse and were never run at the same layers. Ours, at L26: gap 0.85 [0.68, 0.98] (recall
  0.75, lookup -0.10; muse30b_x0_necessity, 200 scenes). Zach's, at L36-42: M - K +59.9 [55, 65], but the logit lens's
  own top 10 give +34.6 [29, 40] of it (muse30_jsuite_v2_test_chat_ko_cand2_v1), and docs/depth/README.md lists "Zach's
  knock-out finds the split weak outside Qwen, our change-removal finds it on Muse" as a limit. If the methods still
  disagree at the same layers, "carried" (a lens-readable part of the bridge word's change moves the recall) and
  "needed" (removing lens directions everywhere breaks recall more than lookup) are different properties; if they agree
  at the same layers, the disagreement was about depth.
hypotheses:
  Q45.16: "Dan's answer in predictions/2026-10-26_dan.md (Q45.16), one line per layer set; enqueue only after it is committed."
decision_rule: >-
  Fixed in advance (Dan, 27 Oct ~14:40; jobs/c3/batch45.yaml, 45r), verbatim: "'carried, not needed' if our gap >= 0.3
  while his M - K < 15 or within 10 of the logit-lens control, at the same layers." As computed (fixed by the agent
  before any run; Dan may override before the run): (1) Two layer sets, each read on its own: L26, and L36-42. (2) Our
  gap, from this run (X0's cells: chat, J++ k = 25 signed OMP, the 200 main-test scenes): per layer, the recall's (PM)
  extra loss minus the lookup's (PP), extra loss = Jdep - Rdep = (S_no_rand - S_no_part) / S_whole; the point estimate
  decides (EPS 1e-9), the paired cluster-bootstrap CI over bridge entities beside it (10,000, seed 0, as
  x45m.group_cells). A layer counts only if both readers' cells pass X0's bar (S_whole >= 0.30 and >= 30 switches). L26:
  the L26 cell, "can't tell" if it fails the bar. L36-42: X0 patches one layer, so each of L36..L42 is its own cell; our
  gap at the band = the median of the gaps of the layers that pass the bar, "can't tell" if fewer than 4 of the 7 pass.
  (3) His M - K: scripts/jsuite2_score.py, facts/<condition>/start=all, contrast "M-K" (points lost on the memory
  final M minus points lost on the stated final K; items Muse gets right unedited; starts P, M, T pooled; R excluded);
  point estimate, its 1,000-draw bootstrap over relation:bridge (seed 0) beside it. J++ = paper10 (the top 10 J++
  directions removed at every token, at each layer of the band); the logit-lens control = unembed10 on the same band.
  L26: band "L26" (the one layer), run muse30_jsuite_v2_test_chat_ko_cand2_L26_x45r_v1 (x45r_ko_l26_muse). L36-42: the
  record run muse30_jsuite_v2_test_chat_ko_cand2_v1 (Zach, 25 Oct; paper10 +59.9, unembed10 +34.6, known before this
  spec). (4) "Not needed" = M - K(paper10) < 15, or |M - K(paper10) - M - K(unembed10)| <= 10 (two-sided, as written;
  the signed difference reported beside). (5) Labels per layer set: "carried, not needed" = our gap >= 0.3 and not
  needed; "carried and needed" = our gap >= 0.3, M - K >= 15 and more than 10 from the logit lens; "not carried" = our
  gap < 0.3 (his reading reported beside); "can't tell" = our gap not computable under (2). Reported beside, not in the
  rule: the rotated controls (paper10_rot, unembed10_rot), the size-matched control (paper10_pcasize; L36-42 from
  x45r_ko_band_muse), the stated facts' own loss (K), each reader's S_whole and extra loss per layer. At L36-42 his side
  already reads "needed" (+59.9, 25.3 above the logit lens), so that set can only be "carried and needed", "not carried"
  or "can't tell". Scored by hand from this run's verdict.json and the two jsuite2_score files.
controls:
- 'the whole change at each layer (S_whole, the denominator) and X0''s bar per cell (S_whole >= 0.30 and >= 30 switches)'
- 'without a random part of the J++ part''s share (X0''s random subspace, seed 888 + layer): the reference of each extra loss'
- 'both readers on the identical patch (one Δ per scene)'
- 'L26 rerun against the stored muse30b_x0_necessity L26 cells (same 200 scenes): item-level agreement of whole / no_part / no_rand, both readers'
- 'the logit lens (W_U) as a part at L26 is in the stored run (recall extra loss 0.01): not rerun'
n: '200 main-test scenes (d1_topics_v3, chat: the first 200 of 395 eligible in scene order, as muse30b_x0_necessity; plan check 27 Oct: 530 of 600 scenes made, 70 dropped because the bridge is not one token), 2 readers, 8 layers'
