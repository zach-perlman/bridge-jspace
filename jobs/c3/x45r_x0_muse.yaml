  export BJ_TARGET=muse-glimmer-30b BJ_DEVICE_MAP=; uv run python scripts/x0_necessity.py run --name muse30_x45r_x0 --set d1_topics_v3 --renderings chat --layers 26 36 37 38 39 40 41 42 --dicts jpp --curve-dicts jpp --curve-k --no-nonneg --why "batch 45, test 45r (jobs/c3/batch45.yaml; Q45.16): our change-removal at L26 and at each layer of Zach's knock-out band L36-42, J++ k = 25 signed; compared with x45r_ko_l26_muse / x45r_ko_band_muse at the same layers"
