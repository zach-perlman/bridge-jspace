notes: "DRAFT, NOT QUEUED (Dan 27 Oct ~14:40): enqueue only after Dan's Q45.16 answer is committed; then unsealed (X0's verdict and figures run after the run). Run name muse30_ (pins.check_run_name refuses the old muse30b_ prefix since the merge). Why per layer at L36-42: Zach's knock-out edits the band at once, but X0 patches the bridge word's change at one layer; a band version of it needs new code (set the bridge word's state at every band layer to the org state plus the change without its J++ part; adding the change at each layer would count it several times), so this draft reads each layer and takes the median. Expected risk, from the stored runs: past L28 the change at the bridge word stops switching the lookup (S_whole 0.27 at L28, 0.04 at L30, 0.00 at L32 and L34) and the recall fades (0.49 / 0.41 / 0.32 / 0.10 at L28 / 30 / 32 / 34; muse30b_x0_necessity[_depth]), so L36-42 will most likely be \"can't tell\" on our side. Seeds: 24 the set, 0 the bootstrap and examples, 888 + layer the random subspace. Cost (timing ledger, sesterce-h100x2, H100 PCIe): muse_depth (13 layers, 23,200 reads, competence on 530 scenes) ran 0.293 h; x45m_muse_q2 (1 layer, 3,272 reads, 565 scenes) 0.211 h; linear in reads: (0.293 - 0.211) / (23,200 - 3,272) = 4.1e-6 h per read, fixed part 0.211 - 3,272 x 4.1e-6 = 0.198 h. This run: 8 layers x 4 reads x 200 scenes x 2 readers = 12,800 reads, so 0.198 + 12,800 x 4.1e-6 = 0.25 h."
