id: x0_nochat_digit_27b
title: "X0 amendment 3 (descriptive, after data), Qwen3.6-27B: no chat template, thinking off (nochat), read at the first digit the model writes"
thread: C3
gpus: 1
mem_gb: 75
est_gpu_hours: 1.8
depends_on: [x0_hw_gate_27b]
command: >-
  uv run python scripts/x0_necessity.py run --name x0_nochat_digit_27b --set d1_topics_v3 --renderings nochat --read digit --descriptive --why "X0 amendment 3 (Dan, 24 Oct ~16:30): descriptive no-template arm, read at the first digit token of 8 greedy tokens"
figures_command: uv run python scripts/x0_necessity.py figures --name x0_nochat_digit_27b
question: >-
  The same descriptive no-template arm on the 27B: read at the first digit token the model writes, on the items each reader gets right. Do lookup and recall show the chat pattern (graded contrast) without the chat template?
why_it_matters: >-
  The 27B half of the chat vs no-chat comparison Dan asked for; runs whatever the amendment-2 gate shows, so both models use the same read.
hypotheses:
  H-same: 'the graded contrast C at L32 is within the chat value''s CI (0.60 [0.50, 0.69]). Prior: none set (descriptive, after data)'
  H-differs: 'otherwise. Prior: none set'
decision_rule: >-
  Descriptive, after data, not part of the X0 rule (amendment 3); as qwen35_9b_x0_nochat_digit, at L32.
controls:
- 'the random part of the same share, per dictionary (no_rand_D, at D''s own share of ||Δ||²)'
- 'the random Gaussian dictionary at k = 25 (the fitted null, rand_omp)'
- 'both readers on the identical patch'
- 'the valid-cell bar on the whole edit (S_whole >= 0.30 and >= 30 items)'
n: 'up to 200 scenes of d1_topics_v3 right under the digit read, 2 readers each (any number; reported)'
seeds: [24, 0]
notes: "Amendment 3 (jobs/c3/X0.md). Cost: 13 layers x ~10 arms x 200 x 2 readers, each arm generating 8 tokens with a KV cache: ~1.5-2 h on this box."
