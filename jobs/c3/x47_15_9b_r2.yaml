question: >-
  When the same question ("How many legs does Iris's pick have?") is answered from the passage (a false digit stated
  there) or from memory (the true legs), does the part of the bridge word's change that carries the answer follow the
  source (from the text like a lookup: U + I needed, J++ not; from memory like a recall: J++ needed, U + I not), or the
  question (the same split under both instructions)?
why_it_matters: >-
  The main test's reader and answer source are confounded: the lookup question is always answered from the prompt, the
  recall from memory. Here one question can be answered either way and an instruction picks the source, so the J++ /
  around-the-lens split can be attributed to the source or to the question.
hypotheses:
  Q47.15: "Dan's answer in predictions/2026-10-28_dan.md (Q47.15, per model: 27B; 9B; Muse, and the preferred source with no instruction); not committed when this spec was written, so the job is sealed: per-item outputs only, no verdict; scripts/x47_source.py verdict refuses until the answer is committed."
decision_rule: >-
  Fixed in advance (jobs/c3/batch47.yaml, 47.15), verbatim: ""The part follows the source": under from the text, the
  answer behaves like a lookup (extra loss without J++ <= 0.10; without U + I >= 0.30 beyond random); under from
  memory, like a recall (without J++ >= 0.30; without U + I <= 0.10); same scenes, same question; holds on >= 2 of 3
  models. "The part follows the question": both instructions give the same split; then the readers' difference in the
  main test was never about the source; report it as such. No-instruction condition: classify each item's unedited
  answer as text or memory; the split within each class should match its instructed twin (descriptive; a check that
  the instruction is not doing something else)." As computed: as jobs/c3/x47_15_27b.yaml, on the 9B at L12 with the
  pointer directions and class means of qwen35_9b_x0_probe_v4 (x0_massmean Alf and entity_means, never refit): scenes =
  x6_routes' C2 scenes (seed 2510, 700 generated) plus three false-legs sentences per scene (seed 4715 + scene id;
  digits of 1-9 outside O's and S's locker digits and every item's true legs, distinct); placement after decides, before
  is reported; the instruction in the user turn after the question and before the digit instruction (the bridge index
  and the passage's tokens shared across the conditions, asserted); gate 0.80 per instruction on O's unedited read;
  eligible = O and S said and read right under both instructions, the first 300 with class means; arms whole, without
  J++ (k = 25) / without U + I (span of U and idout), each against a random part of its share (seed 888 + L), only J++
  / only U + I with random twins, S unedited; switch = the top token is S's answer under the condition; extra loss =
  (1 - S_no_part / S_whole) - (1 - S_no_rand / S_whole), point estimates, EPS 1e-9; like a lookup if without J++ <=
  0.10 and without U + I >= 0.30, like a recall if without J++ >= 0.30 and without U + I <= 0.10, can't tell on an
  invalid cell (S_whole < 0.30 or < 30 switches), else neither; follows the source if text is like a lookup and memory
  like a recall, follows the question if both give the same label; the batch on >= 2 of 3 models; cluster-bootstrap
  CIs over the bridge items (10,000, seed 0); the no-instruction check per class against its instructed twin and the
  preferred source (the larger class share of the unedited O answers). Scored by hand: scripts/x47_source.py verdict.
