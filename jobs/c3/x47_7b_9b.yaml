question: With colours instead of digits as the locker values (a value the J++ dictionary's letter tokens can express), does
  the lookup's answer under the whole change ever follow the value, question-last or question-first, and if it does, is it
  carried by the J++ part?
why_it_matters: '''Never the value'' with digits could be a fact about digit tokens, which the lens dictionary leaves out;
  a word value the lens can express tests the claim where it is easiest to fail.'
hypotheses:
  Q47.7: 'Dan''s answer in predictions/2026-10-28_dan.md (Q47.7); not committed when this spec was written, so the run is
    sealed: no verdict in the job (scripts/x47_value.py verdict refuses until the answer is committed).'
decision_rule: 'Fixed in advance (jobs/c3/batch47.yaml, 47.7, amendment 1). As computed (fixed before any run; Dan may override
  before the enqueue): the layer fixed in advance (12); the change h_S - h_O at the bridge word; arms whole, without the J++
  part (signed OMP, k = 25, over the lens atoms of the letter tokens AND the digit tokens: the main test''s letter-only restriction
  is lifted here), without a random part of its share (X0''s random subspace, seed 888 + layer), without U (x0_massmean''s
  Alf of the x0_probe_v4 states, not refit), without a random part of its share; the lookup''s answer classified identity
  / position / value / original / other by the top token at the read step; route shares with cluster-bootstrap intervals over
  bridge items (10,000, seed 0); a value at a bar counts as at the bar (EPS 1e-9). Sealed: no verdict in the job (scripts/x47_value.py
  verdict refuses until Dan''s Q47.7 is committed). Scenes: x6_routes'' generator with the five values drawn from the colours
  that are one token with a leading space on this tokenizer (all 8: red, blue, green, pink, gold, grey, teal, navy); the lookup
  is a word reader (the instruction ''Answer with a single word and nothing else.'', read right after ''Answer:'', the answer
  token carrying its own space, as suite_v1), the recall a digit reader. Both renderings as 47.7(a), every arm in both; the
  probe for the colour and the lens''s rank of the colour among the colour tokens at the lookup''s O state. Gate 0.80 per
  reader and condition in both renderings; eligible in both. Rule per rendering: a value route appears if the C2 value share
  under the whole change >= 0.15; the J++ part carries it if without J++ the value share falls >= 0.3 beyond the random part;
  ''never the value holds for a word value too'' if the question-last value share <= 0.05 on every tested model. The (a) labels
  (prefetch / J-space / address) are computed beside it on the colour value.'
