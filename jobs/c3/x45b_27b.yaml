id: x45b_27b
title: "Batch 45, 45b on the 27B (L32): where is the binding made when the locker comes after the pick? Bridge-word change at L, L/2, L/4; S patched into O at the locker sentences at L and L/2"
thread: C3
gpus: 1
mem_gb: 70
est_gpu_hours: 0.15
depends_on: [x45_0_indep_9b]
command: >-
  BJ_TARGET=qwen3.6-27b BJ_DEVICE_MAP= uv run python scripts/x45b_binding.py run --name x45b_binding_27b --why "batch 45, test 45b (jobs/c3/batch45.yaml): the 27B at L32; (a) the bridge-word change at L, (b) at L/2 and L/4, (c) S patched into O at every locker-sentence token at L, (d) at L/2; S read on S"
examples_command: BJ_TARGET=qwen3.6-27b uv run python scripts/x45b_binding.py examples --name x45b_binding_27b
question: >-
  In the main test's scenes where the original bridge's locker sentence comes after the asked pick, is the binding made at the locker sentences rather than at the bridge word: does patching S's states into O at every token of the locker sentences (at L or L/2) switch at least half of the lookups that S itself switches, while the bridge-word change at L switches at most 0.25?
why_it_matters: >-
  In these scenes the bridge-word change switches few lookups (x0_strata, 24 Oct: 0.19 on the 9B at L12, 0.09 on the 27B at L32, against 0.86 / 0.76 where the locker comes first), although S itself switches them all. If the model can only bind the pick to its locker once it reads the locker sentence, the change lives at the locker sentences, and the lookup's low rate there is about reading order, not about the bridge word.
hypotheses:
  Q45.5: "The reading-order explanation holds: (a) yes; (b) no. Dan's answer in docs/predictions_batch45.md (Q45.5), committed before any result of this test is opened."
decision_rule: >-
  Fixed in advance (batch 45, jobs/c3/batch45.yaml, 45b): the reading-order explanation holds if (c) or (d) switches at least half of the lookups that S itself switches, while (a) stays at or below 0.25. As implemented (scripts/x45b_binding.py, rule): the lookup, point estimates; "half of the lookups S switches" = among the items whose lookup S read on S switches, the share (c) (or (d)) switches >= 0.5; (a) = its switch rate over all the items <= 0.25; can't tell if S switches none. Switch = the top token at the read step is S's answer's first token (X0's chat read). Rates with cluster-bootstrap CIs over bridge items (10,000 resamples, seed 0) and the n.
controls:
- '(a) the bridge-word change at L: the main test''s whole arm rerun on these items (stored 0.09 on the 27B, x0_strata); checked against the stored reads of x0_necessity_27b_chat (a at L32, b_half at L16)'
- 'S read on S: what S itself switches (the rule''s reference); checked against the stored S read (competence.jsonl)'
- 'O unedited (arm none): reads O''s answer'
- 'the recall read on the identical patches (descriptive)'
n: 'the 99 items of x0_necessity_27b_chat (chat, L32) whose org locker sentence comes after the asked pick, 33 bridge entities; all 99 align token for token between O and S (plan stage, 26 Oct)'
seeds: [0]
notes: "Results stay closed until docs/predictions_batch45.md holds Dan's Q45.5 commit: the job runs the run and examples stages only; the verdict after that commit, on the CPU: uv run python scripts/x45b_binding.py verdict --name x45b_binding_27b. Locker sentences = every 'The locker of <thing> is <n>.' sentence of the context (3 per scene; one that comes before the first changed pick has h_S = h_O, a no-op). L/2 = 16, L/4 = 8. est_gpu_hours from the timing ledger (H100 PCIe): x0_single_27b_r2 took 1114 s for about ten times this run's forwards (competence on 600 scenes and 8 layers of reads), x0_probe_27b 149 s (load and a few hundred forwards); this run: 99 items x (2 recorded forwards + 2 readers x (one 6-row read of O + one read of S)) + 10 example items' greedy tokens, about 5 minutes."
