id: x52_lightning_layer
title: "Batch 52 C, Lightning prerequisite (before any scored run): the gate on the first 60 main-test scenes, then the whole change at the bridge word on 60 dev scenes at every 4th layer L2-L50; the layer = the earliest where both readers switch >= 0.3 (Dan's published rule), written as layer.json; no step 2, no verdict"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.3
depends_on: []
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  uv run python scripts/x51_lightning.py prereq --name nem35l_x52_layer --why "Batch 52 part C (jobs/c3/batch52.yaml), Lightning's prerequisite: the gate on 60 main-test scenes, then the layer by the published rule (earliest layer where both readers switch >= 0.3, every 4th layer L2-L50, 60 dev scenes); no prediction: a design choice, committed before any scored run"
question: >-
  On NVIDIA Nemotron 3.5 Lightning 30B-A3B: does the gate pass on 60 main-test scenes, and at which layer (every 4th,
  L2-L50) does the bridge word's whole change first switch both readers >= 0.3 on the dev scenes? That layer is L for
  every Lightning coverage cell of batch 52.
why_it_matters: >-
  Lightning is tier 2 of batch 52's coverage (the second family: hybrid Mamba-2 / attention / MoE). Dan's prerequisites
  for a new family: the lens file exists (sha 3306b6e4, layers 0-50, checked on speedup 29 Oct), the weights load on
  the box, the gate passes on 60 main-test scenes, and the layer is fixed by the published rule on a dev set and
  committed before the main runs. No layer passing is itself a result ("the bridge word does not redirect the lookup
  at any layer on this model") and cancels the column.
hypotheses:
  none: "No prediction (batch 52 addendum): the layer is a design choice fixed by the published rule, not a forecast."
decision_rule: >-
  Fixed in advance (jobs/c3/batch52.yaml part C, Dan's words, verbatim): "Prerequisites for a new family (Lightning,
  Bolt), before any real run: the J++ lens file exists (report its sha and band); the weights load on the box; the gate
  passes on 60 main-test scenes; the layer is fixed by the published rule (earliest layer where both readers switch
  >= 0.3, sweeping every 4th layer) and committed before the main runs. No lens file -> stop and tell Dan; that column
  is cancelled. No layer passes -> report "the bridge word does not redirect the lookup at any layer on this model" and
  cancel the column; that is a result." As computed (fixed by the agent before any run; Dan may override before the
  run): the gate = X0's (unedited org accuracy under X0's top-token read >= 0.80 for both readers) on the FIRST 60
  main-test scenes in scene order (d1_topics_v3, alt cf, chat, Lightning's tokenizer: 516 of 600 made); X0's all-scene
  gate and eligibility computed beside (the coverage runs use them). Dev = 51.6's split: random.Random(0).sample of 60 of
  X0's eligible scenes (kept in scene order); test = the first 200 eligible not in dev (recorded in gate.json for the
  coverage runs, not read here). Sweep: every 4th layer L2, L6, ..., L50 (13 layers; as batch 47's every-4th sweep of
  Muse's 52 blocks, a subset of 51.6's every-2nd grid; the lens has maps at 0-50); Delta_l = h_S - h_O at the bridge
  word from one forward of O and of S; the whole Delta_l added at l on O (X0's AddRows); both readers; X0's chat read
  (switch = the top token over the vocabulary is S's answer's first token). The layer = the earliest l whose two switch
  rates are both >= 0.3 (point estimates on the 60 dev scenes, EPS 1e-9); cluster-bootstrap CIs over the bridge items
  (10,000, seed 0) and every passing layer reported beside. A failed 60-scene gate, or fewer than 60 eligible dev
  scenes, writes "prerequisite failed" and no sweep. Code: scripts/x51_lightning.py prereq (gate_first, layer_record).
controls:
- "the unedited row per dev scene and reader (O reads O's answer by eligibility)"
- "dev scenes only: the coverage runs' test scenes (the first 200 eligible not in dev) are disjoint and are not read here"
- "X0's all-scene gate (0.80 per reader, >= 150 eligible) reported beside the 60-scene gate"
- "the mamba-ssm hub kernel the load used, against the 45s smoke's verified commit 28017f36 (gate.json)"
n: "516 main-test scenes made on Lightning's tokenizer; gate on the first 60; X0's stored competence from the 45s smoke (results/x0_necessity/nem35l_x45s_smoke_main/gate.json, all 516 scenes): lookup 0.957, recall 0.816 (pass), ~315 eligible expected; dev 60 (26 bridge items), test 200 (37 bridge items) per results/x51_lightning/plan-20261028T162525Z"
seeds: [0, 24]
notes: "Batch 52 part C (Dan 29 Oct 00:25 / 00:30), box speedup (1x H100 PCIe 80 GB): its prerequisites checked read-only 29 Oct ~01:00 UTC: lens ~/bridge-jspace/cache/nemotron-3.5-lightning/lenses/jpp/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16_jpp_lens.pt present, sha256 3306b6e4... = the pin, J++ LN rule, 32 wikitext prompts, d_model 2688, maps at layers 0-50 (held-out macro pass@10 0.587 vs logit lens 0.443; Zach's knock-out band L27-33); snapshot nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16 @ a9904d24 in /ephemeral/hf/hub, 14 of 14 shards, 62 GB, no incomplete blobs; the hub kernel kernels-community/mamba-ssm (1.6 MB) is fetched by transformers at load (network at load). The run's preflight refuses before writing anything if the lens or a shard is missing. Run name nem35l_x52_layer (the pin's live prefix). One GPU: the 45s smoke peaked at 62.5 GB with X0's reads; this job records 13 layers per forward (< 0.1 GB) and reads at most 16 rows per batch. Writes manifest, competence, cases, gate.json (gate60, X0's gate, dev / test scene ids, kernels), step1_outcomes.jsonl, layer.json (the pick, the rates with CIs, every passing layer) and prereq.md. AFTER THE JOB: pull and commit results/x51_lightning/nem35l_x52_layer/ (layer.json is the artefact; x51_lightning.committed_layer() refuses until it is committed at HEAD); only then write / enqueue the Lightning coverage chain. Risk known before the run (flagged in 51.6, design not changed): on Muse (52 blocks) the whole change switches both readers far above 0.3 at shallow layers (L8: lookup 0.84, recall 0.87; muse30b_x0_necessity_depth), so the earliest passing layer will most likely be L2, where the change is close to a token swap and the J++ part is least specific; every passing layer is reported beside so Dan can see the whole profile before the chain runs. The 45s specs fixed L27 (x0_necessity.PREDICTED, Dan 27 Oct) by a different rule; batch 52's rule supersedes it for the coverage cells. Estimate: the 45s linear model (sesterce-h100x2 ledger: 4.1e-6 h per read row, 0.198 h for the load and a competence pass on ~550 scenes): competence on 516 scenes + 60 x 2 x 14 = 1,680 step-1 reads + 120 Delta forwards -> ~0.21 h; the 45s smoke took 0.20 h run (two competence passes); est 0.3."
