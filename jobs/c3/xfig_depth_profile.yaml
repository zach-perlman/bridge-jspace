id: xfig_depth_profile
title: "X-fig: do Zach's knock-out band and Dan's split agree in depth, including where both fail?"
thread: C3
gpus: 0
est_gpu_hours: 0
command: uv run python scripts/xfig_depth_profile.py --check-inputs
figures_command: uv run python scripts/xfig_depth_profile.py
question: >-
  (Amended 24 Oct before the figure was built, Dan: the main figure is 9B, 27B and 122B; OLMo-3 goes to an appendix figure because its two sides are different checkpoints, Instruct vs Instruct-DPO; the script still draws 2 x 2 and is split before the figure is built.) On the models with both methods (Qwen3.5-9B, Qwen3.6-27B, OLMo-3-7B, Qwen3.5-122B), where in relative depth do Zach's knock-out band (the window of his held-out depth sweep where the top-10 J++ knock-out breaks memory-final words most) and Dan's split (the first layer where removing the J++-readable part of a stated bridge's change stops hurting lookups and still hurts recalls) sit, and do they agree, including on the model where neither shows a recall-specific depth?
why_it_matters: >-
  C1 (Zach: memory steps need the J-space at a middle band) and C3 (Dan: past a model-specific depth only recall needs the J-space form) are two readings of one claim, with two interventions. If the band chosen on held-out data with lookups excluded contains the split, the two methods point at the same depth from independent choices of layer; if not, at least one of the depths is method-specific. The figure puts both depth profiles on one x axis, per model, before X0 (the pre-registered split confirmation) runs.
hypotheses:
  H-inside: 'on each model with both a band and a split, the split layer lies inside the band (band first layer <= split <= band last layer). Prior: Dan''s (predictions/), none set by the agent'
  H-outside: 'the split lies outside the band on at least one such model. Prior: Dan''s'
  H-none: 'on OLMo-3 (no split), Zach''s memory-final minus lookup-final loss shows no window that stands apart either. Prior: Dan''s'
decision_rule: >-
  Descriptive figure: no pass/fail rule, no verdict. Written 24 Oct before the figure was built and before any number it draws was computed (only schemas and row counts were inspected). Per model the figure is described in these terms only. (1) Split vs band: "inside" if band first layer <= split layer <= band last layer; else "outside by k layers" (k = the distance to the nearer band edge, also as k / n_layers of depth); "no split" or "no band" where one is missing, so the pair is not compared. (2) Zach's curve at the split: the memory-final minus lookup-final loss of the window whose middle is nearest the split layer, with its 95% interval, said to be above 0, below 0 or including 0. (3) Dan's curve in the band: the recall minus lookup J-dependence at Dan's cells inside the band, with their 95% intervals, said the same way, or "no Dan cell in the band". Zach's band is chosen by memory-final accuracy alone (scripts/choose_band.py), not by the drawn gap, so the band need not sit at the gap's peak; this is said, not tested. Nothing here is a confirmation of C1 or C3: Dan's split is post hoc until X0 runs.
controls:
- 'none drawn: X-fig re-plots existing rows, it runs no intervention'
- 'Zach''s band eligibility (in its choice, not redrawn): the rotated knock-out (paper10_rot) keeps every word >= 90% in the window'
- 'Dan''s split rule (in split_depth, not redrawn): lookups at the random-part removal''s level (not_rand_sub; where not run, 0)'
- 'consistency checks (raise on failure): Zach''s accuracies from summary.json recomputed from rows.jsonl; Dan''s J-dependences equal split_depth''s and its d1_verdict files; Dan''s split equal to the README''s; both lenses J++ with the pinned sha256; n_layers equal in both pins files'
n: 'Dan: 180 scenes per family (PP lookups, PM recalls) per cell, OLMo-3 116; cells as split_depth (9B bridge_word 6-14, context 16-18; 27B bridge_word 16-28, context 32-36 (context 40 has no recalls); 122B bridge_word 24-30, bind_bridge 33-36, context 24-36; OLMo-3 bridge_word 6-14). Zach, items per word (PP / MP / PM / MM) per window, 14 windows each: 27B and 122B 100 / 100 / 100 / 100 (42 bridges); 9B 88 / 41 / 88 / 41 (38 bridges); OLMo-3 29 / 15 / 29 / 15 (21 bridges)'
seeds: [0]
notes: "Dan, 24 Oct (brief: X-fig). Runs locally on CPU, not through jobq: jobq.validate requires gpus >= 1 (a CPU-only job cannot be queued), so this spec says gpus: 0 and is never enqueued. Order: `command` (--check-inputs: files, columns, lenses, checkpoints; prints schema and counts only) any time; `figures_command` (the figure) only after Dan's predictions are committed; it writes results/xfig_depth_profile/<UTC stamp>/ (png, svg, data.csv, caption.md, manifest.json); --band-of-record also shades, hatched, the band Zach's C1 test used where no band_choice file exists. Inputs. Zach @ a6db0d602e71acc8483e33f68fc389c2ab70c79b (zach/v8-breadth-1021), read with git show, never from a working tree: results/ablate_v2/{qwen35_9b_ctrl_sweep_v1, ctrl_sweep_v1 (Qwen3.6-27B), olmo3d7_ctrl_sweep_v1, qwen35_122b_ctrl_sweep_v1}/{manifest.json, summary.json, rows.jsonl}; results/ablate_v2/band_choice/{ctrl_sweep_v1, qwen35_122b_ctrl_sweep_v1}.json; results/ablate_v2/c1_v2/{qwen35_9b_full2_ko_v1, full2_ko_v1, olmo3d7_full2_ko_v1, qwen35_122b_full2_ko_v1}.json ('middle' only); src/bridge_jspace/pins.py (as text). Dan @ HEAD of danorel (committed, unchanged in the checkout; checked): results/statement_positions/<run>/{manifest.json, outcomes.jsonl} for split_depth's runs (qwen35_9b_d1_necessity_parts_r2, qwen35_9b_d1_rest_size_parts_r2, d1_necessity_parts_27b_r2, d1_topics2_parts_27b, qwen35_122b_d1_topics2_parts, qwen35_122b_d1_late_parts, olmo3_7b_instruct_jpp_d1_necessity_parts_r2), the d1_verdict verdict.json files that judge them, README.md (split layers). Definitions. Memory-final loss = mean over PM, MM of (unedited accuracy - paper10 accuracy); lookup-final loss = the same over PP, MP (scripts/c1_v2.py at a6db0d6); per sweep window, at its middle layer. J-dependence = (F(whole) - F(without J)) / F(whole) (scripts/figs/split_depth.py). Layer L = block output of layer L on both sides. Lens (J++ only; Dan 24 Oct: no plain J-lens run; none of qwen3_32bj_, muse30j_, gptoss20j_, q27jlens_ is an input): 27B published bbef480b, 9B published 8cda12f7, 122B published b771e502 (bf16 fit on the FP8 model) on both sides; OLMo-3: Dan ours 6847cfb3 on allenai/Olmo-3-7B-Instruct@6e5971d, Zach ours 1ca44bf5 on allenai/Olmo-3-7B-Instruct-DPO@b33130b: NOT ONE CHECKPOINT (the figure stars the panel). Gaps: no band_choice file at a6db0d6 for qwen35_9b, olmo3d7 or olmoh7; the 9B's and OLMo-3's bands of record exist only as the c1_v2 files' 'middle' and in EXPERIMENTS.md text (OLMo-3's queue falls back to a fixed relative-depth band when choose_band finds none; which one was used is not on file). Qwen3-32B (qwen3_32b_ctrl_sweep_v1, our J++ 6fbc0386, which is not danorel's qwen3-32b-jpp 7d6856b6) and Olmo-Hybrid-7B (olmoh7_ctrl_sweep_v1) have Zach's sweep only: no panel. Disclosure: while looking for the 9B / OLMo-3 bands, an agent grep printed lines of Zach's EXPERIMENTS.md and docs/day3_plan_zach.md that carry band labels and C1 gaps; no number this figure draws was computed."
