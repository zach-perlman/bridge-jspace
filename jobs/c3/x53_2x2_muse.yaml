id: x53_2x2_muse
title: "Batch 53.1 (Q-before, number) on Muse (L26), Dan 11:10 item 3: the number cells, (Q-after, number) = its main test as is and (Q-before, number) = each reader's question before the scene; per cell the main gate (a failed gate = not tested, never lowered), the conflict test at L, 51.12's arms with the readout check first, the atom inventory on 50 items; across: 'the pointer does not depend on the question's position' if the lookup loses <= 0.10 in both cells; verdict into results/x53_2x2/x53_2x2-<UTC>/; no prediction"
thread: C3
gpus: 1
mem_gb: 75
est_gpu_hours: 0.7
depends_on: []
command: >-
  export BJ_TARGET=muse-glimmer-30b BJ_DEVICE_MAP= PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  uv run python scripts/x53_2x2.py run --cells number --name muse30_x53_2x2 &&
  uv run python scripts/x53_2x2.py verdict
question: >-
  On Muse: does the conflict test's lookup lose more than 0.10 beyond random when each reader's question is placed
  before the scene, as the 27B's did (0.22 with the question first, 0.14 after)? And the 51.12 label of the recall in
  both number cells.
why_it_matters: >-
  Dan 11:10 (batch53.yaml next_1110, item 3): the 27B's lookup lost 0.22 with the question first (0.14 after); Muse
  (and Lightning if its gate passes) tells whether the pointer's independence of the question's position holds beyond
  the Qwens.
hypotheses:
  none: "no prediction (batch 53: exploration day; rules fixed by Dan 11:10 before any run)"
decision_rule: >-
  Dan 11:10 (jobs/c3/batch53.yaml next_1110, item 3), verbatim: "53.1 (Q-before, number) on Muse, and on Lightning if
  its gate passes: the 27B's lookup lost 0.22 with the question first (0.14 after). Rule: the conflict test's,
  verbatim; across: "the pointer does not depend on the question's position" if the lookup loses <= 0.10 in both
  cells on a model." The conflict test's rule (x0_necessity, jobs/c3/X0.md): per cell and reader, Jdep = 1 -
  S_no_part / S_whole, Rdep = 1 - S_no_rand / S_whole, excess = Jdep - Rdep (the extra loss beyond random); valid iff
  S_whole >= 0.30 and >= 30 items switched; around (excess <= 0.10, upper bound <= 0.20), through (Jdep >= 0.30, excess
  >= 0.20, lower bound >= 0.10), else mixed. The brief's 53.1 cells and gate verbatim as jobs/c3/x53_2x2_9b.yaml. As
  computed (scripts/x53_2x2.py; fixed before any run): Muse at L26 (x0_necessity.PREDICTED, its main test's layer);
  scenes = the main test's 600, of which 530 build on Muse's tokenizer (the bridge one token at one index; the same
  530 as its stored main test muse30b_x0_necessity, checked by tests/test_x53_2x2.py on Muse's tokenizer with its
  chat-template edits; results/x53_2x2/plan-20261029T101636Z); per cell X0's gate (O read accuracy >= 0.80 per reader
  over the 530, >= 150 eligible, the first 200); a failed gate = "not tested (gate x < 0.80)", never lowered, no
  below-gate run. (Q-after, number) checked item by item against muse30b_x0_necessity at L26 (agreement.json).
  (Q-before, number): "Question: <q> <digit instruction>\n\nScene:\n<scene>", each reader's question in its own prompt,
  per-reader Δ. The lookup's loss in a cell = X0's excess for the lookup (point estimate; cluster bootstrap over the
  bridge entity, 10,000, seed 0, beside); across (Dan 11:10): holds iff both cells' lookup <= 0.10; does not hold as
  soon as a tested cell is above 0.10 (named); can't tell while a cell is untested and none is above. Kept apart from
  the brief's rule across cells (the word cells stopped: "Stop: the 53.1 word cells (the wording fails)").
controls:
- "a random part of the same share beside every removal (X0's random subspace, seed 888 + L)"
- "the readout check before the arms, per cell and reader"
- "(Q-after, number) against the stored main test muse30b_x0_necessity item by item (agreement.json)"
- "both cells' gates before any test"
n: "per cell: 530 scenes for the gate; the first 200 eligible; atoms on 50"
seeds: [888, 0]
notes: >-
  Batch 53, 53.1 (Q-before, number) on Muse (Dan 11:10, item 3: "53.1 (Q-before, number) on Muse, and on Lightning if
  its gate passes"; "Stop: the 53.1 word cells (the wording fails)"). No prediction; UNVERIFIED; nothing into the
  README. Writes results/x53_2x2/muse30_x53_2x2/ (qa_num/, qb_num/), then the verdict over every model's runs. To
  speedup or mats GPU 1, whichever is free. Estimate from the ledger (sesterce-h100x2): x45m_muse_q2 788 s vs
  x45m_9b_q2 480 s (x1.64); the 9B's number cells ~0.3 h -> ~0.5 h; entered as 0.7 (wall ~30-40 min on 1x H100 80 GB).
