id: x50_z1_122b
title: "122B coverage (Dan 18:20, coverage_122b_1820 item 6): Z1 (Zach's named passages, true facts) and Z1-P (made-up facts) on Qwen3.5-122B-A10B (FP8): the conflict test on his passages at L33 (and his band's start L39 for Z1, Muse's design); gate 0.80 per reader, never lowered; no prediction; UNVERIFIED"
thread: C3
gpus: 2
mem_gb: 150
est_gpu_hours: 1.2
depends_on: []
command: >-
  export BJ_TARGET=qwen3.5-122b-a10b BJ_DEVICE_MAP=auto BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  { uv run python scripts/x50_zach.py run --part z1 --name qwen35_122b_z1 && uv run python scripts/x50_zach.py verdict --part z1 --coverage; a=$?;
  NOTE="no prediction: Z1's rule (verbatim) applied to the P items (Dan 18:20, the 122B's coverage)" &&
  uv run python scripts/x50_zach.py run --part z1p --name qwen35_122b_z1p &&
  printf '%s\n' "$NOTE" > results/x50_zach/qwen35_122b_z1p/coverage.txt &&
  uv run python scripts/x50_zach.py verdict --part z1p --coverage --runs qwen35_122b_z1p; b=$?;
  echo "exit Z1=$a Z1-P=$b"; test $a -eq 0 -a $b -eq 0; }
question: >-
  On the 122B, on Zach's named-bridge passages: does the lookup go around the lens part while the recall follows it
  (Z1, true facts), and with made-up facts (Z1-P), where the lookup cannot answer from memory?
why_it_matters: >-
  Dan 18:20 item 6; on the 9B and 27B the true-fact lookups follow the lens part (0.26 / 0.28) and made-up facts bring
  the split back on the 9B: the 122B is the scale point.
hypotheses:
  none: "No prediction (coverage_122b_1820): coverage run on an already-scored rule."
decision_rule: >-
  Z1's rule verbatim from jobs/c3/x50_z1_muse.yaml (jobs/c3/batch50.yaml; first scored in
  results/x50_zach/z1-20261028T161649Z), as copied in jobs/c3/x52_lightning_zach.yaml: "per model, gap >= 0.3 and
  lookup extra loss <= 0.10 -> "the split holds on his passages"; lookup >= 0.20 -> "the lookup follows the lens
  here"; else in between. Order split ...: "The order pattern replicates" if the lookup's switch under the whole
  change is >= 2x higher fact-first than fact-after (both CIs)". Z1-P: the same rule on the P (made-up fact) items,
  as jobs/c3/x52_z1p_lightning.yaml (no prediction). As computed: the specs' texts on the 122B's tokenizer (his v2
  sets, the same seeds, the gate 0.80 per reader, never lowered; a miss = "not tested"; up to 200 passages); layers:
  Muse's design for a model whose X0 layer lies below Zach's band: X0's L33 and his band's start L39 (of L39-45),
  both reported, Z1-P at L33 only. Zach's stored 122B knock-out rows beside
  (results/ablate_v2/qwen35_122b_jsuite_v2_test_chat_ko_cand2_v1).
controls:
- "a random part of the lens part's share (X0's random subspace, seed 888 + L)"
- "both readers on the identical patch"
- "the gate 0.80 per reader on his passages"
n: "up to 200 passages per part, 2 readers"
seeds: [888, 0]
notes: "Coverage, not hand-checked (Dan 18:20); UNVERIFIED; README untouched. Caveats: J++ fit on bf16 used on FP8; MoE; 2x H100, BJ_DEVICE_MAP=auto. Code: x50_zach LAYERS / COVERAGE_RUNS (z1, z1p) / BESIDE / BESIDE_BAND gain the 122B. Z1-P runs whether or not Z1 passes its gate. Cost: two parts, competence + 200 x 2 readers x 3 arms x 1-2 layers: ~0.5 h wall on 2 GPUs."
