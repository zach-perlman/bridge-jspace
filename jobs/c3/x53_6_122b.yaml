question: >-
  On the 122B: when the bridge word carries the lens part of B's identity and an address pointing at C's locker slot,
  which does the recall follow: B's attribute, C's, or both?
why_it_matters: >-
  Dan 12:20 (jobs/c3/batch53.yaml fallback_1220, approving the coordinator's list): "53.6 на 122B", on the already-fixed
  rule, queued after the day's ordered items. The four models run so far all give "both"
  (results/x53_identity_address/x53_identity_address-20261029T105132Z; across models: does not hold).
hypotheses:
  none: "No prediction (fallback_1220: already-fixed rules, no new rules, no prediction)."
decision_rule: >-
  53.6's rule verbatim (jobs/c3/batch53.yaml brief, 53.6): "At the bridge word: the lens part toward item B plus the
  address swap toward item C's slot (s = 2). Read: the recall answers B's, C's or the original. Rule: "the recall
  follows the lens identity" if B's share >= 2x C's; "follows the address" if C's >= 2x B's; else both." Across models
  (critic_1125, verbatim): ""the recall's pointer use tracks the swap's collateral" if the models whose recall the
  address swap moved (9B, Lightning) give "both" and the others give "follows the lens identity"." As computed: as
  jobs/c3/x53_6_9b.yaml (scripts/x53_identity_address.py, unchanged design), on the 122B at L33 (X0's layer for the
  122B): x6_routes' C0 pairs (seed 2510, 1,400 per condition) with three distinct legs counts (512 of 1,400 on the
  122B's tokenizer), X0's competence and X0's gate (0.80 per reader on O) on these, the first 300 eligible; the lens
  part = P_J (h_{S_B} - h_O), 25 signed-OMP atoms of the 122B's J++ at L33; the address swap = 2 (mu_{j_C} - mu_{j_A}),
  mu = x0_massmean.pointer_means(qwen35_122b_x0_probe_v4) (x8_write's means, the probe run at L33, not refit; checked on
  CPU: slots 0-4 present); the rule on the recall under both, the clauses in the brief's order, "neither (no B or C
  answers)" when both shares are 0; CIs over the original bridge item (10,000, seed 0) beside. Across models (flagged:
  the coordinator's reading): the 122B is not in Dan's moved list (9B, Lightning), so it is one of "the others", wanted
  at "follows the lens identity"; the rule's label over every model run (x53_identity_address.across: RUNS gains the
  122B). Verdict in the job (the 122B alone): results/x53_identity_address/x53_identity_address-<UTC>/; a joint
  five-model verdict by hand on CPU.
