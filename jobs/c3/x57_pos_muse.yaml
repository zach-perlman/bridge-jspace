title: "DO NOT ENQUEUE: running on Zach's box since 27 Oct 18:08 UTC (amendment 57 note 5). Zach's amendment 57 note 1 on Muse (approved by Zach 27 Oct, note 4): where the knock-out acts at L36-42, question-only and bridge-mention-only"
thread: C3
gpus: 1
mem_gb: 75
est_gpu_hours: 0.6
