  missed); no verdict. By hand after Dan''s Q51.2 is committed: uv run python scripts/x51_heads.py verdict --runs qwen35_9b_x51_2
  muse30_x51_2 x51_2_27b (CPU; verdict.md / .json, heads_<model>.png = the cut per set and site with the random draws beside
  and the collateral, examples.md); BJ_TARGET=<model> uv run python scripts/x51_heads.py view --runs <that model''s run> for
  the decoded verify pack (5 prompts as read, 10 random read pairs per arm, seed 0). Plan: results/x51_heads/plan-20261028T164052Z/
  (counts, the ranking, every set, 5 rendered prompts with both readers'' sites, seed 0). Seeds: 2510 the routes scenes, 0
  the split, bootstrap and examples, 512 the random head sets. Cost (ledger arithmetic, results/jobq/ledger_sesterce-h100x2.jsonl):
  49.7 on Muse (x49_7_muse, H100 PCIe) ran 687 s for ~3,100 passes incl. the competence (~300 s) and the load (~2 min): ~0.086
  s per pass; here ~17,800 passes: ~1,530 s + ~420 s = ~33 min = 0.55 GPU-h, est 0.6.'
