  300 items (49.7''s), 32 bridge entities; fit 157 items (16 entities), read 143 items (16 entities); 286 read pairs; 49.7''s
  switched pairs fit 154 / read 149 (read share 0.52); heads at every layer 27-51 (25 x 32 = 800; no Gated DeltaNet layer);
  question tokens 8 (lookup) / 9 (recall); top 10 by fit move L39:h1 1.71, L35:h25 1.58, L35:h21, L34:h20, L35:h17, L43:h4,
  L34:h21, L33:h25, L35:h31, L47:h25 0.59; best layer L39 (32 heads); 30 sets x 2 sites x 2 readers on 143 read items = 17,160
  batched reads of 3 rows, + 286 baseline reads, + 314 single forwards (means)'
