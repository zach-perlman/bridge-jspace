command: >-
  uv run python scripts/x0_necessity.py run --name x0_single_27b --set d1_topics_v3 --renderings chat --layers 28 30 32 34 --alt single --curve-dicts jpp --curve-k 50 100 --curve-all-layers --why "X0 descriptive, added after data (critic via Dan, 24 Oct): single-change alt (the asked pick becomes another person's pick, nothing else changes), L28-34, J++ k = 25 / 50 / 100 at every layer"
figures_command: uv run python scripts/x0_necessity.py figures --name x0_single_27b
question: >-
  X0's alt swaps two picks, so where the other changed sentence comes first Δ at the asked word carries an upstream change (the 27B L32 lookup: upstream items switch 63% with excess 0.16, asked-first 24%). With only the asked person's pick changed (to an entity another person already picks), what are the lookup's and recall's J++ dependence and excess at L28-34, at k = 25 / 50 / 100?
why_it_matters: >-
  Separates the lookup's moderate J++ dependence from the upstream change in X0's alt.
hypotheses:
  H-same: 'the lookup excess at L32 is within X0''s CI (0.14 [0.08, 0.20]). Prior: none set (descriptive, after data)'
  H-differs: 'otherwise. Prior: none set'
decision_rule: >-
  Descriptive, added after data, not part of X0's rule. X0's code path with --alt single: the alt context is the org context with only the asked pick sentence changed; the alt answer is the cf answer (the same entity). Cells, labels and the rule's verdict are computed and reported as descriptive, beside X0's word cells; absolute drops and the random-subspace null per dictionary as in X0.
controls:
- 'the random part of the same share, per dictionary and k'
- 'the random Gaussian dictionary at k = 25'
- 'both readers on the identical patch'
- 'the valid-cell bar (S_whole >= 0.30 and >= 30 items)'
- 'the competence gate on the single-change alt prompts'
n: 'up to 200 eligible scenes of d1_topics_v3, 2 readers each'
seeds: [24, 0]
notes: "Seeds as x0_necessity_27b_chat. Every case has no upstream change (checked on the tokenizer: 600/600 cases, 0 upstream). Cost: 4 layers x (1 + 8 + 4 curve + 2 nonneg arms) x 200 x 2 readers ~ 24k reads + competence: ~0.5 h."
