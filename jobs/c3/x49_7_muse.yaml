id: x49_7_muse
title: "Batch 49.7 on the Muse (L26): does the question's attention follow the written address? x8_write's routes scenes; at the bridge word none / the pointer swap 2 (mu_k - mu_j) / a random vector of its norm; softmax attention from the last token and the question tokens to every token at every layer > L (all softmax attention); five heads chosen on a fit half, read on the other; the best head zeroed (necessity); SEALED until Q49.7"
thread: C3
gpus: 1
mem_gb: 75
est_gpu_hours: 0.5
depends_on: []
command: >-
  export BJ_TARGET=muse-glimmer-30b BJ_DEVICE_MAP=; uv run python scripts/x49_attn.py run --name muse30_x49_7 --why "batch 49, test 49.7 (jobs/c3/batch49.yaml with amendment 2; Q49.7): x8_write's items at L26, none / swap s = 2 / random of the swap's norm at the bridge word; attention at every layer > L from the last and question tokens; candidates on the fit half, the best head zeroed at the last / question tokens on the read half; sealed"
question: >-
  When the address at the bridge word is swapped (x8_write's mu_k - mu_j at s = 2), does the question's attention move
  onto the locker sentence of the written slot k, and does a head that moves carry the switch (zeroing it undoes it)?
why_it_matters: >-
  The address is probe-readable, removable and writable; nothing yet shows who dereferences it. A head whose attention
  follows the written address, and without which the switch falls, puts the dereference in hand at the head level; on
  Muse every layer is softmax attention, so Muse decides what a 9B null means.
hypotheses:
  Q49.7: "Dan's answer in predictions/2026-10-28_dan.md (Q49.7, per model: (a) follows / (b) elsewhere / (c) neither; if (a), above L+4 or within 4 layers of L); not committed when this spec was written, so the run is sealed: no verdict in the job (scripts/x49_attn.py verdict and view refuse until the Dan: line is committed)."
decision_rule: >-
  Fixed in advance (jobs/c3/batch49.yaml, 49.7, with amendment 2, Dan 28 Oct ~14:20). Read half, decisive query site
  the last token (the question tokens' mean beside, the same rules), cluster bootstrap over bridge entities (10,000,
  seed 0), EPS 1e-9 at the bars. move = (mass on slot k's sentence - mass on slot j's) under the arm minus the same
  under none, per head and (item, k); j = the bridge item's slot, k = the written slot; a sentence's mass = all its
  tokens. "The attention follows the address": on the pairs where the lookup switched to slot k's locker under the
  swap, >= 1 of the five candidate heads has mean move >= 0.30 with its CI excluding 0, its mean move under the random
  vector on the same pairs <= 0.05, and its mean move on the non-switched swap pairs <= 0.10. "Dereference elsewhere":
  the switch share >= 0.3 and no recorded head (every layer > L, every head) reaches a mean move of 0.15
  on the switched pairs. Otherwise neither. (1) Aggregate, beside the per-head rule: the summed move over the five
  candidates and over every head of the best head's layer; "distributed dereference" if either sum >= 0.30 while no
  single candidate reaches 0.30. (2) Necessity: the best head (chosen on the fit half before the ablation runs) has its
  output (its slice of o_proj's input) zeroed at the last token, and separately at the question tokens, under the swap
  on the read half; "the head carries the position route" if the switch to slot k falls by >= 0.5 of its swap value
  while the identity answers (read pairs answering slot j's locker under the swap) change <= 0.10 and the recall's
  answer changes <= 0.10 (swap + zero vs swap); the clean answers lost (none + zero vs none) beside. (3) Weights-level,
  descriptive: S[k, k'] = (W_Q mu^q_k)^T (W_K mu^src_k') for the best head, mu^q_k = the mean last-token attention
  input (post input-norm) over items whose picked item is in slot k, mu^src_k' = the mean over items of the mean input
  at slot k''s locker-sentence tokens, unedited; diagonal dominance = (mean diagonal - mean off-diagonal) / SD of the
  off-diagonal; RoPE and the q/k norms left out (said so); the actual mean attention logits on slot j's / k's / the
  third sentence's tokens under none / swap / random beside. (4) The 9B caveat does not apply (no Gated DeltaNet
  layer); Muse is the model that decides a 9B "elsewhere". Report beside: the best head's layer and index (and L + how many), its attention entropy per arm, the
  per-token breakdown of its mass on slot k's sentence (item / number / rest), the total full-attention change (the
  summed move over every head; the mean total-variation distance from none over every head, swap vs random).
  As computed (fixed before any run; Dan may override): items = x8_write.eligible (the routes test's C2 scenes, their
  O prompt, gate 0.80 per reader on O, the first 300; the run records whether they are x8's 300); fit / read halves
  by bridge entity (sorted, random.Random(0) shuffle, first half fit); candidates = the five (layer, head) with the
  most mass on the three locker sentences together at the last token under none, mean over fit items (ties: lower
  layer, then head); best head = the candidate with the largest mean move on the fit half's switched pairs (none
  switched: the first candidate); the lookup's answer read in the forward that records the attention (one prompt,
  X0's chat read), the recall and the ablation read with X0's batched chat read; swap / random classes as x8_write
  (target = slot k's digit, original = slot j's, third, other).
controls:
- 'a random vector of the swap''s norm at the same token and layer, one per item and k (seed 4401, as x8_write): the move under it must stay <= 0.05 on the switched pairs'
- 'the non-switched swap pairs: the head''s move there must stay <= 0.10 (a head that moves under any write is not following the address)'
- 'heads chosen on the fit half, every rule read on the other half (split by bridge entity, seed 0)'
- 'necessity: identity answers and the recall under the zeroed head (<= 0.10 changed each); the clean answers lost (none + zero vs none) beside'
- 'attention entropy per arm and the mean total-variation distance from none over every head, swap vs random (dumbest way 1); the item / number / rest split of slot k''s mass (dumbest way 2)'
n: 'plan check (CPU, the stored x8 run muse30b_x8_write and routes cases muse30b_x6_routes): 300 items, 32 bridge entities; fit 157 items (16 entities), read 143 items (16 entities); 600 (item, k) pairs, 286 on the read half; x8''s s = 2 target share 0.52 (read half 0.54, 155 switched read pairs); recorded layers 27-51 (25 x 32 heads = 800; sliding window 2048 > the longest prompt, 110 tokens, asserted in the run), none skipped; 8 question tokens and 9 tokens per locker sentence'
seeds: [2510, 4401, 0]
notes: "Batch 49 (Dan, 28 Oct; amendment 1 ~14:10: queue item 4, 9B -> Muse, this the second; amendment 2 ~14:20: the aggregate, necessity, weights-level and 9B-caveat reads). Sealed: the run writes manifest (switches, inputs' sha256, recorded / skipped layers), gate.json, cases.jsonl (items, halves, token groups), outcomes.jsonl (both readers, none / swap / random), norms.jsonl, attention.npz (every recorded head, both query sites: mass per locker sentence split item / number / rest, entropy, TV from none, mean logit per sentence; none per item fp32, swap and random per (item, k) fp16), heads.json (the five on the fit half, the best), states.npz (attention inputs at the candidate layers: last token, per-slot locker-sentence means), head_weights.npz (the best head's W_Q / W_K rows), ablation.jsonl (read half: none and swap with the best head zeroed at nothing / the last token / the question tokens, both readers), status.json (tested, or not tested if the gate missed); no verdict. By hand after Dan's Q49.7 is committed: uv run python scripts/x49_attn.py verdict --runs qwen35_9b_x49_7 muse30_x49_7 x49_7_27b (CPU; verdict.md / .json, best_head_<model>.png = the best head's mass on slot j / k / third under none / swap / random beside the lookup's answer shares, examples.md); BJ_TARGET=<model> uv run python scripts/x49_attn.py view --runs <that model's run> for the decoded verify pack (10 random items, seed 0, the prompt as read with the bridge and locker sentences marked, each arm's answers). Plan: results/x49_attn/plan-*/plan_muse-glimmer-30b.json and prompts_muse-glimmer-30b.md (5 rendered prompts, seed 0). Seeds: 2510 the routes scenes, 4401 the random vectors, 0 the split, bootstrap and examples. Cost (ledger arithmetic, results/jobq/ledger_sesterce-h100x2.jsonl): x8_a_muse (the same eligibility and competence, 300 items) ran 588 s; here ~3,100 passes (5 single forwards with 25 layers' attention recomputed, a recall batch, a state forward per item; 6 ablation batches of 3 per read item); x45p_muse's 0.067 s per read (167 s / 178 items / 14 reads) x 1.5 for the recompute = 0.1 s: ~310 s, plus the competence (~300 s) and the load (~3 min): ~13 min = 0.22 GPU-h; est 0.5 (Dan's) as the upper bound. The run name takes pins' Muse prefix muse30_ (the stored x8 and routes runs keep muse30b_)."
