notes: "Batch 49 amendment 1 (Dan, 28 Oct ~14:10), queue item 8: runs after 48.1's verdict exists (depends on x48_1_9b_r2). BJ_DAS_GDN=torch exactly as x48_1_9b_r2: the 9B's linear-attention layers run transformers' torch reference of the gated delta rule (fla's backward refuses on Hopper with Triton 3.6), recorded in the manifest (gdn_kernel) and the switches. Sealed: the run writes manifest, pairs.json (scene ids and splits), cases.jsonl (with the marked prompts), states_L12.pt (h_O, h_S, Delta per pair), R.pt (every R, U, W, U_fit), train.jsonl (loss curves), geometry.jsonl, readouts.json, outcomes.jsonl; no verdict. By hand after Dan's Q49.8 is committed: uv run python scripts/x49_das_pos.py verdict --runs qwen35_9b_x49_das_pos (CPU; verdict.md, verdict.json, <run>.png, examples.md = 10 random test pairs, seed 0). Seeds: 0 the split, bootstrap and examples; 49 R's init (49 + 100 k, shuffled + 10); 4981 the shuffled targets; 4982 the random R; 4803 the training batches (x48_das.BATCH_SEED + the R's seed); 2510 x6_routes' scenes. Caveat for Dan: the recall moved off O's answer on 27% of these pairs under the stored whole change (137 of 187 kept), so the recall's cross bar (<= 0.1) is stricter than the whole change itself; reported beside. Small test split (6 entities, 34 pairs): CIs will be wide. Cost (ledger arithmetic): x48_1_muse ran 16 trainings (9,600 micro-batches of 8) plus reads in 3,262 s, ~0.31 s per micro-batch; the 9B ~1.8x faster, the torch GDN reference ~2x slower (x48_1_9b_r2's assumption; no r2 ledger row yet): ~0.34 s. Here 6 trainings x 300 steps x 16 rows = 3,600 micro-batches x 0.34 = 1,220 s; states 374 forwards + reads (75 held-out pairs x 2 readers x 11 arms = 1,650 rows) ~120 s; load ~2 min; total ~0.4 h, est 0.6 (Dan ~0.5)."
