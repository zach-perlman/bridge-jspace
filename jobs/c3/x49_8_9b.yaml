id: x49_8_9b
title: "Batch 49.8 on the 9B (L12): DAS for the address. R_pos (k = 2, 4, 8) trained on routes position counterfactuals (same item, its locker sentence moved to another slot; target = O's locker at that slot); own-IIA, U's and W's energy inside R_pos, R_pos inside J++-25, the recall's cross read; random and shuffled-target baselines"
thread: C3
gpus: 1
mem_gb: 40
est_gpu_hours: 0.6
depends_on: [x48_1_9b_r2]
command: >-
  export BJ_TARGET=qwen3.5-9b BJ_DEVICE_MAP= BJ_DAS_GDN=torch; uv run python scripts/x49_das_pos.py run --name qwen35_9b_x49_das_pos --why "batch 49, test 49.8 (jobs/c3/batch49.yaml, amendment 1; Q49.8): DAS at the bridge word at L12 on routes position counterfactuals (x6_routes C1 pairs the stored whole change sends to the position answer); R_pos at k = 2, 4, 8, random and shuffled-target baselines; U's and W's energy inside R_pos, the recall's cross read; sealed"
question: >-
  At the bridge word at L12, does a learned low-dimensional subspace R_pos mediate the locker sentence's position (moving
  the lookup to the locker at the slot the bridge's sentence occupies in S), and is it the hand-built address U (and/or
  47.2's slot subspace W), leaving the recall alone?
why_it_matters: >-
  The address U is probe-readable, removable and writable, but it was built by hand (mass means by slot). If DAS, which
  is free to find any subspace, recovers U, the address is validated as the model's own mediator; if it finds a
  mediator that U misses, there are two address codes; if none, the position route has no low-dimensional mediator at
  this token and layer.
hypotheses:
  Q49.8: "Dan's answer in predictions/2026-10-28_dan.md (Q49.8, (a)-(d) at k = 4); not committed when this spec was written, so the run is sealed: no verdict in the job (scripts/x49_das_pos.py verdict refuses until the answer is committed)."
decision_rule: >-
  Fixed in advance (jobs/c3/batch49.yaml, 49.8): "the learned address is ours" if at k = 4 >= 0.6 of U's energy lies in
  R_pos (random k/d ~ 0.001) with own-IIA >= 0.6 and the recall's cross-IIA <= 0.1; "two address codes" if own-IIA >=
  0.6 but U's energy in R_pos <= 0.2 (then report which one the writes used, 47.2's slot-specific result, and the angle
  between them); Q49.8 (c) "no low-dimensional mediator" if own-IIA < 0.6; (d) "in between" otherwise.
  As computed (fixed before any run; Dan may override before the enqueue): pairs = the stored routes run
  qwen35_9b_x6_routes (chat, L12, scene seed 2510), its 300 eligible C1 scenes (the bridge's locker sentence swapped
  with another slot's, the bridge's number a new digit in S; the item is the same in O and S), restricted to the 187
  whose stored whole change sent the lookup to the position answer (identity 109, other 4 dropped, counted in
  pairs.json); the counterfactual answer = O's locker digit at the slot the bridge's sentence occupies in S
  (x6_routes' expect["position"]), not S's own answer. Scenes rebuilt with the tokenizer and asserted equal to the
  stored ids. Split by bridge entity 60 / 20 / 20 (train / select / test), seed 0 (31 entities: 19 / 6 / 6; pairs 112 /
  41 / 34). Intervention h <- h_O + R R^T (h_S - h_O) at the bridge token at L12 on the O prompt (x48_das's code: R [d x
  k] orthonormal via torch.nn.utils.parametrizations.orthogonal, Adam lr 1e-3, 300 steps, batch 16 in micro-batches of
  8, cross-entropy of the position answer's token at X0's chat read position); one R_pos per k in {2, 4, 8}, one
  untrained random R and one shuffled-target R per k. Reads on the select and test pairs, both readers, arms none /
  whole / R_pos / random / shuffled per k (X0's read, AddRows): own-IIA = the lookup's top token is the position answer;
  the lookup's route (identity / position / value / other) beside; the recall's cross-IIA = its top token is not O's
  answer under R_pos (the item is the same, so any move is collateral). U = x0_massmean.subspaces' Alf on
  qwen35_9b_x0_probe_v4 (rank 4, not refit); W = 47.2's slot subspace (x47_six's layout-free mass-mean by slot on the
  six-locker fit half at L12, rank 5), loaded from results/x47_six/qwen35_9b_x47_2/fit.npz, not refit. U's energy in
  R_pos = ||R_pos^T U||_F^2 / 4 (x6_routes.mean_cos2); W's = ||R_pos^T W||_F^2 / 5; principal angles R_pos vs U, R_pos vs
  W, U vs W; per pair the share of R R^T Delta inside the 25 / 100 signed-OMP J++ atoms, the 25 W_E atoms, U, W, U_fit
  (refit on the train pairs' h_O by the bridge's O slot, rank 2, descriptive) and outside the union (J++-25, U, W_E-25).
  The rule reads k = 4 on the test pairs' point estimates (EPS 1e-9 at the bars); cluster-bootstrap CIs over bridge
  entities (10,000, seed 0) beside; own-IIA / the whole change's rerun position share beside; the select split
  reported, not used to choose k. Energy >= 0.8 of Delta flags an R "not selective". Scored by hand:
  scripts/x49_das_pos.py verdict (CPU).
controls:
- 'untrained random R of the same k (QR of a seeded Gaussian, seed 4982 + k): its IIA, the recall''s moves and its U / W energy (~k / d) beside every trained R'
- 'R trained on shuffled targets (the training rows'' position answers permuted once, seed 4981 + k): must sit at the random R (overfitting check, entities held out)'
- 'the whole change and O unedited reread on the select and test pairs (ceiling and floor; IIA / S_whole and the recall''s moves under the whole change reported)'
- 'the recall reader on the identical edit (the cross read): the item is the same in O and S, so a move off O''s answer is collateral'
- 'the read position: both readers'' prompts identical through the bridge token (x6_routes.encode asserts it), each read at its own last token (the appended space)'
