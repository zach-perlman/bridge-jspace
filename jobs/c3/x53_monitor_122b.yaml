id: x53_monitor_122b
title: "Batch 53, test 53.2 (the monitor test) on Qwen3.5-122B-A10B (FP8, 2x H100), coverage (Dan 12:20, fallback_1220): the states at the bridge word and the last token, every second layer (L0-L46), main test (its X0 r2 run at L33) and the JSON varied scenes, O and S, both readers; each state's J++ lens part at k = 25 / 100 (sealed: no probe, no label; the probes run on the Mac); no prediction"
thread: C3
gpus: 2
mem_gb: 150
est_gpu_hours: 1.2
depends_on: []
command: >-
  export BJ_TARGET=qwen3.5-122b-a10b BJ_DEVICE_MAP=auto BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  uv run python scripts/x53_monitor.py run --name qwen35_122b_x53_monitor
question: "On the 122B, what can a J-space readout decode compared with the full state: (b) the bridge's locker slot and (c) the lookup's answer digit (headline), (a) which item and (d) the recall's answer (positive controls), from the full residual, the J++ lens part (k = 25, 100), the fixed J++ subspace, a random subspace of the same k, the energy-matched random subspace and PCA top-k?"
why_it_matters: "Dan 12:20 (jobs/c3/batch53.yaml fallback_1220, approving the coordinator's list: '53.2 монітор на 122B (mats, 2 GPU)'): the largest model gives the clean conflict-test split (lookup 0.00 at L33); the monitor test on it says whether the J++ part reads the address and the lookup digit there as on the four models. Coverage, same rule, reported as an addendum folder."
hypotheses:
  none: "rule fixed in advance in jobs/c3/batch53.yaml (53.2, with critic_1125 and additions_1140); coverage run (fallback_1220: all on already-fixed rules, no new rules, no prediction)"
decision_rule: "Fixed in advance (jobs/c3/batch53.yaml brief 53.2, Dan 09:30), verbatim: \"Rule: “J-space blind to X” if the J++ probe is within 0.10 of the random subspace at every layer while the full residual reaches >= 0.8 at some layer; “J-space carries X” if J++ >= 0.8 and >= 0.3 above random; else in between.\" critic_1125 (Dan 11:25), verbatim: \"53.2 changes, before scoring: headline targets (b) slot and (c) lookup digit; (a) and (d) are positive controls. Add a fixed J++ subspace (the k atoms most frequent on the training folds) and an energy-matched random subspace beside the current ones. Check one cell against sklearn.\" additions_1140 (Dan 11:40) item 2, verbatim: \"report two monitors separately. (a) The lens readout (top words): cite 47.0, unchanged. (b) The trained probe on J++ coordinates vs random vs full. If the random subspace also decodes the slot (\\\"random reads it too\\\"), the wording is: \\\"the address is linearly decodable from many subspaces, J++ included; the lens readout does not show it\\\" — not \\\"J-space is blind\\\". Only \\\"J-space blind\\\" if J++ is within 0.10 of random AND random is under 0.8 while the full state is >= 0.8.\" As computed: exactly as the four models' runs (jobs/c3/x53_monitor_9b.yaml's decision_rule and scripts/x53_monitor.py: 5 seeds x 5-fold, (b) and (c) grouped by the row's bridge entity, (a) and (d) by scene, C = 1.0, standardised; J++_k X0's signed OMP of the state over the J++ letter atoms; fixed J++ and energy-matched random beside; 'random under 0.8' read at every layer, flagged as on the four). The verdict is an addendum folder (results/x53_monitor/x53_monitor_122b-<UTC>/), not part of the four models' verdict."
controls:
- "a random subspace of the same k (decisive), the energy-matched random subspace and the fixed J++ subspace (beside), PCA top-k, the full residual, the training folds' majority class"
- "47.0's lens readout is not run on the 122B (cited only for the four models)"
n: "main: 200 items (40 bridge entities) of qwen35_122b_x0_necessity_r2 at L33 x O / S x 2 readers = 800 forwards; json: 310 aligned x0b_v2 JSON scenes (30 entities) = 1,240 forwards; 24 layers (L0-L46); plan results/x53_monitor/plan-20261029T112122Z/plan-122b.json"
seeds: [888, 0, 1, 2, 3, 4]
notes: "Batch 53, 53.2 coverage on the 122B (fallback_1220), loading as jobs/c3/x53_2x2_122b.yaml (Qwen/Qwen3.5-122B-A10B-FP8, 2x H100, BJ_DEVICE_MAP=auto, BJ_SUITE_BATCH=16, mem 150). Flags (the coordinator's, for the record): L33 is the 27B's relative depth carried over (33/48); the J++ lens was fit on the bf16 weights while the run loads the FP8 checkpoint. The main test is the 122B's X0 r2 run (x53_monitor.MAIN_RUN_EXTRA, as scripts/x53_2x2.py; x45b_binding.MAIN_RUN has no 122B). Saved fp16 layer-major, gitignored (~0.17 / 0.26 GB per array for main / json; 3 arrays + atoms): pull results/x53_monitor/qwen35_122b_x53_monitor/ into the main checkout. Estimate: ~2,040 forwards on the 2-GPU split plus the OMP on 24 layers (d = 3072) and the load, ~0.5-0.6 h wall x 2 GPUs; entered as 1.2. Then x53_monitor_atoms_122b (depends on this job)."
