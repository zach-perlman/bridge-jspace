id: x0b_v2
title: "X0b v2 (exploratory): the lookup / recall contrast on 7 domains x 3 formats x 3 levels, order by design (75% locker-before), single-change alt, pooled rule with C; 27B on GPU0 and 9B on GPU1 in parallel"
thread: C3
gpus: 2
mem_gb: 120
est_gpu_hours: 3.0
depends_on: [qwen35_122b_x0_hw_gate_r2]
command: >-
  uv run python -c "import torch" &&
  { CUDA_VISIBLE_DEVICES=0 BJ_DEVICE_MAP= uv run python scripts/x0b_generalize.py run --name x0b_v2_27b --set x0b_v2 --why "X0b v2 on the 27B (jobs/c3/X0b.md; Dan 24 Oct evening)" & p27=$!;
  CUDA_VISIBLE_DEVICES=1 BJ_DEVICE_MAP= BJ_TARGET=qwen3.5-9b uv run python scripts/x0b_generalize.py run --name qwen35_9b_x0b_v2 --set x0b_v2 --why "X0b v2 on the 9B (jobs/c3/X0b.md; Dan 24 Oct evening)" & p9=$!;
  wait $p27; s27=$?; wait $p9; s9=$?; echo "exit 27B=$s27 9B=$s9"; test $s27 -eq 0 -a $s9 -eq 0; }
figures_command: >-
  uv run python scripts/x0b_generalize.py figures --name x0b_v2_27b && BJ_TARGET=qwen3.5-9b uv run python scripts/x0b_generalize.py figures --name qwen35_9b_x0b_v2
question: >-
  On x0b_v2 (7 domains, prose / json / table, levels 0-2, 75% of scenes with the bridge's locker before the asked pick, single-change alt built by the harness), at the bridge's word, chat, pooled over the cells that pass the per-cell gate, at the 27B's L32 and the 9B's L12: is the lookup's extra loss without the J++ part (k = 25) at most 0.10 while the contrast C = recall excess - lookup excess is at least 0.20? Descriptive: the k-curve, the strata, and whether probe (b) reads the bridge's locker row ordinal in JSON and tables as in prose.
why_it_matters: >-
  X0 used one simple scene type (3 domains, prose, level 0). X0b asks whether the contrast holds beyond it, and whether the address the probe reads at the bridge's word forms in structured formats too.
hypotheses:
  H-holds: 'the pooled rule holds (lookup excess <= 0.10, upper CI <= 0.20; C >= 0.20, lower CI >= 0.10). Prior: Dan''s, predictions batch 27'
  H-moderate: 'the 27B lookup excess >= 0.20 (the moderate dependence generalizes). Prior: Dan''s, batch 27'
  H-address: 'probe (b) reads the locker row ordinal above every baseline in locker-before JSON and tables. Prior: Dan''s, batch 27'
decision_rule: >-
  jobs/c3/X0b.md section 2 (v2, Dan 24 Oct ~18:45 and ~19:30): at L32 (27B) and L12 (9B), J++ k = 25, pooled over eligible items of cells passing the per-cell gate (>= 0.80 unedited org accuracy, both readers): holds iff lookup excess <= 0.10 (upper CI <= 0.20) and C >= 0.20 (lower CI >= 0.10); fails iff lookup excess >= 0.20 or C's upper CI < 0.10; can't tell if either reader's cell is invalid; else mixed. Cluster bootstrap over bridge entities (10,000 resamples, seed 0). Exploratory; the X0 verdicts do not change. Descriptive: the k-curve (50, 100), strata, probe (b). Results not opened or summarized before Dan's batch-27 commit.
controls:
- 'the random part at J++''s own share, per item and k'
- 'both readers on the identical patch'
- 'the valid-cell bar (S_whole >= 0.30 and >= 30 switched)'
- 'the per-cell competence gate'
- 'probe (b): locker-after scenes; the layout-only and pick-ordinal-only baselines'
n: 'x0b_v2: 2,258 aligned scenes (of 4,410; 1,693 locker-before), at most 40 eligible per passing cell; 61 bridge entities'
seeds: [2410, 0]
notes: "One 2-GPU job, two processes (27B on GPU0, 9B on GPU1; BJ_DEVICE_MAP empty: each model whole on its GPU). Replaces x0b_v1 (cancelled before it ran). Limits (X0b.md section 4): JSON covers animals, Greek and shapes only; 61 entities, not 100. Cost basis: x0_single_27b_r2 (competence 1.3 scenes/s; ~1.7 min per 200 items per layer with 10 arms), plus one forward per aligned scene for the probe states: 27B ~1.5 h, 9B ~0.6 h."
