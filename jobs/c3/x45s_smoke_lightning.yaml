id: x45s_smoke_lightning
title: "45s on Nemotron-3.5-Lightning, the smoke (DRAFT, not queued; Dan predicts first, Q46.2-Q46.3; needs Zach's lens file and mamba-ssm revision): kernels vs the torch path, the lens and its L27 map, our scenes on Lightning's tokenizer, the read gate on all scenes, a no-op patch, the write at the bridge word, and both designs end to end on 8 scenes"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.75
depends_on: []
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_SUITE_BATCH=16 BJ_MAMBA_SSM_REVISION=28017f36635a6b94d911333812beeed5dd901ac0;
  uv run python scripts/x45s.py fetch
  && uv run python scripts/x45s.py smoke-manifest --name nem35l_x45s_smoke --why "45s smoke (Dan 27 Oct ~15:00; jobs/c3/x45s_smoke_lightning.yaml): Lightning's load, kernels, lens, scenes, read gate and patch mechanics before the two sealed runs at L27"
  && uv run python scripts/kernel_nll.py results/x45s/nem35l_x45s_smoke/knll_kernels.pt
  && BJ_NO_KERNELS=1 uv run python scripts/kernel_nll.py results/x45s/nem35l_x45s_smoke/knll_torch.pt
  && uv run python scripts/x45s.py smoke --name nem35l_x45s_smoke
  && uv run python scripts/x0_necessity.py run --name nem35l_x45s_smoke_main --set d1_topics_v3 --renderings chat --layers 27 --alt cf --dicts jpp --curve-dicts jpp --curve-k --no-nonneg --n-items 8 --sealed --why "45s smoke: the main test (two people swap) end to end on 8 scenes at L27, and its read gate on all scenes"
  && uv run python scripts/x0_necessity.py run --name nem35l_x45s_smoke_clean --set d1_topics_v3 --renderings chat --layers 27 --alt fresh --dicts jpp --curve-dicts jpp --curve-k --no-nonneg --n-items 8 --sealed --why "45s smoke: the clean one-pick design (45m) end to end on 8 scenes at L27, and its read gate on all scenes"
  && uv run python scripts/x45s.py smoke-gates --runs nem35l_x45s_smoke_main nem35l_x45s_smoke_clean
question: >-
  Can our main test and 45m's clean design run on Nemotron-3.5-Lightning as pinned (Zach's settings: hub mamba-ssm
  kernels, his J++ lens, no BOS, thinking off), and are both designs testable there: enough scenes, the read gate
  passed, and a patch at the bridge word that does what it should?
why_it_matters: >-
  Lightning is a new family and architecture for our side (hybrid Mamba-2 / attention / MoE, 52 blocks), loaded through
  hub kernels, with a lens we did not fit and numerics that depend on batch composition (Zach, amendment 56 B). A
  failure in any of these would be confounded with the result; the two sealed runs (x45s_a_lightning,
  x45s_b_lightning) start only after this passes.
hypotheses:
  H-none: 'a check, not a claim; no prediction'
decision_rule: >-
  Fixed before any run (Dan 27 Oct ~15:00; the bars are the agent's where Dan gave none, marked). STOP (exit 1; a and b
  stay blocked) if any of: (1) the mamba-ssm commit the load used (read from the loaded module paths after a forward)
  is not BJ_MAMBA_SSM_REVISION (Zach's revision); (2) kernels vs the torch path on 32 pinned WikiText rows
  (scripts/kernel_nll.py with and without BJ_NO_KERNELS=1) misses Zach's bar, |mean NLL diff| <= 0.01 and top-1
  agreement >= 0.95 (amendment 44; Lightning's was 0.0008 and 97.6%); (3) the lens file's sha256 is not the pin
  (3306b6e4..., asserted by JLens) or it has no map at L27; (4) either design has fewer than 150 scenes per reader whose
  bridge is one token at one position and whose org and alt answers are one token each (tokenizer-only check, 27 Oct:
  516 / 559 of 600); (5) on the first 8 scenes of either design (scene order), a zero patch at L27 does not give logits
  identical to the unedited row of the same batch, or (agent's bar) the whole change written at the bridge word leaves
  L27's output there more than 1e-2 of its max |value| from the changed prompt's; (6) either 8-scene x0_necessity run's
  read gate (unedited org accuracy under the top-token read, both readers, all scenes of the design) is below 0.80 or
  has fewer than 150 eligible scenes; a gate in [0.75, 0.80) is reported as "descriptive only" and still stops (no
  0.75 rerun is specified). Reported, not stopping: the J++ readout of the bridge word at L27 (the bridge's rank among
  its domain's one-token items, top 10), the unedited / S / whole-change reads on the 8 scenes ("switches a handful of
  items as S does"), and each unedited read alone vs in its batch (max |dlogit|, same top token). A failed smoke gets one
  hour of debugging (Dan), then stop and report.
controls:
- 'the torch Mamba path (BJ_NO_KERNELS=1) for the hub kernels'
- 'a zero patch at the bridge word for the patch hook (exact)'
- 'the changed prompt (S) itself for the write and for the whole change''s answer'
- 'the unedited read alone (a batch of 1) for the batched read'
n: '32 WikiText rows (kernels); all scenes of d1_topics_v3 per design for the counts and the read gate (600 generated; 516 two-people-swap, 559 clean on the tokenizer); the first 8 scenes per design, 2 readers, for the mechanics and the end-to-end runs'
seeds: [24, 4513, 0, 888]
notes: "DRAFT, NOT QUEUED (Dan 27 Oct ~15:00). Blocked on Zach: (1) his Lightning J++ file on the box at ~/bridge-jspace/cache/nemotron-3.5-lightning/lenses/jpp/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16_jpp_lens.pt (sha256 3306b6e4f0f4ba039cde5f902aeb3ef6ae8b775a7abc1b999f6cbc0b7d534f44; pins' source is 'local', no Hub copy); (2) the mamba-ssm commit his Lightning runs loaded (set to pins.py's recorded 28017f36 without waiting, Dan ~16:00: we do not wait for Zach; the smoke stops if the loaded commit differs) (pins.py's Bolt entry names kernels-community/mamba-ssm@28017f36635a6b94d911333812beeed5dd901ac0 as 'the revision transformers fetched for Lightning'; Zach confirms). jobq validate refuses this spec until the placeholder is replaced; x45s_a / x45s_b carry no placeholder and validate now, but depend on this job. Why a check and not a pin: transformers 5.17 maps Lightning's mamba-ssm by major version (kernels-community/mamba-ssm, version 2), resolved at load, so the smoke reads the commit it actually loaded and stops on a mismatch; both runs record their own loaded hub kernels in gate.json, and the sealed verdict flags a run whose commit is not the smoke's. Settings as pinned (Zach's): use_kernels, sdpa attention, no BOS, thinking off through the chat template, norm_f with a plain weight gain; nothing re-tuned. One H100 80 GB: weights ~63 GB bf16 (31.6B parameters from config.json); this job's peak memory decides whether a and b keep one GPU (else BJ_DEVICE_MAP=auto on two, Dan's call). Batching (Zach found Lightning deterministic at fixed eligibility and batching, amendment 56 B): BJ_SUITE_BATCH=16 (his Lightning value), recorded in every manifest's switches; the row and item order in every x0_necessity manifest ('order') and the scenes read in order in gate.json. With one layer and J++ only, a read batch holds 4 rows (none, whole, no J++, no random part), so any batch >= 4 gives the same composition. The two 8-scene runs repeat the competence pass the sealed runs make (on purpose: the gate on all scenes, through the production path, before a and b spend). Seeds: 24 the set, 4513 the clean design's draws, 0 bootstrap and examples, 888 + layer the random subspace. Cost (timing ledger, sesterce-h100x2, H100 PCIe; the 45r spec's linear model: x45m_muse_q2 0.211 h for 3,272 reads with competence on 565 scenes, muse_depth 0.293 h for 23,200 reads on 530; so 4.1e-6 h per read and 0.198 h fixed for the load and competence): the two 8-scene runs 2 x (0.198 + 64 x 4.1e-6) = 0.40 h; three more loads (kernel_nll x2, smoke) ~0.05 h each = 0.15 h; the torch-path NLL on 32 rows and the smoke's mechanics on 16 scenes < 0.05 h; total ~0.6 h at Muse's speed, est 0.75 with margin. Not counted: the download of ~63 GB (fetch; GPU idle, minutes, unmeasured on this box). Zach's same-task runs had Lightning at 0.42-0.55x Muse's time per row, so it is likely faster."
