  Descriptive, after the data. (1) As x0_jppother (each part against a random part of its own share; cluster bootstrap over bridge entities, 10,000 resamples, seed 0). (2) As x6_routes_early_r2: the C0 check descriptive (stop only below 0.50), no pointer arms (the pointer directions exist at L33 only); the early layer is L27, the 122B's peak of the lookup's J++ extra loss among the layers measured (24-36; F2: 0.56 at L27). (3) As x6_routes_bothoff. (2) and (3) use x6_routes' scenes, where the 122B's recall read 0.797 of the original prompts right: the read-accuracy gate is lowered to 0.75 for both, after the data, as Dan set for the 122B routes rerun.
