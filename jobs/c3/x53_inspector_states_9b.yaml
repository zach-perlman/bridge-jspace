id: x53_inspector_states_9b
title: "Batch 53, J-space inspector states (Dan 11:45, inspector_1145 item 1) on the 9B: residual states O / S at every layer at the seed-29 review sample's tokens, the change's 25 atoms and random part per layer, the rank check's Δ and parts at L for every conflict / routes item; read-only, no rule"
thread: C3
gpus: 1
mem_gb: 30
est_gpu_hours: 0.1
depends_on: []
command: >-
  export BJ_TARGET=qwen3.5-9b BJ_DEVICE_MAP= PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  uv run python scripts/review_states.py run --name qwen35_9b_review_states
question: >-
  None (inputs for the review dashboard's "Look into J-space" panel): the 9B's residual states at the bridge word, the
  locker-sentence mentions, the asked pick sentence, the question and the last token of each seed-29 sample item's O and
  S prompts, every layer; and, at L12 and the bridge word, the J++ part / rest / random part of Δ for every item of the
  conflict test and the routes test with the readouts' ranks of S's bridge word and the answers.
why_it_matters: >-
  Dan 11:45 (jobs/c3/batch53.yaml inspector_1145): tomorrow's hand check reads what the J-space readout shows on the
  items he marks, with the experiments' own lens and OMP; item 3's automatic rank check needs Δ at L for every item.
hypotheses:
  none: "no prediction (a read-only state dump and a check; no rule)"
decision_rule: >-
  None: no verdict. Dan 11:45 (inspector_1145), verbatim: "States (GPU, once, small): for every item in the seed-29
  review sample (all tier-1 views, all models incl. Lightning and the 122B), save the residual states, O and S, at
  every layer, at these tokens: the bridge word; every item's mention in the locker sentences; the pick sentence; the
  question's tokens; the last token. fp16 npz under cache/review_states/<model>/<view>/." Item 3 (a check, no rule
  change) is scored on the CPU from rank_check.jsonl: "the rank of S's bridge token (and its variants) in the readout of
  the J++ part, of the rest and of a random part of the same share; the share of items with it in the top 50 for each.
  Flag if the rest puts it in the top 50 on >= 20% of items more often than the random part does. The same for the
  answer words." As computed (scripts/review_states.py): the sample is docs/review_views.yaml's fixed_sample (seed 29)
  for this model; the change's part = x52_atoms.omp_atoms (x0_necessity.fit step for step, K = 25, J++ letter atoms);
  the random part = statement_positions.random_subspace_part at the part's share, basis seed 888 + layer (CPU QR at L).
controls:
- "the rank check's J++ share against the runs' stored shares (shares.jsonl / norms.jsonl), per item (checks.json)"
- "omp_atoms against x0_necessity.fit at L (checks.json)"
- "GPU calibration readouts (J++ and logit lens) of 5 items for the CPU panel's parity test (calib.jsonl)"
n: "the fixed seed-29 sample's 9B items (21 over 7 views); rank check: 200 conflict-test scenes + 900 routes scenes"
seeds: [29, 888]
notes: >-
  Batch 53, inspector_1145 item 1 (and item 3's Δ). Writes results/review_states/qwen35_9b_review_states/ (manifest
  before the model, plan, checks, rank_check.jsonl, calib.jsonl) and cache/review_states/qwen3.5-9b/ (states ~0.3 GB,
  head ~2 GB, rank/*.npz; gitignored: pull with rsync -a <box>:bridge-jspace/cache/review_states/qwen3.5-9b/
  cache/review_states/qwen3.5-9b/). Run only on an idle GPU. Estimate from the ledger: x52_read_main_9b 85 s for 800
  forwards with the load, x52_atoms_9b 98 s; here ~2,250 forwards (21 x 2 at every layer, 1,100 x 2 at L) and 31 layers
  of OMP on ~410 rows: ~4-5 min wall, entered as 0.1 GPU-h.
