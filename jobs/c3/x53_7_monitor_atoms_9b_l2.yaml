id: x53_7_monitor_atoms_9b_l2
title: "Batch 53, 53.7: 53.2's fixed J++ arm beside 53.7's monitor (code / tool) on the 9B: the atoms' J++ lens vectors for the forward run qwen35_9b_x53_7_monitor_l2 (into results/x53_monitor/qwen35_9b_x53_7_monitor_l2_atoms/); the probes run on CPU; no prediction"
thread: C3
gpus: 1
mem_gb: 40
est_gpu_hours: 0.05
depends_on: [x53_7_monitor_9b_l2]
command: >-
  export BJ_TARGET=qwen3.5-9b BJ_DEVICE_MAP= PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  uv run python scripts/x53_7.py monitor-atoms --source qwen35_9b_x53_7_monitor_l2
question: "Beside 53.7's monitor (code / tool)'s verdict: does a fixed J++ subspace (the k atoms most frequent on the training folds) decode (a)-(d) like the per-state J++ part? This job only provides the atoms' vectors (lens maps and W_U are on the box only); the probes run on CPU."
why_it_matters: "Dan 11:25 (jobs/c3/batch53.yaml critic_1125) for 53.2, before scoring: 'Add a fixed J++ subspace (the k atoms most frequent on the training folds) and an energy-matched random subspace beside the current ones.' The coordinator (~12:15): the same arms beside 53.7's monitor verdicts; Dan's energy-confound point applies equally there."
hypotheses:
  none: "no prediction (batch 53, 53.7; UNVERIFIED)"
decision_rule: "None in this job (it records vectors). Beside the verdict, as 53.2 (scripts/x53_monitor.py RULE_ARMS): the rule with J++ replaced by the fixed J++ subspace ('fixed_') and the per-state J++ part against the energy-matched random subspace ('erand_'); the decisive label stays the per-state J++ part against a random subspace of the same k."
controls:
- "the atoms are exactly those the fixed pass looks up (x53_monitor.needed_atom_ids over the run's own folds, seeds, row sets and k)"
n: "the forward run's recorded datasets (manifest sets_done); every second layer"
seeds: [0, 1, 2, 3, 4]
notes: >-
  Batch 53, 53.7 (Dan 11:10; arms beside per critic_1125); no prediction; UNVERIFIED; rule verbatim from 53.2
  (RULE_ARMS beside the decisive arm). Depends on x53_7_monitor_9b on the same box: the forward run
  results/x53_monitor/qwen35_9b_x53_7_monitor_l2/ (cases_<set>.jsonl, states_<set>_atoms.npy, manifest) must be in this checkout; the
  command fails loudly otherwise ("the monitor run is not in this checkout") and if the run has not finished. The atom
  ids are computed here from the run (x53_7.monitor_atom_ids = x53_monitor.needed_atom_ids, the code 53.2's atom-ids
  stage runs on the Mac), so no Mac step comes first; if every format failed its gate there are no states and the job
  writes only the manifest and an empty fixed_atom_ids.json. Writes results/x53_monitor/qwen35_9b_x53_7_monitor_l2_atoms/
  (fixed_atom_ids.json committed, fixed_atoms_<set>.npz gitignored, as 53.2's). After the pull, on the Mac (nice, after
  53.2's CPU work): `x53_monitor.py probe --name qwen35_9b_x53_7_monitor_l2 --sets <code_l,tool_l: the datasets that passed> --pass erand` and `--pass fixed`
  (the base pass first), then the verdict (x53_7.py monitor-verdict). Estimate: as 53.2's atoms jobs (~0.05 GPU-h: one model load and
  the lens vectors of a few hundred atoms per layer).
