id: x52_lightning_layer_r2
title: "Batch 52 C, Lightning prerequisite r2 (before any scored run): the main test's gate verbatim (X0's: 0.80 per reader on all main-test scenes, >= 150 eligible) decides, the 60-scene gate reported beside as a failed pre-check; the whole change at the bridge word on 60 dev scenes at every 4th layer L2-L50; the layer by amendment 1 (the earliest layer where both readers switch >= 0.3 at relative depth >= 0.25; tie-break the bridge word's lens readability, recorded per layer); every swept layer's status in layer.json; no step 2, no verdict"
thread: C3
gpus: 1
mem_gb: 78
est_gpu_hours: 0.3
depends_on: []
command: >-
  export BJ_TARGET=nemotron-3.5-lightning BJ_DEVICE_MAP= BJ_SUITE_BATCH=16 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  uv run python scripts/x51_lightning.py prereq --gate main --name nem35l_x52_layer_r2 --why "Batch 52 part C (jobs/c3/batch52.yaml), Lightning's prerequisite r2: the main test's gate verbatim decides (coordinator for Dan, 29 Oct ~01:10 Paris, flagged at 02:00, reversible; r1 nem35l_x52_layer failed the 60-scene gate: lookup 0.883, recall 0.783; X0's gate on all 516 scenes passed 0.957 / 0.816), then the layer by amendment 1 (Dan ~00:50, before any sweep: the earliest layer passing at relative depth >= 0.25, tie-break the bridge word's lens readability), every 4th layer L2-L50, 60 dev scenes; no prediction: a design choice, committed before any scored run"
question: >-
  On NVIDIA Nemotron 3.5 Lightning 30B-A3B, at which layer of the every-4th sweep (L2-L50) at relative depth >= 0.25
  (L14 on) does the bridge word's whole change first switch both readers >= 0.3 on 60 dev scenes, given the main
  test's own gate? That layer is L for every Lightning coverage cell of batch 52.
why_it_matters: >-
  r1 (results/x51_lightning/nem35l_x52_layer, committed eea66c89) stopped at the 60-scene pre-check (recall 0.783 <
  0.80) although the main test's gate, the one applied to every other model, passed on all scenes (0.957 / 0.816), and
  swept nothing. Dan then fixed the pick rule (amendment 1) before any sweep ran. The coverage chain needs the layer.
hypotheses:
  none: "No prediction (batch 52 addendum): the layer is a design choice fixed by the published rule, not a forecast."
decision_rule: >-
  Fixed in advance. jobs/c3/batch52.yaml part C (Dan's words, verbatim): "Prerequisites for a new family (Lightning,
  Bolt), before any real run: the J++ lens file exists (report its sha and band); the weights load on the box; the gate
  passes on 60 main-test scenes; the layer is fixed by the published rule (earliest layer where both readers switch
  >= 0.3, sweeping every 4th layer) and committed before the main runs. ... No layer passes -> report "the bridge word
  does not redirect the lookup at any layer on this model" and cancel the column; that is a result."
  jobs/c3/batch52.yaml amendment_1 (Dan, 29 Oct ~00:50 Paris, recorded before any sweep ran), verbatim: "earliest layer
  passing the gate at relative depth >= 0.25; tie-break = highest lens readability of the bridge word. ... The report
  must show the conflict result at every swept layer, not only the chosen one." The gate (coordinator for Dan, 29 Oct
  ~01:10 Paris, to be flagged to Dan at 02:00, reversible; not Dan's words): the main test's gate verbatim (X0's,
  jobs/c3/x0_necessity_27b_chat.yaml: unedited org accuracy under the top-token read >= 0.80 for both readers on all
  scenes, >= 150 eligible), as applied to every other model; the gate on the first 60 main-test scenes reported beside
  as a pre-check (failed in r1: lookup 0.883, recall 0.783). As computed (fixed by the agent before any run): dev =
  51.6's split, random.Random(0).sample of 60 of X0's eligible scenes (kept in scene order); test = the first 200
  eligible not in dev (recorded for the coverage runs, not read here); swept layers every 4th L2, L6, ..., L50 (13); at
  each, the whole Delta_l = h_S - h_O added at the bridge word on O, both readers, X0's chat read; "passing" = both
  readers' switch rates >= 0.3 (point estimates on the 60 dev scenes, EPS 1e-9); relative depth = l / 52 (>= 0.25 means
  l >= 13: candidates L14, L18, ..., L50); the layer = the earliest passing candidate; "lens readability of the bridge
  word" = the J++ lens readout (lens.readout, full vocabulary) at the bridge word of O's and of S's lookup prompt, each
  scored on its own bridge token, unedited: the share of the 120 rows whose bridge token is the lens's top-1 (then the
  lower median rank), recorded per swept layer with the top-5 share; swept layers are distinct, so 'earliest' leaves no
  tie and the tie-break cannot act (recorded, not used; flagged). No passing candidate: "the bridge word does not
  redirect the lookup at any layer on Lightning at relative depth >= 0.25" and the column is cancelled. layer.json
  records, per swept layer: both readers' rates with cluster-bootstrap CIs over the bridge items (10,000, seed 0),
  passes / deep enough / candidate, and the readability. The conflict result at every swept layer is the conflict-test
  run's (x52_lightning_conflict: X0's three arms at all 13 layers), not this sweep. Code: scripts/x51_lightning.py
  prereq --gate main (gate_passes, readability, pick_layer_a1, layer_record).
controls:
- "the 60-scene gate (r1's prerequisite reading) reported beside as a pre-check"
- "the unedited row per dev scene and reader"
- "dev scenes only: the coverage runs' test scenes are disjoint and are not read here"
- "every swept layer's rates, passing status and lens readability recorded, not only the pick"
- "the mamba-ssm hub kernel the load used, against the 45s smoke's verified commit 28017f36 (gate.json)"
n: "516 main-test scenes made; X0's gate on all of them (r1: lookup 0.957, recall 0.816, pass); dev 60, test 200 (51.6's split)"
seeds: [0, 24]
notes: "Batch 52 part C, box speedup, first free slot (the coordinator: after three short atom forwards). Same box checks as r1 (lens sha 3306b6e4 = pin, maps L0-50; snapshot a9904d24 14/14 shards); r1 loaded the weights and ran competence on all 516 scenes on speedup, so 'the weights load on the box' passed there. Run name nem35l_x52_layer_r2; x51_lightning.LAYER_RUN = nem35l_x52_layer_r2 is the run whose committed layer.json the coverage chain reads (x51_lightning.py layer prints it; refuses until it is committed at HEAD and has a layer). AFTER THE JOB: pull and commit results/x51_lightning/nem35l_x52_layer_r2/; then the Lightning conflict test first on speedup (it preempts everything there, amendment 1). Readability adds 120 unedited forwards recording 13 layers and 13 x 120 lens readouts (vocab 131k): seconds. Estimate as r1 plus the sweep (60 x 2 x 14 reads + 240 forwards): ~0.25 h; est 0.3."
