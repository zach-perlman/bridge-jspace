id: olmo3_7b_instruct_d2_natural_read
title: "The late read in real paragraphs (OLMo-3-7B-Instruct): the answer's sentence of a SQuAD paragraph hidden from the last tokens"
thread: D2
gpus: 1
mem_gb: 30
est_gpu_hours: 0.2
depends_on: []
command: >-
  BJ_TARGET=olmo-3-7b-instruct uv run python scripts/natural_read.py manifest --name olmo3_7b_instruct_natural_competence
  --why "finding 4 on natural text (Dan, 23 Oct): which SQuAD items the model answers from the paragraph, from the answer's sentence alone, not without it, and not after another article's paragraph"
  && BJ_TARGET=olmo-3-7b-instruct uv run python scripts/natural_read.py competence --name olmo3_7b_instruct_natural_competence
  && BJ_TARGET=olmo-3-7b-instruct uv run python scripts/attn_knockout.py manifest --name olmo3_7b_instruct_d2_natural_read
  --dataset natural_read_v1 --n 718 --sources lookup lookup_off --dests final question after --layers all --sweep path
  --sweep-dests final --competence olmo3_7b_instruct_natural_competence
  --why "finding 4 on natural text (Dan, 23 Oct; amended before any run): the sentence holding the answer of a SQuAD paragraph hidden from the last tokens in every layer (all attention), against another sentence of the paragraph; every eligible item"
  && BJ_TARGET=olmo-3-7b-instruct uv run python scripts/attn_knockout.py run --name olmo3_7b_instruct_d2_natural_read
figures_command: >-
  BJ_TARGET=olmo-3-7b-instruct uv run python scripts/attn_knockout.py summarise --name olmo3_7b_instruct_d2_natural_read
  && BJ_TARGET=olmo-3-7b-instruct uv run python scripts/natural_read.py verdict --run olmo3_7b_instruct_d2_natural_read --competence olmo3_7b_instruct_natural_competence
question: >-
  In a real Wikipedia paragraph, when the last tokens before the answer cannot attend to the sentence that holds the
  answer, does the model still answer?
why_it_matters: >-
  Finding 4 rests on synthetic lists (and neutral filler). In natural text the answer's sentence is linked to its
  neighbours (pronouns, topic), the question shares words with it, and the question words could read it and pass the
  answer on. If the last tokens still have to read the sentence themselves, the late read is how lookups work in text,
  not an artefact of lists. OLMo-3-7B-Instruct: another family, softmax attention in every layer (sliding windows of
  4096, longer than every prompt here), 7 template tokens after the user turn.
hypotheses:
  H-late-natural: 'the primary rule holds: hidden from the last tokens in every layer, <= 10% right (upper bound <= 20%); another sentence hidden there keeps >= 90%'
  H-late-near-floor: 'the primary bar fails but finding 4''s bar holds (<= 20% right, upper bound <= 30%): most answers need the late read, a few survive another way'
  H-relay: 'more than 20% right with the sentence hidden from the last tokens while hidden from every later token leaves <= 10%: other positions (the question words, later sentences) read it and pass the answer on'
decision_rule: >-
  Fixed 2026-10-23 before any run and amended by Dan on 23 Oct, before any run (docs/depth/notes/design_natural_late_read.md;
  scripts/natural_read.py judge, BARS); the rule of qwen36_27b_d2_natural_read without its DeltaNet clause (this model
  has none). Items: data/natural_read_v1 (SQuAD v1.1 dev, one question per paragraph, 718). The knockout run takes
  every item the competence run makes eligible, no cap: the answer's first token has 3+ characters or is its whole
  first word; with the paragraph, the answer's first token is on top and the greedy answer is right; with the
  answer's sentence alone, the first token is on top; with the paragraph without that sentence, it is not. Counted if
  right unedited in the knockout run. PRIMARY verdict: holds iff the answer's sentence hidden from the last tokens
  (every token after the user turn: the template and 'Answer:') in every layer leaves <= 10% right with the Wilson
  upper bound <= 0.20, AND the item's off-path sentence (two or more sentences away, character length within
  0.75-1.33 of the answer's) hidden there keeps >= 90% right with the Wilson lower bound >= 0.85. SECONDARY verdict
  (finding 4's bar, for comparability): the same with <= 20% right and the upper bound <= 0.30. Both verdicts: not
  interpretable if the answer's sentence hidden from every later token in every layer leaves > 10% right, or if the
  off-path control fails; not testable with fewer than 100 items right unedited. Reported, not decisive: built ->
  eligible with the items each criterion drops (answers that need a neighbouring sentence, e.g. a pronoun's
  antecedent, are not covered); hidden from the question words; the question after another article's paragraph
  (unedited); the blocked answers scored against another item's answer; an article-cluster bootstrap interval of the
  decisive cell.
controls:
- 'another sentence of the same paragraph, of about the same length, two or more sentences from the answer, hidden the same way'
- 'floor: the answer''s sentence hidden from every later token in every layer'
- 'baselines: the question after another article''s paragraph (unedited); the blocked answers scored against another item''s answer'
n: 'every eligible SQuAD item, no cap (718 built, 628 after the per-tokenizer filter; >= 100 right unedited to be testable)'
seeds: [0]
notes: "Dan, 2026-10-23: finding 4 on natural text, lens-free. Amended by Dan 23 Oct, before any run: primary bar 10% / 20% (the floor here is ~0, not 20% chance), finding 4's 20% / 30% reported as secondary; every eligible item (no cap at 200); eligibility kept, with the funnel reported; the another-article control kept as built; HotpotQA not before 30 Oct. Data: data/natural_read_v1/items.json (SQuAD v1.1 dev, CC BY-SA 4.0). CPU dry run on this tokenizer: 718 items, 628 after the short-first-token filter, full prompts 132-377 tokens (median 223; the template adds a system turn), the last tokens = 7 template tokens. Rows: 6 knocked reads per item. No priors set by the agent; not opened before Dan predicts."
