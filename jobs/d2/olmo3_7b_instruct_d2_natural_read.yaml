id: olmo3_7b_instruct_d2_natural_read
title: "The late read in real paragraphs (OLMo-3-7B-Instruct): the answer's sentence of a SQuAD paragraph hidden from the last tokens"
thread: D2
gpus: 1
mem_gb: 30
est_gpu_hours: 0.15
depends_on: []
command: >-
  BJ_TARGET=olmo-3-7b-instruct uv run python scripts/natural_read.py manifest --name olmo3_7b_instruct_natural_competence
  --why "finding 4 on natural text (Dan, 23 Oct): which SQuAD items the model answers from the paragraph, from the answer's sentence alone, not without it, and not after another article's paragraph"
  && BJ_TARGET=olmo-3-7b-instruct uv run python scripts/natural_read.py competence --name olmo3_7b_instruct_natural_competence
  && BJ_TARGET=olmo-3-7b-instruct uv run python scripts/attn_knockout.py manifest --name olmo3_7b_instruct_d2_natural_read
  --dataset natural_read_v1 --n 200 --sources lookup lookup_off --dests final question after --layers all --sweep path
  --sweep-dests final --competence olmo3_7b_instruct_natural_competence
  --why "finding 4 on natural text (Dan, 23 Oct): the sentence holding the answer of a SQuAD paragraph hidden from the last tokens in every layer (all attention), against another sentence of the paragraph"
  && BJ_TARGET=olmo-3-7b-instruct uv run python scripts/attn_knockout.py run --name olmo3_7b_instruct_d2_natural_read
figures_command: >-
  BJ_TARGET=olmo-3-7b-instruct uv run python scripts/attn_knockout.py summarise --name olmo3_7b_instruct_d2_natural_read
  && BJ_TARGET=olmo-3-7b-instruct uv run python scripts/natural_read.py verdict --run olmo3_7b_instruct_d2_natural_read --competence olmo3_7b_instruct_natural_competence
question: >-
  In a real Wikipedia paragraph, when the last tokens before the answer cannot attend to the sentence that holds the
  answer, does the model still answer?
why_it_matters: >-
  Finding 4 rests on synthetic lists (and neutral filler). In natural text the answer's sentence is linked to its
  neighbours (pronouns, topic), the question shares words with it, and the question words could read it and pass the
  answer on. If the last tokens still have to read the sentence themselves, the late read is how lookups work in text,
  not an artefact of lists. OLMo-3-7B-Instruct: another family, softmax attention in every layer (sliding windows of
  4096, longer than every prompt here), 7 template tokens after the user turn.
hypotheses:
  H-late-natural: 'the rule holds: hidden from the last tokens in every layer, <= 20% right (upper bound <= 30%); another sentence hidden there keeps >= 90%'
  H-relay: 'more than 20% right with the sentence hidden from the last tokens while hidden from every later token leaves <= 10%: other positions (the question words, later sentences) read it and pass the answer on'
decision_rule: >-
  Fixed 2026-10-23 before any run (docs/design_natural_late_read.md; scripts/natural_read.py judge), the rule of
  qwen36_27b_d2_natural_read without its DeltaNet clause (this model has none). Items: data/natural_read_v1 (SQuAD
  v1.1 dev, one question per paragraph, 718), eligible by the competence run (full paragraph: the answer's first token
  on top and the greedy answer right; the answer's sentence alone: first token right; the paragraph without that
  sentence: first token wrong), the answer's first token >= 3 characters or its whole first word; the first 200 in the
  file's seeded order (all if fewer); counted if right unedited in the knockout run. Holds iff the answer's sentence
  hidden from the last tokens (every token after the user turn: the template and 'Answer:') in every layer leaves <= 20%
  right with the Wilson upper bound <= 0.30, and the item's off-path sentence (two or more sentences away, character
  length within 0.75-1.33 of the answer's) hidden there keeps >= 90% right (Wilson lower bound >= 0.85). Not
  interpretable if the answer's sentence hidden from every later token in every layer leaves > 10% right, or the
  off-path control fails. Not testable with fewer than 100 items right unedited. Reported, not decisive: hidden from
  the question words; the question after another article's paragraph (unedited); the blocked answers scored against
  another item's answer; an article-cluster bootstrap interval of the decisive cell.
controls:
- 'another sentence of the same paragraph, of about the same length, two or more sentences from the answer, hidden the same way'
- 'floor: the answer''s sentence hidden from every later token in every layer'
- 'baselines: the question after another article''s paragraph (unedited); the blocked answers scored against another item''s answer'
n: '200 eligible SQuAD items (one per paragraph; fewer if fewer are eligible, >= 100 to be testable)'
seeds: [0]
notes: "Dan, 2026-10-23: finding 4 on natural text, lens-free. Data: data/natural_read_v1/items.json (SQuAD v1.1 dev, CC BY-SA 4.0). CPU dry run on this tokenizer: 718 items, 628 after the short-first-token filter, full prompts 132-377 tokens (median 223; the template adds a system turn), the last tokens = 7 template tokens. Rows: 6 knocked reads per item. No priors set by the agent; not opened before Dan predicts."
