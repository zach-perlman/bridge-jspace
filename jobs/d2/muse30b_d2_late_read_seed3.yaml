  H-late: 'holds. Prior 0.75 (copied from muse30b_d2_late_read_seed2)'
decision_rule: >-
  The late-read rule of the seed2 runs, unchanged: memory -> prompt, topics pooled, items right unedited; holds iff the answer's statement hidden from the last tokens in every layer leaves <= 20% right with the Wilson upper bound <= 0.30 and the off-path statement keeps >= 90% (lower bound >= 0.85); at chance reported as such (as Gemma).
controls:
- 'as the same test on the other models'
n: '100 memory -> prompt items'
