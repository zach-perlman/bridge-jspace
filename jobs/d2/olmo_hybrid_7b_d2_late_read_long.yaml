id: olmo_hybrid_7b_d2_late_read_long
title: "The late read with ~2000 filler tokens (Olmo-Hybrid-7B Instruct; attention vs DeltaNet layers)"
thread: D2
gpus: 1
mem_gb: 50
est_gpu_hours: 0.8
depends_on:
- olmo_hybrid_7b_port_smoke
command: >-
  BJ_TARGET=olmo-hybrid-7b-instruct-dpo BJ_JUDGE=read uv run python scripts/pointer_v4.py manifest --set long --name olmo_hybrid_7b_d3v4_long_competence --why "the long set" && BJ_TARGET=olmo-hybrid-7b-instruct-dpo BJ_JUDGE=read BJ_GEN_BATCH=16 uv run python scripts/pointer_v4.py competence --name olmo_hybrid_7b_d3v4_long_competence && BJ_TARGET=olmo-hybrid-7b-instruct-dpo PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True BJ_BATCH=8 uv run python scripts/attn_knockout.py manifest --name olmo_hybrid_7b_d2_late_read_long --dataset pointer_v4 --set long --families RL --n 100 --sources lookup lookup_off --dests final question --layers all kind --sweep path --gate-lo 0.80 --competence olmo_hybrid_7b_d3v4_long_competence --why "finding 4 with a long context (Olmo-Hybrid-7B Instruct): the answer's statement hidden from the last tokens in every attention layer, or in every DeltaNet layer instead" && BJ_TARGET=olmo-hybrid-7b-instruct-dpo PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True BJ_BATCH=8 uv run python scripts/attn_knockout.py run --name olmo_hybrid_7b_d2_late_read_long
figures_command: BJ_TARGET=olmo-hybrid-7b-instruct-dpo uv run python scripts/attn_knockout.py summarise --name olmo_hybrid_7b_d2_late_read_long
question: >-
  With ~2000 tokens between the list and the question, is the read still late, through the last tokens' attention?
why_it_matters: >-
  Finding 4 on short prompts only, except Qwen3.5-9B (holds with the long context). On a hybrid the outside review's
  boring explanation (with ~100-token prompts attention suffices, so the DeltaNet layers play no part) is tested
  directly.
hypotheses:
  H-late-long: 'replicates. Prior 0.75 (copied from olmo3_7b_instruct_d2_late_read_long_r2_q)'
decision_rule: >-
  The late-read rule of the seed2 runs, unchanged; on this hybrid in olmo_hybrid_7b_d2_late_read_seed2's wording:
  memory -> prompt, topics pooled, items right unedited; holds iff the answer's statement hidden from the last tokens
  in every attention layer leaves <= 20% right with the Wilson upper bound <= 0.30, the off-path statement hidden there
  keeps >= 90% (lower bound >= 0.85), and hidden in every DeltaNet layer instead keeps >= 90% right. Competence gate
  0.80 (declared).
controls:
- 'the off-path statement hidden the same way; the DeltaNet layers instead of the attention layers; the same scenes without filler (the seed2 run, olmo_hybrid_7b_d2_late_read_seed2)'
n: '100 memory -> prompt items of pointer_v4 long'
seeds: [0]
notes: 'Mechanical copy of olmo3_7b_instruct_d2_late_read_long_r2_q incl. its competence step (Dan, 23 Oct ~01:30: fill the grid); not opened before Dan''s predictions. Target and run names change (id without the source''s requeue suffix _r2_q); read judge, BJ_GEN_BATCH=16, BJ_BATCH=8 and the 0.80 gate as the source. Layers "all kind" in place of OLMo-3''s "all": this model''s own committed late-read set (olmo_hybrid_7b_d2_late_read_seed2) and the other hybrid''s long run (qwen35_9b_d2_late_read_long), so the rule''s attention / DeltaNet arms exist. mem_gb 50 (not the source''s 30): qwen35_9b_d2_late_read_long peaked at 48 GB on these ~2100-token prompts (batch 16); not a lens claim.'
