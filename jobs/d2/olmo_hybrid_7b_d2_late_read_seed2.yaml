question: >-
  Hidden from the last tokens in every attention layer, does the answer's statement leave the model guessing, while
  hidden in every DeltaNet layer instead it does not?
why_it_matters: >-
  Zach's C1 holds only on the DeltaNet hybrids; Dan's late read is attention-only on the 27B; Olmo-Hybrid vs
  OLMo-3-7B separates architecture from family.
hypotheses:
  H-late-attn: 'the answer''s statement hidden from the last tokens in every attention layer (8 of 32) leaves <= 20%
    right (Wilson upper bound <= 0.30). Prior 0.75'
  H-late-gdn-spared: 'hidden in every DeltaNet layer (24 of 32) instead keeps >= 90% right. Prior 0.55'
decision_rule: >-
  Fixed 2026-10-22 for the 27B and Qwen3-32B, unchanged (the Qwen hybrids' wording): memory -> prompt, topics pooled,
  items right unedited. Holds iff the answer's statement hidden from the last tokens in every attention layer leaves
  <= 20% right with the Wilson upper bound <= 0.30, the off-path statement hidden there keeps >= 90% (lower bound
  >= 0.85), and hidden in every DeltaNet layer instead keeps >= 90% right.
controls:
- 'the off-path statement of the same token length hidden the same way; unedited accuracy; the competence gate (every prompt of the scene right)'
- 'the run''s own pre-run check (attn_knockout run_check): empty-source no-op exact, mode-absent positive control (the last token reads nothing), the DeltaNet kernel against the torch reference'
n: '100 items per family (RL), seed2'
