id: muse30b_d2_late_read_long
title: "Muse Glimmer 30B: the late read with ~2000 filler tokens"
thread: D2
gpus: 1
mem_gb: 75
est_gpu_hours: 0.8
depends_on:
- muse30b_competence
command: >-
  BJ_TARGET=muse-glimmer-30b PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True BJ_BATCH=4 uv run python scripts/attn_knockout.py manifest --name muse30b_d2_late_read_long --dataset pointer_v4 --set long --families RL --n 100 --sources lookup lookup_off --dests final question --layers all --sweep path --gate-lo 0.80 --competence muse30b_d3v4_competence --why "finding 4 with a long context on Muse" && BJ_TARGET=muse-glimmer-30b PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True BJ_BATCH=4 uv run python scripts/attn_knockout.py run --name muse30b_d2_late_read_long
figures_command: BJ_TARGET=muse-glimmer-30b uv run python scripts/attn_knockout.py summarise --name muse30b_d2_late_read_long
question: >-
  With ~2000 tokens between the list and the question, is the read still late?
why_it_matters: >-
  A sixth model from another lab (Meta), with every test the other five have, so the cross-model table has no gaps.
hypotheses:
  H-late-long: 'Prior 0.7'
decision_rule: >-
  The late-read rule of the seed2 runs, unchanged: memory -> prompt, topics pooled, items right unedited; holds iff the answer's statement hidden from the last tokens in every layer leaves <= 20% right with the Wilson upper bound <= 0.30 and the off-path statement keeps >= 90% (lower bound >= 0.85); at chance reported as such (as Gemma). Competence gate 0.80 (declared). Muse's sliding window is 2048 tokens: the statements stay within reach of every layer only just; full-attention layers (every 4th) see them regardless.
controls:
- 'as the same test on the other models'
n: '100 memory -> prompt items'
seeds: [841, 844]
notes: "Dan, 22 Oct night: Muse Glimmer 30B (Meta) as a sixth model, every experiment, the rules copied unchanged from the other models; layers by the fixed rules or the 27B's scaled by depth (x 52/64). Not opened before Dan's predictions; README and figures only after he opens the results."
