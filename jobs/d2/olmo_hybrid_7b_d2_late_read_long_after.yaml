figures_command: BJ_TARGET=olmo-hybrid-7b-instruct-dpo uv run python scripts/attn_knockout.py summarise --name olmo_hybrid_7b_d2_late_read_long_after
question: >-
  With the answer's sentence hidden from every token after it, what share of lookups stays right, and what share of
  the drop do the last tokens carry alone: (unedited - last tokens blocked) / (unedited - every token after it
  blocked)? At least 0.7?
why_it_matters: >-
  When the answer's sentence is hidden from the last tokens a few lookups stay right (Gemma; the 27B with a long
  text). The block of every token after the sentence is the floor that says how much of the drop the last tokens carry
  alone (Dan, 23 Oct; batch 20).
hypotheses:
  H-last-tokens: 'the share >= 0.70 and the rule holds. Dan predicts in batch 20 (Q20.8-Q20.10); no agent prior'
  H-relay: 'the share < 0.70: tokens between the sentence and the last tokens carry part of the read. Dan predicts in batch 20; no agent prior'
decision_rule: >-
  Fixed 23 Oct before this run (late-read-v2, Dan): memory -> prompt, pooled over topics, items right unedited. The
  last tokens' share of the drop = (unedited - the answer's sentence hidden from the last tokens) / (unedited - hidden
  from every token after it); the relay = the first block's share right minus the second's. Holds iff the share >=
  0.70, hidden from every token after it leaves <= 10% right with the Wilson upper bound <= 15% (the floor), the
  off-path sentence hidden at the same places keeps >= 90% at both, and on a hybrid the answer's sentence hidden in
  every DeltaNet layer instead keeps >= 90%. The last tokens are blocked as in the late read (every attention layer on
  a hybrid, every layer otherwise); every token after the sentence in every attention layer (decisive here); blocked
  in all layers too, reported for comparison with the first scene set's runs, where it is a conservative lower bound
  on a hybrid. A failed off-path control or a floor above its bar: not interpretable; a share below 0.70, or a
  DeltaNet block that keeps < 90%: fails. The share's 95% interval: items resampled with replacement (paired), 4000
  draws, seed 0 (scripts/cross_model_grid.py late_read_v2). The late read itself (the answer's sentence hidden from
  the last tokens leaves <= 20% right, upper bound <= 0.30, the off-path sentence keeps >= 90% with lower bound >=
  0.85, DeltaNet instead >= 90%) is re-measured on the same items and judged as before; its verdicts on the original
  runs do not change.
controls:
- 'the off-path sentence of the same token length hidden at the same places (the last tokens; every token after it)'
- 'on a hybrid: the answer''s sentence hidden in every DeltaNet layer instead'
- 'the floor itself: hidden from every token after it must leave <= 10% right (upper bound <= 15%)'
n: '100 memory -> prompt items of pointer_v4 long'
seeds: [0]
notes: 'Copy of olmo_hybrid_7b_d2_late_read_long (its n and seeds; that spec never ran) with the destination ''after'' (every token after the answer''s sentence) added last, in all layers; on this hybrid the block is also run in every attention layer alone and in every DeltaNet layer alone (--sweep-dests ... after); the attention-layer block is decisive, the all-layer one is comparable with the first scene set''s runs. final / question / both as the original; its competence run is made here under a new name (olmo_hybrid_7b_d3v4_long_competence_r2): the original long spec never ran. A full copy, not the ''after'' block alone: attn_knockout has no way to reuse another run''s rows, and one run keeps the items, the batches and the code the same for the late read and its floor. Not enqueued before Dan''s batch-20 answers are committed.'
