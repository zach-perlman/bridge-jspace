id: olmo_hybrid_7b_d2_late_read_long_after
title: 'The relay floor on a long context (Olmo-Hybrid-7B Instruct): the answer''s sentence hidden from every token after it'
thread: D2
gpus: 1
mem_gb: 50
est_gpu_hours: 1.0
depends_on: []
command: >-
  BJ_TARGET=olmo-hybrid-7b-instruct-dpo BJ_JUDGE=read uv run python scripts/pointer_v4.py manifest --set long --name
  olmo_hybrid_7b_d3v4_long_competence_r2 --why "the long set" && BJ_TARGET=olmo-hybrid-7b-instruct-dpo BJ_JUDGE=read
  BJ_GEN_BATCH=16 uv run python scripts/pointer_v4.py competence --name olmo_hybrid_7b_d3v4_long_competence_r2 &&
  BJ_TARGET=olmo-hybrid-7b-instruct-dpo PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True BJ_BATCH=8 uv run python
  scripts/attn_knockout.py manifest --name olmo_hybrid_7b_d2_late_read_long_after --dataset pointer_v4 --set long
  --families RL --n 100 --sources lookup lookup_off --dests final question after --layers all kind --sweep path
  --sweep-dests question final both after --gate-lo 0.80 --competence olmo_hybrid_7b_d3v4_long_competence_r2 --why
  "the relay floor (Olmo-Hybrid-7B Instruct, long context; Dan, 23 Oct): the answer's sentence hidden from every token
  after it, in every attention layer and in all layers, beside the last tokens" &&
  BJ_TARGET=olmo-hybrid-7b-instruct-dpo PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True BJ_BATCH=8 uv run python
