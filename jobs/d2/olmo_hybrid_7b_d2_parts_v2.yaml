id: olmo_hybrid_7b_d2_parts_v2
title: "Name vs digit: what do the question's tokens and the last tokens take from the answer's statement? (Olmo-Hybrid-7B Instruct)"
thread: D2
gpus: 1
mem_gb: 40
est_gpu_hours: 0.15
depends_on:
- olmo_hybrid_7b_port_smoke
- olmo_hybrid_7b_d3v4_competence
command: >-
  BJ_TARGET=olmo-hybrid-7b-instruct-dpo uv run python scripts/attn_knockout.py manifest --name olmo_hybrid_7b_d2_parts_v2 --dataset pointer_v4 --families RL DL --n 100
  --sources lookup lookup_off lookup_name lookup_digit lookup_off_name lookup_off_digit lookup_nodigit lookup_noname lookup_off_nodigit lookup_off_noname --dests question final --layers all --competence olmo_hybrid_7b_d3v4_competence
  --why "D2 follow-up (name vs digit) on Olmo-Hybrid-7B Instruct: hide only the entity's name or only the digit of the
  answer's statement (and of an off-path statement) from the question's tokens or from the last tokens, in every layer;
  analysed by scripts/d2_parts.py"
  && BJ_TARGET=olmo-hybrid-7b-instruct-dpo uv run python scripts/attn_knockout.py run --name olmo_hybrid_7b_d2_parts_v2
examples_command: BJ_TARGET=olmo-hybrid-7b-instruct-dpo uv run python scripts/attn_knockout.py examples --name olmo_hybrid_7b_d2_parts_v2 --k 3
figures_command: uv run python scripts/d2_parts.py --name olmo_hybrid_7b_d2_parts_v2
question: >-
  When only the entity's name, or only the digit, of the answer's statement is hidden from the question's tokens or from
  the last tokens, how many lookups stay right, and where do the wrong answers go?
why_it_matters: >-
  Finding 3's main draw on Olmo-Hybrid (same family and tokenizer as OLMo-3-7B, Gated DeltaNet in 24 of 32 layers).
  Hiding the whole statement from the question's tokens breaks lookups on Qwen3-32B, OLMo-3 and Qwen3.5-9B with
  mostly off-list answers: the question's tokens take something other than the digit choice from the statement,
  perhaps the name to resolve the bridge. The last tokens should need the digit.
hypotheses:
  H-name-q: 'where the question needs the statement at all (whole statement hidden from the question leaves <= 0.70
    right): hiding the name alone there hurts as much as the whole statement (within 0.15) and the digit alone keeps
    >= 0.85. Prior 0.55 (copied from olmo3_7b_instruct_d2_parts_v2)'
  H-digit-final: 'from the last tokens, hiding the digit alone leaves <= 0.35 right and the name alone >= 0.70. Prior 0.6 (copied from olmo3_7b_instruct_d2_parts_v2)'
decision_rule: >-
  scripts/d2_parts.py (committed before this run): memory -> prompt, topics pooled, items right unedited; valid iff the
  off-path name and digit controls keep >= 0.90 right at both destinations; question hypotheses testable iff the whole
  statement hidden from the question leaves <= 0.70 right; H-name-q, H-digit-q, H-digit-final, H-name-final as in its
  docstring. Error types (another list digit vs off the list) reported for every cell.
controls:
- 'the same parts (name, digit) of an off-path statement of the same length; the whole statement and the whole off-path statement'
n: '100 items per family, 3 topics (pointer_v4)'
seeds: [0]
notes: 'Mechanical copy of olmo3_7b_instruct_d2_parts_v2 (Dan, 23 Oct ~01:30: fill the grid); not opened before Dan''s predictions. Only the target, run / gate names change (the gate is this model''s own main-draw competence, olmo_hybrid_7b_d3v4_competence); every layer, as the source and olmo_hybrid_7b_d2_parts_seed2 (blocking in every layer covers both kinds). The second draw is olmo_hybrid_7b_d2_parts_seed2.'
