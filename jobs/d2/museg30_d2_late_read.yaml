command: >-
  BJ_TARGET=muse-glimmer-30b uv run python scripts/attn_knockout.py manifest --name museg30_d2_late_read --dataset pointer_v4 --families RL --n 100 --sources lookup lookup_off --dests final question --layers all --sweep path --competence museg30_d3v4_competence --why "finding 4 on Muse Glimmer" && BJ_TARGET=muse-glimmer-30b uv run python scripts/attn_knockout.py run --name museg30_d2_late_read
