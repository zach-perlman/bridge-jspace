id: olmo3_7b_instruct_d2_v4_late_read_v2
title: "D2 on OLMo-3-7B-Instruct: do the last tokens read the answer's statement late, and in which 4-layer band?"
thread: D2
gpus: 1
mem_gb: 25
est_gpu_hours: 0.6
depends_on:
- olmo3_7b_instruct_d2_smoke_v2
command: >-
  BJ_TARGET=olmo-3-7b-instruct uv run python scripts/attn_knockout.py manifest --name olmo3_7b_instruct_d2_v4_late_read_v2
  --why "D2 on a second model (softmax attention in every layer; 3 of 4 sliding-window, 4096 tokens, longer than these prompts): d2_v4_late_read's grid on pointer_v4 with 4-layer bands,
  memory -> prompt, named -> prompt, memory -> memory; entity-cluster intervals per topic"
  --dataset pointer_v4 --families RL DL RR --n 100 --layers all bands band4 --sweep path+random
  --sweep-dests question final both --competence olmo3_7b_instruct_d3v4_competence
  && BJ_TARGET=olmo-3-7b-instruct uv run python scripts/attn_knockout.py run --name olmo3_7b_instruct_d2_v4_late_read_v2
  && BJ_TARGET=olmo-3-7b-instruct uv run python scripts/attn_knockout.py summarise --name olmo3_7b_instruct_d2_v4_late_read_v2
examples_command: BJ_TARGET=olmo-3-7b-instruct uv run python scripts/attn_knockout.py examples --name olmo3_7b_instruct_d2_v4_late_read_v2 --k 3
figures_command: BJ_TARGET=olmo-3-7b-instruct uv run python scripts/attn_knockout.py figures --name olmo3_7b_instruct_d2_v4_late_read_v2
question: >-
  On OLMo-3-7B-Instruct (32 layers, softmax attention in each; 3 of 4 sliding-window, 4096 tokens), when the answer's statement is hidden from the last
  tokens, does a lookup in the prompt (memory -> prompt, named -> prompt) break while a recall (memory -> memory) does
  not, as on Qwen3.6-27B? In which 4-layer band must the statement stay visible?
why_it_matters: >-
  D2 ("the last tokens read the answer's statement late, through attention") rests on one hybrid model. OLMo has no
  DeltaNet layers, so the attention-vs-DeltaNet half cannot transfer, but the late read can: if it is there, and in
  the layers just after OLMo's slot phase (17-19), the lookup's last step is a property of transformers' in-context
  lookups, not of Qwen3.6-27B.
hypotheses:
  H-late-read: 'statement hidden from the last tokens in every layer: memory -> prompt still right <= 20% (upper bound)
    pooled, memory -> memory >= 90% (lower bound). Prior 0.7'
  H-band: 'the band whose blocking alone breaks memory -> prompt most lies at or after layer 16 (the last third or the
    4-layer bands 16-27). Prior 0.6'
decision_rule: >-
  attn_knockout's rule as in d2_v4_late_read (kept = the unedited answer survives the block; entity-cluster
  intervals; the off-path same-length control and the random-span control must keep >= 90%). PRIMARY: memory ->
  prompt, statement hidden from the tokens after the question in all layers, pooled over topics. Bands, topics,
  named -> prompt and the question words are reported.
controls:
- 'off-path: another statement of the same length hidden (should keep the answer)'
- 'random span of the same length hidden'
- 'memory -> memory: the answer is recalled, so hiding the statement should not matter'
n: '100 items per family (eligible in olmo3_7b_instruct_d3v4_competence), 3 topics'
seeds: [0]
notes: '~0.6 GPU-h on one A100 (7B; the 27B grid took 1.1 h with more layer sets).'
