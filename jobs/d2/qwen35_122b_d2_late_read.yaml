command: >-
  BJ_TARGET=qwen3.5-122b-a10b BJ_BATCH=16 uv run python scripts/attn_knockout.py manifest --name qwen35_122b_d2_late_read --dataset pointer_v4 --families RL --n 100 --sources lookup lookup_off --dests final question --layers all kind --sweep path --competence qwen35_122b_d3v4_competence --why "finding 4 on a larger model" && BJ_TARGET=qwen3.5-122b-a10b BJ_BATCH=16 uv run python scripts/attn_knockout.py run --name qwen35_122b_d2_late_read
