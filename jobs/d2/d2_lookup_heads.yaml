id: d2_lookup_heads
title: 'D2 batch 3: which late attention heads (layers 51-63) read the answer''s statement at the last tokens, and does one head''s attention point at the asked statement?'
thread: D2
gpus: 1
mem_gb: 70
est_gpu_hours: 0.5
depends_on:
- d3b_competence_400
command: >-
  uv run python scripts/attn_knockout.py manifest --name d2_lookup_heads
  --why "D2 batch 3 (a): one attention head at a time blocked from reading the answer's statement on pointer_v1
  (animals, elements): late layers at the last tokens (memory → prompt, named → prompt), early layers at the question
  words (named → prompt), middle layers at question words and last tokens together (memory → prompt); memory → memory
  as the null; per-head attention to each statement saved (pointer readout)"
  --dataset pointer_v1 --families RL DL RR --domains animals elements --n 100 --competence d3b_competence_400
  --grid heads --head-ranges late
  && uv run python scripts/attn_knockout.py run --name d2_lookup_heads
  && uv run python scripts/attn_knockout.py summarise --name d2_lookup_heads
examples_command: uv run python scripts/attn_knockout.py examples --name d2_lookup_heads --k 3
figures_command: uv run python scripts/attn_knockout.py figures --name d2_lookup_heads
question: 'Batch 2 found three reads of the answer''s statement in pointer_v1''s locker scenes, all through attention
  (UNVERIFIED): (1) the last tokens read it late (layers 48-63) in memory → prompt; (2) in named → prompt the question
  words read it early (hiding it from the question words + last tokens in layers 0-31 leaves 1/175 right, attention
  layers only 6/175, DeltaNet layers only 175/175; the last tokens alone at 0-31 keep 175/175); (3) in memory → prompt
  the question words and the last tokens together in layers 32-47 (78/175 left, each alone 87-88%). Which attention
  heads do each read: one or a few query heads, one key/value group, one layer, or only all of them together? And does
  any single head''s attention pattern point at the asked statement (a pointer readout better than D3b''s slot probe,
  39%)?'
why_it_matters: 'A named head (or group) that reads the answer''s statement is a concrete mechanism to check against
  the J-lens: if the late read sits in one head, D3''s pointer can be traced to that head''s query (what it asks for)
  and value (what it moves); if it is spread over every head and layer, single-head circuits are the wrong unit and the
  write-up should say "attention, redundantly". The early named → prompt read and the middle joint read of memory →
  prompt tell whether the recalled bridge uses the same heads as a named entity does, at a different depth.'
hypotheses:
  H_reproduce: 'memory → prompt, every head of the 4 late attention layers (51, 55, 59, 63) blocked at the last tokens:
    answer org kept in 11-20% (the entity-cluster interval overlaps 11-20%), reproducing batch 2. Prior 0.7'
  H_late_few_heads: 'memory → prompt: no single late query head is a reader (24 heads x 4 layers; the read is
    redundant across heads), but at least one whole late layer is. Prior 0.45'
  H_named_early: 'named → prompt, every head of the 8 early attention layers (3, 7, ..., 31) blocked at the question
    words: <= 10% kept; and at least one single early head is a reader (a name-matching head). Prior 0.5 (<= 10%
    alone: 0.7)'
  H_name_tokens: 'named → prompt, early layers: blocking the read from the name tokens only (" pig") keeps answer org
    within 10 points of blocking it from all the question words, so the per-head results at the question words are
    about the name. Prior 0.6'
  H_mid_joint: 'memory → prompt, every head of the 4 middle attention layers (35, 39, 43, 47) blocked at the question
    words and the last tokens together: 30-60% kept (batch 2: 45% with the DeltaNet layers blocked too, which alone
    cost nothing), and no single middle head is a reader. Prior 0.5'
  H_readout: 'the late head chosen on even-numbered scenes looks most at the asked statement (attention from the last
    token, argmax over the 5 statements) on > 39% of odd-numbered scenes (entity-cluster lower bound > 39%, the D3b
    probe; chance 20%). Prior 0.7'
  H_null: 'memory → memory: every whole-layer and whole-range cell >= 95%. Prior 0.9'
decision_rule: 'Fixed before the run (scripts/attn_knockout.py BATCH3_RULES and INTERVALS, written into
  manifest.json "batch3_rules" and "intervals"). Items: pointer_v1 main, animals and elements (every family passes
  d3b_competence_400''s gate: clean Wilson lower bound >= 0.85), scenes with every competence prompt right in all
  three families, first 100 per domain by scene id (they include all 175 items of d2_pointer_late_read), and unedited
  read right. Unit = one query head (Qwen3.6-27B: 24 query heads share 4 key/value heads, 6 per group; blocking a
  query head masks its scores only, its key/value partners still read), one key/value group (its 6 query heads), one
  layer (all heads), or the whole range. A unit is a READER if acc(control) - acc(unit) >= 10 points and the 95%
  entity-cluster bootstrap lower bound of that drop >= 5 points (control: the same unit blocked from a same-kind
  statement off the answer''s path, same items). Intervals: entity-cluster bootstrap (the queried entities resampled
  within domain: 16 animals, 6 elements; 4,000 draws, seed 0) first, item-level Wilson / paired item bootstrap second;
  every number per domain with n items / k entities. Readout: the best head chosen on even-numbered scenes (pooled
  over memory → prompt and named → prompt), scored on odd-numbered ones; above the probe iff its entity-cluster lower
  bound > 39%. A single-head reader is read with its group and layer cells, never alone (480 single-head cells are
  tested: named → prompt 192 early + 96 late, memory → prompt 96 middle + 96 late; the report counts the rule''s mirror
  image as a noise floor). n per cut: 100 per domain (>= 35).'
controls:
- 'the same unit blocked from a statement of the same kind off the answer''s path (another entity''s locker, same
  token length, seeded per scene): every reader is measured against it'
- 'memory → memory on the same scenes (the answer is recalled; its "asked statement" is not needed): whole layers and
  whole ranges'
- 'the whole range (all heads of all its layers) as the reproduction of batch 2 (late: 11-20%; early: the question
  words + last tokens at 0-31, attention only, kept 6/175; middle: the joint block 78/175 with DeltaNet layers too)'
- 'the readout: the head is chosen on half the scenes and scored on the other half; chance (1 of 5 statements) 20%'
- 'pre-run check (check.json): an empty source leaves the answer read bit-exact; the per-head mask matches a naive
  fp64 reference (tests/test_knockout.py)'
n: '200 org prompts per family (100 animals with 16 queried entities + 100 elements with 6; 392 / 337 scenes eligible)'
seeds:
- 0
notes: 'Split before the run (2026-10-21): this job runs the late range only (--head-ranges late, ~0.45 h; hypotheses
  H_reproduce, H_late_few_heads, H_readout, H_null); the early and middle ranges (H_named_early, H_name_tokens,
  H_mid_joint) run as d2_lookup_heads_early_mid with the same rule. The full design: Rows: 244,800 knocked reads: named → prompt 718 per item (early 8 layers x (24 heads + 4 groups + 1 layer)
  + the range = 233 units, + 9 name-token units; late 4 x 29 + 1 = 117 units; x 2 sources), memory → prompt 468 (middle
  117 + late 117 units, x 2), memory → memory 38 (whole layers and ranges: 19 units x 2). At the measured 31-37 edited
  reads/s on ~80-token prompts: ~2.0 h + load, check and the attention readout ~0.2 h. Split if wall-clock matters: the
  same command with --head-ranges late (~0.45 h) and, under another name, --head-ranges early mid (~1.7 h). Local 0.8B
  CPU smoke (qwen35_08b_smoke_d2_heads_cpu3, 2 scenes per domain, --no-eligibility; the 0.8B''s ranges: early 3-11,
  middle 15, late 19-23): every stage ran, check.json gates exact (no-op 0.0, positive control 0.0). Results:
  results/attn_knockout/d2_lookup_heads/.'
