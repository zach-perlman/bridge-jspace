# One caption per figure, keyed by its file stem (src/bridge_jspace/figkit/captions.py).

01_item_not_answer = "The answer control, main test: the recall's switches blocked beyond a random part of the same size without the lens part, with the lens part removed but the answer word's directions kept, and with only the answer word's directions removed, one lane each per model. Whiskers {{q|95%}} intervals; Lightning and the 122B hollow ○ (after the data)."
02_lightning_layers = "Lightning's layer sweep on the pre-check scenes: the share of each reader's answers switched by the whole change at the bridge word, lookup (violet) and recall (black), at every swept layer; dashed: the bar both readers must reach. All estimates post hoc (the gate was chosen after the pre-check)."
03_ladder = "The ladder at the two rungs its rule compares: the answers turned wrong beyond a random part of the same share when the lens part is removed step by step, the recall in locker-first and in locker-after scenes and the lookup over every scene. Whiskers {{q|95%}} intervals; Lightning and the 122B hollow ○."
04_follows_both = "The lens part from one scene (item B) and the address from another (item C) swapped in together (left) or alone (right): the share of the recall's answers that are B's (the lens part's item, teal) and C's (the address's item, orange), per model. Whiskers {{q|95%}} intervals; Lightning hollow ○."
05_number_answer = "A number as the answer: the switches blocked without the lens part beyond a random part, the recall (left) and the lookup (right), with the question after the scene and, on the 27B and the 122B, before it. Whiskers {{q|95%}} intervals; Lightning and the 122B hollow ○."
06_answer_map = "Where the answer word is readable through the lens (left: the share of items with it in the lens top {{q|5}} at the best layer before the answer; one value, no interval) and whether adding its lens directions there changes the answer (right; at the size the run chose), lookup (violet) and recall (black), on our scenes and on the fact passages. Whiskers {{q|95%}} intervals; Lightning and the 122B hollow ○ (coverage runs)."
07_value_formats = "The routes test in prose, JSON and a table: the share of the lookup's answers that follow the moved item's position (orange) and its new value (slate), per model and format run. Whiskers {{q|95%}} intervals; Lightning hollow ○."
08_identity_code = "The item's identity code from its locker sentence added at the bridge word: the share of lookups moved by the item's own code (blue), by another item's version of it (slate) and by a random vector (grey), with the code as fit in advance and centered. Whiskers {{q|95%}} intervals."
09_subset27b = "The 27B's scenes where its lookup goes by position, beside the 9B: the position answers left without the address and without a random part (grey), and brought back by the address alone and by a random part alone (grey). Whiskers {{q|95%}} intervals."
10_report_first_position = "The model's report of where the item sits, reworded: the share of reports naming the first position under the earlier wording, when a digit is asked for and when a word is asked for, per model. Whiskers {{q|95%}} intervals; Lightning hollow ○."
11_last_token_swap = "The address fit at the bridge word swapped in at the last token, a few layers after L at twice a real change's size: the share of lookups sent to the target item, per model. Whiskers {{q|95%}} intervals; Lightning hollow ○ (a coverage run)."
12_last_conflict = "The conflict test at the last token: the switches blocked without the lens part beyond a random part, lookup (left) and recall (right), at the two layers tested for each reader (its own layers, earlier first; the 122B at one). Whiskers {{q|95%}} intervals; Lightning and the 122B hollow ○."
13_last_conflict_words = "As the figure above with words as the answers: per model, three, two and one layers before the answer and at the read peak (the rule counts the two layers nearest the answer as uninformative). Whiskers {{q|95%}} intervals; Lightning hollow ○."
14_attention_blocks = "Lightning: the switches blocked when attention blocks are cut, lookup (left) and recall (right), per block or span cut (rows), with a control block and a control span. Whiskers {{q|95%}} intervals; all estimates post hoc."
15_fact_answer_control = "The answer control on the fact passages with the bridge named, per chain (P: read in the passage, M: recalled; the last letter is the hop the reader answers): the switches blocked without the lens part and with only the answer word's directions removed, lookup (violet) and recall (black). Whiskers {{q|95%}} intervals."
16_every_layer = "The change at the bridge word at one layer (left) and at every layer up to L (right): the switches blocked without the lens part beyond a random part, lookup (violet) and recall (black), with the fact sentence before the pick and after it. Whiskers {{q|95%}} intervals; Lightning hollow ○."
17_fact_routes = "The routes test on the fact passages: the share of the lookup's answers by identity (blue), by position (orange) and by value (slate), at each model's layer tested and, where run, a later one. Whiskers {{q|95%}} intervals; the 27B, Lightning and the 122B hollow ○ (coverage runs, or after the data)."
18_read_window = "The fact passages' read window: the share of each reader's answers switched by the whole change at the bridge name, one layer at a time, lookup (violet) and recall (black); dashed: the bar fixed in advance. Lightning post hoc (a coverage run)."
19_person_probe = "Who picked the item, read by a probe at its locker sentence: the accuracy pooled over the sentence (with its {{q|95%}} interval) and at the best single token, at half the test layer and at it. The 27B and Lightning hollow ○ (a coverage run; below its gate)."
20_any_item = "The address on other kinds of item: the position answers cut beyond random without the address fit on animals (left) and refit on each kind (right), per model and kind. Whiskers {{q|95%}} intervals; Lightning hollow ○."
21_described_gap = "The fact passages with the bridge described: the gap, recall minus lookup, under the change at one layer (left, a share of switches) and under removal everywhere (right, a share of answers); the 122B not run at one layer. Whiskers {{q|95%}} intervals; Lightning and the 122B hollow ○."
