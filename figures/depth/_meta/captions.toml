49_last_conflict = "The conflict test at the last token: the switches blocked without the lens part beyond a random part, lookup (left) and recall (right), at the two layers tested for each reader (its own layers, earlier first; the 122B at one). Whiskers {{q|95%}} intervals; Lightning and the 122B hollow ○."
50_last_conflict_words = "As the figure above with words as the answers: per model, three, two and one layers before the answer and at the read peak (the rule counts the two layers nearest the answer as uninformative). Whiskers {{q|95%}} intervals; Lightning hollow ○."
