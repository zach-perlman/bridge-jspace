# One caption per figure, keyed by its file stem (src/bridge_jspace/figkit/captions.py).

01_setup = "The running example: one prompt, its two questions and the changed prompt."
02_one_layer_split = "Switches blocked without the lens part beyond a random part, lookup and recall per model, main test at L (the 122B's L33: the 27B's relative depth carried over); right: the gap, recall minus lookup, with its {{q|95%}} interval; grey band: within 0.10 of random (the lookup's bar)."
03_six_lockers = "Claim 8: six-locker scenes. Left: the locker pairs whose swap (dose 2) sends lookups past the bar fixed in advance (dashed line: half the pairs), with the count beside; right: lookups sent one locker on by one shift along the lockers, against a random vector (grey), whiskers the range over the five start lockers, the numbers beside. Lightning hollow ○ (its gate chosen after its pre-check)."
04_code_tool = "Python code and tool output on the 9B and the 27B (rows): the locker probe's accuracy for the address (amber) against a random part and a layout-only probe (grey); the lookups left on position without the address, and brought back with only the address kept. The 9B's code probe is below its gate. Whiskers: 95% intervals."
05_order = "Lookups switched by the change at the bridge word, with the item's locker (or fact) sentence before the pick and after it: the locker scenes (left) and the fact passages (right); whiskers {{q|95%}} intervals; Lightning hollow ○ (its gate chosen after its pre-check); the 122B not run on the fact passages."
06_link_layers = "With the locker sentence after the pick, by layer (x: the layer as a share of the model's depth): the lookups switched by the change at the bridge word and by the same change copied into the locker sentences, each line named at its end; dots: the cells fixed in advance, with their values; shading {{q|95%}} intervals; the layer sweeps after the data (post hoc); the 9B, 27B and Muse."
07_depth = "By depth (x: the layer as a share of the model's depth), on the three models whose gates were fixed in advance: the locker probe's accuracy and the position answers under the whole change when another item moves (orange, named at their ends), and the lookup's switches blocked without the lens part beyond a random part of the same size (teal); shading {{q|95%}} intervals; grey band: the layers that pass the gate. The 9B in its own block: its interval runs below zero outside its gate."
08_depth_more = "As the figure above, on Lightning and the 122B, whose gates were chosen after the data (all estimates post hoc); Lightning in its own block: its interval runs far below zero outside its gate."
