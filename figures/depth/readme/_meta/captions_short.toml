01_setup = "The worked example's prompt, its two questions and the changed prompt."
02_one_layer_split = "The recall follows the lens part of the bridge word; the lookup mostly does not. Left, switches blocked without the lens part beyond a random part, per reader and model, main test at L; grey band, the lookup's bar, near random. Right, recall minus lookup."
03_six_lockers = "With six lockers, swaps between given lockers work on most pairs; no shift moves the lookup one locker on. Left, the pairs whose swap passes the bar fixed in advance (dashed, half the pairs). Right, lookups sent one locker on by one shift, against a random vector (grey); whiskers span the start lockers."
05_order = "With the locker sentence first, the change at the bridge word switches the lookup; after the pick, far less. Lookups switched with the locker (or fact) sentence before and after the pick, in locker scenes (left) and fact passages (right); the 122B was not run on the latter."
06_link_layers = "After the pick, the change copied into the locker sentences switches the lookups that the change at the bridge word no longer does. Lookups switched by layer on the 9B, 27B and Muse; dots mark the cells fixed in advance. The layer sweeps are post hoc."
07_depth = "On the 9B, 27B and Muse the address is readable before the lookup uses it. By depth, the locker probe's accuracy and position answers when another item moves (orange). Teal, the lookup's switches blocked beyond random without the lens part; grey band, layers passing the gate."
08_depth_more = "On Lightning and the 122B too, the address is readable before the lookup uses it. Drawn as the figure above; their gates were chosen after the data, so every estimate is post hoc. Lightning's interval runs far below zero outside its gate."
09_two_by_two = "Both operations, both datasets, one direction. Recall minus lookup, as a share of each reader's answers; grey, a same-size control's gap. One layer tests following the lens part, a band needing it, so compare sign and order, not size. On Muse and the 122B the band gap on locker scenes is within its control."
15_zeroing = "At one layer the recall keeps nearly all its answers without the lens part; it has other copies. Each reader's answers kept with the lens part removed from the changed prompt's own state at L (recall black, lookup violet), against a same-size random part (grey)."
18_identity_outside = "The lookup's identity survives taking out the lens's next directions, while the lens part blocks the recall's switches. Switches blocked beyond a random part, per model and part removed at the bridge word (lookup violet, recall black; grey band, near random). Filled, the lens's next directions (fixed in advance); hollow ○, run after the data."
35_two_codes = "Post hoc. Position scenes leave position without the address (top); identity scenes go to position without the lens part (bottom). Another item moved, lookup. Each against a same-size random part (grey), with paired differences at right. Not among the hand-checked views."
36_earlier_mention = "The recall also reads the item's earlier mention. Recall switches blocked beyond the change at the bridge word alone, when the lens part is also taken out at the earlier mention (left) or at another item's tokens (right); grey dot, a random part of the same share. Clean one-pick scenes; Lightning and the 122B hollow ○."
37_address_added_alone = "Added by itself at the bridge word, the address brings position answers back, except on the 27B. Position answers in the routes test with only the address (orange) or only a random part of its share (grey). Hollow ○, Lightning (gate chosen after its pre-check) and the 122B (gate lowered after the data)."
s07_cumulative = "For the lookup, almost all switches are carried at the bridge word at L. Shares of each reader's switches (a term may be negative) at the bridge word at L, before L, after L, on the pick sentence's other tokens and outside it; lookup violet, recall black; main test and clean one-pick scenes."
