# Short captions for the README pages (at most 60 words, takeaway first; src/bridge_jspace/figkit/captions.py).
# The full caption of each figure is in captions.toml.

01_setup = "The worked example: one prompt, its two questions and the changed prompt."
02_one_layer_split = "The recall follows the lens part of the bridge word; the lookup mostly does not. Left: switches blocked without the lens part beyond a random part, lookup and recall per model, main test at L; grey band: the lookup's bar, near random. Right: the gap, recall minus lookup. Lightning hollow ○."
03_six_lockers = "Claim 8: with six lockers, swaps between given lockers work on most pairs; no shift moves the lookup one locker on. Left: the pairs whose swap sends lookups past the bar fixed in advance (dashed: half the pairs). Right: lookups sent one locker on by one shift, against a random vector (grey); whiskers: the range over start lockers. Lightning hollow ○."
05_order = "With the locker sentence first, the change at the bridge word switches the lookup; after the pick, far less. Lookups switched with the item's locker (or fact) sentence before and after the pick, in the locker scenes (left) and the fact passages (right). Lightning hollow ○; the 122B not run on the fact passages."
06_link_layers = "After the pick, the change copied into the locker sentences switches the lookups that the change at the bridge word no longer does. Lookups switched by layer (x: share of the depth), each line named at its end; dots: the cells fixed in advance, with their values; the layer sweeps are post hoc. The 9B, 27B and Muse."
07_depth = "On the 9B, 27B and Muse the address is readable before the lookup uses it. By depth: the locker probe's accuracy and the position answers when another item moves (orange), and the lookup's switches blocked without the lens part beyond a random part (teal); grey band: layers passing the gate. The 9B's interval runs below zero outside its gate."
08_depth_more = "On Lightning and the 122B too, the address is readable before the lookup uses it. Drawn as the figure above; their gates were chosen after the data, so every estimate is post hoc. Lightning's interval runs far below zero outside its gate."
09_two_by_two = "Both operations, both datasets, one direction: recall minus lookup, as a share of each reader's answers; grey: a same-size control's gap. One layer asks whether the recall follows the lens part, a band whether it needs it: compare sign and order, not size. On Muse and the 122B the band gap on locker scenes is within its control."
15_zeroing = "Claim 2: at one layer the recall keeps nearly all its answers without the lens part; it has other copies. The share of each reader's answers kept when the lens part is removed from the changed prompt's own state at L (recall black, lookup violet), against a random part of the same size (grey). Lightning hollow ○."
18_identity_outside = "Claim 5: the lookup's identity survives taking out the lens's next directions, while the lens part blocks the recall's switches. Per model and part removed at the bridge word: switches blocked beyond a random part, lookup violet, recall black; grey band: near random. Filled: the lens's next directions, fixed in advance; hollow ○: run after the data."
35_two_codes = "Post hoc: position scenes leave position without the address; identity scenes go to position without the lens part. Another item moved, lookup. Top: position-route scenes without the address; bottom: identity-route scenes without the lens part; each against a random part of the same size (grey), with the paired differences at right. Not among the hand-checked views."
36_earlier_mention = "Claim 3: the recall also reads the item's earlier mention. Recall switches blocked beyond the change at the bridge word alone, when the item's earlier mention also has its lens part removed (left) or another item's tokens have theirs removed (right); grey tick: a random part of the same share. Clean one-pick scenes. Lightning and the 122B hollow ○."
37_address_added_alone = "Claim 7: added by itself at the bridge word, the address brings position answers back, except on the 27B. The routes test (another item moved): position answers with only the address (orange) against only a random part of its share (grey). Hollow ○: Lightning (gate chosen after its pre-check), the 122B (gate lowered after the data)."
s07_cumulative = "Where each reader's switches are carried: for the lookup almost all at the bridge word at L. Shares of the switches (a term may be negative) at the bridge word at L, before L, every layer after L, the pick sentence's other tokens, and outside it; lookup violet, recall black; main test and clean one-pick scenes. Lightning hollow ○."
