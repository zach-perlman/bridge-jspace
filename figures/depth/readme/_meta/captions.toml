s05_link_copy_27b = "Qwen 27B, the change copied into the locker sentences: per variant (every locker-sentence token, the item's own tokens, the other locker-sentence tokens, the number only, the period only), the share of lookups switched along the depth, with 95% shading. All estimates post hoc."
s06_link_copy_muse = "Muse 30B, the change copied into the locker sentences: per variant (every locker-sentence token, the item's own tokens, the other locker-sentence tokens, the number only, the period only), the share of lookups switched along the depth, with 95% shading. All estimates post hoc."
s07_cumulative = "Claim 11: where each reader's switches under the change are carried, as shares of the switches (a term may be negative): the bridge word at L, the bridge word before L, every layer after L, the pick sentence's other tokens, and outside the pick sentence; lookup violet, recall black; the main test and the clean one-pick scenes; whiskers {{q|95%}} intervals; Lightning hollow ○, its clean one-pick scenes below gate. The split by sentence order behind claim 11 is in the key numbers per claim and in the ledger card."
