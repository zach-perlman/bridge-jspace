# One caption per figure, keyed by its file stem (src/bridge_jspace/figkit/captions.py).

01_setup = "The worked example: one prompt, its two questions and the changed prompt."
02_one_layer_split = "Switches blocked without the lens part beyond a random part, lookup and recall per model, main test at L (the 122B's L33: the 27B's relative depth carried over); right: the gap, recall minus lookup, with its {{q|95%}} interval; grey band: within 0.10 of random (the lookup's bar)."
03_six_lockers = "Claim 8: six-locker scenes. Left: the locker pairs whose swap (dose 2) sends lookups past the bar fixed in advance (dashed line: half the pairs), with the count beside; right: lookups sent one locker on by one shift along the lockers, against a random vector (grey), whiskers the range over the five start lockers, the numbers beside. Lightning hollow ○ (its gate chosen after its pre-check)."
04_code_tool = "Python code and tool output on the 9B and the 27B (rows): the locker probe's accuracy for the address (amber) against a random part and a layout-only probe (grey); the lookups left on position without the address, and brought back with only the address kept. The 9B's code probe is below its gate. Whiskers: 95% intervals."
05_order = "Lookups switched by the change at the bridge word, with the item's locker (or fact) sentence before the pick and after it: the locker scenes (left) and the fact passages (right); whiskers {{q|95%}} intervals; Lightning hollow ○ (its gate chosen after its pre-check); the 122B not run on the fact passages."
06_link_layers = "With the locker sentence after the pick, by layer (x: the layer as a share of the model's depth): the lookups switched by the change at the bridge word and by the same change copied into the locker sentences, each line named at its end; dots: the cells fixed in advance, with their values; shading {{q|95%}} intervals; the layer sweeps after the data (post hoc); the 9B, 27B and Muse."
07_depth = "By depth (x: the layer as a share of the model's depth), on the three models whose gates were fixed in advance: the locker probe's accuracy and the position answers under the whole change when another item moves (orange, named at their ends), and the lookup's switches blocked without the lens part beyond a random part of the same size (teal); shading {{q|95%}} intervals; grey band: the layers that pass the gate. The 9B in its own block: its interval runs below zero outside its gate."
08_depth_more = "As the figure above, on Lightning and the 122B, whose gates were chosen after the data (all estimates post hoc); Lightning in its own block: its interval runs far below zero outside its gate."
09_two_by_two = "Same unit in every column. One layer asks whether the recall follows the lens part, a band whether it needs it, so compare the sign and the order across columns, not the size. Recall minus lookup, the effect as a share of each reader's answers; grey: the same gap with a same-size control. Muse's band cell on the locker scenes ran at L23-29, outside the breadth track's band; the reason for a missing cell is written in it. Band · locker scenes: on Muse and the 122B the gap is within its control ({{dp|fig12|muse-glimmer-30b|Zach's operation, our scenes (rung 6): recall's cost minus the lookup's, every scene}} vs {{dp|fig12|muse-glimmer-30b|Zach's operation, our scenes (rung 6): the control (a random part of the same size instead), recall minus lookup, every scene (kept with none minus kept with the random part)}}; {{dp|fig12|qwen3.5-122b-a10b|Zach's operation, our scenes (rung 6): recall's cost minus the lookup's, every scene}} vs {{dp|fig12|qwen3.5-122b-a10b|Zach's operation, our scenes (rung 6): the control (a random part of the same size instead), recall minus lookup, every scene (kept with none minus kept with the random part)}})."
10_mechanisms = "Four mechanism tests, each against its bar fixed in advance (dashed): late MLPs and the recall (the recall's answers turned wrong, a share); a person mark read by a probe at the item and at the number (probe accuracy, slate); heads passing the rest (how many of five pass, as \"k of 5\"); the address as a second route (recalls naming the target's item); and blocking the pick sentence (identity answers kept, blue, beside the rule's bar per model). Whiskers: 95% intervals; hollow: post hoc; a missing run is named in its cell."
11_settings = "The conflict test in four settings: logit difference, clean one-pick scenes, varied scenes and natural passages. Each row is a model; a grey connector joins the lookup's mark (violet) and the recall's (black), each the share of switches blocked beyond a random part (the logit difference: the share of the logit shift blocked). Hollow: post hoc; a missing run is named in its cell."
12_specificity = "Which part of the change the readers need: per model, lanes for the lens part and three same-size alternatives (PCA directions, logit-lens directions, random lens directions); the lookup (violet) and the recall (black) as switches blocked beyond a random part, with 95% intervals, joined by a grey connector; the grey band is within 0.10 of a random part. Right: each part's share of the change. All estimates post hoc."
13_k_curve = "The main test with more lens directions removed (25, 50, 100): the lookup's (violet) and the recall's (black) extra drop without the lens part, a share, with 95% intervals, joined per model. All estimates post hoc."
14_k_routes = "Another item moved, without the lens part, at 25, 50 and 100 directions (lanes): the share of the lookup's answers given by identity (blue), by position (amber, the address) and with a random part removed instead (grey), with 95% intervals."
15_zeroing = "Claim 2: the share of each reader's answers kept at L when the lens part's {{q|25}} directions are removed from the changed prompt's own state (recall black, lookup violet), against a random part of the same size removed (grey); main test; whiskers {{q|95%}} intervals; Lightning hollow ○ (its gate chosen after its pre-check)."
16_dose_lens = "The lens part added by itself at the bridge word, one column per dose: per model, the switches beyond a random part of the same size, lookup (violet) and recall (black). Whiskers: 95% intervals; Lightning hollow (○, post hoc). The rest of the change added by itself is in 17_dose_rest."
17_dose_rest = "The rest of the change by itself at five doses (columns): per model, lanes for the rest alone, the rest without the address, and the rest without a random part of the address's size (grey), each the share of lookups switched with its 95% interval. Hollow: post hoc (Lightning)."
18_identity_outside = "Claim 5: switches blocked beyond a random part of the same size, lookup (violet) and recall (black), per model and per part removed at the bridge word: the lens part, lens directions {{q|26–100}} (fixed in advance, filled), PCA directions of the same size, logit-lens directions and random lens directions (run after the data, hollow ○); grey band: within {{q|0.10}} of random; whiskers {{q|95%}} intervals."
19_described_bridge = "A described bridge (\"the one known for …\") instead of a named one, per model: the switches blocked without the lens part beyond a random part, lookup (violet) and recall (black), over the grey band; the gap (slate) with its interval; the position answers cut beyond random without the address (amber). Lightning hollow (○, post hoc). Whiskers: 95% intervals."
20_layers = "Where the link is made, with the locker sentence after the pick. Top: per model, the lookups switched by the change at each depth (a share), at the bridge word and copied at every locker-sentence token, named at their ends, with 95% shading; dots mark the layers the bottom panels read. Bottom: lookups switched at the bridge word at L, copied at L and copied at L/2, and the copy at L's share of the switches, with 95% intervals. Each line's panel says it is post hoc."
21_address_depth = "How stable the address is across depth: its overlap between neighbouring layer windows (mean cos², amber) per model along the depth, and below the mean over every pair of window layers."
22_probe_errors = "On the lookup's wrong answers, the share whose locker a probe predicts from the address (amber, with its 95% interval) against the most common locker (grey) and chance (dashed). Right: the same given the layout, and the share where the lens's top item is right. Hollow: post hoc (Lightning); a missing run is named in its cell."
23_first_locker = "The first locker: per model, lanes for no sentence, a neutral sentence and three kinds of pick sentence; the share of the lookup's answers given by identity (blue, with its 95% interval), the share by position (a number), and the identity code's shift against no sentence with its interval. All estimates post hoc."
24_formation = "Blocking the pick sentence: per model, lanes for the whole change, the pick sentence blocked and a control block (grey); the share of the lookup's answers by identity (blue), by position (amber), the original answer, the number and other answers (slate), and the share of the recalls switched (black), with 95% intervals."
25_chain = "Chained addresses, the hall before the locker: a probe for the hall address (amber) against a random part and a layout-only probe (grey); the hall answers by position without the hall address and with only the hall address kept; the whole change in its own column. Lightning not tested. Whiskers: 95% intervals."
26_what_is_left = "What is left of the route: per model, lanes for the lens part and the address removed, then also identity outside the lens part, then a wrong pair instead; the share of the lookup's switches still switching (violet) against a random part of the same size (grey), joined by a grey connector, with 95% intervals. Right: each part's share of the change, and the identity answers cut beyond the wrong pair with its interval. All estimates post hoc; a missing run is named in its cell."
27_enrichment = "Attribute probes and MLPs. Top: per model, along the depth, the share of probe readings that moved toward the changed item's attribute, under the whole change and without the lens part (named at their ends), the probe's accuracy, and a random part (grey), with 95% shading. Bottom: MLP outputs replaced by their mean at the bridge word (late layers), the person word (late layers) and the bridge word (early layers): the lookup's (violet) and the recall's (black) answers turned wrong, a share, with 95% intervals."
28_binding = "Binding: who picked the item, read by a probe at the item and at the number (slate, probe accuracy with its 95% interval), with the locker sentence after or first (lanes). Bottom: the lens part's share of the person direction at the item and at the number (teal), each beside twice a random direction's share (grey, its own column)."
29_binding_added = "The person direction added at strength 1 and 2 (lanes): the share of lookups (violet) and of recalls (black) sent to the target item, each beside a random vector of the same strength (grey, its own column), with 95% intervals."
30_heads = "The heads that pass the most of each part under the swap, on the 9B (top) and Muse (bottom), rows read from the run: what each head passes (median ‖W_OV x‖ / ‖x‖) of the lens part (teal), the rest (slate) and the address (amber), against a random part and twice the lens part (grey). Whiskers: 95% intervals."
31_second_route = "A second route: per model, lanes for the change without the lens part, with the address swapped in as well, the address swapped in only, and a random vector instead (grey); the share of the recall's answers naming the target locker's item (amber, the address), the changed item (blue, identity), the original answer and other answers (slate), with 95% intervals."
32_attention = "The last token's attention on the old and the new locker sentence under the address swap (amber), on the scenes where the answer switched and where it stayed, against no change and a random vector (grey), per model. Whiskers: 95% intervals."
33_learned = "A small address subspace learned on the address test's pairs (its size in the figure's note), on the 9B, the 27B and Muse: the share of position switches it carries (amber) against a random subspace (grey); the recalls it moves; the whole change and the hand-built address's energy inside it in their own columns. Whiskers: 95% intervals."
34_transfer = "Top, after the data: the switches blocked beyond a random part without the lens part (teal) and without the address fit on simple scenes (orange), per model and setting, all hollow ○. Bottom, rule 45d: per format, without the address fit on simple scenes (left) and refit on that format (right); a cell under its switch bar says so. Whiskers {{q|95%}} intervals."
35_two_codes = "Post hoc, another item moved, lookup, 300 scenes per model: the scenes that leave the position route without the address, and the scenes that go from identity to position without the lens part, each against a random part of the same size, with the paired differences and {{q|95%}} intervals (bootstrap over the bridge entity); Lightning and the 122B hollow ○. Not among the hand-checked views. The table below has the counts."
36_earlier_mention = "Claim 3: the recall's switches blocked against the change at the bridge word alone (arm 1) when the new item's tokens at its earlier mention also have their own lens part removed (left), and when another item's tokens have theirs removed (right); grey tick: the same tokens with a random part of the same share removed. Clean one-pick scenes with the item's locker sentence before the pick; whiskers {{q|95%}} intervals; Lightning hollow ○ (below its gate, descriptive), the 122B hollow ○ (a coverage run, no prediction)."
37_address_added_alone = "Claim 7, the routes test (another item moved): position answers when only the address is added at the bridge word (orange) against only a random part of its share (grey); whiskers {{q|95%}} intervals; Lightning hollow ○ (its gate chosen after its pre-check), the 122B hollow ○ (its gate lowered after the data)."
s01_split_all_scene_sets = "Every scene set, one panel per model (the 9B, the 27B, Muse, the 122B): per set (rows), the switches blocked without the lens part beyond a random part of the same size, lookup (violet) and recall (black), joined in each row. Whiskers: 95% intervals. All estimates post hoc."
s02_parts_all = "Every part of the change on the main test, one row per part and one column per model: the lookup's (violet) and the recall's (black) switches blocked beyond a random part, a share, with 95% intervals, joined by a grey connector. Hollow: post hoc."
s03_order_split = "The order split on every model: lanes for the main test and the clean scenes, each with the locker sentence first or after; the share switched by the whole change (lookup violet, recall black), the switches blocked beyond a random part (95% Wilson intervals on the shares, 95% intervals on the blocks), and the gap recall − lookup with its interval. Hollow: post hoc; too few switches and missing runs are named in their cells."
