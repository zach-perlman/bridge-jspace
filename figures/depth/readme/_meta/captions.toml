s13_routes_kept = "Every routes arm with only one part kept: per model, lanes for the address only, a random part of the address's size only, the lens part only, and a random part only (grey); the share of the lookup's answers by identity (blue), by position (amber) and the original answer (slate), with 95% intervals. Hollow: post hoc (Qwen 122B)."
s14_das_muse = "Learned subspaces (DAS) at the bridge word on the 9B and Muse, per subspace size k (rows): the share of each reader's switches carried by its own learned subspace, the lookup's (violet) and the recall's (black), against a shuffled and a random subspace of the same size (grey). Whiskers: 95% intervals."
