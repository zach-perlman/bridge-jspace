02_routes = "One routes scene, Qwen 9B: the bridge word's state comes from a scene in which another item moved, and the three routes predict three different lockers, each read from its own sentence (identity blue, position amber, the value in black). Picked by its outcome, to show the typical case (rule and item id in data/figures/examples/data.csv): the whole change sends the lookup to the position route's locker, it stays there without the lens part, and without the address it leaves it. Of the condition's {{e|e4.pairs_all}} scenes, the whole change takes the position route in {{e|e4.pairs_position}}, and {{e|e4.pairs_shown}} show this whole pattern."
