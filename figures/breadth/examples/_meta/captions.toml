01_fact_passage = "One fact passage, Qwen 27B, jsuite v2 test: both passages name the bridge (bold); the lookup's passage also states the bridge's fact (the sentence in the lookup's colour), the recall's passage replaces it and its like with sentences that do not, so the recall's answer must come from memory; the bridge in bold. Answers before and with the lens part removed at every token over a band of middle layers, or a rotated part of the same size. Picked to show the typical flip (the rule and item ids are in data/figures/examples/data.csv): the recall turns wrong only without the lens part, the lookup holds. On the 27B this pattern shows on {{e|e2.pairs_flip}} of the {{e|e2.pairs_both_right}} pairs whose two answers were right before the removal. Over the test set the removal costs the lookup {{b|ko.q27.lostK}} points and the recall {{b|ko.q27.lostM}}."
02_chains = "Three three-hop chains about one entity, Qwen 27B, jsuite v2 test: each hop is P (read in the passage) or M (recalled), the bridge in bold; answers before and with the lens part removed at every token over a band of middle layers, or a rotated part of the same size. Picked by a fixed rule, not by its outcome (rule and item ids in data/figures/examples/data.csv); on this entity only P → M → M turns wrong, and only without the lens part. Over the run's items, removing the lens part turns {{b|mod.q27.threehop.paper10.loss.PPP}} points of P → P → P answers wrong (a rotated part: {{b|mod.q27.threehop.paper10_rot.loss.PPP}}), {{b|mod.q27.threehop.paper10.loss.PMM}} of P → M → M ({{b|mod.q27.threehop.paper10_rot.loss.PMM}}) and {{b|mod.q27.threehop.paper10.loss.MPM}} of M → P → M ({{b|mod.q27.threehop.paper10_rot.loss.MPM}})."
