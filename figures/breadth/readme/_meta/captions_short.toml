# Short captions for the README pages (at most 60 words, takeaway first; src/bridge_jspace/figkit/captions.py).
# The full caption of each figure is in captions.toml.

01_needed = "Removing the lens part breaks recalled facts, not looked-up ones, far beyond the largest same-size control. Top, the recall − lookup gap in points per model (slate; grey tick, the largest control). Bottom, answers turned wrong on three models by where the answer is (lookup violet, recall black). Hollow ○, post hoc."
02_datasets = "The Qwens' split on every dataset I built, with the logit lens near zero. The recall − lookup gap in points per dataset or variant (slate), and with the logit lens's own directions where run (grey); dashed, the bar fixed in advance. The plain J-lens row is the 27B's only."
02b_datasets = "Muse and the 122B pass the bar on the later sets; the Olmos and Qwen3-32B do not. The recall − lookup gap in points per model and dataset; dashed, the bar fixed in advance; \"no run\" where a model did not run a set. Hollow ○, post hoc."
03a_robust = "The split holds on every relation, far above the rotated control. Every relation of jsuite v2, one row each, one panel per model: the recall − lookup gap in points under the lens part's removal (slate); grey: the same removal rotated to random directions."
03b_robust = "The split holds on every start, both test halves, three renderings and by probability; a bridge never named adds to the recall's drop. Top, the recall − lookup gap in points by chain start (P read, T tracked, M recalled) and by run. Bottom, the extra recall drop when the bridge's one passing mention is deleted."
04_where = "The removal must act at the mention at mid depth in the Qwens, at mention and question in Lightning, and at the question late. Top, the recall − lookup gap by sliding window of layers (slate; grey, rotated). Bottom, on three models, the gap by where the removal acts (every token, mention, passage, question)."
05_carries = "A swapped lens part moves the answer to the other entity; it is not the answer token. Top, answers moved to the other entity's fact by the lens part (teal) and same-kind swaps (grey; whole state, rest, rotated, logit lens). Bottom, Qwen 27B and 9B, the lens part whole, without the answer's direction, that direction alone, rotated."
07_lookup = "The fact appears at the answer position only after the band, for a swapped entity as for the original. Per model and layer, the share of items whose lens top pick is the entity's fact. Grey, unedited; teal, another entity's lens part swapped in, from its passage or a neutral sentence."
08_readable = "The lens reads the fact at the mention in every model; readable is not the same as needed. Per model and depth, the share of items whose true attribute ranks first, read from the lens part at the mention (teal) or the logit lens (grey)."
09_dose = "The lens-specific part sits in the first lens directions; in Bolt and DeepSeek a same-size removal costs about as much. The recall − lookup gap in points per model and number of lens directions removed (slate), against the same number rotated (grey). Hollow ○, post hoc (Muse 30B)."
10a1_beyond = "Under the removal, chains whose last hop recalls turn more answers wrong than the all-passage chain (P → P → P), beyond the largest same-size control (grey tick). The 27B's P → P → M is the exception. Rows, jsuite v2, a second seed and the natural three-hop set (hollow ○ for Lightning's, post hoc)."
10a2_beyond = "Chains whose last hop reads the passage cost nothing beyond the controls on Lightning, and on the 27B only when the first two hops recall. Extra answers turned wrong beyond P → P → P, in points; grey tick, the largest same-size control. Hollow ○, post hoc (Lightning's natural set)."
10b_beyond = "A number made from the passage and then used, and its extra cost under the removal. Numbers counted, computed or recalled, then reported or used to recall. Answers turned wrong beyond a number read from the passage, in points; slate, the lens part's removal; grey, the rotated and logit-lens controls."
10c_beyond = "Generated replies under the removal, sorted into five classes: per model and chain (P → M, M → M) on natplus, the share still right, a lure in the passage, another valid answer, something else, or the bridge's name; right: the replies classified. Cells tagged descriptive are descriptive in the registry."
