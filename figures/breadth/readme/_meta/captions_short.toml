# Short captions for the README pages (at most 60 words, takeaway first; src/bridge_jspace/figkit/captions.py).
# The full caption of each figure is in captions.toml.

01_needed = "Removing the lens part breaks recalled facts, not looked-up ones, far beyond the largest same-size control. Top: per model, the recall − lookup gap in points when its directions are removed at every token over the band (slate); grey tick: the largest control. Bottom, three models: answers turned wrong by where the answer is (lookup violet, recall black). Hollow ○: post hoc."
02_datasets = "The Qwens' split on every dataset we built, with the logit lens near zero. One row per dataset or variant: the recall − lookup gap in points under the lens part's removal (slate); grey: the logit lens's own directions, where run; dashed: the bar fixed in advance. The plain J-lens row is on the 27B only."
02b_datasets = "The other models: Muse and the 122B above the bar on the later sets, the Olmos and Qwen3-32B below it. One row per model, one column per dataset: the recall − lookup gap in points; dashed: the bar fixed in advance; \"no run\" where a model did not run a set. Hollow ○: post hoc."
03a_robust = "The split holds on every relation, far above the rotated control. Every relation of jsuite v2, one row each, one panel per model: the recall − lookup gap in points under the lens part's removal (slate); grey: the same removal rotated to random directions."
03b_robust = "The split holds on every start, both test halves, three renderings and by probability; a bridge never named adds to the recall's drop. Top: the recall − lookup gap in points by start of the chain (P read, T tracked, M recalled) and by run. Bottom: the extra recall drop when the bridge's one passing mention is deleted."
04_where = "Depth and position: the mention at mid depth in the Qwens, mention and question in Lightning, the question late. Top: the recall − lookup gap in points when the lens part is removed over a sliding window of layers (slate; grey: rotated). Bottom, three models: the gap when the removal acts at every token, the mention, the passage or the question."
05_carries = "A swapped lens part moves the answer to the other entity; it is not the answer token. Top: answers moved to the other entity's fact, for the lens part (teal) and same-kind swaps (grey: whole state, the rest, rotated, logit lens). Bottom (Qwen 27B, Qwen 9B): the whole lens part, without the answer's direction, that direction alone, and rotated."
07_lookup = "The fact appears at the answer position only after the band, for a swapped entity as for the original. Per model, by layer: the share of items whose lens top pick there is the fact of the entity in play, unedited (grey) and with another entity's lens part swapped in from its own passage or one neutral sentence (teal)."
08_readable = "The lens reads the fact at the mention in every model; readable is not the same as needed. Per model: the share of items whose true attribute is ranked first when the lens part at the bridge's mention is read (teal) or the logit lens (grey), against the share of the depth."
09_dose = "The lens-specific part sits in the first lens directions; in Bolt and DeepSeek a same-size removal costs about as much. One column per number of lens directions removed, one row per model: the recall − lookup gap in points (slate); grey: the same number of directions rotated. Hollow ○: post hoc (Muse 30B)."
10a1_beyond = "Chains whose last hop recalls: the removal turns more answers wrong than in the all-passage chain (P → P → P), beyond the largest same-size control (grey tick), on every chain but the 27B's P → P → M. Rows: jsuite v2, a second data seed, the natural three-hop set. Hollow ○: post hoc (Lightning's natural set)."
10a2_beyond = "Chains whose last hop reads the passage: no extra cost beyond the controls on Lightning; on the 27B only when the first two hops recall. Drawn as the chains whose last hop recalls: extra answers turned wrong beyond P → P → P, in points; grey tick: the largest same-size control. Hollow ○: post hoc (Lightning's natural set)."
10b_beyond = "A number made from the passage and then used: the extra cost under the removal, per model. Numbers counted, computed or recalled, then reported or used to recall: answers turned wrong beyond a number read from the passage, in points, under the lens part's removal (slate) and the rotated and logit-lens controls (grey)."
10c_beyond = "Generated replies under the removal, sorted into five classes: per model and chain (P → M, M → M) on natplus, the share still right, a lure in the passage, another valid answer, something else, or the bridge's name; right: the replies classified. Cells tagged descriptive are descriptive in the registry."
