  <g id="text_25">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start" x="6.336" y="12.293813" transform="rotate(-0 6.336 12.293813)">The lens part's directions: the bridge words, almost never the answer</text>
  </g>
  <g id="text_26">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #666666" x="6.336" y="38.598281" transform="rotate(-0 6.336 38.598281)">Share of the lens part's rebuilt energy by the kind of word each direction is; main test at L</text>
  </g>
  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(6.336 304.209375)">Descriptive (no rule): each direction's class is automatic, hand-checked on five items per model (9B, 27B,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(6.336 316.709375)">Muse). Some 'no scene word' directions are spellings of the bridge the classifier missed. Lightning hatched:</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(6.336 329.209375)">its gate was chosen after its 60-scene pre-check was seen.</text>
  </g>
