  </g>
  <g id="text_24">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(6.336 39.699355)">Varied scenes, unedited, where the lookup answers wrong. (a) Wrong answers whose locker the address</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(6.336 52.902363)">probe predicts (%); (b) of those, the lens's top item at the bridge word still the right item (%). 95%</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(6.336 66.105371)">intervals, fixed in advance; a model with fewer than 30 wrong answers is not tested.</text>
  </g>
