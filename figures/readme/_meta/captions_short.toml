# Short captions for the root README (at most 60 words, takeaway first; src/bridge_jspace/figkit/captions.py).
# The full caption of each figure is in captions.toml.

02_main_split = "Removing the lens part costs recall far more than lookup, in both tests. Each row joins a model's lookup to its recall, with the gap at the right. Left: the knock-out over a band of layers (fact passages), answers turned wrong, in points. Right: removal from the patch at one layer (locker scenes), switches blocked beyond a random part."
01_tools = "Three tests of the lens part at the bridge, drawn over the first example's last words (rows are layers, columns tokens; teal marks the cells changed). The knock-out removes it at every token over a band of layers. Removal from the patch adds the patch back without it. The swap writes in another entity's."
03_controls = "Same-size controls cost far less than the lens part. Left: the recall − lookup gap when the knock-out removes the lens part (teal) or a same-size control (grey: a rotated part, the logit lens's or the top principal directions). Right: the lens part minus its largest control, paired on the same items."
02b_main_split_gaps = "The gap stays far above the largest same-size control's in the band test, and above zero at one layer. Left: the band test, in points; grey tick: the largest control's gap. Right: one layer, as a share of switches; Lightning's gap has no interval."
03c_controls_more = "On Muse and the 122B the band-test gap is large but not claimed: on Muse it is shared with the logit lens, and on the 122B it is gone when scored by probability. Every estimate here is post hoc."
06_address_read_remove = "A probe reads the address, and removing it stops lookups by position. Left: a probe at the bridge word reads which sentence holds the item's locker (amber), against a probe trained on the layout only (grey). Right: lookups still answering by position with the address removed from the patch (amber) or a same-size random part (grey)."
07_address_swap_lens = "Swapping in another locker's address moves the lookup, and the lens directions do not rebuild that swap. Left: lookups sent to the new locker (amber), against a same-size random vector (grey). Right: how far above random vectors the lens rebuilds the swap (amber), against a same-size change of item (blue, the positive control)."
08_routes = "When another item moves, the lookup follows the item's identity or its position, never the new value. Shares of the lookup's answers by route, per model. The routes scenes are not among the hand-checked views."
04_pointer = "Another entity's lens part moves the recall to that entity's fact, even from one neutral sentence; a probe's subspace that reads the fact barely does. Rows: the source of the part swapped in at the bridge. Dots: answers moved, in points."
12_last_token = "At the answer position a probe on the lens part reads the recall's entity, yet swapping that part barely moves the answer. Left: the probe's accuracy, at the layer where it peaks; dashed: chance. Right: recalls switched by swapping only the lens part (teal) or the whole state (grey)."
