# One caption per figure, keyed by its file stem (src/bridge_jspace/figkit/captions.py).

01_tools = "Three ways to test the lens part, each at the bridge, drawn over the last words of the real locker scene in the first example card (its bridge word in bold); rows are layers, columns tokens, and the teal box marks the cells each test changes. Remove everywhere: the lens part is projected out of every token over a band of middle layers. Remove from the patch: the patch is the change between two prompts at one layer (the bridge word's state in a prompt that names another item, minus the original's), added without its lens part. Swap: another entity's lens part is written into the bridge word over the band; it is drawn in the same teal, because it is a lens part too."
02_main_split = "Rows are models; each dumbbell joins one reader's score to the other's (lookup purple, recall black). Left, band of layers (fact passages): answers turned wrong, in points, when the lens part is removed at every token over a band of middle layers. Right, one layer (locker scenes): switches blocked beyond a random part of the same size when the lens part is removed from the patch, on the grey band (within 0.10 of a random part). The gap, recall minus lookup, is printed at each panel's right end with its 95% interval over bridge items (the band test's bounds are whole points); Lightning's one-layer gap is the difference of its two shares in the aggregate verdict, with no per-item contrast saved, so it has no interval. Hollow (○): Muse 30B and Qwen 122B in the band test, Lightning in the one-layer test (post hoc). The gaps against their largest same-size control are in the figure below. Items per model: the n column of docs/breadth/data.csv (band) and data/figures/depth/data.csv (one layer).<!-- src: plotstyle.toml | 95% interval; within 0.10 of a random part -->"
02b_main_split_gaps = "The headline's gaps, recall minus lookup, with their 95% intervals over bridge items. Left, band of layers (fact passages), in points; grey tick: the gap of the largest same-size control (a rotated part, the logit lens's or the top principal directions, whichever is largest for that model). Right, one layer (locker scenes), as a share of switches; Lightning without an interval (see above). Hollow (○) as above.<!-- src: plotstyle.toml | 95% interval -->"
03_controls = "Band of layers (fact passages): the recall − lookup gap, in points, when the lens part is removed everywhere (teal, with its 95% interval over bridge items) and when a same-size control is removed instead (grey: a rotated part, the logit lens's top directions, the residual stream's top principal directions at the same norm), one lane each, on one axis. Right: the lens part minus its largest control, paired on the same items, with its interval. The three models the post claims (Qwen 9B, Qwen 27B, Lightning); the two it does not claim are in the figure folded below it.<!-- src: plotstyle.toml | 95% interval -->"
03b_controls_layer = "One layer (locker scenes, the earlier runs with a same-size control): the recall's switches blocked beyond a random part when the lens part is removed from the patch (teal, with its 95% interval) and when a same-size control is removed instead (grey: PCA, the logit lens's directions, random lens directions), one lane each, on one axis. Right: the lens part minus its largest control; without a paired interval where only the aggregate was saved. Lightning: no run with a same-size control at one layer.<!-- src: plotstyle.toml | 95% interval -->"
03c_controls_more = "The same band test for Muse 30B and Qwen 122B, the two models the post does not claim; the grey tag under each says why (shared with the logit lens; gone when scored by the answer's probability). Every estimate here is post hoc, so the marks are filled and the key says so once. The 122B has no run of the PCA control."
04_pointer = "Rows are the source of the part swapped in at the bridge: another entity's own passage, one neutral sentence about that entity, the same without its own-word directions (the lens part, teal), a probe's subspace that reads the fact (slate) and a rotated part (grey, a control). One panel per model on one shared axis; each dot is the answers moved to the other entity's fact, in points, with its 95% interval over bridge items; items per model: the swap run's n in docs/breadth/data.csv. The neutral sentence minus the own passage, paired on the same items: {{b|ptr.q9.neutral_minus_swap}} / {{b|ptr.q27.neutral_minus_swap}} / {{b|ptr.nl.neutral_minus_swap}} points (9B / 27B / Lightning; intervals in the same file)."
05_atoms = "One bar per model: the lens part's directions, each counted by the word it decodes to, as shares of the energy they rebuild. The old and the new bridge word are the two teal segments, named above them; another scene word and no scene word are grey. The answer word (brick) has no visible segment: its share is printed at the right. Lightning hollow (○, post hoc)."
06_address_read_remove = "Left: a probe at the bridge word reads which locker sentence holds the item's locker (the address, amber), against a probe trained on the layout only (grey). Right: the lookups that still answer by position when the address is removed from the patch (amber), against a random part of the same size removed instead (grey); lower means more blocked. Whiskers: 95% intervals. Hollow (○): Lightning, and the 122B where its gate was lowered (post hoc).<!-- src: plotstyle.toml | 95% interval -->"
07_address_swap_lens = "Left: the lookups sent to the new locker when another locker's address is swapped in at about a real change's size (amber), against a random vector of the same size (grey). Right: how far above 200 random vectors the lens's 25 directions rebuild that swap (amber), against a change of item of the same size (blue, the positive control), in z; grey band: the range of the 200 random vectors. Hollow (○): Lightning, and the 122B where its gate was lowered (post hoc).<!-- src: plotstyle.toml | z against 200 random vectors --><!-- src: docs/depth/README.md | the 25 directions of the J++ lens that best rebuild the change -->"
08_routes = "Shares of the lookup's answers by route when another item moves, per model: identity, position, other; {{q|95%}} intervals over bridge entities, n = 300 scenes per model; Lightning and the 122B hollow ○ (post hoc gates). The routes scenes are not among the hand-checked views."
11_monitor = "The locker probe's accuracy for the address at the last token, per model, for the lens part as used throughout (left) and with four times as many directions (right): the lens part (teal) against a random part of the same energy (grey), with 95% intervals; the lens part's value and interval, and the full state's accuracy, in their own columns. Lightning hollow (○, post hoc).<!-- src: plotstyle.toml | 95% interval; within 0.10 of a random part -->"
12_last_token = "Per model, at the layer where the read peaks (under the name). Left: a probe's accuracy for the recall's entity on the lens part of the last token's state, with its 95% interval; dashed: chance. Right: the recalls switched when only the lens part is swapped in (teal) against the whole state swapped in (grey); the lens part's value in the last column. Lightning hollow (○, post hoc).<!-- src: plotstyle.toml | 95% interval; within 0.10 of a random part -->"
13_nine_models = "Nine models. Carried: answers moved when another entity's lens part is written in. Needed: recall minus lookup points when it is removed. Right: the grade."
14_directions = "The 27B's lookup has more switches blocked beyond random as more lens directions are removed; the other models' does not. One point per model and number of directions, with an interval over bridge items from the conflict test; Lightning's cells say below gate."
15_facts = "The lookup on passages with true and with made-up facts, per model; whiskers: intervals on the true-fact values (Muse: too few lookup switches, not drawn)."
16_order = "Per model two rows, the question after the scene (the main test) and the question before it, in the same colours (lookup purple, recall black): switches blocked without the lens part beyond a random part, with 95% intervals; grey band: within 0.10 of a random part. Right: the lookup's difference, question before minus after, with its interval. \"below gate (…)\": the question-first scenes did not pass that model's gate; \"can't tell\": no difference without that cell. Hollow (○, post hoc): the 27B's cells and Lightning's. The question-first cell passed its gate on the 27B and the 122B only; the rule was set after the 27B's cells. The breadth track's band measure on its twin set moves the 27B the other way (less reliance with the question first).<!-- src: plotstyle.toml | 95% interval; within 0.10 of a random part -->"
10_two_codes = "Post hoc, another item moved, lookup. Left: of the scenes on the position route, the share that leaves it without the address, against without a random part of the same size. Right: of the scenes on the identity route, the share that turns to the position without the lens part, against without a random part. Paired differences with 95% intervals (bootstrap over bridge entities); all hollow because post hoc; Lightning and the 122B have lowered or late gates. Not hand-checked.<!-- src: results/c2_route_crosstab/20261030T212820Z/tables.json | qwen3.5-9b -->"
09_sentence_order = "Lookups switched by the whole change when the locker sentence comes first and when it comes after the pick, per model, and (post hoc, hollow ○) with the changed prompt's locker sentence before or after the pick, for each original order. Whiskers: 95% cluster-bootstrap intervals over bridge entities; n per cell in the depth README; Lightning ○ (gate chosen after its pre-check). The sentence order is view g of the hand-checked sample; the 2 × 2 is post hoc and was not hand-checked.<!-- src: results/x0_order_2x2/20261030T224216Z/tables.json | qwen3.5-9b -->"
17_where = "Where in the prompt the recall needs the lens part, by layer band: the recall's answers turned wrong, in points, with the lens part removed at all tokens, only at the bridge's mention, or only at the question (black, with its 95% interval), against a rotated part of the same size (grey). Top: the middle layers (the knock-out band); bottom: deeper layers. Muse 30B has no middle-layer run."
