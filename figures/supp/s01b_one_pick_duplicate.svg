  <g id="text_16">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start" x="6.336" y="12.401813" transform="rotate(-0 6.336 12.401813)">One-pick scenes: the new bridge is already another person's pick</text>
  </g>
  <g id="text_17">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(6.336 39.699355)">Extra loss (0-1): switches lost without the J++ part, minus those lost without a random part</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(6.336 52.902363)">(same size). One-pick scenes (only the asked pick changes).</text>
  </g>
  <g id="text_18">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(6.336 330.776992)">In this design the new bridge is an item another person already picks; when that pick</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(6.336 343.98)">comes first, the recall needs the J++ part much less (9B gap 0.15 vs 0.64).</text>
  </g>
