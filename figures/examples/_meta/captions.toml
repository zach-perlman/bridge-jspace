# One caption per figure, keyed by its file stem (src/bridge_jspace/figkit/captions.py).

01_locker_scene = "One locker scene from the main test, Qwen 27B, as the model reads it (the bridge word in bold), with each reader's answer before the change and under each operation at layer {{x|layer_27b}}. The scene is picked by the rule on the card, not by its outcome. Over the main test's {{x|n_27b}} scenes, the whole change switches the lookup in {{x|lk_whole_27b}} and the recall in {{x|rc_whole_27b}}; without the lens part the lookup still switches in {{x|lk_noj_27b}} and the recall in {{x|rc_noj_27b}}; without a random part of the same size, in {{x|lk_norand_27b}} and {{x|rc_norand_27b}}."
02_fact_passage = "One fact passage, Qwen 27B, jsuite v2 test: the lookup's passage states the facts (the sentences in the lookup's colour, the asked one among them), the recall's passage replaces them with sentences that do not, so its answer must come from memory; the bridge in bold. Answers before and with the lens part removed at every token over a band of middle layers, or a rotated part of the same size. Picked to show the typical flip, by the outcome rule on the card: the recall turns wrong only without the lens part, the lookup holds. On the 27B this pattern shows on {{e|e2.pairs_flip}} of the {{e|e2.pairs_both_right}} pairs whose two answers were right before the removal. Over the test set the removal costs the lookup {{b|ko.q27.lostK}} points and the recall {{b|ko.q27.lostM}}."
03_routes = "One routes scene, Qwen 9B: the bridge word's state comes from a scene in which another item moved, and the three routes predict three different lockers (identity blue, position amber, the value in black). Picked by the rule on the card, not by its outcome. Over the condition's scenes, the whole change sends the lookup to the identity route's locker in {{s|qwen3.5-9b|another item moved, whole: identity share}} of scenes, to the position route's in {{s|qwen3.5-9b|another item moved, whole: position share}}, and to the value's in {{s|qwen3.5-9b|another item moved, whole: value share}}."
04_chains = "Three three-hop chains about one entity, Qwen 27B, jsuite v2 test: each hop is P (read in the passage) or M (recalled), the bridge in bold; answers before and with the lens part removed at every token over a band of middle layers, or a rotated part of the same size. Picked by the rule on the card, not by its outcome; on this entity only P → M → M turns wrong, and only without the lens part. Over the run's items, removing the lens part turns {{b|mod.q27.threehop.paper10.loss.PPP}} points of P → P → P answers wrong (a rotated part: {{b|mod.q27.threehop.paper10_rot.loss.PPP}}), {{b|mod.q27.threehop.paper10.loss.PMM}} of P → M → M ({{b|mod.q27.threehop.paper10_rot.loss.PMM}}) and {{b|mod.q27.threehop.paper10.loss.MPM}} of M → P → M ({{b|mod.q27.threehop.paper10_rot.loss.MPM}})."
