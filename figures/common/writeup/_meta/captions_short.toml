10_answer_span = "What the knock-out removes from the recall is its answer's own directions. Recall answers turned wrong per model, beside the full knock-out (slate): knocking out all but the answer span leaves almost none; knocking out only the span reproduces it (brick), on the made-up-fact and the codename set; grey, all but random directions of the same energy."
11_orthogonal = "Removals made orthogonal to the answers cost little. Left: a subspace for the subject built from the data (slate), beyond random, against the bar fixed in advance (dashed). Right, a one-hop question about the subject: removing its lens directions (teal), the answer span (brick), or its directions made orthogonal to the answers (slate, post hoc)."
a01_agents = "In agent tasks, removing the lens part costs producing an answer far more than picking or verifying one. The recall's answers turned wrong by the knock-out minus a control's, in points, per step (copy, pick, verify, produce), on one relation. Grey tags, descriptive cells (no rule fixed in advance). No transcript is quoted."
