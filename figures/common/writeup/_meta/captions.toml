# One caption per figure, keyed by its file stem (src/bridge_jspace/figkit/captions.py).

00_key = "How to read every figure: each colour is a role (recall black, lookup violet, the lens part teal, the address amber, identity blue, the answer brick, a quantity of no role such as a gap slate), grey is a control and nothing else, and the marks (a hollow dot is post hoc, a whisker is the 95% interval, the grey tick is the largest same-size control, the grey band is within 0.10 of a random part). A missing cell says why in grey words. Bottom: Qwen 27B's band-test row from Fig. 1, read aloud under it.<!-- src: plotstyle.toml | 95% interval; within 0.10 of a random part -->"
r01_patch_split = "Two checks on the patch (locker scenes). (A) The share of the patch's switches that removing the lens part blocks beyond a random part of the same size. Dashed lines are the pass rule fixed before the run: the lookup at most 0.10 on this measure, the recall at least 0.30 on the switches lost without the random part subtracted (it also clears 0.30 here); the 27B's lookup, at 0.14, is the only point on the wrong side. Below 0 means the random part blocked more switches than the lens part (Muse's lookup). (B) The share of the recall's drop that remains when the directions for the answer words are spared. ○ post hoc. Whiskers are 95% intervals; an interval can cross 1 when the sample is small."
r02_patch_layers = "One layer is not essential. The share of answers kept when the lens part is removed from a prompt's own state, with no patch: at the bridge word at one layer, at the bridge word over four layers, and at every token over four layers. The recall loses answers only as the removal widens; the lookup keeps them throughout. The grey tick is the recall with a random part of the same size removed instead. All three columns use the same scenes, 295 to 574 per model. ○ post hoc. Whiskers are 95% intervals."
e01_setup_twins = "A pair of twins from the known-fact set, every sentence verbatim (… marks the sentences not shown). Both passages name Rovio, the bridge, and ask the same question. The lookup twin gives Rovio's country in the passage; the recall twin leaves it out and adds lures, so Finland must come from memory. Rule: the pair the post quotes, the second item of its section (the first names Russian figures), not picked by outcome."
e04_setup_knockout = "The knock-out on the same pair (Qwen 27B): removing the lens part at every token over a band of middle layers turns the recall's answer wrong and leaves the lookup's right; removing a rotated part of the same size changes nothing. Cells show the model's first token (Fin is the start of Finland). The note under the card gives the rates over the known-fact set. Rule: the pair the post quotes, the second item of its section (the first names Russian figures), not picked by outcome."
e05_setup_datasets = "Illustration in the set's format. Known-fact set: the passage names the bridge and gives a true fact, which the model may also know. Made-up-fact set: the question only describes the bridge, which the model must find from memory among six people; the passage gives each a made-up value, which only reading can give."
e02_setup_locker = "Illustrative. Bridge word: carbon — shared by both questions. The lookup reads its answer in the scene (carbon's locker, 3); the recall brings it from what the model knows about carbon (its atomic number, 6). At the bridge word the model has not yet seen the question, so its state there is the same for both."
e03_setup_patch = "Illustrative. The patch: Δ, the bridge word's state in a changed prompt (the two picks swap) minus the original's, is added to the original prompt at one layer. Both questions then read the same patched state, and both answers change: the lookup's to oxygen's locker from the scene, the recall's to oxygen's atomic number from memory."
00_schematic = "One locker scene (the bridge word in bold). The bridge word's state holds three parts: the lens part (teal) feeds the recall, which answers from memory; identity (blue) and the address (amber) feed the lookup, which answers from the scene. A schematic of the claim, not a measurement."
01_main_split = "Rows are models. Left, band of layers (fact passages): each reader's answers turned wrong, in points, when the lens part is removed at every token over a band of middle layers (lookup violet, recall black, joined by a grey bar), and the recall − lookup gap (slate) with its 95% interval over bridge items and a grey tick at the largest same-size control's gap. Right, one layer (locker scenes): each reader's switches blocked beyond a random part of the same size when the lens part is removed from the patch, on the grey band (within 0.10 of a random part), and the gap as a share of switches. Hollow (○, post hoc): Muse and Qwen 122B in the band test, Lightning in the one-layer test; Lightning's one-layer gap has no interval (only the aggregate verdict was saved). Items per model: the n columns of docs/breadth/data.csv and data/figures/depth/data.csv.<!-- src: plotstyle.toml | 95% interval; within 0.10 of a random part -->"
02_datasets = "The two kinds of prompt, as text: a fact passage, where the final fact is given in the passage (the lookup reads it) or left to memory (the recall); and a locker scene, where the same bridge word feeds a lookup question and a recall question. The bridge in bold; each answer in its reader's colour, with its source. Illustrative prompts written for the figure, not test items."
03_tools = "The three ways the lens part is tested, drawn over the last words of a real locker scene (the bridge word in bold); rows are layers, columns tokens, and the teal box marks the cells each test changes. Knock-out: the lens part is projected out of every token over a band of middle layers. Patch: the patch is the change between two prompts at one layer at the bridge word, added without its lens part. Swap: another entity's lens part replaces the bridge word's over the band; it is teal because it is a lens part too."
04_made_up_fact_set = "The made-up-fact set (matched pairs whose question describes a person instead of naming them; the passage gives each person a made-up value). Rows are models, each with three lanes: the knock-out (the lens part removed everywhere, in the reader's colour), a rotated part of the same size (grey) and the answer span kept (brick). Left and middle: accuracy on the recall twins and on the lookup twins; right: the recall − lookup gap (slate) with its 95% interval. The answer-span lanes are descriptive (grey tag). Items per model (recall / lookup) under each name; unedited accuracy above the table.<!-- src: plotstyle.toml | 95% interval -->"
05a_controls_band = "Band of layers (fact passages): the recall − lookup gap, in points, when the lens part is removed everywhere (teal) and when a same-size control is removed instead (grey: a rotated part, the logit lens's top directions, the residual stream's top principal directions), one column each on the same scale. Right: the lens part minus its largest control, paired on the same items, with its 95% interval. Hollow (○, post hoc): Muse 30B and Qwen 122B; grey tags: the two cells the text does not claim; \"no run\": no PCA control on the 122B.<!-- src: plotstyle.toml | 95% interval -->"
05b_controls_layer = "One layer (locker scenes, the earlier runs that had a same-size control): the recall's switches blocked beyond a random part when the lens part is removed from the patch (teal, with its 95% interval) and when a same-size control is removed instead (grey: PCA, the logit lens's directions, random lens directions). Right: the lens part minus its largest control, with its interval. Lightning: no run with a same-size control at one layer.<!-- src: plotstyle.toml | 95% interval -->"
06_nine_models = "Three of nine models pass the bar. Left, the recall minus lookup gap under the knock-out, against the bar of 30 points. Right, what two same-size controls cost, against the limit of 10 points: a rotated part and the directions the plain logit lens reads. Muse and the 122B have a large gap but fail on the logit-lens control; Ministral, DeepSeek, Bolt and OLMo fail on the gap. Hollow: post hoc (the test on Muse and the 122B was run after their data). Whiskers are 95% intervals."
07_routes = "When another item's locker moves, where each model's lookup goes: one bar per model splitting its answers by identity (the item's own locker, blue), by position (the locker now at the old place, amber) and other (light grey). Right: the position share with its 95% interval over bridge entities, and the share answered by the number itself. Hollow outlines (○, post hoc): Lightning and the 122B.<!-- src: plotstyle.toml | 95% interval -->"
08a_address_read_remove = "Left: a probe at the bridge word reads the address, which locker sentence holds the item's locker (amber), against a probe trained on the layout only (grey). Right: the lookups that still answer by position when the address is removed from the patch (amber), joined to a random part of the same size removed instead (grey); lower means more blocked. Whiskers: 95% intervals. Hollow (○, post hoc): Lightning, and the 122B where its gate was lowered.<!-- src: plotstyle.toml | 95% interval -->"
08b_address_swap_lens = "Left: the lookups sent to the new locker when another locker's address is swapped in (amber), against a random vector of the same size (grey). Right: how far above random vectors the lens part rebuilds that swap (amber), against a change of item of the same size (blue, the positive control), in z; grey band: the range of the random vectors. Hollow (○, post hoc): Lightning and the 122B.<!-- src: plotstyle.toml | z against 200 random vectors -->"
09_order = "Per model two lanes, the locker (or fact) sentence before the pick and after it: the share of lookups the whole change at the bridge word switches, with its 95% interval. Left, locker scenes; right, fact passages (\"no run\": none on the 122B). Hollow (○, post hoc): Lightning.<!-- src: plotstyle.toml | 95% interval -->"
10_answer_span = "What the knock-out removes from the recall sits at the answer span (the answers' own lens directions). Every number is a share of the knock-out's damage to the recall (recall answers turned wrong, net of a rotated part of the same size); 1, dashed, is all of it. Per model: keeping only the answer span undoes this share (brick), against random directions of the same energy kept (grey; Lightning has none, since no random keep held as much energy); removing only the answer span does this share, beyond a random removal of the same energy, on the made-up-fact set and on the same format with each person named only by a codename the passage defines (codenames). The keep has no rule fixed in advance. Lightning's random removals reached their target energy on 29% of items in the first set and 2% in the codename set. Whiskers: 95% intervals.<!-- src: data/figures/writeup/data.csv | fig10.span_only_matched.v4.nl; fig10.span_only_matched.codename.nl -->"
11_orthogonal = "Removals orthogonal to the answers. Left: a data-built subspace for the subject (slate), answers turned wrong beyond random, against the bar fixed in advance (dashed). Right, a one-hop question about the subject: answers turned wrong when the subject's lens directions are removed (teal), when only the answers' own directions are (brick), and when the subject's directions are made orthogonal to the answers (slate, hollow: post hoc, no interval stored). Whiskers: 95% intervals.<!-- src: plotstyle.toml | 95% interval -->"
12_pointer = "Answers moved to another entity's fact (of the same kind) when its lens part is swapped in at the bridge, with 95% intervals; rows are models, items per model under the name. Top: the part taken from that entity's own passage and from one neutral sentence about it. Bottom: the same without the entity's own-word directions, a rotated part (grey), and the paired difference neutral sentence − own passage. These runs use a different item set from Fig. 6's swap.<!-- src: plotstyle.toml | 95% interval -->"
13_last_token = "Per model, at the layer where the read peaks (under the name). Left: a probe's accuracy for the recall's entity on the lens part of the last token's state, with its 95% interval; dashed: chance. Right: the recalls switched when only the lens part is swapped in (teal), joined to the whole state swapped in (grey); the lens part's value in the last column. Hollow (○, post hoc): Lightning.<!-- src: plotstyle.toml | 95% interval -->"
a01_agents = "Inside agent transcripts, one relation: the recall's answers turned wrong by the knock-out minus a control's, in points, when the step is to copy a given answer, pick the true one of two, verify a Yes/No claim, or produce the answer alone (minus the rotated control, or the harshest control for verify). Whiskers: 95% intervals; grey tags: cells read without a rule fixed in advance (descriptive). No transcript is quoted.<!-- src: plotstyle.toml | 95% interval -->"
a02_atoms = "Of the lens part's directions at the bridge, the share of the energy they rebuild by the word each decodes to: the old bridge word, the new bridge word, another scene word, no scene word (teal dots, one column each); the answer word's share at the right. Hollow (○, post hoc): Lightning."
a03_position_route = "Post hoc, another item moved, lookup. Of the scenes on the position route, the share that leaves it when the address is removed (amber), joined to a random part of the same size removed instead (grey); right: the paired difference with its 95% interval over bridge entities. All estimates post hoc.<!-- src: plotstyle.toml | 95% interval -->"
a04_identity_route = "Post hoc, another item moved, lookup. Of the scenes on the identity route, the share that turns to the position when the lens part is removed (teal), joined to a random part removed instead (grey); right: the paired difference with its 95% interval. All estimates post hoc.<!-- src: plotstyle.toml | 95% interval -->"
a05_where = "Where the recall needs the lens part: answers turned wrong, in points, when it is removed at all tokens, at the bridge's mention only, or at the question only (black, 95% intervals), against a rotated part of the same size (grey). Top: the middle layers (the knock-out band); bottom: deeper layers. Muse 30B: no run in the middle band.<!-- src: plotstyle.toml | 95% interval -->"
a06_order = "Per model two lanes, the question after the scene (the main test) and before it: switches blocked without the lens part beyond a random part (lookup violet, recall black, 95% intervals), on the grey band. Right: the lookup's difference, before − after. \"below gate (…)\": the question-first scenes did not pass that model's gate; \"can't tell\": no difference without that cell. Hollow (○, post hoc): the 27B and Lightning.<!-- src: plotstyle.toml | 95% interval; within 0.10 of a random part -->"
a07_facts = "Fact passages: the lookup's switches blocked beyond a random part when the lens part is removed, with true facts and with made-up ones (one lane each), on the grey band. Whiskers: 95% intervals on the true-fact cells. Muse 30B: too few lookup switches. Hollow (○, post hoc): Lightning.<!-- src: plotstyle.toml | 95% interval; within 0.10 of a random part -->"
a08_directions = "The conflict test with more lens directions removed: the lookup's switches blocked beyond a random part, one column per number of directions, on the grey band; whiskers: 95% intervals. Lightning: below its gate.<!-- src: plotstyle.toml | 95% interval; within 0.10 of a random part -->"
a09_link_crossover = "Per model, over the depth (share of the layers): the lookups switched by the change at the bridge word and by the same change copied into the locker sentences (two violet lines, named at their ends; shading: 95% interval). Dots: the cells fixed in advance, with their own whiskers and values. Grey \"post hoc\" over each panel: the lines are post hoc.<!-- src: plotstyle.toml | 95% interval -->"
a10_attention = "Per model four lanes: the address swap with the answer switched, with it staying (amber, 95% intervals), no change and a random vector (grey controls). Each is the last token's attention on the old locker sentence (left) and on the new one (right).<!-- src: plotstyle.toml | 95% interval -->"
a11_heads = "Under the address swap: the share of its switches cut when the top heads are zeroed (amber, 95% interval), against as many random heads (grey), with the bar fixed in advance (dashed); the values in the two columns at the right. Hollow (○, post hoc): Lightning.<!-- src: plotstyle.toml | 95% interval -->"
a12_code_tool = "Python code and tool output (exploratory, the 9B and the 27B). Left: the locker probe reads the address (amber) against a layout-only probe (grey); \"below gate\": the 9B's code probe was not run. Middle: the lookups that keep the position route without the address (amber) against a random part (grey). Right: with only the address kept. Whiskers: 95% intervals.<!-- src: plotstyle.toml | 95% interval -->"
a13_six_lockers = "With six lockers. Left: the pairs of lockers whose address swap reaches the bar (dashed: half of them); the count in the next column. Right: the lookups sent one locker on by the shift vector (violet; whisker: the range over the start lockers) against a random vector of the same size (grey), with the bar (dashed). Hollow (○, post hoc): Lightning."
