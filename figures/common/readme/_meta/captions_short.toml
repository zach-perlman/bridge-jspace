# Short captions for the README pages (at most 60 words, takeaway first; src/bridge_jspace/figkit/captions.py).
# The full caption of each figure is in captions.toml.

01_tools = "Three tests of the lens part at the bridge, drawn over the first example's last words (rows are layers, columns tokens; teal marks the cells changed). The knock-out removes it at every token over a band of layers. The patch puts the change in without it. The swap replaces it with another entity's."
02_main_split = "The panels count in different units (left points, right shares), so compare their pattern: removing the lens part costs recall far more than lookup in both. Rows are models, gaps at the right. Left: the knock-out over a band of layers (fact passages), answers turned wrong. Right: one layer (locker scenes), switches blocked beyond a random part."
02b_main_split_gaps = "The gap stays far above the largest same-size control's in the band test, and above zero at one layer. Left: the band test, in points; grey tick: the largest control's gap. Right: one layer, as a share of switches; Lightning's gap has no interval."
03_controls = "Same-size controls cost far less than the lens part. Per model, one lane each: the recall − lookup gap when the knock-out removes the lens part (teal) or a same-size control (grey: a rotated part, the logit lens's or the top principal directions). The column at the right: the lens part minus its largest control, paired on the same items."
03c_controls_more = "On Muse and the 122B the band-test gap is large but not claimed: on Muse it is shared with the logit lens, and on the 122B it is gone when scored by probability. Every estimate here is post hoc."
04_pointer = "Another entity's lens part moves the recall to that entity's fact, even from one neutral sentence; a probe's subspace that reads the fact barely does. Rows: the source of the part swapped in at the bridge. Dots: answers moved, in points."
05_atoms = "The lens part's directions decode to the bridge words, almost never to the answer: shares of the rebuilt energy, per model; each part named above its bars. 95% intervals over bridge entities in the table below."
06_address_read_remove = "A probe reads the address, and removing it stops lookups by position. Left: a probe at the bridge word reads which sentence holds the item's locker (amber), against a probe trained on the layout only (grey). Right: lookups still answering by position with the address removed from the patch (amber) or a same-size random part (grey)."
07_address_swap_lens = "Swapping in another locker's address moves the lookup, and the lens directions do not rebuild that swap. Left: lookups sent to the new locker (amber), against a same-size random vector (grey). Right: how far above random vectors the lens rebuilds the swap (amber), against a same-size change of item (blue, the positive control)."
08_routes = "When another item moves, the lookup follows the item's identity or its position, never the new value. Shares of the lookup's answers by route, per model. The routes scenes are not among the hand-checked views."
11_monitor = "The lens part holds less of the address than random parts of its energy. The locker probe's accuracy for the address at the last token, per model, on the lens part (teal) and a random part of the same energy (grey). Left, the usual size; right, four times the directions; the full state's accuracy beside."
12_last_token = "At the answer position a probe on the lens part reads the recall's entity, yet swapping that part barely moves the answer. Left: the probe's accuracy, at the layer where it peaks; dashed: chance. Right: recalls switched by swapping only the lens part (teal) or the whole state (grey)."
16_order = "Question first, one model's lookup leans more on the lens part. Switches blocked without the lens part beyond a random part, per model, with the question after the scene (the main test) and before it (lookup violet, recall black). Right, the lookup's before-minus-after difference. \"below gate\", the question-first scenes missed that model's gate."
